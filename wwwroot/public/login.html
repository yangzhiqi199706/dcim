<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>组态设计</title>
    <script type="text/JavaScript" src="./js/jquery-2.2.4.min.js"></script>
    <script type="text/JavaScript" src="./runtime-endpoints.js"></script>
    <style>
        * 
            box-sizing: border-box;
        }

        body {
            background: rgba(0, 0, 0);
        }
        .login {
            width: 658px;
            margin: calc(50vh - 246px) auto;
            height: 492px;
            background: url(./Images/icon/login.png) no-repeat center;
        }
        .login .message {
            width: 152px;
            position: relative;
            font-size: 24px;
            font-weight: bold;
            color: #F8C472;
            line-height: 36px;
            text-align: center;
            margin: 0 auto 38px;
            padding-top: 26px;
        }
        .login .message::before,
        .login .message::after {
            content: '';
            position: absolute;
            width: 140px;
            height: 1px;
            background-color: #F8C472;
            top: 44px
        }
        .login .message::before {
            left: -140px
        }
        .login .message::after {
            left: 152px;
        }
        .login .form {
            margin: 0 113px;
        }
        .login input[type=text],
        .login input[type=password] {
            border: 1px solid rgba(133, 159, 255, 0.69);
            vertical-align: middle;
            height: 54px;
            padding: 0 10px;
            font-size: 16px;
            color: white;
            outline: none;
            width: 100%;
            margin-bottom: 21px;
            background: rgba(14, 26, 82, 0.36);
            border-radius: 2px;
        }
        .login input[type=text]:focus,
        .login input[type=password]:focus {
            border-color: #859FFF !important;
        }
        .login input[type=submit],
        .login input[type=reset] {
            display: inline-block;
            vertical-align: middle;
            padding: 12px 24px;
            margin-top: 20px;
            font-size: 18px;
            line-height: 24px;
            text-align: center;
            background: #0845F4;
            border-radius: 2px;
            border: none;
            color: #fff;
            width: 48%;
            cursor: pointer;
        }
        .login input[type=reset] {
            float: right;
            background: rgba(8, 69, 244, 0.5);
            border: 1px solid #0845F4;
        }
        .tips{font-size: 16px;color:red;text-align: center;line-height: 2.5;}
    </style>
</head>

<body>
    <div class="login">
        <div class="message">组态登录</div>
        <div class="form">
            <input name="account" placeholder="请输入账号" type="text" >
            <input name="password" placeholder="请输入密码" type="password">
            <input value="登录" type="submit">
            <input value="重置" type="reset">
        </div>
        <div class="tips"></div>
    </div>
</body>
<script>
    const RUNTIME_ENDPOINTS = window.__RUNTIME_ENDPOINTS__ || {};
    const LOGIN_PORT = RUNTIME_ENDPOINTS.mainApiPort || '8086';
    const APP_PORT = RUNTIME_ENDPOINTS.appPort || '8081';
    const MAIN_API_BASE = `${window.location.protocol}//${window.location.hostname}:${LOGIN_PORT}`;
    const APP_BASE = `${window.location.protocol}//${window.location.hostname}:${APP_PORT}`;

    $(function(){
        $('input[type=submit]').click(function(){
            $.post(`${MAIN_API_BASE}/ZTLoginKey`,{
                'account':$('input[name=account]').val(),
                'password':$('input[name=password]').val(),
            },function(r){
                let res = JSON.parse(r);
                if (res.code == 100) {
                    localStorage.setItem('wl',res.data.token)
                    window.location.href=`${APP_BASE}/index.html`;
                } else {
                    $('.tips').html(res.msg).show();
                    setTimeout(function(){
                        $('.tips').hide()
                    },2000)
				}
            })
        })
    })
</script>
</html>
