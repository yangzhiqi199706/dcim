<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <div class="layui-form-item">
                    <label class="layui-form-label">易耗品编号<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="ConsumablesNumber" value="" name="ConsumablesNumber" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">易耗品名称<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="ConsumablesName" value="" name="ConsumablesName" lay-verify="required" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">品牌<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="ConsumableBrand" value="" name="ConsumableBrand" autocomplete="off" lay-verify="required" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">型号规格<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="ConsumableSpec" value="" name="ConsumableSpec" autocomplete="off"  lay-verify="required" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">库存位置</label>
                    <div class="layui-input-inline">
                        <select id="StoreLocationId" name="StoreLocationId">
                            <option value="">请选择</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">负责部门</label>
                    <div class="layui-input-inline">
                        <input type="text" id="DeptName" value="" name="DeptName" autocomplete="off" class="layui-input" readonly>
                        <input type="hidden" id="DeptId" value="" name="DeptId" autocomplete="off" class="layui-input" readonly>
                    </div>
                    <div class="layui-form-mid layui-word-aux">
                        <a class="layui-btn" onclick="xadmin.open('选择部门','choose-department.html?type=dept')">选择</a>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">负责人员</label>
                    <div class="layui-input-inline">
                        <input type="text" id="PersonName" value="" name="PersonName"  autocomplete="off" class="layui-input" readonly>
                        <input type="hidden" id="EmpId" value="" name="EmpId" autocomplete="off" class="layui-input" readonly>
                    </div>
                    <div class="layui-form-mid layui-word-aux">
                        <a class="layui-btn" onclick="xadmin.open('选择人员','choose-person.html?type=person&DeptId='+$('#DeptId').val())">选择</a>
                    </div>
                </div>
                <div class="layui-form-item layui-form-text">
                    <label class="layui-form-label">用途</label>
                    <div class="layui-input-block">
                        <textarea placeholder="请输入内容" id="ConsumableUse" name="ConsumableUse" class="layui-textarea"></textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
       var form;
        $(function(){
            layui.use(["form",'laydate'], function () {
                $ = layui.jquery;
                form = layui.form;
                //仓库
                getStoreLocation(form);
                //监听提交
				form.on("submit(submit)", function (data) {
                    var strformData = new FormData($("#formNow")[0]);
                    strformData.append("token", token);
                    list.form("CreateConsumablesKey", strformData, function (r) {
                        backToparent("添加成功");
                    });
                })
            });
        });
        function render(){
            form.render();
        }
    </script>
</body>
</html>
