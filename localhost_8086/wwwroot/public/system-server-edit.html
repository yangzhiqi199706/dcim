<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <script type="text/html" id="detail">
                    <div class="layui-form-item">
                        <label class="layui-form-label">服务器名称<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="ServerName" value="{{data.ServerName}}" name="ServerName" lay-verify="required" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">服务器编码<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="ServerCode" value="{{data.ServerCode}}" name="ServerCode" lay-verify="required" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">服务器IP<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="ServerIP" value="{{data.ServerIP}}" name="ServerIP" lay-verify="required" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">数据库地址<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="ServerAddress" value="{{data.ServerAddress}}" name="ServerAddress" lay-verify="required" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label"></label>
                        <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                    </div>
                </script>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function(){
            var id = GetString("id");

            //获取详情
            list.info("GetServerDetailKey", {
                token: token,
                id: id
            }, function (r) {
                var html = template("detail", r);
                $("#formNow").html(html);
                layui.use(["form"], function () {
                    $ = layui.jquery;
                    var form = layui.form;
                    form.render("select");
                     //监听提交
				    form.on("submit(submit)", function (data) {
                        var strformData = new FormData($("#formNow")[0]);
                        strformData.append("token", token);
                        strformData.append("id", id);
                        list.form("ChangeServerKey", strformData, function (r) {
                            backToparent("修改成功");
                        });
                    });
                });
            });	
        });
    </script>
</body>
</html>
