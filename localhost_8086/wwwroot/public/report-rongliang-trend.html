<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/echarts.js" type="text/javascript" charset="utf-8"></script>
    <style>
        .massage-box-md6:nth-child(2n-1) {
            clear: both
        }
    </style>
</head>

<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>报表管理->容量管理->容量趋势报表</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <select id="ServerCode" name="ServerCode" lay-filter="ServerCode">
                                    <option value="">请选择</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <select id="AreaId" name="AreaId" lay-filter="AreaId">
                                    <option value="">请选择</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <input type="radio" name="type" value="month" title="本月" lay-filter="type" checked>
                                <input type="radio" name="type" value="upmonth" title="上月" lay-filter="type">
                                <input type="radio" name="type" value="auto" title="自定义" lay-filter="type">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <input type="text" id="startDateTime" name="startDateTime" class="layui-input"
                                    placeholder="开始日期" style="display:none;">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <input type="text" id="endDateTime" name="endDateTime" class="layui-input"
                                    placeholder="结束日期" style="display:none;">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                        <div class="layui-inline layui-show-xs-block x-right">
                            <button class="layui-btn search" lay-submit type="button"
                                onclick="displayexport('down','view-route','容量趋势')" id="down">导出</button>
                        </div>
                    </div>
                    <div class="layui-card-body">
                        <div class="two-left1  massage-box-md6">
                            <div class="capacity-statistics-title">容量趋势</div>
                            <div style="height: 269px;overflow-y: auto;clear: both;">
                                <table class="layui-table" id="view-route">
                                    <thead>
                                        <tr>
                                            <th>区域</th>
                                            <th>年月</th>
                                            <th>机柜数量</th>
                                            <th>总U位数</th>
                                            <th>使用U位数</th>
                                            <th>剩余U位数</th>
                                            <th>U位使用率</th>
                                            <th>总额定功率</th>
                                        </tr>
                                    </thead>
                                    <tbody id="list">
                                        <script type="text/html" id="listtemplate">
                                            {{if data.length!=0}} {{each data as list i}}
                                            <tr>
                                                <td>{{list.AreaName}}</td>
                                                <td>&ensp;{{list.time}}</td>
                                                <td>{{list.number}}</td>
                                                <td>{{list.RatedU}}</td>
                                                <td>{{list.UsedU}}</td>
                                                <td>{{list.RatedU-list.UsedU}}</td>
                                                <td>{{((list.UsedU/(list.RatedU==0?1:list.RatedU))*100).toFixed(2)}}%</td>
                                                <td>{{list.RatedPower}}</td>
                                            </tr>
                                            {{/each}} {{else}}
                                            <tr>
                                                <td colspan="20" style="text-align: center">暂无相关数据</td>
                                            </tr>
                                            {{/if}}
                                        </script>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="massage-box massage-box-md6">
                            <div class="capacity-statistics-title">每月平均使用U位趋势</div>
                            <div id="monthUChart" class="massage-chart"></div>
                        </div>
                        <div class="massage-box massage-box-md6">
                            <div class="capacity-statistics-title">每月平均实际功率趋势</div>
                            <div id="powerChart" class="massage-chart"></div>
                        </div>
                        <div class="massage-box massage-box-md6">
                            <div class="capacity-statistics-title">每月平均用电量趋势</div>
                            <div id="electricChart" class="massage-chart"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        $(function () {
            var m = new Date().getMonth() + 1;
            m = m < 10 ? ("0" + m) : m;
            //参数
            var dataparam = {
                token: token,
                ServerCode: '',
                AreaId: '',
                startDateTime: getOnemonth(new Date().getFullYear() + '-' + m)[0],
                endDateTime: getOnemonth(new Date().getFullYear() + '-' + m)[1]
            }
            layui.use(["form", "laydate"], function () {
                $ = layui.jquery;
                var form = layui.form;
                var laydate = layui.laydate;
                laydate.render({
                    elem: '#startDateTime',
                    type: 'datetime'
                });
                laydate.render({
                    elem: '#endDateTime',
                    type: 'datetime'
                });
                form.render();
                var type = 'month';
                //监听提交
                form.on("radio(type)", function (data) {
                    type = data.value;
                    if (data.value != 'auto') {
                        $('#startDateTime,#endDateTime').hide();
                    } else {
                        $('#startDateTime,#endDateTime').show();
                    }
                    return false;
                });
                form.render();
                //服务器
                getServer(form, function (r) {
                    dataparam.ServerCode = r.data[0].id;
                    layuiSelected("ServerCode", r.data[0].ServerName);
                    form.on("select(ServerCode)", function (data) {
                        param.ServerCode = data.value;
                        param.ComboBox = "all";
                        getArea(form, data);
                    });
                    getArea(form, { value: dataparam.ServerCode }, function (re) {
                        dataparam.AreaId = re.data[0] ? re.data[0].id : '';
                        if (re.data[0]) layuiSelected("AreaId", re.data[0].AreaName);
                        //统计
                        GetData(dataparam);
                    });
                });
                //监听提交
                form.on("submit(search)", function (data) {
                    switch (type) {
                        case 'month':
                            dataparam.startDateTime = getOnemonth(new Date().getFullYear() + '-' + m)[0];
                            dataparam.endDateTime = getOnemonth(new Date().getFullYear() + '-' + m)[1];
                            break;
                        case 'upmonth':
                            var year = new Date().getFullYear();
                            var upm = m;
                            if (upm == '01') {
                                upm = '12';
                                year = year - 1;
                            } else {
                                upm = upm - 1;
                            }
                            dataparam.startDateTime = getOnemonth(year + '-' + upm)[0];
                            dataparam.endDateTime = getOnemonth(year + '-' + upm)[1];
                            break;
                        case 'auto':
                        if(!data.field.startDateTime && !data.field.endDateTime){
                                layer.msg('请选择时间！', {
                                    icon: 5,
                                    time: 2000
                                });
                                return false
                            }
                            if(!data.field.startDateTime && data.field.endDateTime){
                                layer.msg('请选择开始时间！', {
                                    icon: 5,
                                    time: 2000
                                });
                                return false
                            }
                            if(data.field.startDateTime && !data.field.endDateTime){
                                layer.msg('请选择结束时间！', {
                                    icon: 5,
                                    time: 2000
                                });
                                return false
                            }
                            dataparam.startDateTime = data.field.startDateTime;
                            dataparam.endDateTime = data.field.endDateTime;
                            break;
                    }
                    dataparam.ServerCode = data.field.ServerCode;
                    dataparam.AreaId = data.field.AreaId;
                    GetData(dataparam);
                    return false;
                });
            });

            function GetData(dataparam) {
                list.info('GetCapacityTrendKey', dataparam, function (r) {
                    var AreaHtml = {'data':[]};

                    var title = [];
                    var monthUdata = [];//月平均u
                    var powerdata = [];//功率
                    var electricdata = [];//电量
                   
                    //列表展示只需获取最后一条数据
                    $.each(r.data, function (n, val) {
                        title.push(val.time);
                        if(val.areaList.length!=0){
                            //处理表格展示
                            let areaid = 0;
                            var mapnew;
                            let totalu = 0;
                            let totalpower = 0;
                            let totalele = 0;
                            let totalNum = getOnemonth(val.time)[1].split('-')[2].split(' ')[0];
                            $.each(val.areaList,function(x,y){
                                // if(areaid!=y.AreaId){
                                //     AreaHtml.data.push({
                                //         AreaName:y.AreaName,
                                //         time:y.time,
                                //         number:y.CabinetNum,
                                //         RatedU:y.TotalU,
                                //         UsedU:y.UsedU,
                                //         RatedPower:y.RatedPower
                                //     })
                                // }
                                if(areaid!=y.AreaId){
                                    mapnew = {
                                        AreaName:y.AreaName,
                                        time:y.time,
                                        number:y.CabinetNum,
                                        RatedU:y.TotalU,
                                        UsedU:y.UsedU,
                                        RatedPower:y.RatedPower,
                                        useArr:[y.UsedU],
                                        powerArr:[y.actualPower],
                                        eleArr:[y.actualElectricity]
                                    }
                                    AreaHtml.data.push(mapnew);
                                }else{
                                    mapnew.useArr.push(y.UsedU);
                                    mapnew.powerArr.push(y.actualPower);
                                    mapnew.eleArr.push(y.actualElectricity);
                                }
                                areaid = y.AreaId;
                                totalu += parseInt(y.UsedU);
                                totalpower += parseFloat(y.actualPower);
                                totalele += parseFloat(y.actualElectricity);
                            })
                            monthUdata.push((totalu/totalNum).toFixed(2));
                            powerdata.push((totalpower/totalNum).toFixed(2));
                            electricdata.push((totalele/totalNum).toFixed(2));
                        }else{
                            monthUdata.push(0);
                            powerdata.push(0);
                            electricdata.push(0);
                        }
                      
                    })
                    console.log(AreaHtml);

                    var html = template("listtemplate", AreaHtml);
                    $("#list").html(html);

                    setLineChart('monthUChart',title,monthUdata);
                    setLineChart('powerChart',title,powerdata);
                    setLineChart('electricChart',title,electricdata);
                    
                });
            };

        })

        function setLineChart(id,title,data) {
            var electricChartDom = document.getElementById(id);
            var electricChart = echarts.init(electricChartDom);
            var electricChartoption = {
                legend: {
                },
                xAxis: {
                    type: 'category',
                    data: title,
                    axisLine: {
                        show: true,
                        lineStyle: {
                            type: 'solid',
                            color: '#F4F8FB',
                            width: '1'
                        }
                    },
                    axisLabel: {
                        textStyle: {
                            color: '#A2CAE1',//坐标值得具体的颜色
                            lineHeight: 30
                        }
                    }
                },
                yAxis: {
                    type: 'value',
                    axisLine: {
                        show: true,
                        lineStyle: {
                            type: 'solid',
                            color: '#F4F8FB',
                            width: '1'
                        }
                    },
                    splitLine: { show: false },
                    axisLabel: {
                        interval: 0,
                        textStyle: {
                            color: '#A2CAE1',//坐标值得具体的颜色
                        },
                    }
                },
                grid: {
                    x: 100,
                    y: 40,
                    x2: 25,
                    y2: 30
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    }
                },
                series: [{
                    data: data,
                    label: {
                        show: true,
                        position: 'top',
                        textStyle: {
                            color: '#ffffff',
                            fontSize: '14',
                            lineHeight: 15
                        },
                    },
                    type: 'line',
                    name: '',
                    barWidth: 20,
                    showBackground: true,
                    backgroundStyle: {
                        color: '#F4F8FB'
                    },
                }
                ]
            };
            electricChartoption && electricChart.setOption(electricChartoption);
        }
    </script>
</body>

</html>
