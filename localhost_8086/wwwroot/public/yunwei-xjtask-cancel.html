<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <div class="layui-form-item">
                    <label class="layui-form-label">备注<span class="x-red">*</span></label>
                    <div class="layui-input-block">
                        <textarea name="Remark" id="Remark" lay-verify="required" class="layui-textarea" placeholder="请填写备注"></textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确认终止</button>
                </div>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function () {
            var id = GetString("id");
            layui.use(["form"], function () {
                $ = layui.jquery;
                var form = layui.form;
                form.on("submit(submit)", function (data) {
                    var strformData = new FormData($("#formNow")[0]);
                    strformData.append("token", token);
                    strformData.append("TaskId", id);
                    strformData.append("Status", "逾期终止");
                    list.form("StopXJTaskKey", strformData, function (r) {
                        backToparent("终止成功");
                    });
                });
            });
        });
    </script>
</body>

</html>
