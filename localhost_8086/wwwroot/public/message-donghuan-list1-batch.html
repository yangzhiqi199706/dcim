<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<style>
    .layui-input-inline {
        line-height: 38px;
        color: #fff
    }
</style>
<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <div class="layui-form-item">
                    <label class="layui-form-label">处理方式：</label>
                    <div class="layui-input-block">
                        <textarea placeholder="请输入处理方式" name="Solution" class="layui-textarea"></textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">事件确认后告警通知方式：</label>
                    <div class="layui-input-block">
                        <input type="checkbox" title="禁用电话告警" name="phoneEnabeld" lay-text="ON|OFF">
                        <input type="checkbox" title="禁用短信告警" name="smsEnabeld" lay-text="ON|OFF">
                        <input type="checkbox" title="禁用邮件告警" name="mailEnabeld" lay-text="ON|OFF">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script src="js/dealCancelNotify.js" type="text/javascript" charset="utf-8"></script>
    <script>
        $(function () {
            var eventId=GetString("id");
            layui.use(["form"], function () {
                $ = layui.jquery;
                var form = layui.form;
                //监听提交
                form.on("submit(submit)", function (data) {
                    var checkboxArr = [];
                    if (data.field.phoneEnabeld != undefined) {
                        checkboxArr.push(data.field.phoneEnabeld == 'on' ? '' : 1)
                    }else{
                        checkboxArr.push(1);
                    }
                    if (data.field.smsEnabeld != undefined) {
                        checkboxArr.push(data.field.smsEnabeld == 'on' ? '' : 2)
                    }else{
                        checkboxArr.push(2);
                    }
                    if (data.field.mailEnabeld != undefined) {
                        checkboxArr.push(data.field.mailEnabeld == 'on' ? '' : 6)
                    }else{
                        checkboxArr.push(6);
                    }
                    var strformData = {
                        token: token,
                        eventId: eventId,
                        Solution:data.field.Solution,
                        NotifyState: checkboxArr.length>0 ? 1 : 0,
                        NotifyMode:checkboxArr.toString(),
                        // phoneEnabeld:data.field.phoneEnabeld=='on'?-1:1,
                        // smsEnabeld:data.field.smsEnabeld=='on'?-1:1,
                        // mailEnabeld:data.field.mailEnabeld=='on'?-1:1,
                        dealWay: '2'
                    }
                    list.info("CheckAlarmKey", strformData, function (res) {
                        // backToparent("告警已批量确认！！");
                        //获取全局告警取消配置
                        list.info('GetAlarmParamKey', {
                            id: 1,
                            token: token
                        }, function (result) {
                            if (result.data.CancelNotify == 1) {
                                let eventIdArr = eventId.split(',');
                                $.each(eventIdArr,function(n,val){
                                    list.info("GetRealAlarmsDetailKey", {
                                        token: token,
                                        id: val
                                    }, function (r) {
                                        if(n==eventIdArr.length-1){
                                            dealCancelNotify(r,checkboxArr.toString(),true)
                                        }else{
                                            dealCancelNotify(r,checkboxArr.toString(),false)
                                        }
                                    })
                                })
                            }else{
                                backToparent("告警已确认！！");
                            }
                        })
                    });
                })
            });
        })
    </script>
</body>

</html>
