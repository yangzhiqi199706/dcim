<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/jquery.qrcode.min.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>资产管理->其他业务->备品备件</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" placeholder="请输入备件名称" name="search">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                        
                        <button class="layui-btn x-right" onclick="xadmin.open('添加备件','asset-spareparts-add.html')">
                            <i class="layui-icon"></i>添加备件
                        </button>
                        <button class="layui-btn x-right" onclick="xadmin.open('回库','asset-spareparts-return.html')" style="margin-right:10px;">
                            回库
                        </button>
                    </div>
                    <div class="layui-card-body">
                        <!-- <div id="tree"></div> -->
                        <table class="layui-table">
                            <thead>
                                <tr>
                                    <th>编号</th>
                                    <th>备件编号</th>
                                    <th>备件类型</th>
                                    <th>备件名称</th>
                                    <th>厂商</th>
                                    <th>型号</th>
                                    <th>规格</th>
                                    <th>尺寸</th>
                                    <th>库存数量</th>
                                    <th>仓库位置</th>
                                    <th>负责人</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.info.length!=0}} {{each data.info as list i}}
                                    <tr>
                                        <td>{{(data.page.p-1)*15+(i+1)}}</td>
                                        <td>{{list.BackupsNumber}}</td>
                                        <td>{{list.AssetsTypeName}}</td>
                                        <td>{{list.BackupsName}}</td>
                                        <td>{{list.BackupsCompany}}</td>
                                        <td>{{list.BackupsModel}}</td>
                                        <td>{{list.BackupsSpec}}</td>
                                        <td>{{list.BackupsSize}}</td>
                                        <td>{{list.SurplusBackupsNumber}}</td>
                                        <td>{{list.StoreLocationName}}</td>
                                        <td>{{list.PersonName}}</td>
                                        <td>
                                            <a title="编辑" onclick="xadmin.open('编辑','asset-spareparts-edit.html','','','{{list.id}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe642;</i>
                                            </a>
                                            <a title="入库" onclick="xadmin.open('入库','asset-spareparts-in.html','','','{{list.id}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe601;</i>
                                            </a>
                                            {{if list.SurplusBackupsNumber!='0'}}
                                            <a title="出库" onclick="xadmin.open('出库','asset-spareparts-out.html','','','{{list.id}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe681;</i>
                                            </a>
                                            {{/if}}
                                            <a title="详情" onclick="xadmin.open('详情','asset-spareparts-use.html','','','{{list.id}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe705;</i>
                                            </a>
                                        </td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        //请求地址
        var url = "GetSparePartsListKey";
        $(function(){
            //初始化数据
            list.get(url, param);
        
            layui.use(["form"], function () {
                $ = layui.jquery;
                var form = layui.form;
                //监听提交
                form.on("submit(search)", function (data) {
                    param.pageNo = 1;
                    param.search = data.field.search;
                    list.get(url, param);
                    return false;
                });    
            });
            
        })
        //分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            list.get(url, param);
        }
    </script>
</body>

</html>
