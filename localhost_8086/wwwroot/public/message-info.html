<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/echarts.js" type="text/javascript" charset="utf-8"></script>
    <style>
        #alarmChart,
        #msgChart,
        #pueChart {
            height: 280px
        }

        .pueChoose {
            width: 120px;
            float: inline-end;
            top: 15px;
            position: relative;
        }
    </style>
</head>

<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>消息中心->消息概况</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <!-- <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <select id="ServerCode" name="ServerCode" lay-filter="ServerCode">
                                    <option value="">请选择</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <select id="AreaId" name="AreaId" lay-filter="AreaId">
                                    <option value="">请选择</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                    </div> -->
                    <div class="layui-card-body">
                        <div class="massage-box">
                            <div class="capacity-statistics-title">动环告警</div>
                            <div id="alarmChart" class="massage-chart"></div>
                        </div>
                        <div class="massage-box">
                            <div class="capacity-statistics-title">资产消息</div>
                            <div id="msgChart" class="massage-chart"></div>
                        </div>
                        <div class="massage-box layui-form">
                            <div class="capacity-statistics-title">PUE</div>
                            <div class="layui-inline layui-show-xs-block pueChoose">
                                <select id="pue" name="pue" lay-filter="pue">
                                </select>
                            </div>
                            <div id="pueChart" class="massage-chart"></div>
                        </div>
                        <div class="massage-box">
                            <div class="capacity-statistics-title" id="changetitle">每日能耗概况</div>
                            <form class="x-right layui-form">
                                <div class="layui-inline layui-show-xs-block">
                                    <input type="radio" name="type" lay-filter="type" value="year" title="年">
                                    <input type="radio" name="type" lay-filter="type" value="month" title="月" checked>
                                </div>
                                <div class="layui-inline layui-show-xs-block">
                                    <input type="text" id="year" class="layui-input" placeholder="年"
                                        style="display:none;">
                                    <input type="text" id="month" class="layui-input" placeholder="年月">
                                </div>
                            </form>
                            <div id="nenghaoChart" class="massage-chart"></div>
                        </div>
                        <div class="massage-box">
                            <div class="capacity-statistics-title">资产变更数量统计</div>
                            <form class="x-right layui-form">
                                <div class="layui-inline layui-show-xs-block">
                                    <input type="text" id="changemonth" class="layui-input" placeholder="年月">
                                </div>
                            </form>
                            <div id="changeChart" class="massage-chart"></div>
                        </div>
                        <div class="massage-box">
                            <div class="capacity-statistics-title">待办事项</div>
                            <table class="layui-table">
                                <tbody>
                                    <tr>
                                        <td>待办工单</td>
                                        <td id="order">0</td>
                                    </tr>
                                    <tr>
                                        <td>巡检任务</td>
                                        <td id="xj">0</td>
                                    </tr>
                                    <tr>
                                        <td>维护任务</td>
                                        <td id="wh">0</td>
                                    </tr>
                                    <tr>
                                        <td>盘点任务</td>
                                        <td id="pd">0</td>
                                    </tr>
                                    <tr>
                                        <td>维修任务</td>
                                        <td id="wx">0</td>
                                    </tr>
                                    <script type="text/html" id="listtemplate">
                                        <tr>
                                            <td colspan="20" style="text-align: center">暂无相关数据</td>
                                        </tr>
                                    </script>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        $(function () {
            //待办数量
            list.info('PlatStatisticsKey', {
                token: token
            }, function (r) {

                $('#order').html(r.data.OrderNeedDo);
                if (r.data.OrderNeedDo > 0) {
                    $('#order').css('cursor', 'pointer').click(function () {
                        clcikNav('待办工单');
                    })
                }
                $('#wh').html(r.data.WHNeedCheck);
                if (r.data.WHNeedCheck > 0) {
                    $('#wh').css('cursor', 'pointer').click(function () {
                        clcikNav('维护任务');
                    });
                }
                $('#xj').html(r.data.XJNeedCheck);
                if (r.data.XJNeedCheck > 0) {
                    $('#xj').css('cursor', 'pointer').click(function () {
                        clcikNav('巡检任务');
                    });
                }
                $('#wx').html(r.data.RepairNeedCheck);
                if (r.data.RepairNeedCheck > 0) {
                    $('#wx').css('cursor', 'pointer').click(function () {
                        clcikNav('维修任务');
                    });
                }
                $('#pd').html(r.data.PlanNeedCheck);
                if (r.data.PlanNeedCheck > 0) {
                    $('#pd').css('cursor', 'pointer').click(function () {
                        clcikNav('盘点任务');
                    });
                }
            });
            function clcikNav(type) {
                var topWindow = $(window.parent.document);
                $ul = $('#nav>li', topWindow).eq(0).children().eq(1).children();
                $.each($ul, function (n, val) {
                    if ($ul[n].innerHTML.indexOf(`${type}`) > -1) {
                        $('#nav>li', topWindow).eq(0).children().eq(1).children().eq(n).find('a').click();
                    }
                })
            }
            //动环告警
            list.info('IndexAlarmStatisticKey', {
                token: token
            }, function (r) {
                var alarmChartDom = document.getElementById('alarmChart');
                var alarmChart = echarts.init(alarmChartDom);
                var alarmtitle = [];
                var alarmdata = [];
                $.each(r.data, function (n, val) {
                    alarmtitle.push({ 'name': val.LevelName, 'icon': 'circle' });
                    alarmdata.push({ 'value': val.AlarmCount, 'name': val.LevelName });
                });
                var alarmChartoption = {
                    legend: {
                        orient: 'vertical',
                        data: alarmtitle,
                        right: 0,
                        top: 55,
                        itemWidth: 6,
                        itemHeight: 6,
                        textStyle: {
                            color: '#A2CAE1',
                            fontSize: '11',
                            lineHeight: 15
                        },
                        formatter: function (name) {
                            var total = 0;
                            var tarValue = 0;
                            for (var i = 0, l = alarmdata.length; i < l; i++) {
                                total += parseInt(alarmdata[i].value);
                                if (alarmdata[i].name == name) {
                                    tarValue = alarmdata[i].value;
                                }
                            }
                            total = total == 0 ? 1 : total;
                            var p = (tarValue / total * 100).toFixed(2);
                            return name + ' ' + p + '%';
                        }
                    },
                    color: ['#35DFFC', '#3783FF', '#FFCC37', '#FF9000', '#F96055'],
                    series: [
                        {
                            name: '动环告警',
                            type: 'pie',
                            radius: ['65%', '90%'],
                            top: 25,
                            left: -80,
                            bottom: 0,
                            itemStyle: {
                                shadowColor: 'rgba(225, 229, 255, 0.69)',
                                shadowBlur: 16
                            },
                            label: {
                                show: false,
                                position: 'center',
                                textStyle: {
                                    color: '#ffffff',
                                    fontSize: '14',
                                    lineHeight: 15
                                },
                            },
                            emphasis: {
                                label: {
                                    show: true,
                                    fontSize: '14.3',
                                    fontWeight: 'bold',
                                    formatter: '{b}：{c}'
                                }
                            },
                            data: alarmdata
                        }
                    ]
                };
                alarmChartoption && alarmChart.setOption(alarmChartoption);
            });
            //资产消息
            list.info('IndexMsgStatisticKey', {
                token: token
            }, function (r) {
                var msgChartDom = document.getElementById('msgChart');
                var msgChart = echarts.init(msgChartDom);
                var msgtitle = [];
                var msgdata = [];
                $.each(r.data, function (n, val) {
                    msgtitle.push({ 'name': val.MsgType, 'icon': 'circle' });
                    msgdata.push({ 'value': val.MsgNumber, 'name': val.MsgType });
                });
                var msgChartoption = {
                    legend: {
                        orient: 'vertical',
                        data: msgtitle,
                        right: 0,
                        top: 55,
                        itemWidth: 6,
                        itemHeight: 6,
                        textStyle: {
                            color: '#A2CAE1',
                            fontSize: '11',
                            lineHeight: 15,
                        },
                        formatter: function (name) {
                            var total = 0;
                            var tarValue = 0;
                            for (var i = 0, l = msgdata.length; i < l; i++) {
                                total += parseInt(msgdata[i].value);
                                if (msgdata[i].name == name) {
                                    tarValue = msgdata[i].value;
                                }
                            }
                            total = total == 0 ? 1 : total;
                            var p = (tarValue / total * 100).toFixed(2);
                            return name + ' ' + p + '%';
                        }
                    },
                    color: ['#35DFFC', '#3783FF', '#FFCC37', '#FF9000', '#F96055'],
                    series: [
                        {
                            name: '资产消息',
                            type: 'pie',
                            radius: ['65%', '90%'],
                            top: 25,
                            left: -80,
                            bottom: 0,
                            itemStyle: {
                                shadowColor: 'rgba(225, 229, 255, 0.69)',
                                shadowBlur: 16
                            }, label: {
                                show: false,
                                position: 'center',
                                textStyle: {
                                    color: '#ffffff',
                                    fontSize: '14',
                                    lineHeight: 15
                                },
                            },
                            emphasis: {
                                label: {
                                    show: true,
                                    fontSize: '14.3',
                                    fontWeight: 'bold',
                                    formatter: '{b}：{c}'
                                }
                            },
                            data: msgdata
                        }
                    ]
                };
                msgChartoption && msgChart.setOption(msgChartoption);
            });

            //资产变更数量统计参数
            var changeparam = {
                token: token,
                startDateTime: '',
                endDateTime: ''
            }
            //资产变更数量统计
            GetAssetChangeCount(changeparam);
            function GetAssetChangeCount(changeparam) {
                list.info('GetAssetChangeCountKey', changeparam, function (r) {
                    var changeChartDom = document.getElementById('changeChart');
                    var changeChart = echarts.init(changeChartDom);
                    var changetitle = [];
                    var changedata = []
                    $.each(r.data, function (n, val) {
                        changetitle.push(val.ChangeType);
                        changedata.push(val.TotalNumber);
                    });
                    var changeChartoption = {
                        xAxis: {
                            type: 'category',
                            data: changetitle,
                            axisLine: {
                                show: true,
                                lineStyle: {
                                    color: '#0F305E'
                                }
                            },
                            axisLabel: {
                                interval: 0,
                                rotate: 30,
                                textStyle: {
                                    color: '#A2CAE1',//坐标值得具体的颜色
                                    fontSize: '13'
                                }
                            }
                        },
                        yAxis: {
                            type: 'value',
                            axisLine: {
                                show: true,
                                lineStyle: {
                                    type: 'solid',
                                    color: '#0F305E',
                                    width: '1'
                                },
                                textStyle: {
                                    color: '#A2CAE1',
                                    fontSize: '13'
                                },
                            },
                            splitLine: {
                                // show: false
                                lineStyle: {
                                    color: 'rgba(24, 152, 237, 0.17',
                                    type: 'dashed'
                                }
                            },
                            axisLabel: {
                                interval: 0,
                                textStyle: {
                                    color: '#A2CAE1',//坐标值得具体的颜色
                                }
                            }
                        },
                        grid: {
                            x: 40,
                            y: 20,
                            x2: 25,
                            y2: 50
                        },
                        tooltip: {
                            trigger: 'axis',
                            axisPointer: {
                                type: 'shadow'
                            }
                        },
                        series: [{
                            data: changedata,
                            type: 'bar',
                            barWidth: 15,
                            itemStyle: {
                                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                    { offset: 0, color: ' #0779F6' },
                                    { offset: 1, color: '#042060' }
                                ])
                            }
                        }]
                    };
                    changeChartoption && changeChart.setOption(changeChartoption);
                });
            }

            var timetype = 'month';
            var date = new Date();
            var year = date.getFullYear();
            var month = date.getMonth() + 1;
            var chartparam = {
                token: token,
                ServerCode: '',
                AreaId: '',
                Date: year + '-' + (month < 10 ? '0' + month : month)
            }
            getdata(chartparam);

            layui.use(["form", "laydate"], function () {
                $ = layui.jquery;
                var form = layui.form;
                var laydate = layui.laydate;
                laydate.render({
                    elem: '#month',
                    type: 'month',
                    value: year + '-' + (month < 10 ? '0' + month : month),
                    change: function (value, date) {
                        chartparam.Date = value;
                        getdata(chartparam);
                    }
                });
                laydate.render({
                    elem: '#year',
                    type: 'year',
                    value: year,
                    change: function (value, date) {
                        chartparam.Date = value;
                        getdata(chartparam);
                    }
                });
                laydate.render({
                    elem: '#changemonth',
                    type: 'month',
                    change: function (value, date) {
                        let start = value + '-01 00:00:00';
                        let endday = '31';
                        let year = value.split('-')[0];
                        let month = value.split('-')[1];
                        switch (month) {
                            case '04':
                            case '06':
                            case '09':
                            case '11': endday = 30; break;
                            case '02':
                                if (year % 4 == 0) {
                                    if (year % 100 == 0) {
                                        endday = year % 400 == 0 ? 29 : 28;
                                    } else {
                                        endday = 29;
                                    }
                                } else {
                                    endday = 28;
                                }
                                break;
                        }
                        let end = value + '-' + endday + ' 23:59:59';
                        changeparam.startDateTime = start;
                        changeparam.endDateTime = end;
                        GetAssetChangeCount(changeparam);
                    }
                });
                form.render();
                //每日能耗监听提交
                form.on("radio(type)", function (data) {
                    timetype = data.value;
                    if (data.value == 'year') {
                        $('#year').show();
                        $('#month').hide();
                        $('#changetitle').html('每月能耗概况')
                    } else {
                        $('#year').hide();
                        $('#month').show();
                        $('#changetitle').html('每日能耗概况')
                    }
                    chartparam.Date = timetype == 'year' ? $('#year').val() : $('#month').val();
                    getdata(chartparam);
                    return false;
                });
                //pue
                getPueClassData(form);
            });
        })

        function getdata(chartparam) {
            //能效分析
            list.info('GetNXFXInfoKey', chartparam, function (r) {
                if (r.data.PUEList) {
                    var nenghaotitle = [];
                    var nenghaodata = [];
                    $.each(r.data.PUEList, function (n, val) {
                        nenghaotitle.push(val.time);
                        nenghaodata.push(val.value);
                    })
                    setNH(nenghaotitle, nenghaodata);
                }
            })
        }
        //获取pue
        function getPueClassData(form) {
            //先获取分类
            list.info('GetNYClassListKey', {
                token: token,
                ComboBox: "all"
            }, function (r) {
                if (r.data.length > 0) {
                    let pueHtml = '';
                    $.each(r.data, function (n, val) {
                        pueHtml += `<option value="${val.AreaId}">${val.NYClassName}</option>`
                    })
                    $('#pue').html(pueHtml);
                    form.render();
                    getPueData(r.data[0].AreaId);
                    form.on("select(pue)", function (data) {
                        getPueData(data.value);
                    })
                } else {
                    getPueData('');
                }
            })
        }
        //获取pue
        function getPueData(AreaId) {
            list.info('GetNXInfoKey', {
                token: token,
                AreaId: AreaId
            }, function (r) {
                setPue(r.data.PueValue);
            })
        }
        //pue
        function setPue(puedata) {
            var pueChartDom = document.getElementById('pueChart');
            var pueChart = echarts.init(pueChartDom);
            var pueChartoption = {
                series: [{
                    type: 'gauge',
                    min: 1,
                    max: 5,
                    splitNumber: 10,
                    startAngle: 180,
                    endAngle: 0,
                    radius: '132%',
                    center: ['50%', '75%'],
                    axisLine: {
                        lineStyle: {
                            color: [
                                [1, '#F4F8FB']
                            ],
                            width: 10
                        }
                    },
                    splitLine: {
                        show: false
                    },
                    axisTick: {
                        show: false
                    },
                    axisLabel: {
                        distance: -43,
                        color: '#A2CAE1',
                        fontSize: 12
                    },
                    progress: {
                        show: true,
                        overlap: true,
                        roundCap: true,
                        itemStyle: {
                            color: {
                                type: 'linear',
                                x: 0,
                                y: 0,
                                x2: 0,
                                y2: 1,
                                colorStops: [{
                                    offset: 0, color: '#68B9FF'
                                }, {
                                    offset: 1, color: '#3783FF'
                                }],
                                global: false
                            }
                        }
                    },
                    title: {
                        show: false
                    },
                    detail: {
                        color: '#FFF',
                        offsetCenter: ["0", "36"]
                    },
                    data: [{
                        value: puedata,
                    }]
                },
                {
                    type: 'gauge',
                    min: 1,
                    max: 3,
                    splitNumber: 6,
                    startAngle: 180,
                    endAngle: 0,
                    radius: '116%',
                    center: ['50%', '75%'],
                    axisLine: {
                        lineStyle: {
                            color: [
                                [1, '#68B9FF']
                            ],
                            width: 3
                        }
                    },
                    splitLine: {
                        distance: -3,
                        length: 10,
                        lineStyle: {
                            color: '#979797'
                        }
                    },
                    axisTick: {
                        show: false
                    },
                    axisLabel: {
                        show: false
                    },
                    pointer: {
                        show: false
                    },
                    title: {
                        show: false
                    },
                    data: [{
                        value: null,
                    }],
                    detail: {
                        color: 'transparent',
                    }
                }
                ]
            };
            pueChartoption && pueChart.setOption(pueChartoption);
        }
        //能耗
        function setNH(nenghaotitle, nenghaodata) {
            var nenghaoChartDom = document.getElementById('nenghaoChart');
            var nenghaoChart = echarts.init(nenghaoChartDom);
            var nenghaoChartoption = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'cross'
                    }
                },
                grid: {
                    left: 15,
                    right: 15,
                    bottom: 10,
                    top: 15,
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    boundaryGap: false,
                    axisLine: {
                        lineStyle: {
                            color: '#1898ED'
                        }
                    },
                    axisLabel: {
                        textStyle: {
                            color: '#A2CAE1',
                            fontSize: '13'
                        },
                        show: true,
                    },
                    data: nenghaotitle
                },
                yAxis: {
                    type: 'value',
                    axisLabel: {
                        textStyle: {
                            color: '#A2CAE1',
                            fontSize: '13'
                        },
                        formatter: '{value} Kw.h',
                    },
                    splitLine: {
                        lineStyle: {
                            color: 'rgba(24, 152, 237, 0.17)',
                            type: 'dashed'
                        }
                    }
                },
                series: [
                    {
                        data: nenghaodata,
                        type: 'line',
                        smooth: 0.6,
                        symbol: 'none',
                        lineStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                {
                                    offset: 0,
                                    color: '#1661FF'
                                },
                                {
                                    offset: 1,
                                    color: '#1EEBFF'
                                }
                            ]),
                            width: 4
                        },
                        areaStyle: {
                            normal: {
                                //颜色渐变函数 前四个参数分别表示四个位置依次为左、下、右、上
                                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                    {
                                        offset: 0,
                                        color: 'rgba(0,153,255,0.52)'
                                    },
                                    {
                                        offset: 1,
                                        color: 'rgba(0, 68, 172, 0.12)'
                                    }
                                ])
                            }
                        }
                    }
                ]
            };
            nenghaoChartoption && nenghaoChart.setOption(nenghaoChartoption);
        }

    </script>
</body>

</html>
