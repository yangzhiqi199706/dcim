<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <script type="text/html" id="detail">
                <div class="layui-form-item">
                    <label class="layui-form-label">工具编号<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="ToolNumber" value="{{data.ToolNumber}}" name="ToolNumber"
                            lay-verify="required" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">工具名称<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="ToolName" value="{{data.ToolName}}" name="ToolName" lay-verify="required"
                            autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">规格<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="ToolSpec" value="{{data.ToolSpec}}" name="ToolSpec" lay-verify="required" autocomplete="off"
                            class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        状态
                    </label>
                    <div class="layui-input-inline">
                        <select id="ToolStatus" value="{{data.ToolStatus}}" name="ToolStatus" lay-filter="ServerCode">
                            <option value="正常">正常</option>
                            <option value="报废">报废</option>
                            <option value="丢失">丢失</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">入库时间<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="PutinTime" value="{{data.PutinTime}}" name="PutinTime"
                            lay-verify="required" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">存放位置</label>
                    <div class="layui-input-inline">
                        <input type="text" id="ToolLocation" value="{{data.ToolLocation}}" name="ToolLocation" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">备注</label>
                    <div class="layui-input-block">
                        <textarea id="remark" value="{{data.remark}}" name="remark"  class="layui-textarea">{{data.remark}}</textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
            </script>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function () {
            var id = GetString("id");
            //获取详情
            list.info("GetToolDetailKey", {
                token: token,
                id: id
            }, function (r) {
                var html = template("detail", r);
                $("#formNow").html(html);
                layui.use(["form", "laydate"], function () {
                    $ = layui.jquery;
                    var form = layui.form;
                    var laydate = layui.laydate;
                    laydate.render({
                        elem: '#PutinTime', //指定元素
                        type:'datetime'
                    });
                    form.render();
                    layuiSelected("ToolStatus", r.data.ToolStatus);
                    form.on("submit(submit)", function (data) {
                        var strformData = new FormData($("#formNow")[0]);
                        strformData.append("token", token);
                        strformData.append("id", id);
                        list.form("ChangeToolKey", strformData, function (r) {
                            backToparent("修改成功");
                        });
                    });
                });
            });
        })

    </script>
</body>

</html>
