<!DOCTYPE html>
<html>

<body>

                        <div class="layui-form-item">

                        </div>
                        <div class="layui-form-item">

                            <div class="layui-input-inline">

                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">性别<span class="x-red">*</span></label>

                                <select id="sex" name="sex" lay-verify="required">
                                    <option value="" {{if data.sex==''}}selected{{/if}}>请选择性别</option>
                                    <option value="男" {{if data.sex=='男'}}selected{{/if}}>男</option>
                                    <option value="女" {{if data.sex=='女'}}selected{{/if}}>女</option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">

                                </select>

                        </div>
                        <div class="layui-form-item">

                                        <option value="2" {{if data.HikDoorPri=='2'}}selected{{/if}}>来宾</option>
                                        <option value="6" {{if data.HikDoorPri=='6'}}selected{{/if}}>非授权名单</option>

                                        }

                                        // 在最外层页面弹出提示框

                                            shade: 0.4,

                                                layero.css('background-color', '#000A54');
                                                layero.find('.layui-layer-content').css('color', '#ffffff');

                                                const currentLeft = parseInt(layero.css('left'));

        // 封装 backToparent 为 Promise 使用 async/await 确保顺序执行
        function backToparentPromise(tips) {
            return new Promise((resolve) => {
                backToparent(tips, resolve);
            });
        }
        // 重新定义 backToparent 函数，使其支持回调
        function backToparent(tips, callback) {
            layer.msg(tips, {
                icon: 6,
                time: 1000
            }, function () {
                var index = parent.layer.getFrameIndex(window.name);
                parent.layer.close(index);
                if (window.parent.changecallbak) {
                    window.parent.changecallbak();
                } else {
                    window.parent.location.reload();
                }
                if (callback) {
                    callback();
                }
            });
        }
        //设置卡号信息展示

                case 'hijackCard': text = '胁迫卡'; color = '#1e37c5'; break;
                case 'dismissingCard': text = '解除卡'; color = '#999'; break;
            }
            var html = `
                <label id="`+ cardNo + `" style="background-color:` + color + `">
                    <input type="hidden" name="cardNo" title="`+ cardNo + `" data-cardType="` + cardType + `" data-cardNo="` + cardNo + `">
                    <i class="layui-icon">&#xe672;</i>
                    <div>`+ cardNo + `</div>
                    <div>` + text + `</div>
                    <ul>
                        <li><a title="编辑" onclick="editCard(this,'`+ cardNo + `','` + cardType + `')"><i class="layui-icon">&#xe642;</i></a></li>
                        <li><a title="删除" onclick="delCard(this,'`+ cardNo + `')"><i class="layui-icon">&#xe640;</i></a></li>
                    </ul>
                </label>
                `;
            $('#cardbox').append(html);
        }
        //编辑卡
        function editCard(obj, cardNo, cardType) {
            xadmin.open('编辑卡号', 'donghuan-menCard-edit.html?cardNo=' + cardNo + '&cardType=' + cardType)
        }
        //删除卡
        function delCard(obj, cardNo) {
            $('#' + cardNo).remove();
        }

        //递归通知人员信息变更
        function submitSN(index, isFaceImgChanged, isOtherFieldsChanged) {
            if (index >= allSN.length) {
                return; // 如果所有 SN 都已提交，则结束
            }
            var DevId = allSN[index]; // 获取当前 SN
            var changeDoorParamData = {
                DevId: DevId,
                token: token,
            };
            if (isFaceImgChanged) {
                changeDoorParamData.changeFaceImg = id;
            }
            if (isOtherFieldsChanged) {
                changeDoorParamData.changeUser = id;
            }

            list.info("ChangeDoorParamKey", changeDoorParamData, function (response) {
                // 递归调用，提交下一个 SN
                submitSN(index + 1, isFaceImgChanged, isOtherFieldsChanged);
            });
        }
    </script>
</body>

</html>
