<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <script type="text/html" id="detail">
                <div class="layui-form-item">
                    <label class="layui-form-label">控制命令<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="Command" value="{{data.Command}}" name="Command" lay-verify="required"
                            autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item snmpctl" style="display: none;">
                    <label class="layui-form-label">发送值类型<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <select id="CommandType" name="CommandType" lay-verify="required" lay-filter="CommandType">
                            <option value="1" {{if data.CommandType=='1' }} selected {{/if}}>整型</option>
                            <option value="2" {{if data.CommandType=='2' }} selected {{/if}}>字符串</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item snmpctl" style="display: none;">
                    <label class="layui-form-label">发送值<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="CommandNum" value="{{data.CommandNum}}" name="CommandNum"
                            lay-verify="required" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">命令说明<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="CommandDesc" value="{{data.CommandDesc}}" name="CommandDesc"
                            lay-verify="required" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
                </script>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function () {
            var id = GetString("id");
            var linktype = GetString("linktype");
            //获取详情
            list.info("GetDeviceCommandDetailKey", {
                token: token,
                id: id
            }, function (r) {
                layui.use(["form"], function () {
                    $ = layui.jquery;
                    var form = layui.form;
                    if (linktype == '3') {
                        let comdarr = r.data.Command.split('-');
                        r.data.Command = comdarr[0];
                        r.data.CommandNum = comdarr[1];
                        r.data.CommandType = comdarr[2] || '1';
                    }
                    var html = template("detail", r);
                    $("#formNow").html(html);
                    form.render();

                    if (linktype == '3') {
                        $('.snmpctl').show();
                    } else {
                        $('.snmpctl').remove();
                    }

                    //监听提交
                    form.on("submit(submit)", function (data) {
                        var strformData = new FormData($("#formNow")[0]);
                        strformData.append("token", token);
                        strformData.append("id", id);
                        if (linktype == '3') {
                            var Command = strformData.get('Command') + '-' + strformData.get('CommandNum') + '-' + strformData.get('CommandType')
                            strformData.delete("Command");
                            strformData.delete("CommandNum");
                            strformData.delete("CommandType");
                            strformData.append("Command", Command)
                        }
                        list.form("ChangeDeviceCommandKey", strformData, function (r) {
                            backToparent("修改成功");
                        });
                    });
                });
            });
        });
    </script>
</body>

</html>
