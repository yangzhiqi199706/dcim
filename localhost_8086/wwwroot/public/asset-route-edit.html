<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <script type="text/html" id="detail">
                    <div class="layui-form-item">
                        <label class="layui-form-label">A端<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="aAssetsId" value="{{data.A}}" autocomplete="off" class="layui-input" lay-verify="required" readonly>
                            <input type="hidden" id="A" value="{{data.A}}" name="A" autocomplete="off" class="layui-input" lay-verify="required" readonly>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" onclick="xadmin.open('选择资产','asset-route-assetlist.html?type=A')">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">B端<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="bAssetsId" value="{{data.B}}" autocomplete="off" class="layui-input" lay-verify="required" readonly>
                            <input type="hidden" id="B" value="{{data.B}}" name="B" autocomplete="off" class="layui-input" lay-verify="required" readonly>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" onclick="xadmin.open('选择资产','asset-route-assetlist.html?type=B')">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label"></label>
                        <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                    </div>
                </script>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function(){
            var id = GetString("id");
            //获取详情
            list.info("GetRouteDetailKey", {
                token: token,
                id: id
            }, function (r) {
                var html = template("detail", r);
                $("#formNow").html(html);
                layui.use(["form"], function () {
                    $ = layui.jquery;
                    var form = layui.form;
                     //监听提交
				    form.on("submit(submit)", function (data) {
                        var strformData = new FormData($("#formNow")[0]);
                        strformData.append("token", token);
                        strformData.append("id", id);
                        list.form("ChangeRouteKey", strformData, function (r) {
                            backToparent("修改成功");
                        });
                    });
                });
            });
        });
    </script>
</body>
</html>
