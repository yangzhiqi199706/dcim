<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">资产类型<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="AssetsTypeName" value="" lay-verify="required" autocomplete="off"
                                class="layui-input" readonly>
                            <input type="hidden" id="AssetsTypeId" value="" name="AssetsTypeId" lay-verify="required"
                                autocomplete="off" class="layui-input" readonly>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" onclick="xadmin.open('选择资产类型','choose-asset-type.html')">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">型号<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <select id="ModelId" name="ModelId" lay-verify="required">
                                <option value="">请选择</option>
                            </select>
                        </div>
                    </div>
                    <!-- <div class="layui-form-item">
                        <label class="layui-form-label">资产编号</label>
                        <div class="layui-input-inline">
                            <input type="text" id="AssetsNumber" value="" name="AssetsNumber" autocomplete="off" class="layui-input">
                        </div>
                    </div> -->
                    <div class="layui-form-item">
                        <label class="layui-form-label">资产描述</label>
                        <div class="layui-input-inline">
                            <input type="text" id="AssetsDescribe" value="" name="AssetsDescribe" autocomplete="off"
                                class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">购置日期<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="BuyTime" value="" name="BuyTime" autocomplete="off"
                                lay-verify="required" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">购置价格（元）</label>
                        <div class="layui-input-inline">
                            <input type="text" id="AssetsPrice" value="" name="AssetsPrice" autocomplete="off"
                                class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">质保时长（月）<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="number" id="AssetsQa" value="" name="AssetsQa" autocomplete="off"
                                lay-verify="required" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">库存位置<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <select id="StoreLocationId" name="StoreLocationId" lay-verify="required">
                                <option value="">请选择</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">入库数量<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="number" id="number" value="1" name="number" lay-verify="required"
                                autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">管理部门<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="DeptName" value="" name="DeptName" lay-verify="required"
                                autocomplete="off" class="layui-input" readonly>
                            <input type="hidden" id="DeptId" value="" name="DeptId" lay-verify="required"
                                autocomplete="off" class="layui-input" readonly>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" onclick="xadmin.open('选择部门','choose-department.html?type=dept')">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">管理人员<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="PersonName" value="" name="PersonName" lay-verify="required"
                                autocomplete="off" class="layui-input" readonly>
                            <input type="hidden" id="EmpId" value="" name="EmpId" lay-verify="required"
                                autocomplete="off" class="layui-input" readonly>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn"
                                onclick="xadmin.open('选择人员','choose-person.html?type=person&DeptId='+$('#DeptId').val())">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">供应商<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="SupplierName" value="" name="SupplierName" lay-verify="required"
                                autocomplete="off" class="layui-input" readonly>
                            <input type="hidden" id="SupplierId" value="" name="SupplierId" lay-verify="required"
                                autocomplete="off" class="layui-input" readonly>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" onclick="xadmin.open('选择供应商','choose-supplier.html?type=store')">选择</a>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md6">
                    <div class="layui-form-item" class="UId">
                        <label class="layui-form-label">资产条ID</label>
                        <div class="layui-input-inline">
                            <input type="text" id="UId" value="" name="UId" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item" class="GatewayId">
                        <label class="layui-form-label">网关ID关联设备</label>
                        <div class="layui-input-inline">
                            <!-- <input type="text" id="GatewayId" value="" name="GatewayId" autocomplete="off" class="layui-input"> -->
                             <select id="GatewayId" name="GatewayId">
                                <option value="">请选择</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">关联租户</label>
                        <div class="layui-input-inline">
                            <select id="TenantId" name="RentId">
                                <option value="">请选择</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        var form;
        $(function () {
            layui.use(["form", 'laydate'], function () {
                $ = layui.jquery;
                form = layui.form;
                var laydate = layui.laydate;
                laydate.render({
                    elem: '#BuyTime'
                });
                //网关Id对应设备协议编码为18002的机柜u位定位器
                list.info('GetDeviceListKey',{
                    token:token,
                    ComboBox:'all',
                    ProtocolCode:'18002'
                },function(res){
                    if (!res.data || res.data.length === 0) return;
                    const $gatewaySelect = $('#GatewayId');
                    const devHtml = res.data.map(val => 
                        `<option value="${val.id}">${val.DeviceName}</option>`
                    ).join('');
                    $gatewaySelect.append(devHtml);
                    form.render("select");
                })
                //仓库\供应商
                getStoreLocation(form);
                getSupplier(form);
                list.info('GetTenantListKey', param, function (res) {
                    var tenanthtml = '<option value="">请选择</option>';
                    $.each(res.data, function (n, val) {
                        tenanthtml += "<option value=\"" + val.id + "\">" + val.TenantName + "</option>";
                    });
                    $("#TenantId").append(tenanthtml);
                    form.render("select");
                })
                //监听提交
                form.on("submit(submit)", function (data) {
                    var strformData = new FormData($("#formNow")[0]);
                    strformData.append("token", token);
                    list.form("CreateAssetsStoreKey", strformData, function (r) {
                        backToparent("添加成功");
                    });
                })
            });
        });
        function render() {
            form.render();
        }
    </script>
</body>

</html>
