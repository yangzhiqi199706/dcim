<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>资产管理->基础配置->盘点计划</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" placeholder="请输入盘点计划" name="search">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                        <button class="layui-btn x-right" onclick="xadmin.open('添加盘点计划','asset-checkplanmodel-add.html')">
                            <i class="layui-icon"></i>添加盘点计划
                        </button>
                    </div>
                    <div class="layui-card-body">
                        <table class="layui-table">
                            <thead>
                                <tr>
                                    <th>编号</th>
                                    <th>计划名称</th>
                                    <th>资产类型</th>
                                    <th>盘点方式</th>
                                    <th>盘点范围</th>
                                    <th>执行部门</th>
                                    <th>执行人</th>
                                    <th>监盘人</th>
                                    <th>周期性盘点</th>
                                    <th>完成期限（天）</th>
                                    <th>派发周期</th>
                                    <th>派发时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.info.length!=0}} {{each data.info as list i}}
                                    <tr>
                                        <td>{{(data.page.p-1)*15+(i+1)}}</td>
                                        <td>{{list.PlanName}}</td>
                                        <td>
                                            {{if list.AssetsType=='F'}}在架资产{{/if}}
                                            {{if list.AssetsType=='CF'}}非在架资产{{/if}}
                                            {{if list.AssetsType=='A'}}所有资产{{/if}}
                                        </td>
                                        <td>
                                            {{if list.CheckWay=='area'}}按区域执行{{/if}}
                                            {{if list.CheckWay=='dept'}}按部门执行{{/if}}
                                            {{if list.CheckWay=='store'}}按仓库执行{{/if}}
                                        </td>
                                        <td>{{list.CheckRangeName}}</td>
                                        <td>{{list.DeptName}}</td>
                                        <td>{{list.PersonName}}</td>
                                        <td>{{list.SeePerson}}</td>
                                        <td>{{if list.PlanCycle=='1'}}启用{{else}}禁用{{/if}}</td>
                                        <td>{{list.ComplateDay}}</td>
                                        <td>{{if list.SendCycle=='year'}}年{{else}}月{{/if}}</td>
                                        <td>{{list.SendTime}}</td>
                                        <td>
                                            <a title="编辑" onclick="xadmin.open('编辑','asset-checkplanmodel-edit.html','','','{{list.id}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe642;</i>
                                            </a>
                                            <a title="删除" onclick="x_admin_del('确认删除吗？','DelCheckPlanModelKey','{{list.id}}',this)" href="javascript:;">
                                                <i class="layui-icon">&#xe640;</i>
                                            </a>
                                        </td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        //请求地址
        var url = "GetCheckPlanModelListKey";
        $(function(){
            //初始化数据
            list.get(url, param);
            layui.use("form", function () {
                $ = layui.jquery;
                var form = layui.form;
                //监听提交
                form.on("submit(search)", function (data) {
                    param.pageNo = 1;
                    param.search = data.field.search;
                    list.get(url, param);
                    return false;
                });
            });
        })
        //分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            list.get(url, param);
        }
    </script>
</body>

</html>
