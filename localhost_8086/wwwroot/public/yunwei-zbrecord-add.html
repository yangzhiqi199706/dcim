<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <script type="text/html" id="detail">
                <input type="hidden" id="Lsh" value="{{data.id}}" name="Lsh" autocomplete="off" class="layui-input">
                <div class="layui-form-item">
                    <label class="layui-form-label">值班人员</label>
                    <div class="layui-input-inline">
                        <input type="text" id="OnDutyEmps" value="{{data.OnDutyEmps}}" name="OnDutyEmps" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">值班班组</label>
                    <div class="layui-input-inline">
                        <input type="text" id="OnDutyGroup" value="{{data.OnDutyGroup}}" name="OnDutyGroup" autocomplete="off" class="layui-input" readonly>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">值班班次</label>
                    <div class="layui-input-inline">
                        <input type="text" id="BCName" value="{{data.BCName}}" name="BCName" autocomplete="off" class="layui-input" readonly>
                    </div>
                </div>
                <input type="hidden" id="PBDate" value="{{data.PBDate}}" name="PBDate" autocomplete="off" class="layui-input">
                <input type="hidden" id="onDutyStartTime" value="{{data.onDutyStartTime}}" name="onDutyStartTime" autocomplete="off" class="layui-input">
                <input type="hidden" id="onDutyEndTime" value="{{data.onDutyEndTime}}" name="onDutyEndTime" autocomplete="off" class="layui-input">

                <input type="hidden" id="JiaoBanGroup" value="" name="JiaoBanGroup" autocomplete="off" class="layui-input">
                <input type="hidden" id="JiaoBanEmps" value="" name="JiaoBanEmps" autocomplete="off" class="layui-input">
                <input type="hidden" id="JiaoBanTime" value="" name="JiaoBanTime" autocomplete="off" class="layui-input">

                <input type="hidden" id="JieBanTime" value="{{data.JieBanTime}}" name="JieBanTime" autocomplete="off" class="layui-input">

                <div class="layui-form-item">
                    <label class="layui-form-label">接班人员</label>
                    <div class="layui-input-inline">
                        <input type="text" id="JieBanEmps" value="{{data.JieBanEmps}}" name="JieBanEmps" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">接班班组</label>
                    <div class="layui-input-inline">
                        <input type="text" id="JieBanGroup" value="{{data.JieBanGroup}}" name="JieBanGroup" autocomplete="off" class="layui-input" readonly>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">接班班次</label>
                    <div class="layui-input-inline">
                        <input type="text" id="JieBanBCName" value="{{data.JieBanBCName}}" name="JieBanBCName" autocomplete="off" class="layui-input" readonly>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">日志</label>
                    <div class="layui-input-block">
                        <textarea id="LogContext" name="LogContext" class="layui-textarea" placeholder="请输入日志内容">{{data.LogContext}}</textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="save" type="button">保存日志</button>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确认交接班</button>
                </div>
            </script>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function () {
            var key = GetString("status");
            list.info('GetOndutyLogKey',{
                token:token,
                Key:key
            },function(r){
                var html = template("detail", r);
                $("#formNow").html(html);
                layui.use(["form"], function () {
                    $ = layui.jquery;
                    var form = layui.form;
                    //监听提交
                    form.on("submit(save)", function (data) {
                        var strformData = new FormData($("#formNow")[0]);
                        strformData.append("token", token);
                        list.form("SaveLogKey", strformData, function (r) {
                            backToparent("日志保存成功");
                        });
                    });
                    form.on("submit(submit)", function (data) {
                        var strformData = new FormData($("#formNow")[0]);
                        strformData.append("token", token);
                        list.form("JiaoJieBanKey", strformData, function (r) {
                            backToparent("交接成功");
                        });
                    });
                });
            })
        })
    </script>
</body>

</html>
