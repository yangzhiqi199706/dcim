<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <div class="layui-form-item">
                    <label class="layui-form-label">出库类型<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <select id="PutoutType" name="PutoutType" lay-verify="required" lay-filter="PutoutType">
                            <option value="">请选择</option>
                            <option value="L">领用出库</option>
                            <option value="B">借用出库</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">出库数量<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="number" id="" value="" name="number" autocomplete="off" lay-verify="required" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">领用/借用时间<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="UseTime" value="" name="UseTime" autocomplete="off" lay-verify="required" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">领用人/借用人<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <select id="EmpId" name="UseEmpId" lay-filter="EmpId" lay-verify="required">
                            <option value="">请选择</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item" id="B">
                    <label class="layui-form-label">计划归还时间<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="PlanReturnTime" value="" name="PlanReturnTime" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item layui-form-text">
                    <label class="layui-form-label">备注</label>
                    <div class="layui-input-block">
                        <textarea placeholder="请输入内容" id="remark" name="remark" class="layui-textarea"></textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function(){
            var id = GetString("id");
            layui.use(["form",'laydate'], function () {
                $ = layui.jquery;
                var form = layui.form;
                var laydate = layui.laydate;
                laydate.render({
                    elem: '#UseTime',
                    type: 'datetime' 
                });
                laydate.render({
                    elem: '#PlanReturnTime' 
                });
                //领用 选择出库时间、领用人
                //借用 选择出库时间、借用人、归还时间
                form.on("select(PutoutType)", function (data) {
                    if(data.value=='B'){
                        $('#B').show();
                        $('#PlanReturnTime').attr('lay-verify','required');
                    }else{
                        $('#B').hide();
                        $('#PlanReturnTime').removeAttr('lay-verify','required');
                    }
                })
                param.ComboBox = "all";
                getEmp(form,'');
                                
                //监听提交
				form.on("submit(submit)", function (data) {
                    var strformData = new FormData($("#formNow")[0]);
                    var number = strformData.get('number');
                    strformData.append("token", token);
                    strformData.append("id", id);
                    if($('#PutoutType').val()=='L'){
                        strformData.delete("PlanReturnTime");
                        strformData.append("PlanReturnTime",'');
                    }
                    if(number<1){
                        layer.msg('出库数量必须大于0', {
                            icon: 5,
                            time: 1000
                        });
                        return;
                    }
                    list.form("ExportSparePartsKey", strformData, function (r) {
                        backToparent("已出库");
                    });
                })
            });
        });
    </script>
</body>
</html>
