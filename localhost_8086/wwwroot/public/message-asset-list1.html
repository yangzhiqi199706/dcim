<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>消息中心->资产消息->未确认消息</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <a class="layui-btn" href="message-asset-list1.html" >
                            未确认消息
                        </a>
                        <a class="layui-btn layui-btn-primary" href="message-asset-list2.html">
                            已确认消息
                        </a>
                    </div>
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" placeholder="请输入主体名称、消息描述" name="search">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <select id="MsgType" name="MsgType" lay-filter="MsgType">
                                    <option value="">全部类型</option>
                                    <option value="报废到期">报废到期</option>
                                    <option value="保修到期">保修到期</option>
                                    <option value="维保到期">维保到期</option>
                                    <option value="逾期未还">逾期未还</option>
                                    <option value="在线异常">在线异常</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="layui-card-body">
                        <table class="layui-table">
                            <thead>
                                <tr>
                                    <th>编号</th>
                                    <th>主体编号</th>
                                    <th>主体名称</th>
                                    <th>消息类型</th>
                                    <th>消息描述</th>
                                    <th>消息时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.info.length!=0}} {{each data.info as list i}}
                                    <tr>
                                        <td>{{(data.page.p-1)*15+(i+1)}}</td>
                                        <td>{{list.MainNumber}}</td>
                                        <td>{{list.MainName}}</td>
                                        <td>{{list.MsgType}}</td>
                                        <td>{{list.MsgDescribe}}</td>
                                        <td>{{list.create_time}}</td>
                                        <td>
                                            <a title="确认" onclick="MsgCheck('{{list.id}}',this)" href="javascript:;">
                                                <i class="layui-icon">&#xe605;</i>
                                            </a>
                                        </td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        //请求地址
        var url = "GetAssetMsgKey";
        $(function(){
            //初始化数据
            param.MsgStatus='未确认';
            list.get(url, param);
            layui.use(["form"], function () {
                $ = layui.jquery;
                var form = layui.form;
                //监听提交
                form.on("submit(search)", function (data) {
                    param.pageNo = 1;
                    param.search = data.field.search;
                    param.MsgType = data.field.MsgType;
                    list.get(url, param);
                    return false;
                });  
            });
        })
        //确认消息
        function MsgCheck(id,obj){
            layer.confirm('确定确认此消息吗？', {
                btn: ['确认','确认不再提醒'], //按钮
            }, function(index){//确定
                list.info('CheckAssetKey',{
                    token:token,
                    id:id,
                    MsgStatus:'已确认'
                },function(){
                    layer.msg("消息已确认", {
						icon: 1,
						time: 1000
					});
                    layer.close(index);
                })
            }, function(){//确认不再提醒
                list.info('CheckAssetKey',{
                    token:token,
                    id:id,
                    MsgStatus:'确认不再提醒'
                },function(){
                    layer.msg("消息已确认不再提醒", {
						icon: 1,
						time: 1000
					});
                    layer.close(index);
                })
            });
        }
        //分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            list.get(url, param);
        }
    </script>
</body>
</html>
