        //更新
        function SaveLicence() {
            var code = $('#Licence').val();
            list.info("ChangeLicenseKey", {
                code: code
            }, function (r) {
                getTime(code);
            })
        }
        //时间
        function getTime(code) {
            list.info("VarLicenseKey", {
                code: code
            }, function (r) {
                if (r.data.indexOf('不正确') > -1) {
                    localStorage.clear();
                    tologin();
                    return false;
                }
                $('#EndTime').val(r.data)
            })
