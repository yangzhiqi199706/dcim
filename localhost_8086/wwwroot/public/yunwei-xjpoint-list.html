<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/jquery.qrcode.min.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>运维管理->配置->移动巡检->巡检点定义</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" placeholder="请输入巡检点名称" name="search">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                        <button class="layui-btn x-right" onclick="xadmin.open('添加巡检点','yunwei-xjpoint-add.html')">
                            <i class="layui-icon"></i>添加巡检点
                        </button>
                    </div>
                    <div class="layui-card-body">
                        <table class="layui-table">
                            <thead>
                                <tr>
                                    <th>编号</th>
                                    <th>巡检点名称</th>
                                    <th>巡检点类型</th>
                                    <th>巡检点识别信息</th>
                                    <th>巡检设备</th>
                                    <th>备注</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.info.length!=0}} {{each data.info as list i}}
                                    <tr>
                                        <td>{{(data.page.p-1)*15+(i+1)}}</td>
                                        <td>{{list.XJPointName}}</td>
                                        <td>{{list.XJPointType}}</td>
                                        <td>{{list.XJPointInfo}}</td>
                                        <td>{{list.XJPointParamId}}</td>
                                        <td>{{list.remark}}</td>
                                        <td>
                                            <a title="编辑" onclick="xadmin.open('编辑','yunwei-xjpoint-edit.html','','','{{list.id}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe642;</i>
                                            </a>
                                            {{if list.XJPointType=='二维码'}}
                                            <a title="生成二维码" id="img{{list.id}}" download="{{list.XJPointName}}" href="{{list.ewm}}" class="fancybox-view">
                                                <i class="layui-icon">&#xe857;</i>
                                                <img src="{{list.FaultImg}}" alt="" style="display:none;">
                                            </a>
                                            {{/if}}
                                            <a title="删除" onclick="x_admin_del('确认删除吗？','DelXJPointKey','{{list.id}}',this)" href="javascript:;">
                                                <i class="layui-icon">&#xe640;</i>
                                            </a>
                                        </td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        //请求地址
        var url = "GetXJPointListKey";
        $(function(){
            //初始化数据
            list.get(url, param,function(r){
                $.each(r.data.info,function(n,val){
                    val.ewm = imgUrl + val.ewm.substr(1,val.ewm.length);
                })
            },function(r){
                //dealEwm(r)
                //预览图片
                fnFancyBox('.fancybox-view');
            });
            layui.use(["form"], function () {
                $ = layui.jquery;
                var form = layui.form;
                //监听提交
                form.on("submit(search)", function (data) {
                    param.pageNo = 1;
                    param.search = data.field.search;
                    list.get(url, param,function(r){
                        $.each(r.data.info,function(n,val){
                            val.ewm = imgUrl + val.ewm.substr(1,val.ewm.length);
                        })
                    },function(r){
                        //dealEwm(r)
                        //预览图片
                        fnFancyBox('.fancybox-view');
                    });
                    return false;
                });    
            });
            
        })
        function dealEwm(r){
            $.each(r.data.info,function(n,val){
                var data='名称:'+val.XJPointName;
                var qrcode = $('#'+val.id).qrcode({
                    width: 128,
                    height: 128,
                    text: toUtf8(data)
                });
                var canvas=$('#'+val.id).find("canvas")[0];
                $('#img'+val.id).attr("href",canvas.toDataURL('image/jpeg'));
            })
        }
        //分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            list.get(url, param,function(r){
                $.each(r.data.info,function(n,val){
                    val.ewm = imgUrl + val.ewm.substr(1,val.ewm.length);
                })
            },function(r){
                //dealEwm(r)
                //预览图片
                fnFancyBox('.fancybox-view');
            });
        }
    </script>
</body>

</html>
