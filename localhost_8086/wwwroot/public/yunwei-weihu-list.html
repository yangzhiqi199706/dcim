<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>运维管理->维护任务</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" placeholder="请输入任务名称\任务编号" name="search" autocomplete="off">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <select id="WHStatus" name="WHStatus" lay-filter="WHStatus">
                                    <option value="">维护状态</option>
                                    <option value="待执行">待执行</option>
                                    <option value="逾期未执行">逾期未执行</option>
                                    <option value="待确认">待确认</option>
                                    <option value="完成">完成</option>
                                    <option value="逾期终止">逾期终止</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                        <button class="layui-btn x-right" onclick="xadmin.open('发起任务','yunwei-weihu-add.html')">
                            <i class="layui-icon"></i>发起任务
                        </button>
                    </div>
                    <div class="layui-card-body">
                        <table class="layui-table">
                            <thead>
                                <tr>
                                    <th>维护编号</th>
                                    <th>维护任务名称</th>
                                    <th>维护内容</th>
                                    <th>关联设备</th>
                                    <th>发起人</th>
                                    <th>维护负责人</th>
                                    <th>计划完成时间</th>
                                    <th>状态</th>
                                    <th>发起时间</th>
                                    <th>系统派发</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.info.length!=0}} {{each data.info as list i}}
                                    <tr>
                                        <td>{{list.WHTaskNumber}}</td>
                                        <td>{{list.WHTaskName}}</td>
                                        <td>{{list.WHTaskCon}}</td>
                                        <td>{{list.WHDeviceId}}</td>
                                        <td>{{list.CreateEmpName}}</td>
                                        <td>{{list.WHEmpName}}</td>
                                        <td>{{list.PlanComplateDate}}</td>
                                        <td>{{list.WHStatus}}</td>
                                        <td>{{list.create_time}}</td>
                                        <td>{{if list.system==1}}否{{else}}是{{/if}}</td>
                                        <td>
                                            {{if list.WHStatus=="待执行"}}
                                            <a title="编辑" onclick="xadmin.open('编辑','yunwei-weihu-edit.html','','','{{list.id}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe642;</i>
                                            </a>
                                            <a title="执行" onclick="xadmin.open('执行','yunwei-weihu-do.html','','','{{list.id}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe652;</i>
                                            </a>
                                            {{/if}}
                                            {{if list.WHStatus=="待确认"}}
                                            <a title="确认" onclick="xadmin.open('确认','yunwei-weihu-check.html','','','{{list.id}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe6b2;</i>
                                            </a>
                                            {{/if}}
                                            {{if list.WHImg}}
                                            <a title="浏览图片" class="fancybox-view" href="{{list.WHImg}}">
                                                <i class="layui-icon">&#xe64a;</i>
                                                <img src="{{list.WHImg}}" alt="" style="display:none;">
                                            </a>
                                            {{/if}}
                                            {{if list.WHStatus=="待执行"}}
                                            <a title="删除" onclick="x_admin_del('确认删除吗？','DelWHTaskKey','{{list.id}}',this)" href="javascript:;">
                                                <i class="layui-icon">&#xe640;</i>
                                            </a> 
                                            {{/if}}
                                            {{if list.WHStatus=="逾期未执行"}}
                                            <a title="终止" onclick="xadmin.open('终止','yunwei-weihu-cancel.html','','','{{list.id}}')" href="javascript:;">
                                                <i class="layui-icon">&#x1006;</i>
                                            </a>
                                            {{/if}}
                                        </td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        //请求地址
        var url = "GetWHTaskListKey";
        if(localStorage.getItem('whStatus'))param.Status=localStorage.getItem('whStatus');layuiSelected("WHStatus", localStorage.getItem('whStatus'));localStorage.removeItem('whStatus');
        $(function () {
            //初始化数据
            list.get(url, param,dealdata);
            layui.use("form", function () {
                $ = layui.jquery;
                var form = layui.form;
                //监听提交
                form.on("submit(search)", function (data) {
                    param.pageNo = 1;
                    param.search = data.field.search;
                    param.Status = data.field.WHStatus;
                    list.get(url, param,dealdata);
                    return false;
                });
                //预览图片
                fnFancyBox('.fancybox-view');
            });
            
        })
        //数据处理
        function dealdata(r){
            $.each(r.data.info,function(n,val){
                if(val.WHImg  && val.WHImg.indexOf('http')<0){
                    val.WHImg=imgUrl+val.WHImg;
                }
            });
        }
        //分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            list.get(url, param,dealdata);
        }
    </script>
</body>

</html>
