<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        所属服务器<span class="x-red">*</span>
                    </label>
                    <div class="layui-input-inline">
                        <select id="ServerCode" name="ServerCode" lay-verify="required" lay-filter="ServerCode">
                            <option value="">请选择</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        所属区域<span class="x-red">*</span>
                    </label>
                    <div class="layui-input-inline">
                        <select id="AreaId" name="AreaId" lay-verify="required" lay-filter="AreaId">
                            <option value="">请选择</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">预占U位数(个)<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="number" id="PreNumber" value="" name="PreNumber" lay-verify="required" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">功率(W)<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="PrePower" value="" name="PrePower" lay-verify="required" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">重量(Kg)<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="PreWeight" value="" name="PreWeight" lay-verify="required" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">电源插口(个)</label>
                    <div class="layui-input-inline">
                        <input type="number" id="PreJackPort" value="1" name="PreJackPort" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">网口(个)</label>
                    <div class="layui-input-inline">
                        <input type="number" id="PreNetworkPort" value="1" name="PreNetworkPort" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">光口(个)</label>
                    <div class="layui-input-inline">
                        <input type="number" id="PreSmoothPort" value="1" name="PreSmoothPort" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        容量模型
                    </label>
                    <div class="layui-input-inline">
                        <select id="PreCapacityModelId" name="PreCapacityModelId" lay-filter="PreCapacityModelId">
                            <option value="">请选择</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">机柜<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="position" value="" name="position" autocomplete="off" class="layui-input" readonly>
                        <input type="hidden" id="PreCabinetId" value="" name="PreCabinetId" autocomplete="off" class="layui-input" readonly>
                    </div>
                    <div class="layui-form-mid layui-word-aux">
                        <a class="layui-btn" id="choose" lay-submit lay-filter="choose" ype="button">选择</a>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        预占U位<span class="x-red">*</span>
                    </label>
                    <div class="layui-input-block" id="ulist">
                        <script type="text/html" id="utemplate">
                            {{each data as list i}}
                            {{if list.UStatus==null}}
                                <input type="checkbox" name="UPosition" value="{{list.ULocation}}" title="{{list.ULocation}}" lay-skin="primary">
                            {{/if}}
                            {{/each}}
                        </script>
                    </div>
                </div>
                <div class="layui-form-item layui-form-text">
                    <label class="layui-form-label">预占说明</label>
                    <div class="layui-input-block">
                        <textarea placeholder="请输入内容" id="PreDescribe" name="PreDescribe" class="layui-textarea"></textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        var formdata='';
        var form;
        $(function(){
            layui.use(["form"], function () {
                $ = layui.jquery;
                form = layui.form;
                param.ComboBox='all';
                list.info('GetCapacityModelListKey',param,function(r){
                    $("#PreCapacityModelId").html('<option value="">请选择容量模型</option>');
                    var prehtml = "";
                    $.each(r.data, function (n, val) {
                        prehtml += "<option value=\"" + val.id + "\">" + val.CapacityModelName + "</option>";
                    });
                    $("#PreCapacityModelId").append(prehtml);
                    form.render("select");
                })
                //服务器
                getServer(form,function(){
                    form.on("select(ServerCode)", function (data) {
                        getArea(form,data);
                        form.on("select(AreaId)", function (rdata) {
                            getColumn(form,rdata);
                            form.on("select(column)", function (redata) {
                                getCabinet(form,redata);
                            });
                        });
                    });
                });
                //选择机柜
                form.on("submit(choose)", function (data) {
                    formdata =  new FormData($("#formNow")[0]);
                    xadmin.open('选择机柜','asset-preemption-cabinet.html?');
                });
                //监听提交
                form.on("submit(submit)", function (data) {
                    var strformData =  new FormData($("#formNow")[0]);
                    if(!strformData.get('PreCabinetId') || !strformData.get('UPosition')){
                        return layer.msg("必填项不能为空", {
							icon: 5,
							time: 1000
						});
                    }
                    strformData.append('PreUPosition',strformData.getAll('UPosition'));
                    strformData.append("token", token);
                    list.form("CreatePreemptionKey", strformData, function (r) {
                        backToparent("添加成功");
                    });
                });
            });
        })
        function getU(){
            list.info('GetCabinetUKey',{
                token:token,
                id:$('#PreCabinetId').val()
            },function(r){
                var lists = template("utemplate", r);
                $("#ulist").html(lists);
                form.render();
            })
        }
    </script>
</body>

</html>
