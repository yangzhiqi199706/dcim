<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<style>
    #syncuser {
        margin-right: 10px !important;
    }
</style>

<body>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body mennav">
                        <a class="layui-btn">
                            用户管理
                        </a>
                        <a class="layui-btn layui-btn-primary">
                            考勤记录
                        </a>
                        <a class="layui-btn layui-btn-primary">
                            操作记录
                        </a>
                        <a class="layui-btn layui-btn-primary">
                            控制记录
                        </a>
                    </div>
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" placeholder="请输入用户名" name="search">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                        <button class="layui-btn x-right" type="button" id="syncuser">用户同步</button>
                    </div>
                    <div class="layui-card-body">
                        <table class="layui-table">
                            <thead>
                                <tr>
                                    <th>姓名</th>
                                    <th>工号</th>
                                    <th>卡号</th>
                                    <th>卡片数量</th>
                                    <th>权限</th>
                                    <th>是否过期</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.length!=0}} {{each data as list i}}
                                    <tr>
                                        <td>{{list.PersonName}}</td>
                                        <td>{{list.PersonNumber}}</td>
                                        <td>{{list.DoorCardNum}}</td>
                                        <td>{{list.DoorCardNumber}}</td>
                                        <td>{{list.DoorPriName}}</td>
                                        <td>{{list.OverDate}}</td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        var id = GetString("id");
        var SN = GetString("SerialNumber");
        var code = GetString("code");
        var url = "GetEmpListKey";
        var type = GetString("type");
        let catchEmp;
        let resGroupId = [];
        let paramAll = {
            pageNo: 1,
            pageSize: 15
        };

        $(function () {
            $('.mennav a').eq(0).attr('href', 'donghuan-menCus-list.html?id=' + id + '&SerialNumber=' + SN + '&code=' + code + '&type=' + type);
            $('.mennav a').eq(1).attr('href', 'donghuan-menAtt-list.html?id=' + id + '&SerialNumber=' + SN + '&code=' + code + '&type=' + type);
            $('.mennav a').eq(2).attr('href', 'donghuan-menOper-list.html?id=' + id + '&SerialNumber=' + SN + '&code=' + code + '&type=' + type);
            $('.mennav a').eq(3).attr('href', 'donghuan-menCmd-list.html?id=' + id + '&SerialNumber=' + SN + '&code=' + code + '&type=' + type);

            if (code == '14001' || code == '14005') {
                $('.mennav a').eq(1).text('事件记录');
                $('.mennav a').eq(2).hide();
            }

            paramAll.DevId = id;
            paramAll.token = token;
            paramAll.ComboBox = 'all';

            layui.use("form", function () {
                $ = layui.jquery;
                var form = layui.form;

                // 先拿门禁分组，再拿人员列表
                list.info("GetDoorParamDetailKey", {
                    token: token,
                    id: id
                }, function (res) {
                    if (res.data && res.data.GroupId) {
                        resGroupId = res.data.GroupId.split(',').map(function (id) {
                            return id.trim();
                        }).filter(function (id) {
                            return id !== '';
                        });
                    }
                    list.info(url, paramAll, dealdata);
                });

                form.on("submit(search)", function (data) {
                    paramAll.pageNo = 1;
                    paramAll.search = data.field.search;
                    list.info(url, paramAll, dealdata);
                    return false;
                });
            });
        });
        //数据处理
        function dealdata(r) {
            if (!Array.isArray(r.data)) r.data = [];

            r.data = r.data.filter(function (item) {
                if (!item.GroupId) return false;
                let itemGroupIds = item.GroupId.split(',').map(function (id) {
                    return id.trim();
                }).filter(function (id) {
                    return id !== '';
                });
                return itemGroupIds.some(function (id) {
                    return resGroupId.includes(id);
                });
            });

            $.each(r.data, function (n, val) {
                val.DoorCardNumber = 0;
                val.DoorPriName = '';
                val.overDate = '-';

                if (code == '14001') {
                    if (val.DoorCardList) {
                        let DoorCardListArr = JSON.parse(val.DoorCardList);
                        val.DoorCardNumber = DoorCardListArr.length;
                        val.DoorCardNum = DoorCardListArr.map(function (card) {
                            return card.cardNo;
                        }).filter(Boolean).join("、");
                    }
                    switch (val.DoorPri) {
                        case '0': val.DoorPriName = '普通用户'; break;
                        case '2': val.DoorPriName = '来宾'; break;
                        case '6': val.DoorPriName = '非授权名单'; break;
                    }
                    if (val.ValidStratTime && val.ValidEndTime) {
                        var time = new Date();
                        var timenum = time.getTime() - new Date(Date.parse(val.ValidEndTime)).getTime();
                        if (timenum > 0) {
                            val.OverDate = '已过期';
                        } else {
                            val.OverDate = '未过期';
                        }
                        var starttimenum = time.getTime() - new Date(Date.parse(val.ValidStratTime)).getTime();
                        if (starttimenum < 0) {
                            val.OverDate = '未生效';
                        }
                    }
                } else if (code == '14002' || code == '14005') {
                    if (val.DoorCardNum) {
                        val.DoorCardNumber = 1;
                    }
                    switch (val.DoorPri) {
                        case '0': val.DoorPriName = '普通用户'; break;
                        case '2': val.DoorPriName = '登记员'; break;
                        case '6': val.DoorPriName = '管理员'; break;
                        case '14': val.DoorPriName = '超级管理员'; break;
                    }
                }

                if (n + 1 == r.data.length) {
                    catchEmp = r;
                    pagechange(1);
                }
            });

            // 空数据或 each 未进入时也要渲染
            if (!catchEmp || !Array.isArray(catchEmp.data) || catchEmp !== r) {
                catchEmp = r;
                pagechange(1);
            }

            x_admin_page(r.data.length, paramAll.pageSize, pagechange);
        }

        //分页回调
        function pagechange(curr) {
            let list = {
                data: catchEmp.data.slice(paramAll.pageSize * (curr - 1), paramAll.pageSize * curr)
            }
            var lists = template("listtemplate", list);
            $("tbody:not('.chooseTable')").html(lists);
        }


        //用户同步
        $('#syncuser').click(function () {
            list.info('ChangeDoorParamKey', {
                token: token,
                DevId: id,
                userSync: 1
            }, function (res) {
                layer.msg("已发送，等待同步", {
                    icon: 1,
                    time: 2000
                });
                if (code == '14001') {
                    getDoorInfo('hik', {
                        DevId: id
                    });
                }
                //执行5次 ，每5秒请求一次 同步结果
                let time = 0;
                var setCallBcakTime = setInterval(function () {
                    time += 1;
                    if (time <= 10) {
                        list.info("GetDoorParamDetailKey", {
                            token: token,
                            id: id
                        }, function (res) {
                            if (res.data.userSync == 0) {
                                clearInterval(setCallBcakTime);
                                layer.msg("用户已同步到人员管理！", {
                                    icon: 1,
                                    time: 2000
                                });
                            }
                        })
                    } else {
                        clearInterval(setCallBcakTime);
                        layer.msg("用户同步出错！", {
                            icon: 5,
                            time: 2000
                        });
                    }
                }, 5000)
            });

        })

    </script>
</body>

</html>
