<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <script type="text/html" id="detail">
                <div class="layui-form-item">
                    <label class="layui-form-label">需求名称<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="NeedName" value="{{data.NeedName}}" name="NeedName" lay-verify="required"
                            autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">需求说明<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="NeedDescribe" value="{{data.NeedDescribe}}" name="NeedDescribe"
                            lay-verify="required" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">调整时间<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="AdjustTime" value="{{data.AdjustTime}}" name="AdjustTime"
                            lay-verify="required" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">调整指令<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="AdjustOrder" value="{{data.AdjustOrder}}" name="AdjustOrder"
                            lay-verify="required" autocomplete="off" class="layui-input" readonly>
                        <input type="hidden" id="AdjustOrder" value="{{data.AdjustOrder}}" name="AdjustOrder"
                            lay-verify="required" autocomplete="off" class="layui-input" readonly>
                    </div>
                    <div class="layui-form-mid layui-word-aux">
                        <a class="layui-btn" onclick="xadmin.open('选择','choose-department.html?type=dept')">选择</a>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
            </script>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <Script>
        $(function () {
            var id = GetString("id");
            //获取详情
            list.info("GetCapacityNeedDetailKey", {
                token: token,
                id: id
            }, function (r) {
                var html = template("detail", r);
                $("#formNow").html(html);
                layui.use(["form",'laydate'], function () {
                    $ = layui.jquery;
                    var form = layui.form;
                    var laydate = layui.laydate;
                    laydate.render({
                        elem: '#AdjustTime', //指定元素
                        type:'datetime'
                    });
                    //监听提交
                    form.on("submit(submit)", function (data) {
                        var strformData = new FormData($("#formNow")[0]);
                        strformData.append("token", token);
                        strformData.append("id", id);
                        list.form("ChangeCapacityNeedKey", strformData, function (r) {
                            backToparent("修改成功");
                        });
                    });
                });
            });
        });
    </Script>
</body>

</html>
