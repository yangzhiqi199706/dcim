<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <style>
        .imgPos {
            position: relative;
            top: -2px;
            width: 18px
        }
    </style>
</head>

<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>资产管理->基础配置->U位设置->U位设备定义</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" placeholder="请输入设备名称" name="search">
                            </div>
                            <div class="layui-inline layui-show-xs-block" id="serverCodeDiv">
                                <select id="ServerCode" name="ServerCode" lay-filter="ServerCode">
                                    <option value="">服务器</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block" id="areaIdDiv">
                                <select id="AreaId" name="AreaId" lay-filter="AreaId">
                                    <option value="">区域</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                        <button class="layui-btn x-right" onclick="xadmin.open('添加U位设备','donghuan-device-add.html?type=udevice')">
                            添加U位设备
                        </button>
                    </div>
                    <div class="layui-card-body">
                        <table class="layui-table layui-form">
                            <thead>
                                <tr>
                                    <th>编号</th>
                                    <th>设备名称</th>
                                    <th>设备ID</th>
                                    <th>设备型号</th>
                                    <th>IP:端口/串口地址</th>
                                    <th>设备分类</th>
                                    <th>所属服务器</th>
                                    <th>所属区域</th>
                                    <th>当前状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                            {{if data.info.length!=0}} {{each data.info as list i}}
                            <tr {{if list.ClassName!='门禁' && list.ClassName!='微信网关' && list.DeviceClass!='6' && list.DeviceClass!='7' && list.DeviceClass!='19' && list.DeviceStatus==0}} class="colorred"{{/if}}>
                                <td>{{(data.page.p-1)*15+(i+1)}}</td>
                                <td name="name">{{list.DeviceName}}</td>
                                <td>{{list.id}}</td>
                                <td>{{list.DeviceType}}</td>
                                <td>{{if list.LinkMode==1 || list.LinkMode==3}}{{list.DeviceIP}}:{{list.DevicePort}}{{else if list.LinkMode==2}}{{list.DeviceIP}}{{/if}}</td>
                                <td>{{list.ClassName}}</td>
                                <td>{{list.ServerName}}</td>
                                <td>{{list.AreaName}}</td>
                                <td>{{if list.ClassName!='门禁' && list.ClassName!='微信网关' && list.DeviceClass!='6' && list.DeviceClass!='7' && list.DeviceClass!='19'}}{{if list.DeviceStatus==0}} 离线 {{else}} 在线 {{/if}}{{else}}-{{/if}}</td>
                                <td>
                                    {{if list.ClassName!='微信网关' && list.DeviceClass!='6' && list.DeviceClass!='7' && list.DeviceClass!='19'}}
                                        <a title="当前值" onclick="xadmin.open('当前值','donghuan-device-value.html','','','{{list.id}}&LinkMode={{list.LinkMode}}')" href="javascript:;">
                                            <i class="layui-icon">&#xe714;</i>
                                        </a>
                                        {{if list.ProtocolCode!='18001' && list.ClassName!='门禁'}}
                                        {{if list.LinkMode!=3}}
                                            <a title="采集指令/控制指令" onclick="xadmin.open('采集指令/控制指令','donghuan-device-commandRev.html','','','{{list.id}}&code={{list.ProtocolCode}}&linktype={{list.LinkMode}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe808;</i>
                                            </a>
                                        {{else}}
                                            <a title="控制指令" onclick="xadmin.open('控制指令','donghuan-device-command.html','','','{{list.id}}&code={{list.ProtocolCode}}&linktype={{list.LinkMode}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe808;</i>
                                            </a>
                                        {{/if}}
                                        {{/if}}
                                    {{/if}}
                                    <a title="编辑" onclick="xadmin.open('编辑','donghuan-device-edit.html','','','{{list.id}}')" href="javascript:;">
                                        <i class="layui-icon">&#xe642;</i>
                                    </a>
                                    <a title="删除" onclick="x_admin_del('确认删除吗？','DelDeviceKey','{{list.id}}',this)" href="javascript:;">
                                        <i class="layui-icon">&#xe640;</i>
                                    </a>
                                    <a title="事件" onclick="xadmin.open('事件','donghuan-event-list.html','','','{{list.id}}')" href="javascript:;" >
                                        <i class="layui-icon">&#xe656;</i>
                                    </a>
                                    {{if list.ClassName=='门禁'}}
                                        <a title="下发权限" onclick="xadmin.open('下发权限','donghuan-mencus-group.html','','','{{list.id}}')" href="javascript:;" >
                                            <i class="layui-icon">&#xe609;</i>
                                        </a>
                                        {{if list.ProtocolCode=='14003'}}
                                            <a title="门禁管理" onclick="xadmin.open('门禁管理','donghuan-menDAHUA-list.html','','','{{list.id}}&ip={{list.DeviceIP}}&port={{list.DevicePort}}&user={{list.account}}&password={{list.password}}')" href="javascript:;" >
                                                <i class="layui-icon">&#xe672;</i>
                                            </a>
                                        {{else if list.ProtocolCode=='14004'}}
                                            <a title="门禁管理" onclick="xadmin.open('门禁管理','donghuan-menAndakai-list.html','','','{{list.id}}')" href="javascript:;" >
                                                <i class="layui-icon">&#xe672;</i>
                                            </a>
                                        {{else}}
                                            <a title="门禁管理" onclick="xadmin.open('门禁管理','donghuan-menCus-list.html','','','{{list.id}}&SerialNumber={{list.SerialNumber}}&code={{list.ProtocolCode}}')" href="javascript:;" >
                                                <i class="layui-icon">&#xe672;</i>
                                            </a>
                                        {{/if}}
                                    {{/if}}
                                    {{if list.LinkMode==3}}
                                        <a title="导入参数" href="javascript:;" id="oid{{list.id}}">
                                            <i class="layui-icon">&#xe610;</i>
                                        </a>
                                        <a title="导入trap告警参数" href="javascript:;" id="alarm{{list.id}}">
                                            <i class="layui-icon">&#xe667;</i>
                                        </a>
                                    {{/if}}
                                    {{if list.ProtocolCode=='18001'}}
                                        <a title="导入U位信息" href="javascript:;" id="u{{list.id}}">
                                            <i class="layui-icon">&#xe681;</i>
                                        </a>
                                        <a title="导入温湿度信息" href="javascript:;" id="th{{list.id}}">
                                            <i class="layui-icon">&#xe67c;</i>
                                        </a>
                                    {{/if}}
                                    <a title="撤防" onclick="SetAlarmCloseNotice(this,'{{list.id}}')" href="javascript:;"  {{if list.Deploy=="0"}}style="display: none;"{{/if}}>
                                        <img src="images/closenotice.png" class="imgPos">
                                    </a>
                                    <a title="布防" onclick="SetAlarmNotice(this,'{{list.id}}')" href="javascript:;"  {{if list.Deploy=="1"}}style="display: none;"{{/if}}>
                                        <img src="images/notice.png" class="imgPos">
                                    </a>
                                </td>
                            </tr>
                            {{/each}} {{else}}
                            <tr>
                                <td colspan="20" style="text-align: center">暂无相关数据</td>
                            </tr>
                            {{/if}}
                        </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        // 请求地址
        var url = "GetDeviceListKey";
        var search = '', form, upload;
        var selectedDevices = []; // 存储选中的设备序列号
        $(function () {

            param.ClassName = 'U位设备';

            // 初始化Layui模块
            layui.use(["form", "upload"], function () {
                $ = layui.jquery;
                form = layui.form;
                upload = layui.upload;
                form.render();

                // 服务器选择
                getServer(form, function () {
                    form.on("select(ServerCode)", function (data) {
                        param.ServerCode = data.value;
                        param.ComboBox = "all";
                        getArea(form, data);
                    });
                });

                // 初始化数据
                delete param['ComboBox'];
                list.get(url, param, dealdata, dealupload);

                // 搜索提交
                form.on("submit(search)", function (data) {
                    param.pageNo = 1;
                    param.search = search = data.field.search;
                    param.ServerCode = data.field.ServerCode;
                    param.AreaId = data.field.AreaId;
                    delete param['ComboBox'];
                    list.get(url, param, dealdata, dealupload);
                    return false;
                });
                
            });

            // 定时刷新数据
            var time = setInterval(function () {
                delete param['ComboBox'];
                list.get(url, param, dealdata, dealupload);
            }, 120000);
        })

        // 去除重复设备
        function unique(arr, devlist) {
            let newarr = [];
            $.each(arr, function (n, val) {
                let findnew = newarr.findIndex(v => v.DevID == val.DevID);
                let finddev = devlist.findIndex(v => v.DevID == val.DevID);
                if (findnew < 0 && finddev > -1) {
                    val.DeviceStatus = devlist[finddev].DeviceStatus;
                    newarr.push(val);
                }
            })
            return newarr;
        }

        // 处理数据
        function dealdata(r, callback) {
            let data = r.data;
            // console.log(r);
            if (callback) {
                let res = {
                    data: data
                }
                callback(res);
            }
        }

        // 处理导入参数
        function dealupload(res) {
            $.each(res.data.info, function (n, val) {
                if (val.LinkMode == 3) {
                    //导入oid
                    setUpload(upload, '#oid' + val.id, {
                        'DevId': val.id,
                        'token': token
                    }, 'xls', 'ImportSnmpKey');
                    //导入alarm
                    setUpload(upload, '#alarm' + val.id, {
                        'DevId': val.id,
                        'token': token
                    }, 'xlsx', 'ImportSnmpAlarmKey');
                }
                if (val.ProtocolCode == '18001') {
                     //导入U位信息
                    setUpload(upload, '#u' + val.id, {
                        'DevId': val.id,
                        'token': token
                    }, 'json', 'ImportUDeviceJsonKey');
                    //导入温湿度信息
                    setUpload(upload, '#th' + val.id, {
                        'DevId': val.id,
                        'token': token
                    }, 'json', 'ImportUDeviceTHJsonKey');
                }
            })
            form.render();
        }

        // 文件上传实例
        function setUpload(upload, key, param, type, url) {
            upload.render({
                elem: key,
                data: param,
                accept: 'file',
                exts: type,
                url: ajaxUrl + url,
                before: function (obj) {
                    layer.load();
                },
                done: function (res) {
                    layer.closeAll('loading');
                    if (res.code == 100) {
                        layer.msg("导入成功！", { icon: 1, time: 1000 });
                    } else {
                        layer.msg(res.msg, { icon: 5, time: 2000 });
                    }
                },
                error: function () {
                    layer.closeAll('loading');
                    layer.msg(r.msg, { icon: 5, time: 1000 });
                }
            });
        }

        //设备布防
        function SetAlarmNotice(obj, id) {
            list.info('SetAlarmNoticeKey', {
                token: token,
                DevId: id
            }, function (r) {
                if (r.data == true) {
                    layer.msg("布防成功！", {
                        icon: 1,
                        time: 1000
                    });
                    $(obj).hide().prev().css('display', 'inline-block');
                } else {
                    layer.msg("布防失败！", {
                        icon: 5,
                        time: 2000
                    });
                }
            })
        }
        //设备撤防
        function SetAlarmCloseNotice(obj, id) {
            list.info('SetAlarmCloseNoticeKey', {
                token: token,
                DevId: id
            }, function (r) {
                if (r.data == true) {
                    layer.msg("撤防成功！", {
                        icon: 1,
                        time: 1000
                    });
                    $(obj).hide().next().css('display', 'inline-block');
                } else {
                    layer.msg("撤防失败！", {
                        icon: 5,
                        time: 2000
                    });
                }
            })
        }

        // 分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            delete param['ComboBox'];
            list.get(url, param, dealdata, dealupload);
        }

        //其它页面回到此页面
        function changecallbak() {
            delete param['ComboBox'];
            list.get(url, param, dealdata, dealupload);
        }
    </script>
</body>

</html>
