<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <script type="text/html" id="detail">
                    <div class="layui-form-item">
                        <label class="layui-form-label">易耗品编号<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="ConsumablesNumber" value="{{data.ConsumablesNumber}}" name="ConsumablesNumber" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">易耗品名称<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="ConsumablesName" value="{{data.ConsumablesName}}" name="ConsumablesName" lay-verify="required" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">品牌<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="ConsumableBrand" value="{{data.ConsumableBrand}}" name="ConsumableBrand" autocomplete="off" lay-verify="required" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">型号规格<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="ConsumableSpec" value="{{data.ConsumableSpec}}" name="ConsumableSpec" autocomplete="off"  lay-verify="required" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">库存位置</label>
                        <div class="layui-input-inline">
                            <select id="StoreLocationId" name="StoreLocationId">
                                <option value="">请选择</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">负责部门</label>
                        <div class="layui-input-inline">
                            <input type="text" id="DeptName" value="{{data.DeptName}}" name="DeptName" autocomplete="off" class="layui-input" readonly>
                            <input type="hidden" id="DeptId" value="{{data.DeptId}}" name="DeptId" autocomplete="off" class="layui-input" readonly>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" onclick="xadmin.open('选择部门','choose-department.html?type=dept')">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">负责人员</label>
                        <div class="layui-input-inline">
                            <input type="text" id="PersonName" value="{{data.PersonName}}" name="PersonName"  autocomplete="off" class="layui-input" readonly>
                            <input type="hidden" id="EmpId" value="{{data.EmpId}}" name="EmpId" autocomplete="off" class="layui-input" readonly>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" onclick="xadmin.open('选择人员','choose-person.html?type=person&DeptId='+$('#DeptId').val())">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item layui-form-text">
                        <label class="layui-form-label">用途</label>
                        <div class="layui-input-block">
                            <textarea placeholder="请输入内容" id="ConsumableUse" name="ConsumableUse" class="layui-textarea">{{data.ConsumableUse}}</textarea>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label"></label>
                        <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                    </div>
                </script>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function(){
            var id = GetString("id");
            //获取详情
            list.info("GetConsumablesDetailKey", {
                token: token,
                id: id
            }, function (r) {
                var html = template("detail", r);
                $("#formNow").html(html);
                layui.use(["form"], function () {
                    $ = layui.jquery;
                    var form = layui.form;
                    //仓库
                    getStoreLocation(form,'',function(){
                        //继成上个接口
                        layuiSelected("StoreLocationId", r.data.StoreLocationName);
                    });
                     //监听提交
				    form.on("submit(submit)", function (data) {
                        var strformData = new FormData($("#formNow")[0]);
                        strformData.append("token", token);
                        strformData.append("id", id);
                        list.form("ChangeConsumablesKey", strformData, function (r) {
                            backToparent("修改成功");
                        });
                    });
                });
            });
        });
    </script>
</body>
</html>
