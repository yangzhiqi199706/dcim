<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>资产管理->基础配置->资产信息->品牌型号</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" placeholder="请输入型号名称" name="search">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                        <div class="x-right">
                            <!-- <button class="layui-btn " onclick="">导入</button>
                            <button class="layui-btn" onclick="">型号模板</button> -->
                            <button class="layui-btn x-right" onclick="xadmin.open('添加品牌型号','asset-brand-add.html')">
                                添加品牌型号
                            </button>
                            <a class="layui-btn x-right" id="importBtn3" style="margin-right: 10px;">
                                导入型号
                            </a>
                            <a class="layui-btn x-right" id="importBtn2">
                                导入品牌
                            </a>
                            <a class="layui-btn x-right" id="importBtn" style="margin-right: 10px;">
                                导入厂商
                            </a>
                            <a href="/upfiletpl/brandModel.zip" download="" class="importTpl x-right"
                                style="margin-top: 7px;">《下载模版》</a>
                        </div>
                    </div>
                    <div class="layui-card-body">
                        <div id="tree"></div>
                        <ul id="menu">
                            <li>编辑</li>
                            <li>删除</li>
                        </ul>
                        <table class="layui-table layui-col-tree">
                            <thead>
                                <tr>
                                    <th>编号</th>
                                    <th>型号</th>
                                    <th>品牌</th>
                                    <th>资产类型</th>
                                    <th>质保时长（月）</th>
                                    <th>报废年限（年）</th>
                                    <th>3D模型ID</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.info && data.info.length!=0}} {{each data.info as list i}}
                                    <tr>
                                        <!-- <td>{{list.BrandModelNumber}}</td> -->
                                        <td>{{(data.page.p-1)*15+(i+1)}}</td>
                                        <td>{{list.BrandModel}}</td>
                                        <td>{{list.BrandName}}</td>
                                        <td>{{list.AssetsTypeName}}</td>
                                        <td>{{list.ModelQa}}</td>
                                        <td>{{list.ModelScrap}}</td>
                                        <td>{{if !list.ThrDModelId}}{{list.ThrDModelId}}{{else}}-{{/if}}</td>
                                        <td>
                                            <a title="编辑" onclick="xadmin.open('编辑','asset-brand-edit.html','','','{{list.id}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe642;</i>
                                            </a>
                                            <a title="属性详情" onclick="xadmin.open('属性详情','choose-asset-brandattr.html','','','{{list.id}}&typeid={{list.AssetsTypeId}}&parentName='+encodeURI(encodeURI('{{list.parentTypeName}}'))+'&grandparentName='+encodeURI(encodeURI('{{list.grandparentTypeName}}')))" href="javascript:;">
                                                <i class="layui-icon">&#xe643;</i>
                                            </a>
                                            <a title="删除" onclick="x_admin_del('确认删除吗？','DelBrandModelKey','{{list.id}}',this)" href="javascript:;">
                                                <i class="layui-icon">&#xe640;</i>
                                            </a>
                                        </td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        let tree;
        $(function () {
            layui.use(["form", "tree", "upload"], function () {
                $ = layui.jquery;
                var form = layui.form;
                tree = layui.tree;
                var upload = layui.upload;

                //导入厂商
                upDataPtl(upload, {
                    "table": "dcim-company",
                    "primary_key": "CompanyName",
                    "primary_field_name": "CompanyName",
                    "mappings": []
                }, () => {
                    getComBrand()
                }, '#importBtn')

                //导入品牌
                upDataPtl(upload, {
                    "table": "dcim-brand",
                    "primary_key": "BrandName",
                    "primary_field_name": "BrandName",
                    "mappings": [
                        {
                            "excel_field": "CompanyId",
                            "lookup_table": "dcim-company",
                            "lookup_field": "CompanyName",
                            "lookup_value": "id"
                        }
                    ]
                }, () => {
                    getComBrand()
                }, '#importBtn2')

                //导入型号
                upDataPtl(upload, {
                    "table": "dcim-brandmodel",
                    "primary_key": "BrandModel",
                    "primary_field_name": "BrandModel",
                    "mappings": [
                        {
                            "excel_field": "BrandId",
                            "lookup_table": "dcim-brand",
                            "lookup_field": "BrandName",
                            "lookup_value": "id"
                        },
                        {
                            "excel_field": "AssetsTypeId",
                            "lookup_table": "dcim-assettype",
                            "lookup_field": "AssetsTypeName",
                            "lookup_value": "id"
                        }
                    ]
                }, () => {
                    getComBrand()
                }, '#importBtn3')

                //初始化数据
                //类型树形列表 厂商-品牌
                getComBrand();

                //监听提交
                form.on("submit(search)", function (data) {
                    param.pageNo = 1;
                    param.search = data.field.search;
                    list.get('GetBrandModelListKey', param);
                    return false;
                });

            });
        })
        //分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            list.get('GetBrandModelListKey', param);
        }
        //厂商品牌
        function getComBrand() {
            param.ComboBox = "all";
            delete (param['search']);
            $('input[name=search]').val('');
            list.info('GetCompanyListKey', param, function (r) {
                let treedata = new Array();
                //树形数据
                var firstthrchild = -1;
                if (r.data.length != 0) {
                    $.ajaxSettings.async = false;
                    $.each(r.data, function (n, val) {
                        var rnewdata = {
                            title: val.CompanyName,
                            id: val.id,
                            spread: firstthrchild == -1 ? true : false,
                            other: 1,
                            children: []
                        }
                        param.CompanyId = val.id;
                        list.info('GetBrandListKey', param, function (re) {
                            if (re.data.length != 0) {
                                $.each(re.data, function (x, y) {
                                    if (firstthrchild == -1) {
                                        var renewdata = {
                                            title: y.BrandName,
                                            id: y.id,
                                            spread: false,
                                            checked: true,
                                            other: 2,
                                            children: []
                                        }
                                        firstthrchild = y.id;
                                    } else {
                                        var renewdata = {
                                            title: y.BrandName,
                                            id: y.id,
                                            spread: false,
                                            other: 2,
                                            children: []
                                        }
                                    }
                                    rnewdata.children.push(renewdata);
                                });
                            }
                        })
                        treedata.push(rnewdata);
                    })
                    $.ajaxSettings.async = true;
                    delete (param['ComboBox']);//去掉不分页参数
                    delete (param['CompanyId']);
                    //树形菜单
                    tree.render({
                        elem: "#tree",
                        data: treedata,
                        id: 'treeId',
                        // onlyIconControl: true,
                        click: function (obj) {

                            $('.layui-tree-txt').removeAttr('style');
                            $(obj.elem).find('.layui-tree-txt').css('color', '#148cf1');
                            if (obj.data.other == 2) {
                                //型号列表
                                param.BrandId = obj.data.id;
                                delete (param['CompanyId']);
                                list.get('GetBrandModelListKey', param);
                            } else if (obj.data.other == 1) {
                                //厂商下所有品牌所有型号列表
                                delete (param['BrandId']);
                                param.CompanyId = obj.data.id;
                                list.get('GetBrandModelListKey', param);
                            }
                            // setMenu(obj, event.clientX, event.clientY, tree);
                        }
                    });
                    // if (r.data.length == n + 1) {
                    //初始属性列表
                    $('.layui-tree-checkedFirst').find('.layui-tree-txt').css('color', '#148cf1');
                    param.BrandId = firstthrchild;
                    list.get('GetBrandModelListKey', param);
                    // }
                }
            });
        }
        //树形右键菜单
        function setMenu(e, left, top) {
            $('#menu').show().css({
                'left': left,
                'top': top - 100,
            })
            $('#menu li').unbind('click').click(function (event) {
                let liindex = $(this).index();
                let id = e[0].dataset.id;
                switch (liindex) {
                    case 0:
                        if (e[0].dataset.other == 1) {
                            xadmin.open('编辑厂商', 'asset-company-edit.html?id=' + id);
                        } else {
                            xadmin.open('编辑品牌', 'asset-brandnew-edit.html?id=' + id);
                        }
                        break;
                    case 1:
                        layer.confirm('确认删除吗？', function (index) {
                            var url;
                            if (e[0].dataset.other == 1) {
                                url = 'DelCompanyKey';
                            } else {
                                url = 'DelBrandKey';
                            }
                            list.del(url, {
                                token: token,
                                id: id
                            }, function () {
                                layer.msg("已删除!", {
                                    icon: 1,
                                    time: 1000
                                }, function () {
                                    window.location.reload();
                                })
                            })
                        });
                        break;
                }
            })
            //任意点击hide
            $('body').click(function () {
                $('#menu').hide();
            })
        }
    </script>
</body>

</html>
