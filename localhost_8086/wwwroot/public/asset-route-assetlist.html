<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/jquery.qrcode.min.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" placeholder="请输入资产描述" name="search">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                        <button class="layui-btn x-right" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                    </div>
                    <form class="layui-form layui-card-body">
                        <table class="layui-table">
                            <thead>
                                <tr>
                                    <th></th>
                                    <th>所属区域</th>
                                    <th>机柜列</th>
                                    <th>机柜</th>
                                    <th>起始U位</th>
                                    <th>资产类型</th>
                                    <th>型号</th>
                                    <!-- <th>端口类型</th>
                                    <th>端口编号</th> -->
                                    <th>资产编号</th>
                                    <th>资产描述</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.info.length!=0}} {{each data.info as list i}}
                                    <tr>
                                        <td>
                                            <input type="radio" id="{{list.id}}" name="AssetsId"  value="{{list.AssetsId}}" lay-skin="primary">
                                        </td>
                                        <td>{{list.AreaName}}</td>
                                        <td>{{list.column}}</td>
                                        <td>{{list.position}}</td>
                                        <td>{{list.ULocation}}</td>
                                        <td>{{list.AssetsTypeName}}</td>
                                        <td>{{list.BrandModel}}</td>
                                        <td>{{list.AssetsNumber}}</td>
                                        <td>{{list.AssetsDescribe}}</td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                        
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>
        //请求地址
        var url = "GetGroundingAssetsListKey";
        var form;
        var type = GetString("type");
        $(function(){
            //初始化数据
            layui.use(["form"], function () {
                $ = layui.jquery;
                form = layui.form;
                //初始化数据
                list.get(url, param,'',function(){
                    form.render();
                });
                //监听提交
                form.on("submit(search)", function (data) {
                    delete(param['ComboBox']);
                    param.pageNo = 1;
                    param.search = data.field.search;
                    param.AreaId = data.field.AreaId;
                    param.AssetStatus = data.field.AssetStatus;
                    list.get(url, param,'',function(){
                        form.render();
                    });
                    return false;
                }); 
                form.on("submit(submit)", function (data) {
                    var index = parent.layer.getFrameIndex(window.name);
                    parent.layer.close(index);
                    var nameobj, idobj;
                    switch (type) {
                        case 'A': nameobj = 'aAssetsId'; idobj = 'A'; break;
                        case 'B': nameobj = 'bAssetsId'; idobj = 'B'; break;
                    }
                    var id = $('input[name=AssetsId]:checked').val();
                    var title = $('input[name=AssetsId]:checked').val();
                    $(window.parent.document).find('#' + nameobj).val(title);
                    $(window.parent.document).find('#' + idobj).val(id);
                    return false;
                });     
            });
        })
        //分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            list.get(url, param,'',function(){
                form.render();
            });
        }
    </script>
</body>

</html>
