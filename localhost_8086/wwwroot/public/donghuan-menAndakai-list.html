<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input type="text" id="startDateTime" name="startDateTime" class="layui-input" autocomplete="off"
                                    placeholder="开始日期">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <input type="text" id="endDateTime" name="endDateTime" class="layui-input" autocomplete="off"
                                    placeholder="结束日期">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="layui-card-body">
                        <table class="layui-table">
                            <thead>
                                <tr>
                                    <th>序号</th>
                                    <th>部门名称</th>
                                    <th>记录时间</th>
                                    <th>人员类型</th>
                                    <th>人员编号</th>
                                    <th>姓名</th>
                                    <th>设备名称</th>
                                    <th>机号</th>
                                    <th>进出标识</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.info.length!=0}} {{each data.info as list i}}
                                    <tr>
                                        <td>{{i+1}}</td>
                                        <td>{{list.deptName}}</td>
                                        <td>{{list.rdatetime}}</td>
                                        <td>{{list.personTypeName}}</td>
                                        <td>{{list.psnID}}</td>
                                        <td>{{list.pname}}</td>
                                        <td>{{list.smacname}}</td>
                                        <td>{{list.macNo}}</td>
                                        <td>{{list.sInOrOut}}</td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        //请求地址
        var url = "GetDoorADKRecordListKey";
        $(function () {
            //初始化数据
            list.get(url, param);
            layui.use(["form", "laydate"], function () {
                $ = layui.jquery;
                var form = layui.form;
                var laydate = layui.laydate;

                laydate.render({
                    elem: '#startDateTime',
                    type: 'datetime',
                    format: 'yyyy-MM-dd HH:mm:ss'
                });
                laydate.render({
                    elem: '#endDateTime',
                    type: 'datetime',
                    format: 'yyyy-MM-dd HH:mm:ss'
                });
                //监听提交
                form.on("submit(search)", function (data) {
                    param.pageNo = 1;
                    param.startDateTime = data.field.startDateTime;
                    param.endDateTime = data.field.endDateTime;
                    list.get(url, param);
                    return false;
                });
            });
        })
        //分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            list.get(url, param);
        }
    </script>
</body>

</html>
