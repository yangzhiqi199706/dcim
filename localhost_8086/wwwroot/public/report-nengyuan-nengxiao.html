<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/echarts.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>报表管理->能源管理->能效统计</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input type="text" name="month" id="month" class="layui-input" placeholder="年月">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                        <div class="layui-inline layui-show-xs-block x-right">
                            <button class="layui-btn search" type="button" onclick="displayexport('down','nengxtable','年能效统计');displayexport('down','nengxtable1','月能效统计')" id="down">导出</button>
                        </div>
                    </div>
                    <div class="layui-card-body">
                        <div class="massage-box massage-box-md6">
                            <div class="capacity-statistics-title">年能效统计</div>
                            <div id="yearChart" class="massage-chart"></div>
                        </div>
                        <div class="massage-box massage-box-md6">
                            <div class="capacity-statistics-title">月能效统计</div>
                            <div id="monthChart" class="massage-chart"></div>
                        </div>
                        <div class="two-left1 massage-box-md6">
                            <table class="layui-table" id="nengxtable">
                                <thead>
                                    <tr>
                                        <th>名称</th>
                                        <th>年耗能（Kw.h）</th>
                                        <th>年电费（元）</th>
                                        <th>年耗煤（kg）</th>
                                        <th>年CO2排放量（kg）</th>
                                        <!-- <th>年平均PUE</th> -->
                                    </tr>
                                </thead>
                                <tbody>
                                </tbody>
                            </table>
                        </div>
                        <div class="two-left1 massage-box-md6">
                            <table class="layui-table" id="nengxtable1">
                                <thead>
                                    <tr>
                                        <th>名称</th>
                                        <th>月耗能（Kw.h）</th>
                                        <th>月电费（元）</th>
                                        <th>月耗煤（kg）</th>
                                        <th>月CO2排放量（kg）</th>
                                        <!-- <th>月平均PUE</th> -->
                                    </tr>
                                </thead>
                                <tbody>
                                </tbody>
                            </table>
                        </div>
                        <script type="text/html" id="listtemplate">
                            {{if data.length!=0}} {{each data as list i}}
                            <tr>
                                <td>{{list.Date}}</td>
                                <td>{{list.TotalNH}}</td>
                                <td>{{list.TotalDF}}</td>
                                <td>{{list.TotalM}}</td>
                                <td>{{list.TotalCO2}}</td>
                            </tr>
                            {{/each}} {{else}}
                            <tr>
                                <td colspan="20" style="text-align: center">暂无相关数据</td>
                            </tr>
                            {{/if}}
                        </script>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        $(function(){
            var date = new Date();
            var year = date.getFullYear();
            var month = date.getMonth() + 1;
            var chartparam={
                token:token,
                ServerCode:'',
                AreaId:'',
                Date:year+'-'+(month<10?'0'+month:month)
            }
            getdata(chartparam);
            layui.use(["form","laydate"], function () {
                $ = layui.jquery;
                var form = layui.form;
                var laydate = layui.laydate;
                laydate.render({
                    elem: '#month',
                    type: 'month',
                    value: year+'-'+(month<10?'0'+month:month)
                });
                form.render();
                //监听提交
                form.on("submit(search)", function (data) {
                    chartparam.Date=data.field.month;
                    getdata(chartparam);
                    return false;
                });    
            });
        })
        function getdata(chartparam){
            list.info('GetPayInfoKey',chartparam,function(r){
                if(r.data){
                    dealdata(r,'monthChart','月');
                    var html = template("listtemplate", r);
                    $("#nengxtable1 tbody").html(html);
                }
            })

            let yparam = chartparam;
            yparam.Date = chartparam.Date.split('-')[0];
            list.info('GetPayInfoKey',yparam,function(r){
                if(r.data){
                    dealdata(r,'yearChart','年');
                    var html = template("listtemplate", r);
                    $("#nengxtable tbody").html(html);
                }
            })
        }
        function dealdata(r,obj,unit){
            var mtitle=[];
            var mdata=[];
            var mdata2=[];
            var mdata3=[];
            var mdata4=[];
            $.each(r.data,function(n,val){
                val.TotalM=(val.TotalNH*0.4).toFixed(2);
                val.TotalCO2=(val.TotalDF*0.997).toFixed(2);
                mtitle.push(val.Date);
                mdata.push(val.TotalNH);
                mdata2.push(val.TotalDF);
                mdata3.push((val.TotalNH*0.4).toFixed(2));
                mdata4.push((val.TotalDF*0.997).toFixed(2));
            })
            setChart(obj,mtitle,mdata,mdata2,mdata3,mdata4,unit);
        }
        function setChart(id,title,data,data2,data3,data4,unit){
            var yearChartDom = document.getElementById(id);
            var yearChart = echarts.init(yearChartDom);
            var yeartitle = title;
            var yeardata = data;
            var yeardata2 = data2;
            var yeardata3 = data3;
            var yeardata4 = data4;
            var yearChartoption={
                legend: {
                    top: '10',
                    textStyle: {
                        color: "#fff"
                    }
                },
                xAxis: {
                    type: 'category',
                    data: yeartitle,
                    axisLine: {
                        show: true,
                        lineStyle: {
                            type: 'solid',
                            color: '#1898ED',
                            width: '1'
                        }
                    },
                    axisLabel: {
                        textStyle: {
                            color: '#A2CAE1',
                            fontSize: '13'
                        },
                    }
                },
                yAxis: {
                    type: 'value',
                    axisLabel: {
                        textStyle: {
                            color: '#A2CAE1',
                            fontSize: '13'
                        },

                    },
                    splitLine: {
                            lineStyle: {
                                color: 'rgba(24, 152, 237, 0.17）',
                                type: 'dashed'
                            }
                        },
                },
                grid: {
                    top: '60',
                    bottom: '50',
                    left: '80',
                    right: '20'
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    }
                },
                series: [{
                    data:yeardata,
                    label:{
                        show:true,
                        position: 'top',
                        textStyle: {
                                color:'#ffffff',
                                fontSize:'14',
                                lineHeight: 15
                            },
                    },
                    type: 'line',
                    name: unit+'耗能（Kw.h）',
                    barWidth:20,
                    showBackground: true,
                    backgroundStyle: {
                        color: '#F4F8FB'
                    },
                },
                {
                    data:yeardata2,
                    label:{
                        show:true,
                        position: 'top',
                        textStyle: {
                                color:'#ffffff',
                                fontSize:'14',
                                lineHeight: 15
                            },
                    },
                    type: 'line',
                    name: unit+'电费（元）',
                    barWidth:20,
                    showBackground: true,
                    backgroundStyle: {
                        color: '#F4F8FB'
                    },
                },
                {
                    data:yeardata3,
                    label:{
                        show:true,
                        position: 'top',
                        textStyle: {
                                color:'#ffffff',
                                fontSize:'14',
                                lineHeight: 15
                            },
                    },
                    type: 'line',
                    name: unit+'耗煤（kg）',
                    barWidth:20,
                    showBackground: true,
                    backgroundStyle: {
                        color: '#F4F8FB'
                    },
                },
                {
                    data:yeardata4,
                    label:{
                        show:true,
                        position: 'top',
                        textStyle: {
                                color:'#ffffff',
                                fontSize:'14',
                                lineHeight: 15
                            },
                    },
                    type: 'line',
                    name: unit+'CO2排放量（kg）',
                    barWidth:20,
                    showBackground: true,
                    backgroundStyle: {
                        color: '#F4F8FB'
                    },
                }
            ]
            };
            yearChartoption && yearChart.setOption(yearChartoption);
        }
        
    </script>
</body>
</html>
