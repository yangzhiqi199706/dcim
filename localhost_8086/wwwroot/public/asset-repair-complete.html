<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <script type="text/html" id="detail">
                    <div class="layui-form-item">
                        <label class="layui-form-label">资产编号</label>
                        <div class="layui-input-inline">
                            <input type="text" id="AssetsNumber" value="" autocomplete="off" class="layui-input" readonly>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">型号</label>
                        <div class="layui-input-inline">
                            <input type="text" id="BrandModel" value="" autocomplete="off" class="layui-input" readonly>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">维修类型</label>
                        <div class="layui-input-inline">
                            <input type="text" id="RepairType" value="{{if data.RepairType=='IR'}}在库维修{{else if data.RepairType=='DI'}}外送维修（在库）{{else if data.RepairType=='FR'}}在架维修{{else if data.RepairType=='DF'}}外送维修（在架）{{/if}}" autocomplete="off" class="layui-input" readonly> 
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">维修日期</label>
                        <div class="layui-input-inline">
                            <input type="text" id="RepairTime" value="{{data.RepairTime}}" autocomplete="off" class="layui-input" readonly>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">维修人</label>
                        <div class="layui-input-inline">
                            <input type="text" id="RepairEmp" value="{{data.RepairEmp}}" autocomplete="off" class="layui-input" readonly>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">负责部门</label>
                        <div class="layui-input-inline">
                            <input type="text" id="DeptName" value="{{data.DeptName}}" autocomplete="off" class="layui-input" readonly>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">负责人</label>
                        <div class="layui-input-inline">
                            <input type="text" id="PersonName" value="{{data.PersonName}}" autocomplete="off" class="layui-input" readonly>
                        </div>
                    </div>
                    <div class="layui-form-item layui-form-text">
                        <label class="layui-form-label">故障描述</label>
                        <div class="layui-input-block">
                            <textarea id="FaultDescribe" class="layui-textarea" readonly>{{data.FaultDescribe}}</textarea>
                        </div>
                    </div>
                    <div class="layui-form-item layui-form-text">
                        <label class="layui-form-label">完成时间<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" class="layui-input" name="FinishDate" id="FinishDate" lay-verify="required">
                        </div>
                    </div>
                    <div class="layui-form-item layui-form-text">
                        <label class="layui-form-label">维修结果<span class="x-red">*</span></label>
                        <div class="layui-input-block">
                            <textarea placeholder="请输入内容" id="Result" name="Result" class="layui-textarea" lay-verify="required"></textarea>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label"></label>
                        <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                    </div>
                </script>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function(){
            var id = GetString("id");
            var AssetsNumber = decodeURI(GetString("AssetsNumber"));
            var BrandModel = decodeURI(GetString("BrandModel"));
            list.info('GetRepairPlanDetailKey',{
                token:token,
                id:id
            },function(r){
                var html = template("detail", r);
                $("#formNow").html(html);
                $('#AssetsNumber').val(AssetsNumber);
                $('#BrandModel').val(BrandModel);
                layui.use(["form","laydate"],function(){
                    $ = layui.jquery;
                    var form = layui.form;
                    var laydate = layui.laydate;
                    laydate.render({
                        elem:'#FinishDate',
                        type:'datetime'
                    })
                    //监听提交
                    form.on("submit(submit)", function (data) {
                        var strformData = new FormData($("#formNow")[0]);
                        strformData.append("token", token);
                        strformData.append("RepairId", id);
                        strformData.append("RepairStatus", 'true');
                        list.form("FinishRepairPlanKey", strformData, function (r) {
                            backToparent("维修完成");
                        });
                    });
                })
            });
        });
    </script>
</body>
</html>
