<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <div class="layui-form-item">
                    <label class="layui-form-label">资产处置<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <select id="DealWay" name="DealWay" lay-verify="required">
                            <option value="">请选择</option>
                            <option value="G">赠送</option>
                            <option value="Y">遗失</option>
                            <option value="R">报废</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item layui-form-text">
                    <label class="layui-form-label">处置理由<span class="x-red">*</span></label>
                    <div class="layui-input-block">
                        <textarea placeholder="请输入内容" id="DealReason" name="DealReason" class="layui-textarea" lay-verify="required"></textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function(){
            var id = GetString("id");
            var AssetsId = GetString("AssetsId");
            layui.use(["form"], function () {
                $ = layui.jquery;
                var form = layui.form;
                form.render('select');
                //监听提交
                form.on("submit(submit)", function (data) {
                    var strformData = new FormData($("#formNow")[0]);
                    strformData.append("token", token);
                    strformData.append("id", id);
                    strformData.append("AssetsId", AssetsId);
                    list.form("AssetsStoreDealKey", strformData, function (r) {
                        backToparent("处置成功");
                    });
                });
            });
        });
    </script>
</body>
</html>
