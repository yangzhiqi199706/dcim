<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <table class="layui-table">
                            <thead>
                                <tr>
                                    <th>编号</th>
                                    <th>名称</th>
                                    <th>关键词</th>
                                    <th>故障类型</th>
                                    <th>故障子类型</th>
                                    <th>解决方案</th>
                                    <th>更新人</th>
                                    <th>更新时间</th>
                                    <th>阅读次数</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.info.length!=0}} {{each data.info as list i}}
                                    <tr>
                                        <td>{{(data.page.p-1)*15+(i+1)}}</td>
                                        <td>{{list.EventName}}</td>
                                        <td>{{list.KeyWord}}</td>
                                        <td>{{list.FaultTypeName}}</td>
                                        <td>{{list.FaultSubTypeName}}</td>
                                        <td>{{list.FaultSolution}}</td>
                                        <td>{{list.UpdateEmpName}}</td>
                                        <td>{{list.update_time}}</td>
                                        <td>{{list.KnowledgeRead}}</td>
                                        <td>
                                            {{if list.KnowledgeFile}}
                                            <a title="浏览图片" class="fancybox-view" href="{{list.KnowledgeFile}}">
                                                <i class="layui-icon">&#xe64a;</i>
                                                <img src="{{list.KnowledgeFile}}" alt="" style="display:none;">
                                            </a>
                                            {{/if}}
                                        </td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        //请求地址
        var url = "GetKnowledgeBaseListKey ";
        var id = decodeURI(GetString("id"));
        var FaultSubTypeLsh = decodeURI(GetString("FaultSubTypeLsh"));
        console.log(id);
        $(function () {
            //初始化数据
            param.FaultTypeId = id;
            param.FaultSubTypeLsh = FaultSubTypeLsh;
            list.get(url, param,dealdata);
            //初始化数据
            param.ComboBox = "all";
        });
        //数据处理
        function dealdata(r){
            $.each(r.data.info,function(n,val){
                if(val.KnowledgeFile && val.KnowledgeFile.indexOf('http')<0){
                    val.KnowledgeFile=imgUrl+val.KnowledgeFile;
                }
            });
        }
        //分页回调
        function pagechange(curr) {
            delete param['ComboBox'];
            param.pageNo = curr;
            list.get(url, param,dealdata);
        }
    </script>
</body>

</html>
