<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <script type="text/html" id="detail">
                <div class="layui-form-item">
                    <label class="layui-form-label">执行时间<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="SubmitTime" value="" name="SubmitTime" lay-verify="required"
                            autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">维护情况<span class="x-red">*</span></label>
                    <div class="layui-input-block">
                        <textarea name="WHSituation" value="" id="WHSituation" class="layui-textarea"></textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">维护人<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="WHPeople" name="WHPeople" lay-verify="required" autocomplete="off"
                            class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">附件</label>
                    <div class="layui-input-inline">
                        <input type="text" id="FileImg" value="" autocomplete="off" class="layui-input" readonly>
                        <input id="BaseImg" type="hidden" value="" name="WHImg" >
                    </div>
                    <a class="layui-btn">
                        <input type="file" class="layui-btn" onchange="uploadImg(this)" accept="image/*" value="">
                        选择文件
                    </a>
                    <a class="layui-btn-warm layui-btn fancybox-view" href="" id="ViewImg">预览
                        <img src="" alt="">
                    </a>
                    <a class="layui-btn-danger layui-btn" id="CleanImg" onclick="CleanImg(this)">清空</a>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
            </script>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    </div>
    <script>
        $(function () {
            var id = GetString("id");
            //获取详情
            list.info("GetWHTaskDetailKey", {
                token: token,
                id: id
            }, function (r) {
                var html = template("detail", r);
                $("#formNow").html(html);
                $('#ViewImg,#CleanImg').hide();
                layui.use(["form", "laydate"], function () {
                    $ = layui.jquery;
                    var form = layui.form;
                    var laydate = layui.laydate;
                    laydate.render({
                        elem: '#SubmitTime', //指定元素
                        type: 'datetime',
                    });
                    form.render();
                    form.on("submit(submit)", function (data) {
                        var strformData = new FormData($("#formNow")[0]);
                        strformData.append("token", token);
                        strformData.append("id", id);
                        strformData.append("Status",'待确认');
                        list.form("PerformWHTaskKey", strformData, function (r) {
                            backToparent("执行成功");
                        });
                    });
                });
            });
        })

    </script>
</body>

</html>
