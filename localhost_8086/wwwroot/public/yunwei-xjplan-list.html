<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/jquery.qrcode.min.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>运维管理->配置->移动巡检->巡检计划模板</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" placeholder="请输入模板名称" name="search">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                        <button class="layui-btn x-right" onclick="xadmin.open('添加模板','yunwei-xjplan-add.html')">
                            <i class="layui-icon"></i>添加模板
                        </button>
                    </div>
                    <div class="layui-card-body">
                        <table class="layui-table">
                            <thead>
                                <tr>
                                    <th>编号</th>
                                    <th>巡检计划名称</th>
                                    <!-- <th>巡检模式</th> -->
                                    <th>巡检点</th>
                                    <th>巡检人</th>
                                    <th>周期性巡检</th>
                                    <th>完成期限(天)</th>
                                    <th>派发周期</th>
                                    <th>派发时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.info.length!=0}} {{each data.info as list i}}
                                    <tr>
                                        <td>{{(data.page.p-1)*15+(i+1)}}</td>
                                        <td>{{list.XJModelName}}</td>
                                        <!-- <td>{{list.XJModelType}}</td> -->
                                        <td>{{list.XJPointName}}</td>
                                        <td>{{list.XJEmpName}}</td>
                                        <td>{{if list.XJCycle==1}}开启{{else}}关闭{{/if}}</td>
                                        <td>{{list.XJComplateDays}}</td>
                                        <td>{{if list.DistributeCycle=='week'}}周{{else}}月{{/if}}</td>
                                        <td>{{if list.DistributeCycle=='week'}}
                                                {{if list.DistributeTime==1}}
                                                星期一 
                                                {{else if list.DistributeTime==2}}
                                                星期二
                                                {{else if list.DistributeTime==3}}
                                                星期三
                                                {{else if list.DistributeTime==4}}
                                                星期四
                                                {{else if list.DistributeTime==5}}
                                                星期五
                                                {{else if list.DistributeTime==6}}
                                                星期六
                                                {{else if list.DistributeTime==0}}
                                                星期日
                                                {{/if}}
                                            {{else}}
                                            {{list.DistributeTime}}号
                                            {{/if}}
                                        </td>
                                        <td>
                                            <a title="编辑" onclick="xadmin.open('编辑','yunwei-xjplan-edit.html','','','{{list.id}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe642;</i>
                                            </a>
                                            <a title="删除" onclick="x_admin_del('确认删除吗？','DelXJModelKey','{{list.id}}',this)" href="javascript:;">
                                                <i class="layui-icon">&#xe640;</i>
                                            </a>
                                        </td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        //请求地址
        var url = "GetXJModelListKey";
        $(function(){
            //初始化数据
            list.get(url, param);
            
            layui.use(["form","tree"], function () {
                $ = layui.jquery;
                var form = layui.form;
                
                //监听提交
                form.on("submit(search)", function (data) {
                    param.pageNo = 1;
                    param.search = data.field.search;
                    list.get(url, param);
                    return false;
                });    
            });
            
        })
        //分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            list.get(url, param);
        }
    </script>
</body>

</html>
