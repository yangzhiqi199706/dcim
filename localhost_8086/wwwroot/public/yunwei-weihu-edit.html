<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <script type="text/html" id="detail">
                <div class="layui-form-item">
                    <label class="layui-form-label">维护任务名称<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="WHTaskName" value="{{data.WHTaskName}}" name="WHTaskName"
                            lay-verify="required" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">维护内容<span class="x-red">*</span></label>
                    <div class="layui-input-block">
                        <textarea name="WHTaskCon" id="WHTaskCon" class="layui-textarea" lay-verify="required" placeholder="请输入">{{data.WHTaskCon}}</textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">关联设备<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="DeviceId" value="{{data.WHDeviceId}}" name="WHDeviceId" lay-verify="required"
                            autocomplete="off" class="layui-input" readonly>
                    </div>
                    <div class="layui-form-mid layui-word-aux">
                        <a class="layui-btn" onclick="xadmin.open('选择设备','choose-device.html?inputid=DeviceId&value='+$('#DeviceId').val())">选择</a>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">维护负责人<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="WHEmpName" value="{{data.WHEmpName}}" name="WHEmpName"
                            lay-verify="required" autocomplete="off" class="layui-input" readonly>
                        <input type="hidden" id="WHEmpId" value="{{data.WHEmpId}}" name="WHEmpId"  lay-verify="required" autocomplete="off"
                       class="layui-input" readonly>
                    </div>
                    <div class="layui-form-mid layui-word-aux">
                        <a class="layui-btn" onclick="xadmin.open('选择人员','choose-person.html?type=weihu')">选择</a>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">计划完成时间<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="PlanComplateDate" value="{{data.PlanComplateDate}}" name="PlanComplateDate"
                            lay-verify="required" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
            </script>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function () {
            var id = GetString("id");
            //获取详情
            list.info("GetWHTaskDetailKey", {
                token: token,
                id: id
            }, function (r) {
                var html = template("detail", r);
                $("#formNow").html(html);
                layui.use(["form", "laydate"], function () {
                    $ = layui.jquery;
                    var form = layui.form;
                    var laydate = layui.laydate;
                    laydate.render({
                        elem: '#PlanComplateDate' ,//指定元素
                        type:'datetime',
                        format: 'yyyy-MM-dd'
                    });
                    form.render();
                    form.on("submit(submit)", function (data) {
                        var strformData = new FormData($("#formNow")[0]);
                        strformData.append("token", token);
                        strformData.append("id", id);
                        list.form("ChangeWHTaskKey", strformData, function (r) {
                            backToparent("修改成功");
                        });
                    });
                });
            });
        })

    </script>
</body>

</html>
