<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>资产管理->查询及报表->变更日志</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <div class="two-left three-left-big">
                            <form class="layui-form layui-col-md12">
                                <text>资产编号</text>
                                <input type="text" name="search"  placeholder="输入资产编号" autocomplete="off" class="layui-input">
                                <text>变更时间</text>
                                <div class="layui-input-inline">
                                    <input type="text" id="startDateTime" name="startDateTime" class="layui-input" placeholder="开始日期" >
                                </div>
                                <div class="layui-input-inline">
                                    <input type="text" id="endDateTime" name="endDateTime"  class="layui-input" placeholder="结束日期" >
                                </div>
                                <text>变更类型</text>
                                <select id="ChangeType" name="ChangeType" lay-filter="ChangeType">
                                    <option value="">请选择变更类型</option>
                                    <option value="入库">入库</option>
                                    <option value="出库">出库</option>
                                    <option value="上架">上架</option>
                                    <option value="安装">安装</option>
                                    <option value="下架">下架</option>
                                    <option value="变更">变更</option>
                                    <option value="回库">回库</option>
                                    <option value="处置">处置</option>
                                    <option value="移除">移除</option>
                                    <option value="下架回库">下架回库</option>
                                </select>
                                <div class="two-search">
                                    <button class="layui-btn" lay-submit lay-filter="search" type="button">查询</button>
                                </div>
                            </form>
                        </div>
                        <div class="two-right-big">
                            <table class="layui-table">
                                <thead>
                                    <tr>
                                        <th>编号</th>
                                        <th>资产编号</th>
                                        <th>资产类型</th>
                                        <th>型号</th>
                                        <th>资产描述</th>
                                        <th>变更类型</th>
                                        <th>变更内容</th>
                                        <th>变更人</th>
                                        <th>变更时间</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <script type="text/html" id="listtemplate">
                                        {{if data.info.length!=0}} {{each data.info as list i}}
                                        <tr>
                                            <td>{{(data.page.p-1)*15+(i+1)}}</td>
                                            <td>{{list.AssetsNumber}}</td>
                                            <td>{{list.AssetsTypeName}}</td>
                                            <td>{{list.BrandModel}}</td>
                                            <td>{{list.AssetsDescribe}}</td>
                                            <td>{{list.ChangeType}}</td>
                                            <td>{{list.ChangeDescribe}}</td>
                                            <td>{{list.PersonName}}</td>
                                            <td>{{list.create_time}}</td>
                                        </tr>
                                        {{/each}} {{else}}
                                        <tr>
                                            <td colspan="20" style="text-align: center">暂无相关数据</td>
                                        </tr>
                                        {{/if}}
                                    </script>
                                </tbody>
                            </table>
                            <div id="bottomPaging"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        //请求地址
        var url = "GetAssetChangeInfoKey";
        $(function(){
            param.startDateTime='';
            param.endDateTime='';
            list.get(url, param);
            layui.use(["form",'laydate'], function () {
                $ = layui.jquery;
                var form = layui.form;
                var laydate = layui.laydate;
                laydate.render({
                    elem: '#startDateTime' 
                });
                laydate.render({
                    elem: '#endDateTime' 
                });
                //监听提交
                form.on("submit(search)", function (data) {
                    param.pageNo = 1;
                    param.search = data.field.search;
                    param.startDateTime = data.field.startDateTime;
                    param.endDateTime = data.field.endDateTime;
                    param.ChangeType = data.field.ChangeType;
                    list.get(url, param);
                    return false;
                });
            });
        });
        //分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            list.get(url, param);
        }
    </script>
</body>
</html>
