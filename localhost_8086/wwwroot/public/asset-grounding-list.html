<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/jquery.qrcode.min.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>资产管理->资产管理->在架资产</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" placeholder="资产编号、描述、类型、型号" name="search">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <select id="ServerCode" name="ServerCode" lay-filter="ServerCode">
                                    <option value="">请选择</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <select id="AreaId" name="AreaId" lay-filter="AreaId">
                                    <option value="">请选择</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                        <button class="layui-btn x-right" onclick="xadmin.open('上架','asset-grounding-add.html')">
                            <i class="layui-icon"></i>上架
                        </button>
                    </div>
                    <div class="layui-card-body">
                        <div id="tree"></div>
                        <table class="layui-table layui-col-tree">
                            <thead>
                                <tr>
                                    <th>编号</th>
                                    <th>资产编号</th>
                                    <th>资产类型</th>
                                    <th>型号</th>
                                    <th>U位标签</th>
                                    <th>标签状态</th>
                                    <th>资产描述</th>
                                    <th>所属服务器</th>
                                    <th>所属区域</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                
                                <script type="text/html" id="listtemplate">
                                    {{if data.info.length!=0}} {{each data.info as list i}}
                                    <tr>
                                        <td>{{(data.page.p-1)*15+(i+1)}}</td>
                                        <td>{{list.AssetsNumber}}</td>
                                        <td>{{list.AssetsTypeName}}</td>
                                        <td>{{list.BrandModel}}</td>
                                        <td>{{if list.UId || list.GatewayId}}{{list.UTag}}{{/if}}</td>
                                        <td>{{if list.UId || list.GatewayId}}
                                            {{if list.UTag}}在线{{else}}离线{{/if}}
                                            {{/if}}</td>
                                        <td>{{list.AssetsDescribe}}</td>
                                        <td>{{list.ServerName}}</td>
                                        <td>{{list.AreaName}}</td>
                                        <td>
                                            <!-- <a title="编辑" onclick="xadmin.open('编辑','asset-grounding-edit.html','','','{{list.id}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe642;</i>
                                            </a> -->
                                            <a title="变更" onclick="xadmin.open('变更','asset-grounding-change.html','','','{{list.id}}&AssetsId={{list.AssetsId}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe6b2;</i>
                                            </a>
                                            <a title="下架" onclick="xadmin.open('下架回库','asset-return-add.html','','','{{list.id}}&AssetsId={{list.AssetsId}}&type=offback&UId={{list.UId}}&GatewayId={{list.GatewayId}}&ULocation={{list.ULocation}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe601;</i>
                                            </a>
                                            <a title="私有属性" onclick="xadmin.open('私有属性','asset-private-add.html','','','{{list.id}}&AssetsId={{list.AssetsId}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe716;</i>
                                            </a>
                                            <a title="生成二维码" id="img{{list.id}}" download="在架-{{list.AssetsTypeName}}-{{list.BrandModel}}" href="{{list.ewm}}" class="fancybox-view">
                                                <i class="layui-icon">&#xe857;</i>
                                                <div id="{{list.id}}" style="display:none"></div>
                                            </a>
                                            <a title="维修登记" onclick="xadmin.open('维修登记','asset-repair-add.html','','','{{list.id}}&AssetsId={{list.AssetsId}}&BrandModel={{list.BrandModel}}&AssetsNumber='+encodeURI(encodeURI('{{list.AssetsNumber}}')))" href="javascript:;">
                                                <i class="layui-icon">&#xe631;</i>
                                            </a>
                                            <a title="处置" onclick="xadmin.open('处置','asset-handle-add.html','','','{{list.id}}&AssetsId={{list.AssetsId}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe64d;</i>
                                            </a>
                                            <!-- <a title="绑定标签" href="javascript:;">
                                                <i class="layui-icon">&#xe64e;</i>
                                            </a>
                                            <a title="写标签" href="javascript:;">
                                                <i class="layui-icon">&#xe64e;</i>
                                            </a> -->
                                        </td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        //请求地址
        var url = "GetGroundingAssetsListKey";
        $(function(){
            //初始化数据
            list.get(url, param,'',function(r){
                dealEwm(r)
            });
            layui.use(["form","tree"], function () {
                $ = layui.jquery;
                var form = layui.form;
                var tree = layui.tree;
                getArray(tree);
                 //服务器
                 getServer(form,function(){
                    form.on("select(ServerCode)", function (data) {
                        param.ServerCode=data.value;
                        param.ComboBox = "all";
                        delete(param['serach']);
                        getArea(form,data,function(){
                            form.on("select(AreaId)", function (data) {
                                param.AreaId=data.value;
                            })
                        });
                    });
                });
                //监听提交
                form.on("submit(search)", function (data) {
                    param.pageNo = 1;
                    param.search = data.field.search;
                    param.column='';
                    getArray(tree);
                    delete(param['ComboBox']);
                    list.get(url, param,'',function(r){
                        dealEwm(r)
                    });
                    return false;
                });  
            });
        })
        
        function getArray(tree){
            list.info('GetArrangeKey',param,function(r){
                var data=[];
                $.each(r.data,function(n,val){
                    data.push({
                        title:val.column,
                        id:val.column,
                        spread:false,
                        other:1,
                    })
                })
                tree.render({
                    elem:"#tree",
                    data:data,
                    id: 'treeId',
                    click: function(obj){
                        if(obj.data.other==1){
                            $('.layui-tree-txt').removeAttr('style');
                            $(obj.elem).find('.layui-tree-txt').css('color','#148cf1');
                            param.column=obj.data.id;
                            param.pageNo = 1;
                            delete(param['ComboBox']);
                            list.get(url, param,'',function(r){
                                dealEwm(r)
                            });
                        }
                    }
                }); 
            });
        }
        //生成二维码
        function dealEwm(r){
            $.each(r.data.info,function(n,val){
                var data='资产编号:'+val.AssetsNumber+',资产类型:'+val.AssetsTypeName+',型号:'+val.BrandModel+',资产描述:'+val.AssetsDescribe+',机柜编号:'+val.position+',占用U位:'+val.ULocation+',管理部门:'+val.DeptName+',管理人员:'+val.PersonName+',上架时间:'+val.create_time+',维修时间:'+val.repair_time;
                var qrcode = $('#'+val.id).qrcode({
                    width: 128,
                    height: 128,
                    text: toUtf8(data)
                });
                var canvas=$('#'+val.id).find("canvas")[0];
                $('#img'+val.id).attr("href",canvas.toDataURL('image/jpeg'));
            })
        }//分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            delete(param['ComboBox']);
            list.get(url, param,'',function(r){
                dealEwm(r)
            });
        }
    </script>
</body>
</html>
