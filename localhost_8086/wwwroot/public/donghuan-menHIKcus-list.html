<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body mennav">
                        <a class="layui-btn" href="">
                            用户管理
                        </a>
                        <a class="layui-btn layui-btn-primary" href="">
                            事件管理
                        </a>
                    </div>
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" placeholder="请输入工号、姓名、卡号" name="search">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                        <button class="layui-btn x-right" id="addmencus">
                            <i class="layui-icon"></i>添加用户
                        </button>
                    </div>
                    <div class="layui-card-body">
                        <table class="layui-table">
                            <thead>
                                <tr>
                                    <th>姓名</th>
                                    <th>工号</th>
                                    <th>卡号</th>
                                    <th>是否过期</th>
                                    <th>卡片数量</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if totalMatches>0}} {{each UserInfo as list i}}
                                    <tr>
                                        <td>{{list.name}}</td>
                                        <td>{{list.employeeNo}}</td>
                                        <td>{{list.cardNo}}</td>
                                        <td>{{list.overDate}}</td>
                                        <td>{{list.numOfCard}}</td>
                                        <td>
                                            <a title="编辑" onclick="xadmin.open('编辑','donghuan-menHIKcus-edit.html','','','{{list.devid}}&ip={{list.DeviceIP}}&port={{list.DevicePort}}&user={{list.user}}&password={{list.password}}&employeeNo={{list.employeeNo}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe642;</i>
                                            </a>
                                            <a title="删除" onclick="d_del('{{list.employeeNo}}',this)" href="javascript:;">
                                                <i class="layui-icon">&#xe640;</i>
                                            </a>
                                        </td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        var ip = GetString("ip");
        var port = GetString("port");
        var user = GetString("user");
        var password = GetString("password");
        var srcdata;
        $(function () {

            //获取设备信息
            var devid = '';
            getDoorInfo('hik', {
                addr: ip + ':' + port,
                user: user,
                password: password,
                isapi: 'ISAPI/System/deviceInfo',
                method: 'GET',
                format: 'XML',
                data: ''
            }, function (res) {

                devid = $(res).find('deviceID').text().trim();

                $('.mennav a').eq(0).attr('href', 'donghuan-menHIKcus-list.html?ip=' + ip + '&port=' + port + '&user=' + user + '&password=' + password);
                $('.mennav a').eq(1).attr('href', 'donghuan-menHIKevent-list.html?ip=' + ip + '&port=' + port + '&user=' + user + '&password=' + password);
                $('#addmencus').click(function () {
                    xadmin.open('添加用户', 'donghuan-menHIKcus-add.html?id=' + devid + '&ip=' + ip + '&port=' + port + '&user=' + user + '&password=' + password)
                })

                //用户列表
                srcdata = {
                    "UserInfoSearchCond": {
                        "searchID": devid,
                        "searchResultPosition": 0,
                        "maxResults": 20
                    }
                }
                getInfo(srcdata)
            })

            //搜索
            layui.use(["form"], function () {
                $ = layui.jquery;
                var form = layui.form;
                //监听提交
                form.on("submit(search)", function (data) {
                    srcdata.UserInfoSearchCond.searchResultPosition = 0;
                    srcdata.UserInfoSearchCond.fuzzySearch = data.field.search;
                    getInfo(srcdata);
                    return false;
                });
            });


        })
        //查询人员信息
        function getInfo(srcdata) {
            getDoorInfo('hik', {
                addr: ip + ':' + port,
                user: user,
                password: password,
                isapi: 'ISAPI/AccessControl/UserInfo/Search',
                method: 'POST',
                format: 'json',
                data: JSON.stringify(srcdata)
            }, function (res) {
                if (res.UserInfoSearch.totalMatches > 0) {
                    $.each(res.UserInfoSearch.UserInfo, function (n, val) {
                        //查询每个人卡信息
                        var srccarddata = {
                            "CardInfoSearchCond": {
                                "searchID": val.employeeNo,
                                "searchResultPosition": 0,
                                "maxResults": 30,
                                "EmployeeNoList": [
                                    {
                                        "employeeNo": val.employeeNo
                                    }
                                ]
                            }
                        }
                        val.overDate = '';
                        if (val.Valid.enable == true) {
                            var time = new Date();
                            var timenum = time.getTime() - new Date(Date.parse(val.Valid.endTime.replace(/T/g, " ").replace(/-/g, "/"))).getTime();
                            if (timenum > 0) {
                                val.overDate = '已过期';
                            } else {
                                val.overDate = '未过期';
                            }
                            var starttimenum = time.getTime() - new Date(Date.parse(val.Valid.beginTime.replace(/T/g, " ").replace(/-/g, "/"))).getTime();
                            if (starttimenum < 0) {
                                val.overDate = '未生效';
                            }
                        }
                        val.DeviceIP = ip;
                        val.DevicePort = port;
                        val.user = user;
                        val.password = password;
                        val.devid = res.UserInfoSearch.searchID;
                        val.cardNum = 0;
                        val.cardNo = '';

                        getDoorInfo('hik', {
                            addr: ip + ':' + port,
                            user: user,
                            password: password,
                            isapi: 'ISAPI/AccessControl/CardInfo/Search',
                            method: 'POST',
                            format: 'json',
                            data: JSON.stringify(srccarddata)
                        }, function (r) {
                            val.cardNum = r.CardInfoSearch.totalMatches;
                            if (r.CardInfoSearch.totalMatches > 0) {
                                $.each(r.CardInfoSearch.CardInfo, function (x, y) {
                                    val.cardNo += y.cardNo + ','
                                })
                                val.cardNo = val.cardNo.substring(0, val.cardNo.length - 1);
                            }
                            if (n == res.UserInfoSearch.totalMatches - 1) {
                                var html = template('listtemplate', res.UserInfoSearch);
                                $('tbody').html(html);
                            }
                        })

                    })
                }else{
                    var html = template('listtemplate', res.UserInfoSearch);
                    $('tbody').html(html);
                }
                if (srcdata.UserInfoSearchCond.searchResultPosition == 0) {
                    x_admin_page(res.UserInfoSearch.totalMatches, srcdata.UserInfoSearchCond.maxResults, pagechange);
                }
            })
        }
        //分页回调
        function pagechange(curr) {
            srcdata.UserInfoSearchCond.searchResultPosition = (curr - 1) * srcdata.UserInfoSearchCond.maxResults;
            getInfo(srcdata);
        }
        //删除
        function d_del(num, obj) {
            layer.confirm('确认删除此数据吗？', function (index) {
                //查询每个人卡信息
                var srccarddata = {
                    "CardInfoSearchCond": {
                        "searchID": num,
                        "searchResultPosition": 0,
                        "maxResults": 30,
                        "EmployeeNoList": [
                            {
                                "employeeNo": num
                            }
                        ]
                    }
                }
                getDoorInfo('hik', {
                    addr: ip + ':' + port,
                    user: user,
                    password: password,
                    isapi: 'ISAPI/AccessControl/CardInfo/Search',
                    method: 'POST',
                    format: 'json',
                    data: JSON.stringify(srccarddata)
                }, function (r) {
                    //删除关联卡
                    if (r.CardInfoSearch.totalMatches > 0) {
                        $.each(r.CardInfoSearch.CardInfo, function (x, y) {
                            getDoorInfo('hik', {
                                addr: ip + ':' + port,
                                user: user,
                                password: password,
                                isapi: 'ISAPI/AccessControl/CardInfo/Delete',
                                method: 'PUT',
                                format: 'json',
                                data: JSON.stringify({
                                    "CardInfoDelCond": {
                                        "CardNoList": [
                                            {
                                                "cardNo": y.cardNo
                                            }
                                        ]
                                    }
                                })
                            }, function (res) {
                                if (res.statusString != 'OK') {
                                    layer.msg(res.statusCode, {
                                        icon: 5,
                                        time: 1000
                                    });
                                }
                            })
                            if (x == r.CardInfoSearch.totalMatches - 1) {
                                delPer()
                            }
                        })
                    } else {
                        delPer();
                    }
                })
                function delPer() {
                    getDoorInfo('hik', {
                        addr: ip + ':' + port,
                        user: user,
                        password: password,
                        isapi: 'ISAPI/AccessControl/UserInfo/Delete',
                        method: 'PUT',
                        format: 'json',
                        data: JSON.stringify({
                            "UserInfoDelCond": {
                                "EmployeeNoList": [
                                    {
                                        "employeeNo": num
                                    }
                                ]
                            }
                        })
                    }, function (res) {
                        layer.close(index);
                        if (res.statusString == 'OK') {
                            $(obj).parents("tr").remove();
                            layer.msg("已删除!", {
                                icon: 1,
                                time: 1000
                            });
                        } else {
                            layer.msg(res.statusCode, {
                                icon: 5,
                                time: 1000
                            });
                        }
                    })
                }

            });
        }
    </script>
</body>

</html>
