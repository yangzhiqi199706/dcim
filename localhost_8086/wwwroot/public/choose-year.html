<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<style>
    #time {
        padding-top: 0;
    }
</style>
<body>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                            <div class="layui-form-item">
                                <label class="layui-form-label">
                                    选择日期<span class="x-red">*</span>
                                </label>
                                <div class="layui-input-inline">
                                    <input type="text" class="layui-input" id="time">
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <label class="layui-form-label">
                                    已选日期<span class="x-red">*</span>
                                </label>
                                <div class="layui-input-inline" id="choosetime">
                                    <!-- <input type="checkbox" name="day" value="" title="" lay-skin="primary"> -->
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <button class="layui-btn x-right" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        $(function(){
            var data=[];
            layui.use(["form",'laydate'], function () {
                $ = layui.jquery;
                var form = layui.form;
                var laydate = layui.laydate;
                laydate.render({
                    elem: '#time',
                    format: 'M-d',
                    done: function(value, date){ //监听日期被切换
                        var next=true;
                        $.each(data,function(n,val){
                            if(val==value){
                                layer.msg('日期已选择', {
									icon: 5
								});
                                next=false;
                                return false;
                            }
                        })
                        if(next){
                            data.push(value)
                            var html=`<input type="checkbox" name="day" value="`+value+`" title="`+value+`" lay-skin="primary" checked>`;
                            $('#choosetime').append(html);
                            form.render();
                        }
                    }
                });
                 //监听提交
				form.on("submit(submit)", function (data) {
                    var index = parent.layer.getFrameIndex(window.name);
                    parent.layer.close(index);
                    var strformData = new FormData($("#formNow")[0]);
                    $(window.parent.document).find('#SendTime').val(strformData.getAll('day'));
                });
            })
        })  
    </script>
</body>

</html>
