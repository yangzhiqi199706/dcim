<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <!-- <script src="https://webapi.amap.com/maps?v=2.0&key=8cb98fbf52726c7f0b817cccb872249b"></script>
    <script src="https://webapi.amap.com/loca?v=2.0.0&key=8cb98fbf52726c7f0b817cccb872249b"></script> -->
    <script language="javascript" src="js/echarts.js"></script>
    <link rel="stylesheet" href="./css/welcome.css">
    <link rel="stylesheet" href="./css/login.css">
    <style>
        html,
        body,
        #map {
            min-height: auto;
        }

        .map-left,
        .map-right {
            height: auto;
        }

        .list-more {
            float: right;
            font-size: 13px;
            line-height: 35px;
            padding-right: 15px;
            cursor: pointer;
        }

        .wait-1,
        .wait-2 {
            cursor: pointer;
        }

        .alarmtips {
            position: absolute;
            width: 50px;
            z-index: 3;
        }

        .alarmtips img {
            max-width: 100%
        }

        .alarmtips1 {
            left: calc(50% + 12px);
            top: calc(50% - 53px)
        }

        .alarmtips2 {
            left: calc(50% + 56px);
            top: calc(50% - 56px)
        }

        .alarmtips3 {
            left: calc(50% + 25px);
            top: calc(50% + 28px)
        }

        .alarmtitle {
            position: absolute;
            width: 210px;
            height: 40px;
            background-color: transparent;
            z-index: 2;
            cursor: pointer;
        }

        .alarmtitle1 {
            left: calc(50% - 176px);
            top: calc(50% - 66px)
        }

        .alarmtitle2 {
            left: calc(50% + 86px);
            top: calc(50% - 69px)
        }

        .alarmtitle3 {
            left: calc(50% - 161px);
            top: calc(50% + 18px)
        }

        .txtels {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 180px;
            margin: auto;
        }

        .event th,
        #alarmlist td {
            padding: 4px 0px;
            text-align: center;
        }

        #pueChart {
            height: calc(100% - 40px);
        }

        .webtxt {
            width: 100vw;
            height: 100vh;
            position: absolute;
            z-index: 8;
            left: 0;
            right: 0
        }

        .layui-layer-prompt .layui-layer-input {
            width: calc(100% - 16px)
        }

        .codeLine {
            line-height: 2;
        }

        .codeLine b {
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div class="loginbox" id="login">
        <div class="login layui-anim layui-anim-up">
            <div class="message">用户登录</div>
            <form method="post" class="layui-form">
                <input name="username" placeholder="请输入账号" type="text" lay-verify="required" class="layui-input"
                    value="">
                <input name="password" lay-verify="required" placeholder="请输入密码" type="password" class="layui-input"
                    value="">
                <input type="checkbox" title="记住密码" lay-skin="primary" lay-filter="remember" id="remember">
                <br />
                <input value="登录" lay-submit lay-filter="login" type="submit">
                <input value="重置" lay-filter="reset" type="reset">
            </form>
        </div>
    </div>
    <!-- class="haveMap" -->
    <div id="map" style="display: none;" >
        <div id="webtxt"></div>
        <div class="map-head" style="display: none;"></div>
        <div class="map-left" style="display: none;">
            <div class="map-con-box">
                <div class="title">告警等级统计</div>
                <div id="levelChart"></div>
            </div>
            <div class="map-con-box">
                <div class="title">待办事项</div>
                <div class="wait-1" onclick="waitNav(5)">
                    待办工单<span></span>个
                </div>
                <div class="wait-2 wait-2bg" onclick="waitNav(7)">
                    <div>维护任务</div>
                    <div>
                        <div></div>个
                    </div>
                </div>
                <div class="wait-2 wait-3bg" onclick="waitNav(6)">
                    <div>巡检任务</div>
                    <div>
                        <div></div>个
                    </div>
                </div>
                <div class="wait-2 wait-4bg" onclick="waitNav(4)">
                    <div>维修任务</div>
                    <div>
                        <div></div>个
                    </div>
                </div>
                <div class="wait-2 wait-5bg" onclick="waitNav(3)">
                    <div>盘点任务</div>
                    <div>
                        <div></div>个
                    </div>
                </div>
            </div>
            <div class="map-con-box">
                <div class="title">告警事件列表 <span onclick="alarmNav()" class="list-more alarmMore">查看更多</span></div>
                <table class="event layui-table">
                    <thead>
                        <tr>
                            <th>报警事件</th>
                            <th>报警等级</th>
                            <th>报警时间</th>
                        </tr>
                    </thead>
                    <tbody id="alarmlist">
                        <script type="text/html" id="alarmlisttemplate">
                            {{if data.length!=0}} {{each data as list i}}
                            {{if i<6}}
                            <tr class="
                                {{if list.AlarmLevel==1}}
                                level1color
                                {{else if list.AlarmLevel==2}}
                                level2color
                                {{else if list.AlarmLevel==3}}
                                level3color
                                {{else if list.AlarmLevel==4}}
                                level4color
                                {{else if list.AlarmLevel==5}}
                                level5color
                                {{/if}}
                            ">
                                <!-- <td>{{list.TypeName}}</td> -->
                                <td><div title="{{list.DeviceName}}{{if list.TextMessage}}{{list.TextMessage.split(',')[2]}}{{else}}{{list.TypeName}}{{/if}}" class="txtels">{{list.DeviceName}}{{if list.TextMessage}}{{list.TextMessage.split(',')[2]}}{{else}}{{list.TypeName}}{{/if}}</div></td>
                                <td>{{list.LevelName}}</td>
                                <!-- <td width="130px">{{list.update_time}}</td> -->
                                <td>
                                    <div class="txtels" style="width: 90px;" title="{{if list.TextMessage}}
                                    {{list.create_time.split('-')[0]}}-{{(list.TextMessage.split(',')[4]).replace('月','-').replace('日',' ')}}
                                    {{else}}
                                    {{list.update_time}}
                                    {{/if}}">{{if list.TextMessage}}
                                        {{list.create_time.split('-')[0]}}-{{(list.TextMessage.split(',')[4]).replace('月','-').replace('日',' ')}}
                                        {{else}}
                                        {{list.update_time}}
                                        {{/if}}
                                    </div>
                                </td>
                            </tr>
                            {{/if}}
                            {{/each}} {{else}}
                            <tr>
                                <td colspan="20" style="text-align: center">暂无相关数据</td>
                            </tr>
                            {{/if}}
                        </script>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="map-right" style="display: none;">
            <div class="map-con-box">
                <div class="title">安全运行天数</div>
                <div class="day">
                    <div class="day-time">
                        <div></div>
                        <div></div>
                        <div></div>
                    </div>
                    <div class="day-num">
                        <div>
                            <div>安全运行天数</div>
                            <div>000000</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="map-con-box">
                <div class="title">资产状态统计</div>
                <div id="statusChart"></div>
            </div>
            <div class="map-con-box">
                <div class="title">资产消息列表 <span onclick="msgNav()" class="list-more msgMore">查看更多</span></div>
                <table class="msg layui-table">
                    <thead>
                        <tr>
                            <th>消息描述</th>
                            <th>消息时间</th>
                        </tr>
                    </thead>
                    <tbody id="msglist">
                        <script type="text/html" id="msglisttemplate">
                            {{if data.info.length!=0}} {{each data.info as list i}}
                            {{if i<4}}
                            <tr>
                                <td class="txtels">{{list.MsgDescribe}}</td>
                                <td class="txtels" style="width: 90px;" >{{list.create_time}}</td>
                            </tr>
                            {{/if}}
                            {{/each}} {{else}}
                            <tr>
                                <td colspan="20" style="text-align: center">暂无相关数据</td>
                            </tr>
                            {{/if}}
                        </script>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="map-bottom">
            <ul>
            </ul>
        </div>
    </div>

    <script>
        $(function () {
            var loginbox = $("#login").clone();
            $("#login").remove();
            let startTime = '';//开始运行时间
            let pageShow = false;//首页展示
            let pageType = 1;//展示类型
            let pageTxt = '';//展示内容
            let macText = null;
            $.ajaxSettings.async = false;
            //判断许可证
            list.info("GetLicenseKey", {}, function (r) {
                var code = r.data.data;
                macText = '<span class="codeLine">机器码： <b>' + r.data.mac + '</b></span><br/><input type="text" class="layui-layer-input">';
                checkLicense(code);
            })
            //首页与初始时间
            list.info('GetLogoKey', {
                token: token
            }, function (r) {
                if (r.data[0].create_time) {
                    startTime = r.data[0].create_time;
                }
                if (r.data[0].IndexPage) {
                    pageShow = r.data[0].IndexPage != '-1' ? true : false
                    if (pageShow) {
                        pageType = r.data[0].IndexPage;
                        $('#map').show();
                        if (r.data[0].IndexTxt) {
                            pageTxt = r.data[0].IndexTxt;
                            $('.map-head').html(r.data[0].IndexTxt)
                        } else {
                            $('.map-head').html('DCIM数据中心大屏可视化展示');
                        }
                    }
                }
            })
            $.ajaxSettings.async = true;

            function checkLicense(code) {
                list.info("VarLicenseKey", {
                    code: code
                }, function (r) {
                    if (r.data.indexOf('不正确') > -1) {
                        localStorage.clear();
                        layer.prompt({
                            formType: 0,
                            value: '',
                            content: macText,
                            title: '许可证已到期，请输入新的许可证',
                            btn: ['确定', '取消'],
                            btnAlign: 'c'
                        }, function (value, index) {
                            layer.close(index);
                            list.info("ChangeLicenseKey", {
                                code: value
                            }, function () {
                                checkLicense(value);
                            })
                        });
                        return false;
                    }

                    var formattedDate = getDateTime().split(' ')[0];
                    var stoptime = r.data;
                    var date1 = new Date(stoptime).getTime();
                    var date2 = new Date(formattedDate).getTime();
                    var diff = date1 - date2;
                    var days = diff / (1000 * 60 * 60 * 24);
                    if (days <= 0) {
                        localStorage.clear();
                        layer.prompt({
                            formType: 0,
                            value: '',
                            content: macText,
                            title: '许可证已过期，请输入新的许可证',
                            btn: ['确定', '取消'],
                            btnAlign: 'c'
                        }, function (value, index) {
                            layer.close(index);
                            checkLicense(value);
                        });
                    } else {
                        list.info("ChangeLicenseKey", {
                            code: code
                        }, function () {
                            $("body").append(loginbox);
                            if (!token) {
                                $('#login').show();
                                layui.use("form", function () {
                                    var form = layui.form;
                                    form.render();
                                    let remember = localStorage.getItem("remember") ? true : false;
                                    if (localStorage.getItem("remember")) {
                                        $('input[name=password]').val(localStorage.getItem("remember"));
                                        $('input[name=username]').val(localStorage.getItem("username"));
                                        $('#remember').prop('checked', true);
                                        form.render();
                                    }

                                    //改变记住密码的状态
                                    form.on("checkbox(remember)", function (data) {
                                        if (data.elem.checked) {
                                            remember = true;
                                        } else {
                                            remember = false;
                                        }
                                    })

                                    //监听提交
                                    // 监听提交
                                    form.on("submit(login)", function (data) {
                                        if (remember) {
                                            localStorage.setItem("username", $('input[name=username]').val());
                                            localStorage.setItem("remember", $('input[name=password]').val());
                                        } else {
                                            localStorage.removeItem("username");
                                            localStorage.removeItem("remember");
                                        }
                                        $.ajax({
                                            type: "post",
                                            url: ajaxUrl + "LoginKey",
                                            async: true,
                                            data: {
                                                userName: data.field.username,
                                                passWord: data.field.password
                                            },
                                            success: function (r) {
                                                r = JSON.parse(r);
                                                if (r.code == 100) {
                                                    list.info('myMenus', {
                                                        token: r.data.token
                                                    }, function (menuResponse) {
                                                        if (!menuResponse.data) {
                                                            // 如果 data.length 为 0，提示没有权限
                                                            layer.msg("没有登录权限", {
                                                                icon: 5, 
                                                                time: 2000
                                                            });
                                                            return false;
                                                        } else {
                                                            // 如果有权限，继续后续操作
                                                            localStorage.setItem("token", r.data.token);
                                                            localStorage.setItem("name", r.data.adminName);
                                                            localStorage.setItem("userId", r.data.userId);
                                                            layer.msg("登录成功", {
                                                                icon: 1,
                                                                time: 1000
                                                            }, function () {
                                                                if (pageShow) {
                                                                    location.href = "welcome.html";
                                                                } else {
                                                                    location.href = "index.html";
                                                                }
                                                            });
                                                        }
                                                    });
                                                } else {
                                                    layer.msg(r.msg, {
                                                        icon: 5
                                                    });
                                                }
                                            }
                                        });
                                        return false;
                                    });
                                });
                            };
                            if (days < 7) {
                                layer.prompt({
                                    formType: 0,
                                    value: '',
                                    content: macText,
                                    title: '许可证 <b style="font-size:18px">' + days + '</b> 天后失效，请及时更新许可证',
                                    btn: ['确定', '取消'],
                                    btnAlign: 'c'
                                }, function (value, index) {
                                    layer.close(index);
                                    checkLicense(value);
                                });
                            }
                        })
                    }
                })
            }
            //判断是否登录
            if (!token) {
                return false;
            }
            getTime();
            var newtime = setInterval(function () {
                getTime();
            }, 1000);
            $(".day-num>div div").eq(1).html(DateDiff(startTime, getDateTime()));
            //nav设置
            setNav(function () {
                $('.map-bottom ul li').click(function () {
                    navClick($(this).index())
                });
            });
            if (pageShow) {
                if (pageType == '1') {
                    $('.map-head,.map-left,.map-right').show();
                    getAllData();
                    if(!$('#map').hasClass('haveMap'))loadMapJs();
                    var datatime = setInterval(function () {
                        getAllData();
                    }, 10000);
                } else {
                    setWebTxt(pageTxt);
                }
            } else {
                location.href = "index.html";
            }
        })
        //设置组态
        function setWebTxt(txt) {
            $('#webtxt').html(`<iframe src="`+ window.location.protocol + `//` +  window.location.hostname + `:8081?type=preview&title=` + txt + `" frameborder="0" class="webtxt"></iframe>`)
        }
        //与原地图相关信息
        function getAllData() {
            //待办数量
            list.info('PlatStatisticsKey', {
                token: token
            }, function (r) {
                $('.wait-1').find('span').html(r.data.OrderNeedDo);
                $('.wait-2bg>div>div').html(r.data.WHNeedCheck);
                $('.wait-3bg>div>div').html(r.data.XJNeedCheck);
                $('.wait-4bg>div>div').html(r.data.RepairNeedCheck);
                $('.wait-5bg>div>div').html(r.data.PlanNeedCheck);
            });
            //告警事件
            list.info('GetRealAlarmsKey', {
                token: token,
                ComboBox: 'all',
                type: '1'
            }, function (r) {
                var html = template("alarmlisttemplate", r);
                $("#alarmlist").html(html);

                let findone = r.data.filter(v => v.AlarmLevel == 5);
                level1 = findone.length;
                let findtwo = r.data.filter(v => v.AlarmLevel == 4);
                level2 = findtwo.length;
                let findthr = r.data.filter(v => v.AlarmLevel == 3);
                level3 = findthr.length;
                let findfour = r.data.filter(v => v.AlarmLevel == 2);
                level4 = findfour.length;
                let findfive = r.data.filter(v => v.AlarmLevel == 1);
                level5 = findfive.length;

                // setChartBar('levelChart', ['一般报警', '次要报警', '主要报警', '严重报警', '紧急报警'], [level5, level4, level3, level2, level1]);
                setPie('levelChart', [{ 'name': '一般报警', 'icon': 'circle' },
                { 'name': '次要报警', 'icon': 'circle' },
                { 'name': '主要报警', 'icon': 'circle' },
                { 'name': '严重报警', 'icon': 'circle' },
                { 'name': '紧急报警', 'icon': 'circle' }]
                    , [{ 'value': level5, 'name': '一般报警' },
                    { 'value': level4, 'name': '次要报警' },
                    { 'value': level3, 'name': '主要报警' },
                    { 'value': level2, 'name': '严重报警' },
                    { 'value': level1, 'name': '紧急报警' }]);

                // //地图预警展示
                // let place1 = r.data.findIndex(v => v.AreaId == '2');//太平原校区
                // let place2 = r.data.findIndex(v => v.AreaId == '3');//武侯校区
                // let place3 = r.data.findIndex(v => v.AreaId == '1');//航空港校区
                // (place1 == -1) ? $('.alarmtips1 img').attr('src', 'images/alarmGreen.png') : $('.alarmtips1 img').attr('src', 'images/alarmRed.png');
                // (place2 == -1) ? $('.alarmtips2 img').attr('src', 'images/alarmGreen.png') : $('.alarmtips2 img').attr('src', 'images/alarmRed.png');
                // (place3 == -1) ? $('.alarmtips3 img').attr('src', 'images/alarmGreen.png') : $('.alarmtips3 img').attr('src', 'images/alarmRed.png');
            });

            //能耗 报表  pue
            //能效概况
            // list.info('GetNXInfoKey', {
            //     token: token,
            //     ServerCode: '',
            //     AreaId: ''
            // }, function (r) {
            //     setPUE(r.data.PueValue);
            //     if (r.data.TypeList) {
            //         var classtitle = [];
            //         var classdata = [];
            //         $.each(r.data.TypeList, function (n, val) {
            //             classtitle.push(val.TypeName);
            //             classdata.push(val.TypeValue);
            //         })
            //         setChartLine('statusChart', classtitle, classdata)
            //     }
            // })

            //资产消息
            param.MsgStatus = '未确认';
            list.info('GetAssetMsgKey', param, function (r) {
                var html = template("msglisttemplate", r);
                $("#msglist").html(html);
            });
            //资产状态报表
            list.info('GetAssetChangeCountKey', {
                token: token,
                startDateTime: '',
                endDateTime: ''
            }, function (r) {
                var title = [];
                var data = [];
                $.each(r.data, function (n, val) {
                    title.push(val.ChangeType);
                    data.push(val.TotalNumber);
                });
                setChartLine('statusChart', title, data)
            })
        }
        //导航点击事件
        //clickIndex 点击index的值
        function navClick(clickIndex, childIndex, donghuanIndex) {
            //获取首页的index值
            let homeindex = $('.map-bottom ul li.check').index();
            // console.log(homeindex);
            // $.each($('.map-bottom ul li'), function (n, val) {
            //     $(val).removeClass('check').find('img').attr('src', 'images/' + $(val).attr('data-img') + '.png');
            // })
            // $(this).addClass('check').find('img').attr('src', 'images/' + $(this).attr('data-check') + '.png');
            var nav = clickIndex > homeindex ? clickIndex - 1 : clickIndex;
            if (clickIndex == homeindex) {
                return false;
            }
            // var tempwindow = window.open('_blank');
            // tempwindow.location.href = 'index.html?nav=' + nav;
            if (childIndex) {
                window.location.href = 'index.html?nav=' + nav + '&child=' + childIndex;
            } else if (donghuanIndex) {
                window.location.href = 'index.html?nav=' + nav + '&donghuanIndex=' + donghuanIndex;
            } else {
                window.location.href = 'index.html?nav=' + nav;
            }
        }
        //查看更多报警
        function alarmNav() {
            //查找告警的index
            let alaramIndex = $('.map-bottom ul li[data-img=xiaoxi]').index();
            if (alaramIndex == -1) {
                $('.alarmMore').hide()
            } else {
                navClick(alaramIndex, 1);
            }
        }

        //查看更多资产
        function msgNav() {
            //查找告警的index
            let alaramIndex = $('.map-bottom ul li[data-img=xiaoxi]').index();
            if (alaramIndex == -1) {
                $('.msgMore').hide()
            } else {
                navClick(alaramIndex, 2);
            }
        }
        //代办事项跳转
        function waitNav(index) {
            let alaramIndex = $('.map-bottom ul li[data-img=xiaoxi]').index();
            if (alaramIndex != -1) {
                navClick(alaramIndex, index);
            }
        }
        //地图跳转
        function mapNav(index) {
            let alaramIndex = $('.map-bottom ul li[data-img=donghuan]').index();
            if (alaramIndex != -1) {
                navClick(alaramIndex, '', index);
            }
        }

        //动态导航
        function setNav(callback) {
            list.info('myMenus', {
                token: token
            }, function (r) {
                var html = '';
                var len = r.data.length;
                if (dm == 1) {//动环系统
                    r.data = r.data.filter(v => v.dcim == '1')
                    len = r.data.length;
                }
                $.each(r.data, function (n, val) {
                    let img, top;
                    switch (val.menu_name) {
                        case '消息中心': img = 'xiaoxi'; break;
                        case '动环监控': img = 'donghuan'; break;
                        case '资产管理': img = 'zichan'; break;
                        case '容量管理': img = 'rongliang'; break;
                        case '能源管理': img = 'nengyuan'; break;
                        case '运维管理': img = 'yunwei'; break;
                        case '报表管理': img = 'baobiao'; break;
                        case '系统配置': img = 'xitong'; break;
                    }
                    if (len == 1 || len == 2) {
                        top = 6;
                    }
                    if (len == 3 || len == 4) {
                        switch (n) {
                            case 0: case 3: top = 10; break;
                            case 1: case 2: top = 6; break;
                        }
                    }
                    if (len == 5 || len == 6) {
                        switch (n) {
                            case 0: case 5: top = 16; break;
                            case 1: case 4: top = 10; break;
                            case 2: case 3: top = 6; break;
                        }
                    }
                    if (len == 7 || len == 8) {
                        switch (n) {
                            case 0: case 7: top = 22; break;
                            case 1: case 6: top = 16; break;
                            case 2: case 5: top = 10; break;
                            case 3: case 4: top = 6; break;
                        }
                    }
                    if (len % 2 == 0) {
                        if (len / 2 == n) {
                            html += `<li data-img="index" data-check="index-check" class="check">
                                <img src="images/index-check.png" alt="首页">
                                <text>首页</text>
                            </li>`;
                        }
                    } else {
                        if (len / 2 == n - 0.5) {
                            html += `<li data-img="index" data-check="index-check" class="check">
                                <img src="images/index-check.png" alt="首页">
                                <text>首页</text>
                            </li>`;
                        }
                    }
                    html += `<li data-img="` + img + `" data-check="` + img + `-check" >
                        <img src="images/`+ img + `.png" alt="` + val.menu_name + `" style="margin-top: ` + top + `px;">
                        <text>`+ val.menu_name + `</text>
                    </li>`;
                    if (len == 1) {
                        html += `<li data-img="index" data-check="index-check" class="check">
                            <img src="images/index-check.png" alt="首页">
                            <text>首页</text>
                        </li>`;
                    }
                })
                $('.map-bottom ul').css('width', 91 * (len + 1)).html(html);
                callback();
            })
        }

        /*
        * 计算两个日期相差的天数
        * addtime 2020年7月30日 21:16:37
        * sDate1 开始日期 yyyy-MM-dd格式
        * sDate2 结束日期 yyyy-MM-dd格式
        */
        function DateDiff(sDate1, sDate2) {
            var aDate, oDate1, oDate2, iDays;
            aDate = sDate1.split("-");
            oDate1 = new Date(aDate[1] + '-' + aDate[2] + '-' + aDate[0]);  //转换为yyyy-MM-dd格式
            aDate = sDate2.split("-");
            oDate2 = new Date(aDate[1] + '-' + aDate[2] + '-' + aDate[0]);
            iDays = parseInt(Math.abs(oDate1 - oDate2) / 1000 / 60 / 60 / 24) + 1; //把相差的毫秒数转换为天数
            switch (iDays.toString().length) {
                case 1: iDays = '00000' + iDays; break;
                case 2: iDays = '0000' + iDays; break;
                case 3: iDays = '000' + iDays; break;
                case 4: iDays = '0' + iDays; break;
                case 5: iDays = '0' + iDays; break;
                case 6: iDays = iDays; break;
            }
            return iDays;  //返回相差天数
        }

            var script = document.createElement('script');

            script.onerror = () => console.error(`脚本加载失败: ${url}`);

                    path: [[104.069289, 30.671744],

                    [104.07073, 30.670769],
                    [104.070727, 30.670186],
                    [104.070456, 30.670167],
                    [104.07036, 30.669882],
                    [104.07036, 30.669882],
                    [104.069888, 30.669888],
                    [104.068912, 30.670264],
                    [104.069179, 30.670813],
                    [104.06883, 30.671016],
                    [104.069218, 30.671726]
                    ]
                }]
            };
            buildingLayer.setStyle(options); //此配色优先级高于自定义mapStyle
            var map = new AMap.Map('map', {
                zoom: 17,
                center: [104.068096, 30.672388],
                pitch: 65,
                rotation: 0,
                showLabel: false,
                mapStyle: 'amap://styles/darkblue',
                viewMode: '3D',
                layers: [
                    AMap.createDefaultLayer(),
                    buildingLayer,
                ]
            });
            new AMap.Polygon({
                bubble: true,
                fillOpacity: 0.4,
                strokeWeight: 1,
                path: options.areas[0].path,
                map: map
            })

            var loca = new Loca.Container({
                map,
            });

            var geo = new Loca.GeoJSONSource({
                data: {
                    "type": "FeatureCollection",
                    "features": [{
                        "type": "Feature",
                        "geometry": {
                            "type": "Point",
                            "coordinates": [104.069815, 30.670721]
                        },
                        "properties": {
                            "name": "DCIM机房",
                            "price": 65000,
                            "count": 92
                        }
                    }]
                }
            });

            var zMarker = new Loca.ZMarkerLayer({
                loca: loca,
                zIndex: 999999999,
            });

                    return (

                        props['name'] +
                        '</text></div>'
                    );
                },

                rotation: 0,
                alwaysFront: true,
                size: [490 / 2, 222 / 2],
                altitude: 0,
            });

            // 浮动三角
            var triangleZMarker = new Loca.ZMarkerLayer({
                loca: loca,

                content: (i, feat) => {
                    return (
                        '<div style="width: 60px; height: 72px; background: url(images/position.png);position:relative;top:0px"></div>'
                    );

                unit: 'meter',
                rotation: 0,

                key: 'altitude',
