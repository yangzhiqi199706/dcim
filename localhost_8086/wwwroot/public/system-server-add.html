<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <div class="layui-form-item">
                    <label class="layui-form-label">服务器名称<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="ServerName" value="" name="ServerName" lay-verify="required"
                            autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">服务器编码<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="ServerCode" value="" name="ServerCode" lay-verify="required"
                            autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">服务器IP<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="ServerIP" value="" name="ServerIP" lay-verify="required"
                            autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">数据库地址<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="ServerAddress" value="" name="ServerAddress" lay-verify="required"
                            autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>

            layui.use(["form"], function () {
                $ = layui.jquery;
                var form = layui.form;
                //监听提交
                form.on("submit(submit)", function (data) {

                    list.form("CreateServerKey", strformData, function (r) {
                        backToparent("添加成功");
                    });
                })
            });
        })
    </script>
</body>

</html>
