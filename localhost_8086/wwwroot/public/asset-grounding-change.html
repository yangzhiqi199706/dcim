<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <script type="text/html" id="detail">
                    <div class="layui-form-item">
                        <label class="layui-form-label">
                            所属服务器<span class="x-red">*</span>
                        </label>
                        <div class="layui-input-inline">
                            <select id="ServerCode" name="ServerCode" lay-verify="required" lay-filter="ServerCode">
                                <option value="">请选择</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">
                            所属区域<span class="x-red">*</span>
                        </label>
                        <div class="layui-input-inline">
                            <select id="AreaId" name="AreaId" lay-verify="required" lay-filter="AreaId">
                                <option value="">请选择</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">机柜列<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <select id="column" name="column" lay-verify="required" lay-filter="column">
                                <option value="">请选择</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">机柜</label>
                        <div class="layui-input-inline">
                            <select id="CabinetId" name="CabinetId" lay-verify="required" lay-filter="CabinetId">
                                <option value="">请选择</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">起始U位</label>
                        <div class="layui-input-inline">
                            <select id="ULocation" name="ULocation" lay-filter="ULocation">
                                <option value="">请选择</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">管理部门<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="DeptName" value="{{data.DeptName}}" name="DeptName" lay-verify="required" autocomplete="off" class="layui-input" readonly>
                            <input type="hidden" id="DeptId" value="{{data.DeptId}}" name="DeptId" lay-verify="required" autocomplete="off" class="layui-input" readonly>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" onclick="xadmin.open('选择部门','choose-department.html?type=dept')">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">管理人员<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="PersonName" value="{{data.PersonName}}" name="PersonName" lay-verify="required" autocomplete="off" class="layui-input" readonly>
                            <input type="hidden" id="EmpId" value="{{data.EmpId}}" name="EmpId" lay-verify="required" autocomplete="off" class="layui-input" readonly>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" onclick="xadmin.open('选择人员','choose-person.html?type=person&DeptId='+$('#DeptId').val())">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">动环关联</label>
                        <div class="layui-input-inline">
                            <textarea id="ParamId" name="ParamId" class="layui-textarea" readonly></textarea>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" onclick="xadmin.open('选择配置项','report-tableparam-choose.html?className='+encodeURI(encodeURI('动环关联')))">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label"></label>
                        <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                    </div>
                </script>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        var form;
        $(function () {
            var id = GetString("id");
            var AssetsId = GetString("AssetsId");
            var UHigh = 0;
            //获取详情
            list.info("GetGroundingAssetsDetailKey", {
                token: token,
                id: id
            }, function (r) {
                var html = template("detail", r);
                $("#formNow").html(html);
                UHigh = r.data.AttributeVal;
                layui.use(["form"], function () {
                    $ = layui.jquery;
                    form = layui.form;
                    //服务器
                    getServer(form, function () {
                        //继成上个接口
                        layuiSelected("ServerCode", r.data.ServerName);
                        form.on("select(ServerCode)", function (data) {
                            getArea(form, data);
                        });
                    });
                    getArea(form, { value: r.data.ServerCode }, function () {
                        //继成上个接口
                        layuiSelected("AreaId", r.data.AreaName);
                        form.on("select(AreaId)", function (data) {
                            getColumn(form, data);
                        });
                    });
                    getColumn(form, { value: r.data.AreaId }, function () {
                        //继成上个接口
                        layuiSelected("column", r.data.column);
                        form.on("select(column)", function (data) {
                            getCabinet(form, data, function () {
                                getU();
                            });
                        });
                    });
                    getCabinet(form, { value: r.data.column }, function () {
                        //继成上个接口
                        layuiSelected("CabinetId", r.data.position);
                        getU(r);
                    });

                    //监听提交
                    form.on("submit(submit)", function (data) {
                        var strformData = new FormData($("#formNow")[0]);
                        strformData.append("token", token);
                        strformData.append("id", id);
                        strformData.append("AssetsId", AssetsId);
                        strformData.append("DongHuan", data.field.ParamId);
                        strformData.append("UHigh", UHigh);
                        list.form("ChangeAssetsLocationKey", strformData, function (r) {
                            backToparent("修改成功");
                        });
                    });
                });
            });

        })
        //机柜
        function getCabinet(form, data, callback) {
            param.column = data.value;
            param.position = '';
            param.ComboBox = "all";
            $("#CabinetId").html('<option value="">请选择机柜</option>');
            list.info("GetCabinetListKey", param, function (res) {
                var cabinethtml = "";
                $.each(res.data, function (n, val) {
                    if (val.AssetsId) cabinethtml += "<option value=\"" + val.id + "\">" + val.position + "</option>";
                });
                $("#CabinetId").append(cabinethtml);
                form.render("select");
                if (callback) callback(res);
            });
        }
        //获取U位状态
        function getU(r) {
            param.ULocation = '';
            $("#ULocation").html('<option value="">请选择U位</option>');
            list.info('GetCabinetUKey', {
                token: token,
                id: $('#CabinetId').val()
            }, function (res) {
                var locationhtml = "";
                $.each(res.data, function (n, val) {
                    if (val.UStatus == null) {
                        locationhtml += "<option value=\"" + val.ULocation + "\">" + val.ULocation + "</option>";
                    }
                });
                $("#ULocation").append(locationhtml);
                form.render("select");
                //继成上个接口
                layuiSelected("ULocation", r.data.ULocation);
            })
        }
    </script>
</body>

</html>
