<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <style>
        .instantFrame {
            display: none;
        }
    </style>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <div class="layui-form-item">
                    <label class="layui-form-label">设备名称<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="DeviceName" value="" name="DeviceName" lay-verify="required"
                            autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">设备型号<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="DeviceType" value="" name="DeviceType" lay-verify="required"
                            autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">联网模式<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <select id="LinkMode" name="LinkMode" lay-verify="required" lay-filter="LinkMode">
                            <option value="1">TCP</option>
                            <option value="2">COM</option>
                            <option value="3">SNMP</option>
                        </select>
                    </div>
                </div>
                <div class="instantFrame">
                    <div class="layui-form-item">
                        <label class="layui-form-label">SNMP版本号<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <select id="SnmpVar" name="SnmpVar" lay-filter="SnmpVar">
                                <option value="0">V1</option>
                                <option value="1">V2C</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">SNMP读权<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="SnmpRead" value="" name="SnmpRead" autocomplete="off"
                                class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">SNMP写权</label>
                        <div class="layui-input-inline">
                            <input type="text" id="SnmpWrite" value="" name="SnmpWrite" autocomplete="off"
                                class="layui-input">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item ipbox">
                    <label class="layui-form-label">IP<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="DeviceIP1" value="" name="DeviceIP1" autocomplete="off"
                            class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item ipbox">
                    <label class="layui-form-label">端口<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="DevicePort1" value="" name="DevicePort1" autocomplete="off"
                            class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item combox" style="display: none;">
                    <label class="layui-form-label">端口<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="DeviceIP2" value="" name="DeviceIP2" autocomplete="off"
                            class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item combox" style="display: none;">
                    <label class="layui-form-label">比特率<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="DevicePort2" value="9600" name="DevicePort2" autocomplete="off"
                            class="layui-input">
                    </div>
                </div>
                <!-- <div class="layui-form-item snmpbox" style="display: none;">
                    <label class="layui-form-label">OID<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="OID" value="" name="OID" autocomplete="off" class="layui-input" >
                    </div>
                </div> -->
                <!-- <div class="layui-form-item snmpbox" style="display: none;">
                    <label class="layui-form-label">唯一标识<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="OnlyCode" value="" name="OnlyCode" autocomplete="off" class="layui-input" >
                    </div>
                </div> -->
                <div class="layui-form-item">
                    <label class="layui-form-label">串联设备地址<span class="x-red">*</span></label>
                    <div class="layui-input-inline DeviceAddress">
                        <input type="text" id="DeviceAddress" value="" name="DeviceAddress" lay-verify="required"
                            autocomplete="off" class="layui-input">
                        <div>-</div>
                        <input type="text" id="DeviceAddress1" value="" name="DeviceAddress1" autocomplete="off"
                            class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">设备分类<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <select class="layui-input" id="DeviceClass" name="DeviceClass" lay-verify="required"
                            lay-filter="DeviceClass">
                            <option value="">请选择</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item ProtocolCode">
                    <label class="layui-form-label">设备协议<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <select class="layui-input" id="ProtocolCode" name="ProtocolCode" lay-filter="ProtocolCode">
                            <option value="">请选择</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item doorCat1">
                    <label class="layui-form-label">门禁序列号</label>
                    <div class="layui-input-inline">
                        <input type="text" id="SerialNumber" value="" name="SerialNumber" autocomplete="off"
                            class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item udevice">
                    <label class="layui-form-label">账号<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="uaccount" value="" name="uaccount" autocomplete="off"
                            class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item udevice">
                    <label class="layui-form-label">密码<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="upassword" value="" name="upassword" autocomplete="off"
                            class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item doorCat2">
                    <label class="layui-form-label">门禁账号</label>
                    <div class="layui-input-inline">
                        <input type="text" id="account" value="" name="account" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item doorCat2">
                    <label class="layui-form-label">门禁密码</label>
                    <div class="layui-input-inline">
                        <input type="text" id="password" value="" name="password" autocomplete="off"
                            class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">所属服务器<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <select class="layui-input" id="ServerCode" name="ServerCode" lay-verify="required"
                            lay-filter="ServerCode">
                            <option value="">请选择</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">所属区域<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <select class="layui-input" id="AreaId" name="AreaId" lay-verify="required" lay-filter="AreaId">
                            <option value="">请选择</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function () {
            var type = GetString("type");
            let proListArr = [];//全部协议数组
            layui.use(["form"], function () {
                $ = layui.jquery;
                var form = layui.form;
                //联网模式
                form.on("select(LinkMode)", function (data) {
                    if (data.value == 2) {
                        $('.ipbox').hide();
                        $('.combox').show();
                    } else {
                        $('.combox').hide();
                        $('.ipbox').show();
                    }
                    if (data.value == 3) {
                        $('.ProtocolCode').hide();
                        $('.doorCat1,.doorCat2,.udevice').hide();
                        $('.snmpbox').show();
                        $('.instantFrame').show();
                    } else {
                        $('.ProtocolCode').show();
                        $('.instantFrame').hide();
                        let codeval = $('#ProtocolCode option:selected').val();
                        if (codeval) {
                            if (codeval == '14001' || codeval == '14003') {
                                $('.doorCat2').show();
                                $('.doorCat1,.udevice').hide().find('input').val('');
                            }
                            if (codeval == '14002' || codeval == '14005') {
                                $('.doorCat1').show();
                                $('.doorCat2,.udevice').hide().find('input').val('');
                            }
                            if (codeval == '18001') {
                                $('.udevice').show();
                                $('.doorCat2,.doorCat1').hide().find('input').val('');
                            }
                        }
                        $('.snmpbox').hide();
                    }
                });
                //服务器
                getServer(form, function () {
                    form.on("select(ServerCode)", function (data) {
                        getArea(form, data);
                    });
                });
                //分类
                list.info('GetClassListKey', param, function (res) {
                    var classhtml = "<option value=''>请选择</option>";
                    $.each(res.data, function (n, val) {
                        if (type && val.ClassName == 'U位设备') {
                            classhtml += "<option value=\"" + val.id + "\" selected>" + val.ClassName + "</option>";
                        } else {
                            classhtml += "<option value=\"" + val.id + "\">" + val.ClassName + "</option>";
                        }
                    });
                    $("#DeviceClass").html(classhtml);
                    form.render("select");
                    //根据设备分类筛选协议
                    form.on("select(DeviceClass)", function (data) {
                        if (data.value) {
                            let proListFilterArr = proListArr.filter(v=>v.ProtocolType==data.value);
                            setProListHtml(proListFilterArr);
                        } else {
                            setProListHtml(proListArr);
                        }
                    })
                })
                //全部协议初始化
                $('.doorCat1,.doorCat2,.udevice').hide();
                list.info('GetDeviceProtocolListKey', param, function (res) {
                    proListArr = res.data;
                    setProListHtml(proListArr);
                })
                //展示协议数据
                function setProListHtml(proListArr) {
                    var prohtml = "<option value=''>请选择</option>";
                    $.each(proListArr, function (n, val) {
                        if (type && val.ProtocolCode == '18001') {
                            prohtml += "<option value=\"" + val.ProtocolCode + "\" selected>" + val.ProtocolName + "</option>";
                            $('.udevice').show();
                            $('.doorCat2,.doorCat1').hide().find('input').val('');
                        } else {
                            prohtml += "<option value=\"" + val.ProtocolCode + "\">" + val.ProtocolName + "</option>";
                        }
                    });
                    $("#ProtocolCode").html(prohtml);
                    form.render("select");
                    form.on("select(ProtocolCode)", function (data) {
                        let codeval = data.value;
                        $('.doorCat1,.doorCat2,.udevice').hide();
                        if (codeval == '14001' || codeval == '14003') {
                            $('.doorCat2').show();
                            $('.doorCat1,.udevice').hide().find('input').val('');
                        }
                        if (codeval == '14002' || codeval == '14005') {
                            $('.doorCat1').show();
                            $('.doorCat2,.udevice').hide().find('input').val('');
                        }
                        if (codeval == '18001') {
                            $('.udevice').show();
                            $('.doorCat2,.doorCat1').hide().find('input').val('');
                        }
                    });
                }

                //监听提交
                form.on("submit(submit)", function (data) {
                    var strformData = new FormData($("#formNow")[0]);
                    strformData.append("token", token);

                    if (strformData.get("LinkMode") == '2') {
                        if (!strformData.get("DeviceIP2")) {
                            layer.msg('端口不能为空', {
                                icon: 5,
                                time: 1000
                            });
                            return false;
                        }
                        if (!strformData.get("DevicePort2")) {
                            layer.msg('比特率不能为空', {
                                icon: 5,
                                time: 1000
                            });
                            return false;
                        }
                        strformData.append('DeviceIP', strformData.get("DeviceIP2"));
                        strformData.append('DevicePort', strformData.get("DevicePort2"));
                    } else {
                        if (!strformData.get("DeviceIP1")) {
                            layer.msg('ip不能为空', {
                                icon: 5,
                                time: 1000
                            });
                            return false;
                        }
                        if (!strformData.get("DevicePort1")) {
                            layer.msg('端口不能为空', {
                                icon: 5,
                                time: 1000
                            });
                            return false;
                        }
                        strformData.append('DeviceIP', strformData.get("DeviceIP1"));
                        strformData.append('DevicePort', strformData.get("DevicePort1"));
                    }
                    if (strformData.get("LinkMode") == '3') {
                        strformData.delete('ProtocolCode');
                        if (!strformData.get('SnmpVar')) {
                            layer.msg('SNMP版本号不能为空', {
                                icon: 5,
                                time: 1000
                            });
                            return false;
                        }
                        if (!strformData.get('SnmpRead')) {
                            layer.msg('snmp读权不能为空', {
                                icon: 5,
                                time: 1000
                            });
                            return false;
                        }
                        // if(!strformData.get("OID")){
                        //     layer.msg('OID不能为空', {
                        //         icon: 5,
                        //         time: 1000
                        //     });
                        //     return false;
                        // }
                        // if(!strformData.get("OnlyCode")){
                        //     layer.msg('唯一标识不能为空', {
                        //         icon: 5,
                        //         time: 1000
                        //     });
                        //     return false;
                        // }
                    } else {
                        // strformData.delete('OID');
                        // strformData.delete('OnlyCode');
                        if (!strformData.get("ProtocolCode")) {
                            layer.msg('请选择设备协议', {
                                icon: 5,
                                time: 1000
                            });
                            return false;
                        }
                        if (strformData.get("ProtocolCode") == '18001') {//u位设备 账号 密码不为空
                            if (!strformData.get('uaccount')) {
                                layer.msg('账号不能为空', {
                                    icon: 5,
                                    time: 1000
                                });
                                return false;
                            }
                            if (!strformData.get('upassword')) {
                                layer.msg('密码不能为空', {
                                    icon: 5,
                                    time: 1000
                                });
                                return false;
                            }
                            strformData.delete('account');
                            strformData.delete('password');
                            strformData.append('account', strformData.get('uaccount'));
                            strformData.append('password', strformData.get('upassword'));
                        }
                    }
                    strformData.delete('DeviceIP1');
                    strformData.delete('DeviceIP2');
                    strformData.delete('DevicePort1');
                    strformData.delete('DevicePort2');
                    strformData.delete('uaccount');
                    strformData.delete('upassword');
                    list.form("CreateDeviceKey", strformData, function (r) {
                        layer.msg('添加成功', {
                            icon: 6,
                            time: 1000
                        });
                    });
                });
                //监听取消
                $('#cancel').click(function () {
                    var index = parent.layer.getFrameIndex(window.name);
                    parent.layer.close(index);
                    window.parent.location.reload();
                });
            });
        })
    </script>
</body>

</html>
