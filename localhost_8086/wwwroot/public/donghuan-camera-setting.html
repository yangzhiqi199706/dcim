<html>

<head>
    <meta charset="UTF-8">

</head>

<body>
    <div class="x-nav">

            <a>

        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">

                            <thead>
                                <tr>
                                    <th colspan="2">配置信息</th>
                                </tr>
                            </thead>

                                <script type="text/html" id="detail">
                                    <tr>
                                        <td>密码</td>
                                        <td>{{data.sip.password}}</td>
                                    </tr>
                                    <tr>

                                    <tr>

                                    </tr>
                                    <tr>
                                        <td>国标ID</td>
                                        <td>{{data.sip.id}}</td>
                                    </tr>

                                        <td>监听IP</td>
                                        <td>{{data.sip.monitorIp}}</td>
                                    </tr>
                                    <tr>
                                        <td>心跳超时</td>
                                        <td>{{data.sip.keepaliveTimeOut}}</td>
                                    </tr>
                                    <tr>
                                        <td>存储报警信息</td>
                                        <td>{{if !data.sip.alarm}}false{{else}}true{{/if}}</td>
                                    </tr>
                                    <tr>
                                        <td>云台控制速度</td>
                                        <td>{{data.sip.ptzSpeed}}</td>
                                    </tr>
                                    <tr>

                                    </tr> -->

                        </table>

            </div>
        </div>
    </div>
    <script>
        $(function () {
            // getDoorInfo('video', {
            //     addr: videoUrl,
            //     isapi: 'api/server/system/configInfo',
            //     format:'json'
            // }, function (res) {
            videolist.info('get','api/server/system/configInfo','',function(res){
                res.data.sip.ip=window.location.hostname;
                var html = template("detail", res);
                $("tbody").html(html);
            })
        })
    </script>
