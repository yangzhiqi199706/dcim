<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <div class="layui-form-item">
                    <label class="layui-form-label">策略名称<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" name="StrategyName" lay-filter="StrategyName" autocomplete="off"
                            class="layui-input" value="" lay-verify="required">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">主要告警<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <textarea id="MasterNotifyMode" name="MasterNotifyMode" lay-verify="required"
                            class="layui-textarea" readonly></textarea>
                    </div>
                    <div class="layui-form-mid layui-word-aux">
                        <a class="layui-btn"
                            onclick="xadmin.open('选择主要告警','sms-deployment-choose2.html?&MasterNotifyMode='+encodeURI(encodeURI($('#MasterNotifyMode').val()))+'&SlaveNotifyMode='+encodeURI(encodeURI($('#SlaveNotifyMode').val())))">选择</a>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">次要告警<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <textarea id="SlaveNotifyMode" name="SlaveNotifyMode" lay-verify="required"
                            class="layui-textarea" readonly></textarea>
                    </div>
                    <div class="layui-form-mid layui-word-aux">
                        <a class="layui-btn"
                            onclick="xadmin.open('选择次要告警','sms-deployment-choose.html?MasterNotifyMode='+encodeURI(encodeURI($('#MasterNotifyMode').val()))+'&SlaveNotifyMode='+encodeURI(encodeURI($('#SlaveNotifyMode').val())))">选择</a>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-submit lay-filter="submit"
                        type="button">保存</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        $(function () {
            layui.use('form', function () {
                var form = layui.form;
                //提交数据
                form.on("submit(submit)", function (data) {
                    var strformData = {
                        token: token,
                        StrategyName: data.field.StrategyName,
                        MasterNotifyMode: data.field.MasterNotifyMode,
                        SlaveNotifyMode: data.field.SlaveNotifyMode
                    }
                    list.info('CreateAlarmMasterSlaveKey', strformData, function (r) {
                        backToparent('添加成功');
                    })
                })
            });
        });
    </script>
</body>
</html>
