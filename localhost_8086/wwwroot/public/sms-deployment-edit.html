<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <script type="text/html" id="detail">
                    <div class="layui-form-item">
                        <label class="layui-form-label">策略名称<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" name="StrategyName" lay-filter="StrategyName" autocomplete="off"
                                class="layui-input" value="{{data.StrategyName}}" lay-verify="required">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">主要告警<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <textarea id="MasterNotifyMode" name="MasterNotifyMode" lay-verify="required"
                                class="layui-textarea" readonly>{{data.MasterNotifyMode}}</textarea>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn"
                                onclick="xadmin.open('选择主要告警','sms-deployment-choose2.html?type=edit&MasterNotifyMode='+encodeURI(encodeURI($('#MasterNotifyMode').val()))+'&SlaveNotifyMode='+encodeURI(encodeURI($('#SlaveNotifyMode').val())))">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">次要告警<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <textarea id="SlaveNotifyMode" name="SlaveNotifyMode" lay-verify="required" class="layui-textarea" readonly>{{data.SlaveNotifyMode}}</textarea>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" onclick="xadmin.open('选择次要告警','sms-deployment-choose.html?type=edit&MasterNotifyMode='+encodeURI(encodeURI($('#MasterNotifyMode').val()))+'&SlaveNotifyMode='+encodeURI(encodeURI($('#SlaveNotifyMode').val())))">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label"></label>
                        <button class="layui-btn" id="submit" lay-submit lay-submit lay-filter="submit"
                            type="button">保存</button>
                    </div>
                </script>
            </form>
        </div>
    </div>
    <script>
        var form;
        $(function () {
            var id = GetString("id");
            var TypeList1 = [],TypeList2 = [];
            var check='';
            layui.use('form', function () {
                form = layui.form;
                //请求全部数据判断值
                param.ComboBox = "all";
                param.MasterID = "0";

                list.info("GetAlarmMasterSlaveDetailKey", {
                    token: token,
                    id: id
                }, function (r) {
                    var html = template("detail", r);
                    $("#formNow").html(html);
                    list.info("GetAlarmTypeListKey", param, function (res) {
                        TypeList1 = TypeList2 = res.data;
                        // setTypehtml(TypeList1,'#MasterNotifyMode');
                        // setTypehtml(TypeList2,'#SlaveNotifyMode');
                        layuiSelected("MasterNotifyMode",'('+r.data.MasterDeviceName+')'+r.data.MasterTypeName);
                        // layuiSelected("SlaveNotifyMode",'('+r.data.SlaveDeviceName+')'+ r.data.SlaveTypeName);
                    })
                });
                // form.on('select(MasterNotifyMode)', function (data) {
                //     if(!check){
                //         check=data.value;setTypehtml(TypeList2,'#SlaveNotifyMode',data.value)
                //     };
                // })
                // form.on('select(SlaveNotifyMode)', function (data) {
                //     if(!check){
                //         check=data.value;setTypehtml(TypeList1,'#MasterNotifyMode',data.value)
                //     }
                // })
                //提交数据
                form.on("submit(submit)", function (data) {
                    var strformData = {
                        token: token,
                        StrategyName: data.field.StrategyName,
                        MasterNotifyMode: data.field.MasterNotifyMode,
                        SlaveNotifyMode: data.field.SlaveNotifyMode,
                        id:id
                    }
                    list.info('ChangeAlarmMasterSlaveKey', strformData, function (r) {
                        backToparent('修改成功');
                    })
                })
            });
        })
        function setTypehtml(list,obj,check){
            var comhtml = "<option value=''>请选择</option>";
            $.each(list, function (n, val) {
                if(check==val.id && check){
                    comhtml += "<option value=\"" + val.id + "\" disabled>(" + val.DeviceName+")"+val.TypeName + "</option>";
                }else{
                    comhtml += "<option value=\"" + val.id + "\">(" + val.DeviceName+")"+val.TypeName + "</option>";
                }
            });
            $(obj).html(comhtml);
            form.render("select");
        }
    </script>
</body>

</html>
