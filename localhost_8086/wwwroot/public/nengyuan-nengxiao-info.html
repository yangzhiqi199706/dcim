        .massage-box-md12 {
            width: calc(100% - 10px)
        }

        .massage-box-md12 .massage-chart {

        }
    </style>

<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>能源管理->能效概况</cite>

        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">

        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-col-md12">
            <div class="layui-card">
                <div class="layui-card-body">
                    <form class="layui-form layui-col-space5">
                        <div class="layui-inline layui-show-xs-block">
                            <select id="ServerCode" name="ServerCode" lay-filter="ServerCode">
                                <option value="">请选择</option>
                            </select>
                        </div>
                        <div class="layui-inline layui-show-xs-block">
                            <select id="AreaId" name="AreaId" lay-filter="AreaId">
                                <option value="">请选择</option>
                            </select>
                        </div>
                        <div class="layui-inline layui-show-xs-block">
                            <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                <i class="layui-icon">&#xe615;</i>
                            </button>
                        </div>
                    </form>
                    <button class="layui-btn x-right" type="button"
                        onclick="xadmin.open('分类配置','nengyuan-class-list.html')">分类配置</button>
                </div>
                <div class="layui-card-body">
                    <div class="massage-box">
                        <div class="capacity-statistics-title">TOP5分类能耗</div>
                        <div id="topChart" class="massage-chart"></div>
                    </div>
                    <div class="massage-box">
                        <div class="capacity-statistics-title">分类能耗占比</div>
                        <div id="classChart" class="massage-chart"></div>
                    </div>
                    <div class="massage-box">
                        <div class="capacity-statistics-title">PUE</div>
                        <div id="pueChart" class="massage-chart"></div>
                    </div>
                    <div class="massage-box massage-box-md12">
                        <div class="capacity-statistics-title">分类实时功率</div>
                        <div id="nenghaoChart" class="massage-chart"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        $(function () {
            var chartparam = {
                token: token,
                ServerCode: '',
                AreaId: ''
            }

            getdata(chartparam);

            layui.use(["form"], function () {
                $ = layui.jquery;
                var form = layui.form;
                //服务器
                getServer(form, function (r) {
                    form.on("select(ServerCode)", function (data) {
                        getArea(form, data);
                    });
                });
                //监听提交
                form.on("submit(search)", function (data) {
                    chartparam.ServerCode = data.field.ServerCode;
                    chartparam.AreaId = data.field.AreaId;
                    getdata(chartparam);
                    return false;
                });
            });
        })
        function getdata(chartparam) {
            //能效概况
            list.info('GetNXInfoKey', chartparam, function (r) {
                setPUE(r.data.PueValue);
                if (r.data.TypeList) {
                    var classtitle = [];
                    var classdata = [];
                    var toptitle = [];
                    var topdata = [];
                    $.each(r.data.TypeList, function (n, val) {
                        if (n <= 4) {
                            toptitle.push(val.TypeName);
                            var itemcolor = '';
                            switch (n) {
                                case 0: itemcolor = '#35DFFC'; break;
                                case 1: itemcolor = '#3783FF'; break;
                                case 2: itemcolor = '#913BFE'; break;
                                case 3: itemcolor = '#FFCA35'; break;
                                case 4: itemcolor = '#FF9100'; break;
                            }
                            topdata.push({
                                'value': val.TypeValue,
                                'name': val.TypeName,
                                'itemStyle': { 'color': itemcolor }
                            })
                            classtitle.push({
                                'name': val.TypeName,
                                'icon': 'circle'
                            });
                            classdata.push({
                                'name': val.TypeName,
                                'value': val.TypeValue
                            });
                        }
                    })
                    setTop(toptitle, topdata);
                    setPie(classtitle, classdata);
                }
            })

            //实时
            list.info('GetNXPowerInfoKey', chartparam, function (r) {
                var powertitle = [];
                var powerdata = [];
                $.each(r.data, function (n, val) {
                    powertitle.push(val.TypeName);
                    powerdata.push(val.TypeValue);
                })
                setPower(powertitle, powerdata);
            });
        }
        //TOP5
        function setTop(toptitle, topdata) {
            var topChartDom = document.getElementById('topChart');
            var topChart = echarts.init(topChartDom);

            var topChartoption = {
                yAxis: {
                    type: 'category',
                    data: toptitle,
                    axisLine: {
                        show: false,
                        lineStyle: {
                            type: 'solid',
                            color: '#F4F8FB',
                            width: '1'
                        }
                    },
                    inverse: true,//倒叙
                    axisLabel: {
                        interval: 0,
                        textStyle: {
                            color: '#A2CAE1',//坐标值得具体的颜色
                            lineHeight: 30
                        }
                    },
                },
                xAxis: {
                    show: false,
                    type: 'value'
                },
                grid: {
                    x: 120,
                    y: 10,
                    x2: 60,
                    y2: 0
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow',
                    }
                },
                series: [{
                    data: topdata,
                    label: {
                        show: true,
                        formatter: '{c}kwh',
                        textStyle: {
                            color: '#000000',
                            fontSize: '14',
                            lineHeight: 15
                        },
                    },
                    type: 'bar',
                    barWidth: 11,
                    showBackground: true,
                    backgroundStyle: {
                        color: '#F4F8FB'
                    },
                }]
            };
            topChartoption && topChart.setOption(topChartoption);
        }

        //Pie
        function setPie(classtitle, classdata) {
            var classChartDom = document.getElementById('classChart');
            var classChart = echarts.init(classChartDom);
            var classChartoption = {
                legend: {
                    orient: 'vertical',
                    data: classtitle,
                    right: 10,
                    top: 55,
                    itemWidth: 6,
                    itemHeight: 6,
                    textStyle: {
                        color: '#A2CAE1',
                        fontSize: '11',
                        lineHeight: 15,
                    },
                },
                color: ['#35DFFC', '#3783FF', '#913BFE', '#FFCA35', '#FF9100'],
                series: [
                    {
                        name: '分项能耗占比',
                        type: 'pie',
                        radius: ['65%', '90%'],
                        top: 25,
                        left: -140,
                        bottom: 0,
                        itemStyle: {
                            shadowColor: 'rgba(225, 229, 255, 0.69)',
                            shadowBlur: 16
                        },
                        emphasis: {
                            label: {
                                show: true,
                                fontSize: '14.3',
                                fontWeight: 'bold',
                                // formatter: '{c} kwh'
                                formatter: '{b}: {d}%'
                            }
                        },
                        label: {
                            show: false,
                            position: 'center',
                            textStyle: {
                                color: '#ffffff',
                                fontSize: '14',
                                lineHeight: 15
                            },
                        },
                        data: classdata,
                    }
                ]
            };
            classChartoption && classChart.setOption(classChartoption);
        }

        //pue
        function setPUE(data) {
            var pueChartDom = document.getElementById('pueChart');
            var pueChart = echarts.init(pueChartDom);
            var pueChartoption = {
                series: [{
                    type: 'gauge',
                    min: 1,
                    max: 5,
                    splitNumber: 10,
                    startAngle: 180,
                    endAngle: 0,
                    radius: '132%',
                    center: ['50%', '75%'],
                    axisLine: {
                        lineStyle: {
                            color: [
                                [1, '#F4F8FB']
                            ],
                            width: 10
                        }
                    },
                    splitLine: {
                        show: false
                    },
                    axisTick: {
                        show: false
                    },
                    axisLabel: {
                        distance: -43,
                        color: '#A2CAE1',
                        fontSize: 12
                    },
                    progress: {
                        show: true,
                        overlap: true,
                        roundCap: true,
                        itemStyle: {
                            color: {
                                type: 'linear',
                                x: 0,
                                y: 0,
                                x2: 0,
                                y2: 1,
                                colorStops: [{
                                    offset: 0, color: '#68B9FF'
                                }, {
                                    offset: 1, color: '#3783FF'
                                }],
                                global: false
                            }
                        }
                    },
                    title: {
                        show: false
                    },
                    detail: {
                        color: '#FFF',
                        offsetCenter: ["0", "36"]
                    },
                    data: [{
                        value: data,
                    }]
                },
                {
                    type: 'gauge',
                    min: 1,
                    max: 3,
                    splitNumber: 6,
                    startAngle: 180,
                    endAngle: 0,
                    radius: '116%',
                    center: ['50%', '75%'],
                    axisLine: {
                        lineStyle: {
                            color: [
                                [1, '#68B9FF']
                            ],
                            width: 3
                        }
                    },
                    splitLine: {
                        distance: -3,
                        length: 10,
                        lineStyle: {
                            color: '#979797'
                        }
                    },
                    axisTick: {
                        show: false
                    },
                    axisLabel: {
                        show: false
                    },
                    pointer: {
                        show: false
                    },
                    title: {
                        show: false
                    },
                    data: [{
                        value: null,
                    }],
                    detail: {
                        color: 'transparent',
                    }
                }
                ]
            };
            pueChartoption && pueChart.setOption(pueChartoption);
        }

        //功率
        function setPower(powertitle, powerdata) {
            var dom = document.getElementById('nenghaoChart');
            var myChart = echarts.init(dom, null, {
                renderer: 'canvas',
                useDirtyRect: false
            });
            var app = {};
            var option;
            option = {
                xAxis: {
                    type: 'category',
                    data: powertitle,
                    axisLine: {
                        show: true,
                        lineStyle: {
                            type: 'solid',
                            color: '#1898ED',
                            width: '1'
                        }
                    },
                    axisLabel: {
                        interval: 0,
                        textStyle: {
                            color: '#A2CAE1',
                            fontSize: '13'
                        },
                    }
                },
                yAxis: {
                    type: 'value',
                    axisLabel: {
                        textStyle: {
                            color: '#A2CAE1',
                            fontSize: '13'
                        },
                        formatter: '{value}KW',
                    },
                    splitLine: {
                        lineStyle: {
                            color: 'rgba(24, 152, 237, 0.17)',
                            type: 'dashed'
                        }
                    },
                },
                grid: {
                    top: '30',
                    bottom: '20',
                    left: '120',
                    right: '20'
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    }
                },
                series: [{
                    data: powerdata,
                    label: {
                        show: true,
                        position: 'top',
                        color: '#fff',
                        formatter: function (val) {
                            if (val.value !== 0) {
                                return val.value;
                            } else {
                                return '';
                            }
                        },
                    },
                    type: 'bar',
                    smooth: 0.6,
                    barWidth: 20,
                    showBackground: true,
                    backgroundStyle: {
                        color: 'rgba(180, 180, 180, 0.2)'
                    },
                }]
            };
            if (option && typeof option === 'object') {
                myChart.setOption(option);
            }
        }
