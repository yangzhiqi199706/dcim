
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <div class="layui-form-item">
                    <label class="layui-form-label">开始时间<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="startDateTime" value="" name="startDateTime" lay-verify="required" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">结束时间<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="endDateTime" value="" name="endDateTime" lay-verify="required" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">文件前缀<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="FileName" value="" name="FileName" lay-verify="required" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">报表类型<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <select id="type" name="type" lay-filter="type">
                            <option value="all">参数总表</option>
                            <option value="wsd">温湿度报表</option>
                            <option value="air">空调报表</option>
                            <option value="power">配电报表</option>
                            <option value="ups">UPS报表</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">报表模板<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <select id="reporttpl" name="reporttpl" lay-filter="reporttpl">
                            <option value="">请选择</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function(){

            layui.use(["form",'laydate'], function () {
                $ = layui.jquery;
                var form = layui.form;
                var laydate = layui.laydate;
                laydate.render({
                    elem: '#startDateTime',
                    format: 'yyyy-MM-dd',
                    value: GetString("startDateTime"), // 指定值
                });
                laydate.render({
                    elem: '#endDateTime',
                    format: 'yyyy-MM-dd',
                    value: GetString("endDateTime"), // 指定值
                });
                //监听提交
				form.on("select(type)", function (data) {
                    param.ComboBox = "all";
                    var url='';
                    switch(data.value){
                        case 'all':url='GetGeneralTableListKey';break;
                        case 'wsd':url='GetWSDTableListKey';break;
                        case 'air':url='GetAirTableListKey';break;
                        case 'power':url='GetPowerTableListKey';break;
                        case 'ups':url='GetUPSTableListKey';break;
                    }
                    list.info(url,param,function(r){
                        var html = `<option value="">请选择</option>`;
                        if(r.data.length!=0){
                            $.each(r.data,function(n,val){
                                switch(data.value){
                                    case 'all':html+= `<option value="`+val.id+`">`+val.GeneralTableName+`</option>` ;break;
                                    case 'wsd':html+= `<option value="`+val.id+`">`+val.WSDTableName+`</option>` ;break;
                                    case 'air':html+= `<option value="`+val.id+`">`+val.AirTableName+`</option>` ;break;
                                    case 'power':html+= `<option value="`+val.id+`">`+val.PowerTableName+`</option>` ;break;
                                    case 'ups':html+= `<option value="`+val.id+`">`+val.UPSTableName+`</option>` ;break;
                                }
                            })
                        }
					    $("#reporttpl").html(html);
                        form.render();
                    })
                })
                //监听提交
				form.on("submit(submit)", function (data) {
                    // var strformData = new FormData($("#formNow")[0]);
                    // strformData.append("token", token);
                    // list.form("GetParamTableKey", strformData, function (r) {
                    //     backToparent("添加成功");
                    // });
                })
            });
        })
    </script>
</body>
</html>
