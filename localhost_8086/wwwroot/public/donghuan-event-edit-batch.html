<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/public.dcimnew.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <div class="layui-form-item">
                    <label class="layui-form-label">告警上限</label>
                    <div class="layui-input-inline">
                        <input type="text" id="AlarmUpLimit" value="" name="AlarmUpLimit" autocomplete="off"
                            class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">告警下限</label>
                    <div class="layui-input-inline">
                        <input type="text" id="AlarmDownLimit" value="" name="AlarmDownLimit" autocomplete="off"
                            class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">告警特征值</label>
                    <div class="layui-input-inline">
                        <input type="text" id="AlarmValue" value="" name="AlarmValue" autocomplete="off"
                            class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">启用电话通知</label>
                    <div class="layui-form-lineheight">
                        <!-- <input type="checkbox" title="" name="PhoneNotify" lay-skin="switch" lay-text="ON|OFF" checked> -->
                        <input type="radio" name="PhoneNotify" value="on" title="开启">
                        <input type="radio" name="PhoneNotify" value="off" title="禁用">
                        <input type="radio" name="PhoneNotify" value="" title="原值" checked>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">启用短信通知</label>
                    <div class="layui-form-lineheight">
                        <!-- <input type="checkbox" title="" name="SMSNotify" lay-skin="switch" lay-text="ON|OFF" checked> -->
                        <input type="radio" name="SMSNotify" value="on" title="开启">
                        <input type="radio" name="SMSNotify" value="off" title="禁用">
                        <input type="radio" name="SMSNotify" value="" title="原值" checked>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">启用邮件通知</label>
                    <div class="layui-form-lineheight">
                        <!-- <input type="checkbox" title="" name="EmailNotify" lay-skin="switch" lay-text="ON|OFF" checked> -->
                        <input type="radio" name="EmailNotify" value="on" title="开启">
                        <input type="radio" name="EmailNotify" value="off" title="禁用">
                        <input type="radio" name="EmailNotify" value="" title="原值" checked>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">启用声光通知</label>
                    <div class="layui-form-lineheight">
                        <!-- <input type="checkbox" title="" name="NoiseNotify" lay-skin="switch" lay-text="ON|OFF" checked> -->
                        <input type="radio" name="NoiseNotify" value="on" title="开启">
                        <input type="radio" name="NoiseNotify" value="off" title="禁用">
                        <input type="radio" name="NoiseNotify" value="" title="原值" checked>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">启用微信通知</label>
                    <div class="layui-form-lineheight">
                        <!-- <input type="checkbox" title="" name="WeixinNotify" lay-skin="switch" lay-text="ON|OFF" checked> -->
                        <input type="radio" name="WeixinNotify" value="on" title="开启">
                        <input type="radio" name="WeixinNotify" value="off" title="禁用">
                        <input type="radio" name="WeixinNotify" value="" title="原值" checked>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">启用企业微信通知</label>
                    <div class="layui-form-lineheight">
                        <!-- <input type="checkbox" title="" name="WeComNotify" lay-skin="switch" lay-text="ON|OFF" checked> -->
                        <input type="radio" name="WeComNotify" value="on" title="开启">
                        <input type="radio" name="WeComNotify" value="off" title="禁用">
                        <input type="radio" name="WeComNotify" value="" title="原值" checked>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">启用钉钉通知</label>
                    <div class="layui-form-lineheight">
                        <!-- <input type="checkbox" title="" name="DingdingNotify" lay-skin="switch" lay-text="ON|OFF" checked> -->
                        <input type="radio" name="DingdingNotify" value="on" title="开启">
                        <input type="radio" name="DingdingNotify" value="off" title="禁用">
                        <input type="radio" name="DingdingNotify" value="" title="原值" checked>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">告警用户组</label>
                    <div class="layui-input-block" id="ulist"></div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">容错次数</label>
                    <div class="layui-input-inline">
                        <input type="number" id="ConfirmNum" value="" name="ConfirmNum" autocomplete="off"
                            class="layui-input" onchange="$('#ConfirmNumTime').val($(this).val()*3)">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">延时告警时间(秒)</label>
                    <div class="layui-input-inline">
                        <input type="number" id="ConfirmNumTime" autocomplete="off" class="layui-input"
                            onchange="$('#ConfirmNum').val(Math.ceil($(this).val()/3))">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">通知次数</label>
                    <div class="layui-input-inline">
                        <input type="number" id="NotifyNum" value="" name="NotifyNum" autocomplete="off"
                            class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">通知间隔(秒)</label>
                    <div class="layui-input-inline">
                        <input type="number" id="IntervalTime" value="" name="IntervalTime" autocomplete="off"
                            class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">告警级别</label>
                    <div class="layui-input-inline">
                        <select id="AlarmLevel" name="AlarmLevel" lay-filter="AlarmLevel">
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                        <label class="layui-form-label">告警模式</label>
                        <div class="layui-input-inline">
                            <select id="NotifyWindowID" name="NotifyWindowID" lay-filter="NotifyWindowID">
                            </select>
                        </div>
                    </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">升级条件(秒)</label>
                    <div class="layui-input-inline">
                        <input type="number" id="UpgradeTime" value="" name="UpgradeTime" autocomplete="off"
                            class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">升级用户组</label>
                    <div class="layui-input-block" id="uplist"></div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">控制联动</label>
                    <div class="layui-input-inline">
                        <textarea id="Linkage" name="Linkage" class="layui-textarea"></textarea>
                    </div>
                    <div class="layui-form-mid layui-word-aux">
                        <a class="layui-btn"
                            onclick="xadmin.open('选择控制命令','donghuan-event-controlchoose.html?inputid=Linkage&value='+encodeURI(encodeURI($('#Linkage').val())))">选择命令
                        </a>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">控制联动取消</label>
                    <div class="layui-input-inline">
                        <textarea id="CancelLinkage" name="CancelLinkage" class="layui-textarea"></textarea>
                    </div>
                    <div class="layui-form-mid layui-word-aux">
                        <a class="layui-btn"
                            onclick="xadmin.open('选择控制命令','donghuan-event-controlchoose.html?inputid=CancelLinkage&value='+encodeURI(encodeURI($('#CancelLinkage').val())))">选择命令
                        </a>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">监控联动</label>
                    <div class="layui-input-inline">
                        <textarea id="LinkVideoChannel" name="LinkVideoChannel" class="layui-textarea"></textarea>
                    </div>
                    <div class="layui-form-mid layui-word-aux">
                        <a class="layui-btn"
                            onclick="xadmin.open('选择通道','donghuan-event-videochancelchoose.html?inputid=LinkVideoChannel&value='+encodeURI(encodeURI($('#LinkVideoChannel').val())))">选择通道</a>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
            </form>
            <script type="text/html" id="usertemplate">
                {{each data as list i}}
                    <input type="checkbox" name="UserID" value="{{list.id}}" title="{{list.GroupName}}" lay-skin="primary">
                {{/each}}
            </script>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function () {
            var id = GetString("id");

            layui.use(["form"], function () {
                $ = layui.jquery;
                var form = layui.form;
                //告警级别
                list.info('GetAlarmLevelListKey', {
                    token: token,
                    ComboBox: 'all'
                }, function (res) {
                    var level = '<option value="">请选择</option>';
                    if (res.data.length != 0) {
                        $.each(res.data, function (n, val) {
                            level += `<option value="` + val.id + `">` + val.LevelName + `</option>`;
                        })
                    }
                    $("#AlarmLevel").html(level);
                    form.render();
                })
                //告警模式
                dcimNewApi.filter('/dcim-alarmnotifywindow', {}, 500, 1, function (res) {
                    var modeHtml = '<option value="__keep__">原值</option><option value="0">全时段告警</option>';
                    var notifyRows = [];
                    if (res && $.isArray(res.data)) {
                        notifyRows = res.data;
                    } else if (res && res.data && $.isArray(res.data.info)) {
                        notifyRows = res.data.info;
                    }
                    if (notifyRows.length != 0) {
                        $.each(notifyRows, function (n, val) {
                            modeHtml += `<option value="` + val.id + `">` + val.WindowName + `</option>`;
                        })
                    }
                    $("#NotifyWindowID").html(modeHtml);
                    form.render("select");
                })
                //用户
                // list.info("GetEmpListKey", {
                //用户组
                list.info("GetPersonGroupListKey", {
                    token: token,
                    ComboBox: 'all'
                }, function (res) {
                    newPerson={
                        // data:res.data.filter(v=>v.role_name!='门禁权限组')
                        data:res.data
                    }
                    var user = template("usertemplate", newPerson);
                    $("#ulist,#uplist").html(user);
                    form.render();
                });

                //监听提交
                form.on("submit(submit)", function (data) {
                    var UserID = [];
                    var UpgradeUser = [];
                    $.each($("#ulist input[name=UserID]"), function (n, val) {
                        if (val.checked == true) {
                            UserID.push($(val).val());
                        };
                    })
                    $.each($("#uplist input[name=UserID]"), function (n, val) {
                        if (val.checked == true) {
                            UpgradeUser.push($(val).val());
                        };
                    })
                    var strformData = {
                        token: token,
                        id: id,
                        // PhoneNotify: data.field.PhoneNotify == 'on' ? 1 : 0,
                        // SMSNotify: data.field.SMSNotify == 'on' ? 1 : 0,
                        // EmailNotify: data.field.EmailNotify == 'on' ? 1 : 0,
                        // NoiseNotify: data.field.NoiseNotify == 'on' ? 1 : 0,
                        // WeixinNotify: data.field.WeixinNotify == 'on' ? 1 : 0,
                        // WeComNotify: data.field.WeComNotify == 'on' ? 1 : 0,
                        // DingdingNotify: data.field.DingdingNotify == 'on' ? 1 : 0,
                        // UserID: UserID.toString(),
                        // ConfirmNum: data.field.ConfirmNum,
                        // NotifyNum: data.field.NotifyNum,
                        // IntervalTime: data.field.IntervalTime,
                        // AlarmLevel: data.field.AlarmLevel,
                        // UpgradeTime: data.field.UpgradeTime,
                        // UpgradeUser: UpgradeUser.toString(),
                        // AlarmUpLimit: data.field.AlarmUpLimit,
                        // AlarmDownLimit: data.field.AlarmDownLimit,
                        // AlarmValue: data.field.AlarmValue,
                    }
                    if (data.field.AlarmUpLimit) strformData.AlarmUpLimit = data.field.AlarmUpLimit;
                    if (data.field.AlarmDownLimit) strformData.AlarmDownLimit = data.field.AlarmDownLimit;
                    if (data.field.AlarmValue) strformData.AlarmValue = data.field.AlarmValue;
                    if (data.field.PhoneNotify) strformData.PhoneNotify = data.field.PhoneNotify == 'on' ? 1 : 0;
                    if (data.field.SMSNotify) strformData.SMSNotify = data.field.SMSNotify == 'on' ? 1 : 0;
                    if (data.field.EmailNotify) strformData.EmailNotify = data.field.EmailNotify == 'on' ? 1 : 0;
                    if (data.field.NoiseNotify) strformData.NoiseNotify = data.field.NoiseNotify == 'on' ? 1 : 0;
                    if (data.field.WeixinNotify) strformData.WeixinNotify = data.field.WeixinNotify == 'on' ? 1 : 0;
                    if (data.field.WeComNotify) strformData.WeComNotify = data.field.WeComNotify == 'on' ? 1 : 0;
                    if (data.field.DingdingNotify) strformData.DingdingNotify = data.field.DingdingNotify == 'on' ? 1 : 0;
                    if (UserID.length != 0) strformData.UserID = UserID.toString();
                    if (data.field.ConfirmNum) strformData.ConfirmNum = data.field.ConfirmNum;
                    if (data.field.NotifyNum) strformData.NotifyNum = data.field.NotifyNum;
                    if (data.field.IntervalTime) strformData.IntervalTime = data.field.IntervalTime;
                    if (data.field.AlarmLevel) strformData.AlarmLevel = data.field.AlarmLevel;
                    if (data.field.NotifyWindowID !== undefined && data.field.NotifyWindowID !== "__keep__") {
                        strformData.NotifyWindowID = data.field.NotifyWindowID;
                    }
                    if (data.field.UpgradeTime) strformData.UpgradeTime = data.field.UpgradeTime;
                    if (UpgradeUser.length != 0) strformData.UpgradeUser = UpgradeUser.toString();
                    if (data.field.Linkage) strformData.Linkage = data.field.Linkage;
                    if (data.field.CancelLinkage) strformData.CancelLinkage = data.field.CancelLinkage;
                    if (data.field.LinkVideoChannel) strformData.LinkVideoChannel = data.field.LinkVideoChannel;
                    // console.log(strformData)
                    list.info("ChangeAlarmTypeKey", strformData, function (r) {
                        backToparent("已修改！");
                    });
                })
            });

        })
    </script>
</body>

</html>
