<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <select id="ServerCode" name="ServerCode" lay-filter="ServerCode">
                                    <option value="">请选择服务器</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <select id="AreaId" name="AreaId" lay-filter="AreaId">
                                    <option value="">请选择区域</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <select id="DeptId" name="DeptId" lay-filter="DeptId">
                                    <option value="">请选择管理部门</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <select id="EmpId" name="EmpId" lay-filter="EmpId">
                                    <option value="">请选择管理人员</option>
                                </select>
                            </div>
                        </form>
                    </div>
                    <div class="layui-card-body">
                        <table class="layui-table">
                            <thead>
                                <tr>
                                    <th>编号</th>
                                    <th>资产编号</th>
                                    <th>资产类型</th>
                                    <th>型号</th>
                                    <th>管理部门</th>
                                    <th>管理人员</th>
                                    <th>资产描述</th>
                                    <th>安装位置</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.info.length!=0}} {{each data.info as list i}}
                                    <tr> 
                                        <td>{{(data.page.p-1)*15+(i+1)}}</td>
                                        <td><input class="layui-input" type="text" name="AssetsNumber{{list.id}}" value="{{list.AssetsNumber}}"/></td>
                                        <td>{{list.AssetsTypeName}}</td>
                                        <td>{{list.BrandModel}}</td>
                                        <td>{{list.DeptName}}</td>
                                        <td>{{list.PersonName}}</td>
                                        <td><input class="layui-input" type="text" name="AssetsDescribe{{list.id}}" value="{{list.AssetsDescribe}}"/></td>
                                        <td><input class="layui-input" id="{{list.id}}" type="text" name="ULocation" value=""/></td>
                                        <td>
                                            <a title="安装" data-id="{{list.id}}" data-assetsid="{{list.AssetsId}}" onclick="chooseOne(this)"  href="javascript:;">
                                                <i class="layui-icon">&#xe656;</i>
                                            </a>
                                            <a title="私有属性" onclick="xadmin.open('私有属性','asset-private-add.html','','','{{list.AssetsId}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe716;</i>
                                            </a>
                                        </td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        //请求地址
        var url = "GetAssetsPutoutListKey";
        var form;
        $(function(){
            layui.use(["form","tree"], function () {
                $ = layui.jquery;
                form = layui.form;
                var ServerCode,AreaId,DeptId;
                //服务器
                getServer(form,function(r){
                    //继成上个接口
                    layuiSelected("ServerCode", r.data[0].ServerName);
                    ServerCode=r.data[0].id;
                    form.on("select(ServerCode)", function (data) {
                        param.ComboBox = 'all';
                        getArea(form,data);
                    });
                    param.ComboBox = 'all';
                    getArea(form,{value:ServerCode},function(){
                        AreaId=r.data[0].id;
                        form.on("select(AreaId)", function (data) {
                            param.ComboBox = 'all';
                            getDept(form,data);
                        });
                        param.ComboBox = 'all';
                        getDept(form,{value:AreaId},function(){
                            DeptId=r.data[0].id;
                            form.on("select(DeptId)",function(data){
                                param.ComboBox = 'all';
                                getEmp(form,data);
                            });
                        });
                    });
                });
                 //初始化数据
                param.PutoutWay='O';
                param.PutoutStatus='false';
                delete(param['ComboBox']);
                list.get(url,param);
                //监听提交
                form.on("submit(search)", function (data) {
                    param.pageNo = 1;
                    delete(param['ComboBox']);
                    delete(param['DeptId']);
                    list.get(url,param)
                    return false;
                });    
            });
        })
        //分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            delete(param['ComboBox']);
            list.get(url, param);
        }
        //选择
        function chooseOne(obj){
            if(!$('#AreaId').val()){
                layer.msg('请选择安装区域', {
					icon: 5,
					time: 1000
				});
                return false;
            }
            if(!$('#'+$(obj).data('id')).val()){
                layer.msg('请填写安装位置', {
					icon: 5,
					time: 1000
				});
                return false;
            }
            layer.confirm('确认安装此资产？', function (index) {
                list.info('CreateInstallAssetsKey',{
                    token:token,
                    AssetsDescribe:$('input[name=AssetsDescribe'+$(obj).data('id')+']').val(),
                    AssetsNumber:$('input[name=AssetsNumber'+$(obj).data('id')+']').val(),
                    ServerCode:$('#ServerCode').val(),
                    AreaId:$('#AreaId').val(),
                    AssetsId:$(obj).attr('data-assetsid'),
                    PutoutId:$(obj).attr('data-id'),
                    CabinetId:$('#CabinetId').val(),
                    InstallLocation:$('#'+$(obj).data('id')).val(),
                    EmpId:$('#EmpId').val()
                },function(r){
                    backToparent("已安装");
                })
            });
        }
    </script>
</body>
</html>
