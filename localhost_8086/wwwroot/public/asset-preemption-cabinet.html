<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" placeholder="请输入机柜名称" name="search">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="layui-card-body">
                        <table class="layui-table">
                            <thead>
                                <tr>
                                    <th>机柜列</th>
                                    <th>机柜</th>
                                    <th>空间使用率</th>
                                    <th>功率使用率</th>
                                    <th>承重使用率</th>
                                    <th>电源插口使用率</th>
                                    <th>网口使用率</th>
                                    <th>光口使用率</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.length!=0}} {{each data as list i}}
                                    <tr>
                                        <td>{{list.column}}</td>
                                        <td>{{list.position}}</td>
                                        <td>{{list.ratespace}}%</td>
                                        <td>{{list.ratepower}}%</td>
                                        <td>{{list.rateweight}}%</td>
                                        <td>{{list.ratejackprot}}%</td>
                                        <td>{{list.ratenetworkprot}}%</td>
                                        <td>{{list.ratesmoothprot}}%</td>
                                        <td>
                                            <a title="预占" onclick="chooseOne(this)" data-id="{{list.id}}" data-position="{{list.position}}" href="javascript:;">
                                                <i class="layui-icon">&#xe61f;</i>
                                            </a>
                                        </td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        //请求地址
        var url = "GetSearchCabinetListKey";
        var senddata=parent.formdata;
        $(function(){
            var AreaId = GetString('id');
            
            //初始化数据
            param.AreaId=senddata.get('AreaId');
            param.uNumber=senddata.get('PreNumber');
            param.power=senddata.get('PrePower');
            param.weight=senddata.get('PreWeight');
            param.JackPort=senddata.get('PreJackPort');
            param.SmoothPort=senddata.get('PreSmoothPort');
            param.NetworkPort=senddata.get('PreNetworkPort');
            param.CapacityModelId=senddata.get('PreCapacityModelId');
            list.info(url,param,function(r){
                $.each(r.data,function(n,val){
                    val.ratespace=val.UsedU==0?0:(val.UsedU/val.RatedU)*100;
                    val.ratepower=val.UsedPower==0?0:(val.UsedPower/val.RatedPower)*100;
                    val.rateweight=val.UsedWeight==0?0:(val.UsedWeight/val.RatedWeight)*100;
                    val.ratejackprot=val.UsedJackPort==0?0:(val.UsedJackPort/val.RatedJackPort)*100;
                    val.ratenetworkprot=val.UsedNetworkPort==0?0:(val.UsedNetworkPort/val.RatedNetworkPort)*100;
                    val.ratesmoothprot=val.UsedSmoothPort==0?0:(val.UsedSmoothPort/val.RatedSmoothPort)*100;
                })
                var lists = template("listtemplate", r);
                $("tbody").html(lists);
            });
        })
        //选择
        function chooseOne(obj){
            var index = parent.layer.getFrameIndex(window.name);
            parent.layer.close(index);
            $(window.parent.document).find('#position').val($(obj).attr('data-position'));
            $(window.parent.document).find('#PreCabinetId').val($(obj).attr('data-id'));
            parent.getU();
        }
    </script>
</body>
</html>
