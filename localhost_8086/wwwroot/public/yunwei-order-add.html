<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <div class="layui-form-item">
                    <label class="layui-form-label">工单名称<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="OrderName" value="" name="OrderName" lay-verify="required"
                            autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">工单描述</label>
                    <div class="layui-input-block">
                        <textarea name="OrderDescript" id="OrderDescript" class="layui-textarea"
                            placeholder="请输入"></textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        故障类型<span class="x-red">*</span>
                    </label>
                    <div class="layui-input-inline">
                        <select id="FaultTypeId" name=" FaultTypeId" lay-verify="required" lay-filter="FaultTypeId">
                            <option value="">请选择故障类型</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        故障子类型<span class="x-red">*</span>
                    </label>
                    <div class="layui-input-inline">
                        <select id="FaultSubTypeLsh" name="FaultSubTypeLsh" lay-verify="required"
                            lay-filter="ServerCode">
                            <option value="">请选择故障子类型</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">执行人<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="PersonName" value="" name="PersonName" lay-verify="required"
                            autocomplete="off" class="layui-input" readonly>
                        <input type="hidden" id="EmpId" value="" name="EmpId" lay-verify="required" autocomplete="off"
                            class="layui-input" readonly>
                    </div>
                    <div class="layui-form-mid layui-word-aux">
                        <a class="layui-btn" onclick="xadmin.open('选择人员','choose-person.html?type=person')">选择</a>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        SLA服务等级<span class="x-red">*</span>
                    </label>
                    <div class="layui-input-inline">
                        <select id="SLA" name="SLA" lay-verify="required" lay-filter="ServerCode">
                            <option value="5">紧急</option>
                            <option value="4">严重</option>
                            <option value="3">重要</option>
                            <option value="2">次要</option>
                            <option value="1">一般</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        完成截止时间<span class="x-red">*</span>
                    </label>
                    <div class="layui-input-inline">
                        <input type="text" id="CompleteEndDate" value="" name="CompleteEndDate" autocomplete="off"
                            class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">启用通知</label>
                    <div style="line-height:38px">
                        <input type="checkbox" id="OrderNotice" name="OrderNotice" value="启用" title=""
                            lay-filter="OrderNotice" lay-skin="switch" lay-text="ON|OFF" checked>
                    </div>
                </div>
                <div id="showFlag">
                    <div class="layui-form-item">
                        <label class="layui-form-label">通知方式<span class="x-red">*</span></label>
                        <div>
                            <input type="checkbox" value="2" title="短信" id="NoticeWay" name="NoticeWay" checked>
                            <input type="checkbox" value="3" title="邮件" id="NoticeWay" name="NoticeWay">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">通知人员<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="NoticeEmpName" value="" name="NoticeEmpName" autocomplete="off"
                                class="layui-input" readonly>
                            <input type="hidden" id="NoticeEmpId" value="" name="NoticeEmpId" autocomplete="off"
                                class="layui-input" readonly>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" onclick="xadmin.open('选择人员','choose-person.html?type=orderadd')">选择</a>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function () {
            var name = decodeURI(GetString("name"));
            var eventId = GetString("id");
            if (name) $('#OrderName').val(name);
            layui.use(["form"], function () {
                $ = layui.jquery;
                var form = layui.form;
                var laydate = layui.laydate;
                laydate.render({
                    elem: '#CompleteEndDate', //指定元素
                    type: 'datetime'
                });
                $("#OrderNotice").removeAttr('checked');
                $('#showFlag').hide();
                form.render();
                param.ComboBox = "all";
                list.info("GetFaultTypeListKey", param, function (res) {
                    var html = "<option value=''>请选择故障类型</option>";
                    $.each(res.data, function (n, val) {
                        html += "<option value=\"" + val.id + "\">" + val.FaultTypeName + "</option>";
                    });
                    $("#FaultTypeId").html(html);
                    form.render("select");
                    form.on("switch(OrderNotice)", function (data) {
                        var strformData = new FormData($("#formNow")[0]);
                        if (data.elem.checked) {
                            $('#showFlag').show();
                            $('#NoticeEmpName').attr("lay-verify", 'required')
                        } else {
                            $('#showFlag').hide();
                            $('#NoticeEmpName').removeAttr('lay-verify')
                        }
                    });
                    form.on("select(FaultTypeId)", function (data) {
                        param.FaultTypeId = data.value;
                        list.info("GetFaultSubTypeListKey", param, function (res) {
                            var subhtml = "<option value=''>请选择故障子类型</option>";
                            $.each(res.data, function (n, val) {
                                subhtml += "<option value=\"" + val.id + "\">" + val.FaultSubTypeName + "</option>";
                            });
                            $("#FaultSubTypeLsh").html(subhtml);
                            form.render("select");
                        });
                    });
                });

                //监听提交
                form.on("submit(submit)", function (data) {
                    var strformData = new FormData($("#formNow")[0]);
                    var NoticeEmpId = strformData.get("NoticeEmpId");
                    var OrderNotice = strformData.get("OrderNotice");
                    strformData.delete("OrderNotice");
                    strformData.append("token", token);
                    strformData.append("OrderNotice", OrderNotice == 'on' ? 1 : 0);
                    if (OrderNotice == null) {
                        strformData.delete("NoticeEmpName");
                        strformData.delete("NoticeEmpId");
                    }
                    if (eventId) strformData.append("alarmid", eventId);//工单id与告警id绑定
                    console.log('strformData.get("NoticeEmpId")', strformData.get("OrderNotice"))
                    list.form("CreateWorkOrderKey", strformData, function (res) {
                        if (NoticeEmpId) {
                            list.info("GetEmpDetailKey", {
                                token: token,
                                id: NoticeEmpId
                            }, function (r) {
                                var arr_box = [];
                                var arr_box2 = [];
                                $('input[name=NoticeWay]:checked').each(function () {
                                    arr_box.push($(this).val());
                                    if ($(this).val() == '2') {
                                        arr_box2.push(r.data.PersonPhone)
                                    }
                                    if ($(this).val() == '3') {
                                        arr_box2.push(r.data.email)
                                    }
                                });
                                if (arr_box.length == 0) {
                                    layer.msg('通知方式不能为空', {
                                        icon: 5,
                                        time: 1000
                                    });
                                    return;
                                }
                                var obj = {
                                    'NotifyUserID': NoticeEmpId,
                                    'NotifyType': arr_box.toString(),
                                    'NotifyAddr': arr_box2.toString(),
                                    'AreaId': r.data.AreaId,
                                    'token': token,
                                    'NotifyContent': `你有新的工单待处理，工单编号：${res.data.OrderNumber}，工单内容：${res.data.OrderName}`
                                }
                                list.info("CreateAlarmNotifyKey", obj, function () {
                                    backToparent("添加成功");
                                });
                            })
                        } else {
                            backToparent("添加成功");
                        }

                    });
                })
            });
        })
    </script>
</body>

</html>
