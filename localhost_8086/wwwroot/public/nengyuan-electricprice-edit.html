<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <script type="text/html" id="detail">
                <div class="layui-form-item">
                    <label class="layui-form-label">峰段时间段</label>
                    <div class="layui-input-inline">
                        <input type="text" id="HighTime" value="{{data.HighTime}}" name="HighTime" autocomplete="off"
                            class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">平段时间段</label>
                    <div class="layui-input-inline">
                        <input type="text" id="FlatTime" value="{{data.FlatTime}}" name="FlatTime" autocomplete="off"
                            class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">谷段时间段</label>
                    <div class="layui-input-inline">
                        <input type="text" id="LowTime" value="{{data.LowTime}}" name="LowTime" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">峰段电价</label>
                    <div class="layui-input-inline">
                        <input type="text" id="HighPrice" value="{{data.HighPrice}}" name="HighPrice" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">平段电价</label>
                    <div class="layui-input-inline">
                        <input type="text" id="FlatPrice" value="{{data.FlatPrice}}" name="FlatPrice" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">谷段电价</label>
                    <div class="layui-input-inline">
                        <input type="text" id="LowPrice" value="{{data.LowPrice}}" name="LowPrice" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
                </script>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
         $(function () {
            var id = GetString("id");

            //获取详情
            list.info("GetElectricPriceDetailKey", {
                token: token,
                id: id
            }, function (r) {
                var html = template("detail", r);
                $("#formNow").html(html);
                layui.use(["form"], function () {
                    $ = layui.jquery;
                    var form = layui.form;
                    //监听提交
                    form.on("submit(submit)", function (data) {
                        var strformData = new FormData($("#formNow")[0]);
                        strformData.append("token", token);
                        strformData.append("id", id);
                        strformData.append("ServerCode", r.data.ServerCode);
                        strformData.append("AreaId", r.data.AreaId);
                        list.form("ChangeElectricPriceKey", strformData, function (r) {
                            backToparent("修改成功");
                        });
                    });
                });
            });
        });
    </script>
</body>

</html>
