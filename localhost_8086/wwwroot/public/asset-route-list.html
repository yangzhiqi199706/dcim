<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>资产管理->其他业务->路由管理</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <!-- <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" placeholder="请输入区域名称" name="search">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form> -->
                        <button class="layui-btn x-right" onclick="xadmin.open('新增路由','asset-route-add.html')">
                            <i class="layui-icon"></i>新增路由
                        </button>
                    </div>
                    <div class="layui-card-body">
                        <table class="layui-table" id="view-route">
                            <thead>
                                <tr>
                                    <th colspan="8">A</th>
                                    <th colspan="8">B</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <thead>
                                <tr>
                                    <th>所属区域</th>
                                    <th>机柜列</th>
                                    <th>机柜</th>
                                    <th>占用U位</th>
                                    <th>资产类型</th>
                                    <th>型号</th>
                                    <!-- <th>端口类型</th>
                                    <th>端口编号</th> -->
                                    <th>资产编号</th>
                                    <th>资产描述</th>
                                    <th>所属区域</th>
                                    <th>机柜列</th>
                                    <th>机柜</th>
                                    <th>占用U位</th>
                                    <th>资产类型</th>
                                    <th>型号</th>
                                    <!-- <th>端口类型</th>
                                    <th>端口编号</th> -->
                                    <th>资产编号</th>
                                    <th>资产描述</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.info.length!=0}} {{each data.info as list i}}
                                    <tr>
                                        <td>{{list.AreaName}}</td>
                                        <td>{{list.column}}</td>
                                        <td>{{list.position}}</td>
                                        <td>{{list.ULocation}}</td>
                                        <td>{{list.AssetsTypeName}}</td>
                                        <td>{{list.BrandModel}}</td>
                                        <td>{{list.AssetsNumber}}</td>
                                        <td>{{list.AssetsDescribe}}</td>
                                        <td>{{list.bAreaName}}</td>
                                        <td>{{list.bcolumn}}</td>
                                        <td>{{list.bposition}}</td>
                                        <td>{{list.bULocation}}</td>
                                        <td>{{list.bAssetsTypeName}}</td>
                                        <td>{{list.bBrandModel}}</td>
                                        <td>{{list.bAssetsNumber}}</td>
                                        <td>{{list.bAssetsDescribe}}</td>
                                        <td>
                                            <a title="编辑" onclick="xadmin.open('编辑','asset-route-edit.html','','','{{list.id}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe642;</i>
                                            </a>
                                            <a title="删除" onclick="x_admin_del('确认删除吗？','DelRouteKey','{{list.id}}',this)" href="javascript:;">
                                                <i class="layui-icon">&#xe640;</i>
                                            </a>
                                        </td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        //请求地址
        var url = "GetRouteListKey";
        $(function(){
            list.get(url, param);
            layui.use(["form",'laydate'], function () {
                $ = layui.jquery;
                var form = layui.form;
                //监听提交
                form.on("submit(search)", function (data) {
                    param.pageNo = 1;
                    param.search = data.field.search;
                    list.get(url, param);
                    return false;
                });
            });
        });
        //分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            list.get(url, param);
        }
    </script>
</body>
</html>
