<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                
                <div class="layui-form-item">
                    <label class="layui-form-label">供应商名称<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="SupplierName" value="" name="SupplierName" lay-verify="required" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">注册地址及电话</label>
                    <div class="layui-input-inline">
                        <input type="text" id="SupplierAddress" value="" name="SupplierAddress" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">开户行及账号</label>
                    <div class="layui-input-inline">
                        <input type="text" id="BankAccount" value="" name="BankAccount" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">联系人及电话1</label>
                    <div class="layui-input-inline">
                        <input type="text" id="phone1" value="" name="phone1" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">联系人及电话2</label>
                    <div class="layui-input-inline">
                        <input type="text" id="phone2" value="" name="phone2" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">联系人及电话3</label>
                    <div class="layui-input-inline">
                        <input type="text" id="phone3" value="" name="phone3" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">开户许可证</label>
                    <div class="layui-input-inline">
                        <input type="text" id="FileImg" autocomplete="off" class="layui-input" readonly>
                        <input id="BaseImg" type="hidden" value="" name="SupplierLicence" >
                    </div>
                    <a class="layui-btn">
                        <input type="file" class="layui-btn" onchange="uploadImg(this)" accept="image/*" value="">
                        选择文件
                    </a>
                    <a class="layui-btn-warm layui-btn fancybox-view" href="" id="ViewImg">预览
                        <img src="" alt="">
                    </a>
                    <a class="layui-btn-danger layui-btn" id="CleanImg" onclick="CleanImg(this)">清空</a>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">企业证件照</label>
                    <div class="layui-input-inline">
                        <input type="text" id="FileImg" autocomplete="off" class="layui-input" readonly>
                        <input id="BaseImg" type="hidden" value="" name="SupplierPhoto" >
                    </div>
                    <a class="layui-btn">
                        <input type="file" class="layui-btn" onchange="uploadImg(this)" accept="image/*" value="">
                        选择文件
                    </a>
                    <a class="layui-btn-warm layui-btn fancybox-view" href="" id="ViewImg">预览
                        <img src="" alt="">
                    </a>
                    <a class="layui-btn-danger layui-btn" id="CleanImg" onclick="CleanImg(this)">清空</a>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function(){

            $('#ViewImg,#CleanImg').hide();
            
            layui.use(["form"], function () {
                $ = layui.jquery;
                var form = layui.form;
                 //监听提交
				form.on("submit(submit)", function (data) {
                    var strformData = new FormData($("#formNow")[0]);
                    strformData.append("token", token);
                    list.form("CreateSupplierKey", strformData, function (r) {
                        backToparent("添加成功");
                    });
                });
            });
        });
        
    </script>
</body>

</html>
