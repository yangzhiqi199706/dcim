<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <select id="TenantId" name="TenantId" lay-filter="TenantId">
                                    <option value="">请选择租户</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <select id="ServerCode" name="ServerCode" lay-filter="ServerCode">
                                    <option value="">请选择服务器</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <select id="AreaId" name="AreaId" lay-filter="AreaId">
                                    <option value="">请选择区域</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <select id="column" name="column" lay-filter="column">
                                    <option value="">请选择机柜列</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <select id="CabinetId" name="CabinetId" lay-filter="CabinetId">
                                    <option value="">请选择机柜</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="layui-card-body">
                        <table class="layui-table">
                            <thead>
                                <tr>
                                    <th>编号</th>
                                    <th>服务器</th>
                                    <th>区域</th>
                                    <th>机柜列</th>
                                    <th>机柜</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.info.length!=0}} {{each data.info as list i}}
                                    <tr>
                                        <td>{{(data.page.p-1)*15+(i+1)}}</td>
                                        <td>{{list.ServerName}}</td>
                                        <td>{{list.AreaName}}</td>
                                        <td>{{list.column}}</td>
                                        <td>{{list.position}}</td>
                                        <td>
                                            <a title="租用" onclick="$('#TenantId').val()?xadmin.open('租用','asset-tenantulocation-add.html','','','{{list.id}}&tenantid='+$('#TenantId').val()):layer.msg('请选择租户', {
                                                icon: 5,
                                                time: 1000
                                            });" href="javascript:;">
                                                <i class="layui-icon">&#xe609;</i>
                                            </a>
                                        </td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        $(function(){
            //请求地址
            var url = "GetCabinetListKey";
            //初始化数据
            list.get(url, param);
            layui.use("form", function () {
                $ = layui.jquery;
                var form = layui.form;
                //服务器
                getServer(form,function(){
                    form.on("select(ServerCode)", function (data) {
                        $("#AreaId,#column,#CabinetId").val('');
                        getArea(form,data);
                        form.on("select(AreaId)", function (rdata) {
                            $("#column,#CabinetId").val('');
                            getColumn(form,rdata);
                            form.on("select(column)", function (redata) {
                                $("#CabinetId").val('');
                                getCabinet(form,redata);
                            });
                        });
                    });
                });
                list.info('GetTenantListKey',param,function(res){
                    var tenanthtml = "";
                    $.each(res.data, function (n, val) {
                        tenanthtml += "<option value=\"" + val.id + "\">" + val.TenantName + "</option>";
                    });
                    $("#TenantId").append(tenanthtml);
                    form.render("select");
                })
                //监听提交
                form.on("submit(search)", function (data) {
                    delete(param['ComboBox']);
                    param.pageNo = 1;
                    param.ServerCode = data.field.ServerCode;
                    param.AreaId = data.field.AreaId;
                    param.column = data.field.column;
                    param.CabinetId = data.field.CabinetId;
                    list.get(url, param);
                    return false;
                });
            });
        })
        //分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            list.get(url, param);
        }
    </script>
</body>

</html>
