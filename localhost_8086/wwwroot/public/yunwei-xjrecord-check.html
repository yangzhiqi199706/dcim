<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <script language="javascript" src="js/echarts.js"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <a class="layui-btn" href="javascript:;"
                            onclick="location.href='yunwei-xjrecord-check.html?id='+GetString('id')">
                            巡检总览
                        </a>
                        <a class="layui-btn layui-btn-primary" href="javascript:;"
                            onclick="location.href='yunwei-xjrecord-checkdetail.html?id='+GetString('id')">
                            巡检详情
                        </a>
                    </div>
                    <div class="layui-card-body" id="formNow">
                        <script type="text/html" id="detail">
                        <table class="layui-table" style="width:50%;float:left">
                            <tbody>
                                <tr>
                                    <td>巡检任务编号</td>
                                    <td>{{data.XJTaskNumber}}</td>
                                </tr>
                                <tr>
                                    <td>巡检任务名称</td>
                                    <td>{{data.XJTaskName}}</td>
                                </tr>
                                <tr>
                                    <td>巡检任务描述</td>
                                    <td>{{data.XJDescribe}}</td>
                                </tr>
                                <tr>
                                    <td>发起人</td>
                                    <td>{{data.CreateEmpName}}</td>
                                </tr>
                                <tr>
                                    <td>巡检人</td>
                                    <td>{{data.XJEmpName}}</td>
                                </tr>
                                <tr>
                                    <td>创建时间</td>
                                    <td>{{data.create_time}}</td>
                                </tr>
                                <tr>
                                    <td>计划完成时间</td>
                                    <td>{{data.XJPlanComplateTime}}</td>
                                </tr>
                                <tr>
                                    <td>实际完成时间</td>
                                    <td>{{data.EndTime}}</td>
                                </tr>
                                <tr>
                                    <td>巡检正常数量</td>
                                    <td>{{data.zhengchang}}</td>
                                </tr>
                                <tr>
                                    <td>巡检异常数量</td>
                                    <td>{{data.yichang}}</td>
                                </tr>
                                <tr>
                                    <td>未巡检数量</td>
                                    <td>{{data.notdo}}</td>
                                </tr>
                                <tr>
                                    <td>分析结果</td>
                                    <td>{{data.AnalysisResult}}</td>
                                </tr>
                                <tr>
                                    <td>备注</td>
                                    <td>{{data.EndRemark}}</td>
                                </tr>
                            </tbody>
                        </table>
                        <div id="statusChart" style="width:45%;height:380px;float:right"></div>
                        </script>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function () {
            var id = GetString("id");
            //获取详情
            list.info("GetXJTaskDetailKey", {
                token: token,
                id: id
            }, function (r) {
                r.data.zhengchang = 0;
                r.data.yichang = 0;
                r.data.notdo = 0;
                list.info("GetXJTaskDetailParaKey", {
                    token: token,
                    TaskId: GetString("id")
                }, function (re) {
                    $.each(re.data, function (n, val) {
                        if (val.ParamStatus == '正常') {
                            r.data.zhengchang++;
                        }
                        if (val.ParamStatus == '异常') {
                            r.data.yichang++;
                        }
                        if (!val.ParamStatus) {
                            r.data.notdo++;
                        }
                    });
                    var TotalCount = re.data.length;
                    var html = template("detail", r);
                    $("#formNow").html(html);
                    var statusChartDom = document.getElementById('statusChart');
                    var statusChart = echarts.init(statusChartDom);
                    var zhengchangper = ((r.data.zhengchang / TotalCount) * 100).toFixed(2);
                    var weixunjianper = ((r.data.notdo / TotalCount) * 100).toFixed(2);
                    var yichangper = ((r.data.yichang / TotalCount) * 100).toFixed(2);
                    var pietitle = [
                        { 'name': '正常 ' + zhengchangper + '%', 'icon': 'circle' },
                        { 'name': '未巡检 ' + weixunjianper + '%', 'icon': 'circle' },
                        { 'name': '异常 ' + yichangper + '%', 'icon': 'circle' }
                    ];
                    var piedata = [
                        { 'value': r.data.zhengchang, 'name': '正常 ' + zhengchangper + '%' },
                        { 'value': r.data.notdo, 'name': '未巡检 ' + weixunjianper + '%' },
                        { 'value': r.data.yichang, 'name': '异常 ' + yichangper + '%' },
                    ];
                    var pieoption = {
                        legend: {
                            orient: 'vertical',
                            data: pietitle,
                            right: 0,
                            top: 55,
                            itemWidth: 6,
                            itemHeight: 6,
                            textStyle: {
                                color: '#A2CAE1',
                                fontSize: '11',
                                lineHeight: 15,
                            },
                        },
                        color: ['#3783FF', '#FFCA35', '#FF9100'],
                        series: [
                            {
                                name: '',
                                type: 'pie',
                                radius: ['65%', '90%'],
                                top: 25,
                                left: -80,
                                bottom: 0,
                                itemStyle: {
                                    shadowColor: 'rgba(225, 229, 255, 0.69)',
                                    shadowBlur: 16
                                }, label: {
                                    show: false,
                                    position: 'center',
                                    textStyle: {
                                        color: '#ffffff',
                                        fontSize: '14',
                                        lineHeight: 15
                                    },
                                },
                                emphasis: {
                                    label: {
                                        show: true,
                                        fontSize: '14.3',
                                        fontWeight: 'bold',
                                        formatter: '{b}',
                                    }
                                },
                                data: piedata
                            }
                        ]
                    };
                    pieoption && statusChart.setOption(pieoption);
                });
            });
        });
    </script>
</body>

</html>
