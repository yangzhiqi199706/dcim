<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <select id="ServerCode" name="ServerCode" lay-filter="ServerCode">
                                    <option value="">请选择</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <select id="AreaId" name="AreaId" lay-filter="AreaId">
                                    <option value="">请选择</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" placeholder="请输入连续U位数" name="Num">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                                <button class="layui-btn" lay-submit lay-filter="import" type="button"
                                    onclick="displayexport('down','ulist','可用连续U位数据')" id="down">导出</button>
                            </div>
                        </form>
                    </div>
                    <div class="layui-card-body">
                        <table class="layui-table" id="ulist">
                            <thead>
                                <tr>
                                    <th>所属服务器</th>
                                    <th>所属区域</th>
                                    <th>机柜</th>
                                    <th>机柜列</th>
                                    <th>连续数量</th>
                                    <th>可用数量</th>
                                    <th>可用U位</th>
                                </tr>
                            </thead>
                            <tbody id="list">
                                <script type="text/html" id="listtemplate">
                                {{if data.length!=0}} {{each data as list i}}
                                <tr>
                                    <td>{{list.ServerName}}</td>
                                    <td>{{list.AreaName}}</td>
                                    <td>{{list.column}}</td>
                                    <td>{{list.position}}</td>
                                    <td>{{list.Num}}</td>
                                    <td>{{list.NumCount}}</td>
                                    <td>{{list.ulist.join('，')}}</td>
                                </tr>
                                {{/each}} {{else}}
                                <tr>
                                    <td colspan="20" style="text-align: center">暂无相关数据</td>
                                </tr>
                                {{/if}}
                            </script>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        $(function () {
            layui.use(["form"], function () {
                $ = layui.jquery;
                var form = layui.form;
                //服务器
                getServer(form, function (r) {
                    form.on("select(ServerCode)", function (data) {
                        getArea(form, data);
                    });
                });

                //参数 获取机柜 获取每个机柜的未使用U位和预占位
                var dataparam = {
                    token: token,
                    ServerCode: '',
                    AreaId: '',
                    Num: '1',
                    ComboBox: 'all'
                }
                //统计
                GetData(dataparam);
                //监听提交
                form.on("submit(search)", function (data) {
                    dataparam.ServerCode = data.field.ServerCode;
                    dataparam.AreaId = data.field.AreaId;
                    dataparam.Num = data.field.Num || 1;
                    GetData(dataparam);
                    return false;
                });
            });
            //机柜 机柜U位数据处理
            function GetData(dataparam) {
                let Ulist = {
                    data: []
                };
                //获取机柜数量
                $.ajaxSettings.async = false;
                list.info('GetCabinetListKey', dataparam, function (r) {
                    if (r.data.length > 0) {
                        $.each(r.data, function (n, val) {
                            let CabinetId = val.id;
                            //获取U位信息 保留为空、预占位的U位
                            list.info('getCabinetUKey', {
                                token: token,
                                id: CabinetId
                            }, function (res) {
                                if (res.data.length > 0) {
                                    let UOne = {
                                        'ServerName': val.ServerName,
                                        'AreaName': val.AreaName,
                                        'column': val.column,
                                        'position': val.position,
                                        'Num': dataparam.Num,
                                        'ulist': []
                                    }
                                    $.each(res.data, function (m, y) {
                                        if (!y.UStatus || y.UStatus == '预占位') {
                                            UOne.ulist.push(parseInt(y.ULocation));
                                        }
                                        if (m == res.data.length - 1) {
                                            // 存储连续数的结果
                                            let arr = UOne.ulist;
                                            let key = dataparam.Num;
                                            let result = [];
                                            let temp = [];

                                            // 遍历数组
                                            for (let i = 0; i < arr.length; i++) {
                                                // 如果 temp 数组为空，或者当前数字与 temp 数组最后一个数字连续
                                                if (temp.length === 0 || arr[i] === temp[temp.length - 1] + 1) {
                                                    temp.push(arr[i]);
                                                } else {
                                                    // 如果 temp 数组长度大于等于 key，则保留
                                                    if (temp.length >= key) {
                                                        result = result.concat(temp);
                                                    }
                                                    temp = [arr[i]]; // 重置 temp 数组，开始新的连续段
                                                }
                                            }

                                            // 处理最后一个连续段
                                            if (temp.length >= key) {
                                                result = result.concat(temp);
                                            }

                                            // 输出结果
                                            // console.log(result);
                                            UOne.ulist = result;
                                        }
                                    })
                                    UOne.NumCount = Math.floor(UOne.ulist.length/dataparam.Num);
                                    Ulist.data.push(UOne);
                                }
                            })
                        })
                    }
                })
                $.ajaxSettings.async = true;
                var html = template("listtemplate", Ulist);
                $("#list").html(html);
            };
        })

    </script>
</body>

</html>
