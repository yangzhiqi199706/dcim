<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <script type="text/html" id="detail">
                    <div class="layui-form-item">
                        <label class="layui-form-label">备件编号<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="BackupsNumber" value="{{data.BackupsNumber}}" name="BackupsNumber" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">备件类型<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="AssetsTypeName" value="{{data.AssetsTypeName}}" lay-verify="required" autocomplete="off" class="layui-input" readonly>
                            <input type="hidden" id="AssetsTypeId" value="{{data.AssetsTypeId}}" name="AssetsTypeId" lay-verify="required" autocomplete="off" class="layui-input" readonly>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" onclick="xadmin.open('选择资产类型','choose-asset-typespar.html')">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">型号<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="BackupsModel" value="{{data.BackupsModel}}" name="BackupsModel" lay-verify="required" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">备件名称<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="BackupsName" value="{{data.BackupsName}}" name="BackupsName" lay-verify="required" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">厂商<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="BackupsCompany" value="{{data.BackupsCompany}}" name="BackupsCompany" autocomplete="off" lay-verify="required" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">规格<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="BackupsSpec" value="{{data.BackupsSpec}}" name="BackupsSpec" autocomplete="off" lay-verify="required" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">尺寸</label>
                        <div class="layui-input-inline">
                            <input type="text" id="BackupsSize" value="{{data.BackupsSize}}" name="BackupsSize" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">库存位置</label>
                        <div class="layui-input-inline">
                            <select id="StoreLocationId" name="BackupsStoreLocationId">
                                <option value="">请选择</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">管理部门</label>
                        <div class="layui-input-inline">
                            <input type="text" id="DeptName" value="{{data.DeptName}}" name="DeptName" autocomplete="off" class="layui-input" readonly>
                            <input type="hidden" id="DeptId" value="{{data.DeptId}}" name="DeptId" autocomplete="off" class="layui-input" readonly>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" onclick="xadmin.open('选择部门','choose-department.html?type=dept')">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">管理人员</label>
                        <div class="layui-input-inline">
                            <input type="text" id="PersonName" value="{{data.PersonName}}" name="PersonName"  autocomplete="off" class="layui-input" readonly>
                            <input type="hidden" id="EmpId" value="{{data.EmpId}}" name="EmpId" autocomplete="off" class="layui-input" readonly>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" onclick="xadmin.open('选择人员','choose-person.html?type=person&DeptId='+$('#DeptId').val())">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label"></label>
                        <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                    </div>
                </script>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function(){
            var id = GetString("id");
            //获取详情
            list.info("GetSparePartsDetailKey", {
                token: token,
                id: id
            }, function (r) {
                var html = template("detail", r);
                $("#formNow").html(html);
                layui.use(["form"], function () {
                    $ = layui.jquery;
                    var form = layui.form;
                    //仓库
                    getStoreLocation(form,'',function(){
                        //继成上个接口
                        layuiSelected("StoreLocationId", r.data.StoreLocationName);
                    });
                     //监听提交
				    form.on("submit(submit)", function (data) {
                        var strformData = new FormData($("#formNow")[0]);
                        strformData.append("token", token);
                        strformData.append("id", id);
                        list.form("ChangeSparePartsKey", strformData, function (r) {
                            backToparent("修改成功");
                        });
                    });
                });
            });
        });
    </script>
</body>
</html>
