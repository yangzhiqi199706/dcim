<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/echarts.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>能源管理->能效分析</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <select id="ServerCode" name="ServerCode" lay-filter="ServerCode">
                                    <option value="">请选择</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <select id="AreaId" name="AreaId" lay-filter="AreaId">
                                    <option value="">请选择</option>
                                </select>
                            </div>

                            <div class="layui-inline layui-show-xs-block">
                                <input type="radio" name="type" lay-filter="type" value="year" title="年" checked>
                                <input type="radio" name="type" lay-filter="type" value="month" title="月">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <input type="text" id="year" name="year" class="layui-input" placeholder="年">
                                <input type="text" id="month" name="month" class="layui-input" placeholder="年月"
                                    style="display:none;">
                            </div>

                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                                <button class="layui-btn" lay-submit lay-filter="import" type="button"
                                    onclick="displayexport('down','nengxiaotable','能效分析')" id="down">导出</button>
                            </div>
                        </form>
                    </div>
                    <div class="layui-card-body">
                        <div class="massage-box massage-box-md12">
                            <div class="capacity-statistics-title">能耗分析</div>
                            <div id="nenghaoChart" class="massage-chart"></div>
                        </div>
                        <div class="massage-box massage-box-md12">
                            <div class="capacity-statistics-title">PUE分析</div>
                            <div id="puelistChart" class="massage-chart"></div>
                        </div>
                        <div class="massage-box massage-box-md6">
                            <div class="capacity-statistics-title">PUE平均值</div>
                            <div id="pueChart" class="massage-chart"></div>
                        </div>
                        <div class="massage-box massage-box-md6">
                            <div class="capacity-statistics-title">统计</div>
                            <table class="layui-table" id="nengxiaotable">
                                <tbody>
                                    <tr>
                                        <td>总用电量</td>
                                        <td><span id="totalDN">0</span> Kw.h</td>
                                    </tr>
                                    <tr>
                                        <td>总能耗标煤折算值</td>
                                        <td><span id="totalM">0</span> kg</td>
                                    </tr>
                                    <tr>
                                        <td>总用电费用</td>
                                        <td><span id="totalDF">0</span> 元</td>
                                    </tr>
                                    <tr>
                                        <td>总CO2排量</td>
                                        <td><span id="totalCO2">0</span> kg</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        // list.info('/SetTimeVersion',{
        //     token:token
        // })
        var timetype = 'year';
        $(function () {
            var date = new Date();
            var year = date.getFullYear();
            var month = date.getMonth() + 1;
            var chartparam = {
                token: token,
                ServerCode: '',
                AreaId: '',
                Date: year
            }
            getdata(chartparam);
            layui.use(["form", "laydate"], function () {
                $ = layui.jquery;
                var form = layui.form;
                var laydate = layui.laydate;

                laydate.render({
                    elem: '#month',
                    type: 'month',
                    value: year + '-' + (month < 10 ? '0' + month : month)
                });
                laydate.render({
                    elem: '#year',
                    type: 'year',
                    value: year
                });
                form.render();
                //监听提交
                form.on("radio(type)", function (data) {
                    timetype = data.value;
                    if (data.value == 'year') {
                        $('#year').show();
                        $('#month').hide();
                    } else {
                        $('#year').hide();
                        $('#month').show();
                    }
                    return false;
                });
                //服务器
                getServer(form, function (r) {
                    form.on("select(ServerCode)", function (data) {
                        getArea(form, data);
                    });
                });
                //监听提交
                form.on("submit(search)", function (data) {
                    chartparam.ServerCode = data.field.ServerCode;
                    chartparam.AreaId = data.field.AreaId;
                    chartparam.Date = timetype == 'year' ? data.field.year : data.field.month;
                    getdata(chartparam);
                    return false;
                });
            });
        })
        function getdata(chartparam) {
            //能效分析
            list.info('GetNXFXInfoKey', chartparam, function (r) {
                var data = r.data || {};

                if (data.PUEList) {
                    var nenghaotitle = [];
                    var nenghaodata = [];
                    $.each(data.PUEList, function (n, val) {
                        nenghaotitle.push(val.time);
                        nenghaodata.push(val.value);
                    })
                    setNH('nenghaoChart', 'bar', nenghaotitle, nenghaodata, 'Kwh');
                }
                if (data.pue) {
                    var nenghaotitle = [];
                    var nenghaodata = [];
                    var totalPUE = 0;
                    var totalNum = 0;
                    $.each(data.pue, function (n, val) {
                        nenghaotitle.push(val.time);
                        var pueVal = Number(val.value);
                        nenghaodata.push(pueVal);
                        totalPUE += pueVal;
                        if (!isNaN(pueVal) && pueVal !== 0) totalNum += 1;
                    })
                    setNH('puelistChart', 'line', nenghaotitle, nenghaodata, '');
                    var avgPue = totalNum > 0 ? (totalPUE / totalNum) : 0;
                    setPue(avgPue.toFixed(2));
                } else {
                    setPue(0);
                }
                var totalNH = Number(data.TotalNH || 0);
                var totalDF = Number(data.TotalDF || 0);
                $('#totalDN').html(totalNH.toFixed(2));
                $('#totalDF').html(totalDF.toFixed(2));
                $('#totalM').html((totalNH * 0.4).toFixed(2));
                $('#totalCO2').html((totalDF * 0.997).toFixed(2));
            })
        }
        //pue
        function setPue(data) {
            var pueChartDom = document.getElementById('pueChart');
            var pueChart = echarts.init(pueChartDom);
            var pueChartoption = {
                series: [{
                    type: 'gauge',
                    min: 1,
                    max: 5,
                    splitNumber: 10,
                    startAngle: 180,
                    endAngle: 0,
                    radius: '132%',
                    center: ['50%', '75%'],
                    axisLine: {
                        lineStyle: {
                            color: [
                                [1, '#F4F8FB']
                            ],
                            width: 10
                        }
                    },
                    splitLine: {
                        show: false
                    },
                    axisTick: {
                        show: false
                    },
                    axisLabel: {
                        distance: -43,
                        color: '#A2CAE1',
                        fontSize: 12
                    },
                    progress: {
                        show: true,
                        overlap: true,
                        roundCap: true,
                        itemStyle: {
                            color: {
                                type: 'linear',
                                x: 0,
                                y: 0,
                                x2: 0,
                                y2: 1,
                                colorStops: [{
                                    offset: 0, color: '#68B9FF'
                                }, {
                                    offset: 1, color: '#3783FF'
                                }],
                                global: false
                            }
                        }
                    },
                    title: {
                        show: false
                    },
                    detail: {
                        color: '#FFF',
                        offsetCenter: ["0", "36"]
                    },
                    data: [{
                        value: data,
                    }]
                },
                {
                    type: 'gauge',
                    min: 1,
                    max: 3,
                    splitNumber: 6,
                    startAngle: 180,
                    endAngle: 0,
                    radius: '116%',
                    center: ['50%', '75%'],
                    axisLine: {
                        lineStyle: {
                            color: [
                                [1, '#68B9FF']
                            ],
                            width: 3
                        }
                    },
                    splitLine: {
                        distance: -3,
                        length: 10,
                        lineStyle: {
                            color: '#979797'
                        }
                    },
                    axisTick: {
                        show: false
                    },
                    axisLabel: {
                        show: false
                    },
                    pointer: {
                        show: false
                    },
                    title: {
                        show: false
                    },
                    data: [{
                        value: null,
                    }],
                    detail: {
                        color: 'transparent',
                    }
                }
                ]
            };
            pueChartoption && pueChart.setOption(pueChartoption);
        }

        //能耗
        function setNH(id, type, nenghaotitle, nenghaodata, unit) {
            var nenghaoChartDom = document.getElementById(id);
            var nenghaoChart = echarts.init(nenghaoChartDom);
            var nenghaoChartoption = {
                xAxis: {
                    type: 'category',
                    data: nenghaotitle,
                    axisLine: {
                        show: true,
                        lineStyle: {
                            type: 'solid',
                            color: '#1898ED',
                            width: '1'
                        }
                    },
                    axisLabel: {
                        interval: 0,
                        textStyle: {
                            color: '#A2CAE1',
                            fontSize: '13'
                        },
                        formatter: function(value) {
                            if (timetype=='year'){
                                let yearStr = $('#year').val();
                                return value + '月'; 
                            }else if(timetype=='month'){
                                let yearMonStr = $('#year').val()+'-'+$('#month').val();
                                return value + '日';
                            }
                        }
                    }
                },
                yAxis: {
                    type: 'value',
                    axisLabel: {
                        textStyle: {
                            color: '#A2CAE1',
                            fontSize: '13'
                        },
                        formatter: '{value}' + unit,
                    },
                    splitLine: {
                        lineStyle: {
                            color: 'rgba(24, 152, 237, 0.17)',
                            type: 'dashed'
                        }
                    },
                },
                grid: {
                    top: '25',
                    bottom: '50',
                    left: '120',
                    right: '20'
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    }
                },
                series: [{
                    data: nenghaodata,
                    label: {
                        show: true,
                        position: 'top',
                        color: '#fff',
                        formatter: function (val) {
                            if (val.value !== 0) {
                                return val.value;
                            } else {
                                return '';
                            }
                        },
                    },
                    type: type,
                    smooth: 0.6,
                    barWidth: 20,
                    showBackground: true,
                    backgroundStyle: {
                        color: 'rgba(180, 180, 180, 0.2)'
                    },
                }]
            };
            nenghaoChartoption && nenghaoChart.setOption(nenghaoChartoption);
        }

    </script>
</body>

</html>
