<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>资产管理->基础配置->U位设置->U位状态</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        
                    </div>
                    <div class="layui-card-body">
                        <div id="tree"></div>
                        <table class="layui-table layui-col-tree">
                            <thead>
                                <tr>
                                    <th>服务器</th>
                                    <th>区域</th>
                                    <th>机柜列</th>
                                    <th>机柜</th>
                                    <th>资产条ID</th>
                                    <th>U位</th>
                                    <th>U位状态</th>
                                    <th>U位标签</th>
                                    <th>在架资产</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.length!=0}} 
                                    {{each data as list i}}
                                        <tr>
                                            <td>{{list.ServerName}}</td>
                                            <td>{{list.AreaName}}</td>
                                            <td>{{list.column}}</td>
                                            <td>{{list.position}}</td>
                                            <th>{{list.UId}}</th>
                                            <td>{{list.ULocation}}</td>
                                            <td>{{list.UdeviceStatus}}</td>
                                            <td>{{list.UTag}}</td>
                                            <td>{{if list.AssetsId && list.AssetsId!=0}}{{list.AssetsTypeName}},资产编号:{{list.AssetsNumber}}{{/if}}</td>
                                        </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        $(function(){
            //初始化数据
            //服务器
            param.ComboBox = "all";
            list.info('GetServerListKey',param,function(r){
                var data=[];
                $.each(r.data,function(n,val){
                    var rnewdata={
                        title:val.ServerName,
                        id:val.id,
                        spread:false,
                        other:1,
                        children:[]
                    }
                    param.ServerCode=val.id;
                    list.info('GetAreaListKey',param,function(res){
                        //按pid排序
                        res.data.sort(function (a, b) {
                            if (parseInt(a.AreaParentId) < parseInt(b.AreaParentId)) {
                                return -1;
                            } else if (parseInt(a.AreaParentId) == parseInt(b.AreaParentId)) {
                                return 0;
                            } else {
                                return 1;
                            }
                        });
                        $.each(res.data,function(n,val){
                            if(val.AreaParentId==0){
                                var newdata={
                                    title:val.AreaName,
                                    id:val.id,
                                    spread:false,
                                    other:2,
                                    children:[]
                                }
                                rnewdata.children.push(newdata);
                            }else{
                                $.each(rnewdata.children,function(x,y){
                                    if(y.id==val.AreaParentId){
                                        y.children.push({
                                            title:val.AreaName,
                                            id:val.id,
                                            spread:false,
                                            other:3,
                                            children:[]
                                        })
                                    }else{
                                        if(y.children.length!=0){
                                            $.each(y.children,function(m,l){
                                                if(l.id==val.AreaParentId){
                                                    l.children.push({
                                                        title:val.AreaName,
                                                        id:val.id,
                                                        spread:false,
                                                        other:4
                                                    })
                                                }
                                            })
                                        }
                                    }
                                })
                            }
                        })
                    })
                    setTimeout(function(){
                        data.push(rnewdata);
                        //树形菜单
                        delete(param['ComboBox']);//去掉不分页参数
                        delete(param['ServerCode']);
                        layui.use(["form","tree"], function () {
                            $ = layui.jquery;
                            var form = layui.form;
                            var tree = layui.tree;
                            tree.render({
                                elem:"#tree",
                                data:data,
                                id: 'treeId',
                                click: function(obj){
                                    if(obj.data.other==3){
                                        $('.layui-tree-txt').removeAttr('style');
                                        $(obj.elem).find('.layui-tree-txt').css('color','#148cf1');
                                        param.AreaId=obj.data.id;
                                        list.info('GetUDeviceStateKey',param,dealList);
                                    }
                                }
                            });     
                        });
                        if(r.data.length==n+1){
                            list.info('GetUDeviceStateKey',param,dealList);
                        }
                    },500)
                })
            })
        })
        //处理列表渲染
        let totallist=[];
        function dealList(r){
            totallist=[];
            $.each(r.data,function(n,val){
                if(val.uinfo.length>0){
                    $.each(val.uinfo,function(x,y){
                        y.ServerName =val.ServerName;
                        y.AreaName =val.AreaName
                        y.column =val.column
                        y.position =val.position
                        y.UId =val.UId
                        switch(y.UdeviceStatus){
                            case '0':y.UdeviceStatus='上架';break;
                            case '1':y.UdeviceStatus='异常下架';break;
                            case '2':y.UdeviceStatus='预上架';break;
                            case '3':y.UdeviceStatus='预下架';break;
                            case '4':y.UdeviceStatus='未使用';break;
                        }
                        totallist.push(y);
                    })
                }
            })
            x_admin_page(totallist.length, param.pageSize, pagechange);
            let list = {
                data: totallist.slice(0, param.pageSize)
            }
            var lists = template("listtemplate", list);
            $('tbody').html(lists);
        }
        //分页回调
		function pagechange(curr) {
			let list = {
				data: totallist.slice(param.pageSize * (curr - 1), param.pageSize * curr)
			}
			var lists = template("listtemplate", list);
			$("tbody").html(lists);
		}
    </script>
</body>

</html>
