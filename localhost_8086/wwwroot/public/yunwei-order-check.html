<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <script type="text/html" id="detail">
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        执行人
                    </label>
                    <div class="layui-input-inline">
                        <input type="text" id="EmpId" value="{{if data.ZhuanExecuteEmpName}}{{data.ZhuanExecuteEmpName}}{{else}}{{data.EmpName}}{{/if}}" autocomplete="off"
                            class="layui-input" disabled>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        处理情况
                    </label>
                    <div class="layui-input-block">
                        <textarea id="DealSituation" class="layui-textarea" disabled>{{data.DealSituation}}</textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        审核结果<span class="x-red">*</span>
                    </label>
                    <div class="layui-input-inline">
                        <select id="CheckResult" name="CheckResult" lay-verify="required" lay-filter="CheckResult">
                            <option value="正常完成">正常完成</option>
                            <option value="延迟完成">延迟完成</option>
                            <option value="重新处理">重新处理</option>
                            <option value="终止">终止</option>
                        </select>
                    </div>
                </div>
                <!-- <div class="layui-form-item">
                    <label class="layui-form-label">启用通知</label>
                    <div>
                        <input type="checkbox" value="启用" title="" lay-skin="switch" lay-text="ON|OFF" checked>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">通知方式</label>
                    <div>
                        <input type="checkbox" value="" title="短信" id="NoticeWay" name="NoticeWay" checked>
                        <input type="checkbox" title="邮件" id="NoticeWay" name="NoticeWay">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        通知人员
                    </label>
                    <div class="layui-input-inline">
                        <input type="text" id="NeedName" value="用户1" name="NeedName" autocomplete="off"
                            class="layui-input">
                    </div>
                </div> -->
                <div>
                    <div class="layui-form-item">
                        <label class="layui-form-label"></label>
                        <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>

                    </div>
                </div>
            </script>
            </form>
        </div>
    </div>
    <script>
        $(function () {
            var id = GetString("id");
            //获取详情
            list.info("GetYWWorkOrderDetailKey", {
                token: token,
                id: id
            }, function (r) {
                var html = template("detail", r);
                $("#formNow").html(html);
                layui.use(["form"], function () {
                    $ = layui.jquery;
                    var form = layui.form;
                    form.render();
                    //监听提交
                    form.on("submit(submit)", function (data) {
                        var strformData = new FormData($("#formNow")[0]);
                        strformData.append("token", token);
                        strformData.append("Lsh", id);
                        list.form("CheckYWWorkOrderKey", strformData, function (r) {
                            backToparent("审核成功");
                        });
                    });
                });
            });
        })
    </script>
</body>

</html>
