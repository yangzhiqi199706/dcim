<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/public.dcimnew.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/jquery.qrcode.min.js" type="text/javascript" charset="utf-8"></script>
    <style>
        .layui-col-space15>* {
            padding: 0;
        }
    </style>
</head>

<body>

        <span class="layui-breadcrumb">

                <cite>动环监控->事件概览</cite>

    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <div class="two-left">
                            <form class="layui-form layui-col-md12">
                                <!-- <text>告警级别</text>
                                <select id="AlarmLevel" name="AlarmLevel" lay-filter="AlarmLevel">
                                </select> -->

                                <div style="margin-bottom: 10px;">
                                    <select id="ServerCode" name="ServerCode" lay-filter="ServerCode">
                                        <option value="">请选择服务器</option>
                                    </select>
                                </div>
                                <div style="margin-bottom: 10px;">
                                    <select id="AreaId" name="AreaId" lay-filter="AreaId">
                                        <option value="">请选择区域</option>
                                    </select>
                                </div>
                                <div style="margin-bottom: 10px;">
                                    <select id="ClassName" name="ClassName" lay-filter="ClassName">
                                        <option value="">请选择分类</option>
                                    </select>
                                </div>
                                <div style="margin-bottom: 10px;">
                                    <select id="AlarmLevel" name="AlarmLevel" lay-filter="AlarmLevel">
                                        <option value="">请选择告警级别</option>
                                    </select>
                                </div>
                                <!-- <div style="margin-bottom: 10px;">
                                    <select id="NotifyWindowID" name="NotifyWindowID" lay-filter="NotifyWindowID">
                                        <option value="">请选择告警模式</option>
                                    </select>
                                </div> -->
                                <input type="text" name="search" placeholder="请输入设备/事件名称" autocomplete="off"
                                    class="layui-input">
                                <div class="two-search">
                                    <button class="layui-btn" lay-submit lay-filter="search" type="button">搜索</button>
                                </div>
                            </form>
                            <form class="layui-form layui-col-md12">
                                <text>设备列表</text>
                                <div class="three-left" style="height: calc(100vh - 320px)">
                                    <ul>
                                        <script type="text/html" id="listdevicetemplate">
                                        {{if data.length!=0}}
                                            <li data-id="" data-name="" class="checkresult-li">1.全部设备</li>
                                        {{each data as list i}}
                                            <li data-id="{{list.id}}" data-name="{{list.DeviceName}}" class="checkresult-li">{{i+2}}.{{list.DeviceName}}</li>
                                        {{/each}}
                                        {{else}}
                                            暂无设备
                                        {{/if}}
                                    </script>
                                    </ul>
                                </div>
                            </form>
                        </div>
                    </div>
                    <div class="two-right">
                        <button class="layui-btn x-right" style="margin-bottom: 10px;" type="button"
                            onclick="x_admin_dealall(dealAll)">批量编辑</button>
                        <table class="layui-table layui-form">
                            <thead>
                                <tr>
                                    <th>
                                        <input type="checkbox" id="checkall" lay-filter="checkall" lay-skin="primary">
                                    </th>
                                    <th>操作</th>
                                    <th>事件ID</th>
                                    <th>事件名称</th>
                                    <th>设备名称</th>
                                    <th>告警上限</th>
                                    <th>告警下限</th>
                                    <th>告警特征值</th>
                                    <!-- <th>告警联动</th> -->
                                    <th>电话通知</th>
                                    <th>短信通知</th>
                                    <th>邮件通知</th>
                                    <th>声光通知</th>
                                    <th>微信通知</th>
                                    <th>企业微信通知</th>
                                    <th>钉钉通知</th>
                                    <th>告警用户组</th>
                                    <th>容错次数</th>
                                    <th>延时告警时间(秒)</th>
                                    <th>通知次数</th>
                                    <th>通知间隔(秒)</th>
                                    <th>告警级别</th>
                                    <th>告警模式</th>
                                    <th>升级条件(秒)</th>
                                    <th>升级用户组</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="24" style="text-align: center">请先选择</td>
                                </tr>
                            </tbody>
                            <script type="text/html" id="listtemplate">
                                {{if data.info.length!=0}} {{each data.info as list i}}
                                <tr>
                                    <td width="70">
                                        <input type="checkbox" value="{{list.id}}" name="id"  lay-filter="checkone" lay-skin="primary" data-param="{{list.DeviceName}}">
                                    </td>
                                    <td>
                                        <a title="编辑" onclick="xadmin.open('编辑','donghuan-event-edit.html','','','{{list.id}}')" href="javascript:;">
                                            <i class="layui-icon">&#xe642;</i>
                                        </a>
                                    </td>
                                    <td>{{list.id}}</td>
                                    <td>{{list.AlarmName}}</td>
                                    <td>{{list.DeviceName}}</td>
                                    <td>{{list.AlarmUpLimit}}</td>
                                    <td>{{list.AlarmDownLimit}}</td>
                                    <td>{{list.AlarmValue}}</td>
                                    <!-- <td>{{list.AlarmLinkage}}</td> -->
                                    <td>{{if list.PhoneNotify==1}}启用{{else}}禁用{{/if}}</td>
                                    <td>{{if list.SMSNotify==1}}启用{{else}}禁用{{/if}}</td>
                                    <td>{{if list.EmailNotify==1}}启用{{else}}禁用{{/if}}</td>
                                    <td>{{if list.NoiseNotify==1}}启用{{else}}禁用{{/if}}</td>
                                    <td>{{if list.WeixinNotify==1}}启用{{else}}禁用{{/if}}</td>
                                    <td>{{if list.WeComNotify==1}}启用{{else}}禁用{{/if}}</td>
                                    <td>{{if list.DingdingNotify==1}}启用{{else}}禁用{{/if}}</td>
                                    <td>{{list.PersonName}}</td>
                                    <td>{{list.ConfirmNum}}</td>
                                    <td>{{list.ConfirmNum*3}}</td>
                                    <td>{{list.NotifyNum}}</td>
                                    <td>{{list.IntervalTime}}</td>
                                    <td>{{list.LevelName}}</td>
                                    <td>{{list.NotifyWindowNameShow}}</td>
                                    <td>{{list.UpgradeTime}}</td>
                                    <td>{{list.UpgradeUserName}}</td>
                                </tr>
                                {{/each}} {{else}}
                                <tr>
                                    <td colspan="24" style="text-align: center">暂无相关数据</td>
                                </tr>
                                {{/if}}
                            </script>
                        </table>
                        <div id="bottomPaging"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!--    <script>-->
    <!--        var params= window.location.href.toString().split('?id=')[1]-->
    <!--        alert('id='+params)-->
    <!--    </script>-->
    <script>
        //请求地址
        var url = "GetAlarmTypeListKey";
        var DeviceListUrl = "GetDeviceListKey";
        var eventid = GetString('id');
        var form;
        var notifyWindowMap = {
            "0": "全时段告警",
            "": "全时段告警"
        };

        function applyNotifyWindowName(r) {
            if (!r || !r.data || !$.isArray(r.data.info)) return;
            $.each(r.data.info, function (n, row) {
                var key = (row.NotifyWindowID === undefined || row.NotifyWindowID === null || row.NotifyWindowID === "")
                    ? "0"
                    : (row.NotifyWindowID + "");
                row.NotifyWindowNameShow = row.NotifyWindowName || notifyWindowMap[key] || (key === "0" ? "全时段告警" : key);
            });
        }

        function renderEventTable(r) {
            applyNotifyWindowName(r);
            var html = template("listtemplate", r);
            $("table tbody").html(html);
            $('#checkall').prop('checked', false);
            checkall(form);
        }

        $(function () {
            layui.use(["form"], function () {
                $ = layui.jquery;
                form = layui.form;
                // param.ComboBox = 'all';
                param.pageSize = '50';
                //告警级别
                list.info('GetAlarmLevelListKey', {
                    token: token,
                    ComboBox: 'all'
                }, function (res) {
                    var level = '<option value="">请选择告警级别</option>';
                    if (res.data.length != 0) {
                        $.each(res.data, function (n, val) {
                            level += `<option value="` + val.id + `">` + val.LevelName + `</option>`;
                        })
                    }
                    $("#AlarmLevel").html(level);
                    form.render();
                })

                function loadNotifyWindowList() {
                    dcimNewApi.filter('/dcim-alarmnotifywindow', {}, 500, 1, function (res) {
                        var modeHtml = '<option value="">请选择告警模式</option><option value="0">全时段告警</option>';
                        var rows = [];
                        notifyWindowMap = {
                            "0": "全时段告警",
                            "": "全时段告警"
                        };
                        if (res && $.isArray(res.data)) {
                            rows = res.data;
                        } else if (res && res.data && $.isArray(res.data.info)) {
                            rows = res.data.info;
                        }
                        $.each(rows, function (n, val) {
                            var id = (val.id + "");
                            notifyWindowMap[id] = val.WindowName || id;
                            modeHtml += '<option value="' + id + '">' + (val.WindowName || id) + '</option>';
                        });
                        $("#NotifyWindowID").html(modeHtml);
                        form.render("select");
                    });
                }
                loadNotifyWindowList();

                if (eventid) param.DevId = eventid;

                getDevice();

                list.info("GetServerListKey", {
                    token: token,
                    ComboBox: 'all'
                }, function (res) {
                    var serverhtml = '<option value="">请选择</option>';
                    $.each(res.data, function (n, val) {
                        serverhtml += "<option value=\"" + val.id + "\" data-code=\"" + val.ServerCode + "\" data-url=\"" + val.ServerIP + "\">" + val.ServerName + "</option>";
                    });
                    $("#ServerCode").html(serverhtml);
                    form.render("select");
                });
                form.on("select(ServerCode)", function (data) {
                    getArea(data.value);
                    $('#AreaId').val('');
                    getDevice();
                });
                //区域
                function getArea(ServerCode) {
                    list.info("GetAreaListKey", {
                        token: token,
                        ServerCode: ServerCode,
                        ComboBox: 'all'
                    }, function (res) {
                        var areahtml = '<option value="">请选择区域</option>';
                        $.each(res.data, function (n, val) {
                            areahtml += "<option value=\"" + val.id + "\">" + val.AreaName + "</option>";
                        });
                        $("#AreaId").html(areahtml);
                        form.render("select");
                        form.on("select(AreaId)", function (data) {
                            getDevice();
                        })
                    });
                }
                //分类
                list.info("GetClassListKey", {
                    token: token,
                    ComboBox: 'all'
                }, function (res) {
                    var classhtml = '<option value="">请选择分类</option>';
                    $.each(res.data, function (n, val) {
                        classhtml += "<option value=\"" + val.ClassName + "\" >" + val.ClassName + "</option>";
                    });
                    $("#ClassName").html(classhtml);
                    form.render("select");
                    form.on("select(ClassName)", function (data) {
                        getDevice();
                    })
                });

                //初始化数据
                function getDevice() {
                    let devparam = {
                        ComboBox: 'all',
                        token: token
                    }
                    let ClassName = $('#ClassName').val();
                    let AreaId = $('#AreaId').val();
                    let ServerCode = $('#ServerCode').find("option:selected").attr('data-code');
                    if (ServerCode) devparam.ServerCode = ServerCode;
                    if (AreaId) devparam.AreaId = AreaId;
                    if (ClassName) devparam.ClassName = ClassName;
                    list.info(DeviceListUrl, devparam, function (r) {
                        let lists = template("listdevicetemplate", r);
                        $(".three-left ul").html(lists);
                        let findindex = r.data.findIndex(function (val) {
                            return val.id == eventid;
                        });
                        $(".three-left ul>li").unbind('click').click(function () {
                            $(this).addClass('check').siblings().removeClass('check');
                            param.DevId = $(this).attr('data-id');
                            list.get(url, param, function (r) {
                                renderEventTable(r);
                            }, function () {
                                form.render();
                            });
                        })
                        if (findindex > -1) {
                            $(".three-left ul>li").eq(findindex + 1).click();
                        } else {
                            $(".three-left ul>li").eq(0).addClass('check');
                        }
                    });
                }

                //监听设备提交
                form.on("submit(search)", function (data) {
                    param.pageNo = 1;
                    param.search = data.field.search;
                    // param.DeviceStatus = data.field.DeviceStatus;
                    param.AlarmLevel = data.field.AlarmLevel;
                    if (data.field.NotifyWindowID !== undefined && data.field.NotifyWindowID !== "") {
                        param.NotifyWindowID = data.field.NotifyWindowID;
                    } else {
                        delete (param['NotifyWindowID']);
                    }
                    param.ClassName = data.field.ClassName;
                    param.AreaId = data.field.AreaId;
                    param.ServerCode = $('#ServerCode').find("option:selected").attr('data-code');;
                    if (param.ClassName || param.AreaId  || param.ServerCode) {
                        delete (param['DevId']);
                        $(".three-left ul>li").removeClass('check').eq(0).addClass('check');
                    }
                    list.get(url, param, function (r) {
                        renderEventTable(r);
                    }, function () {
                        form.render();
                    });
                    return false;
                });
            });

        })

        //分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            list.get(url, param, function (r) {
                renderEventTable(r);
            }, function () {
                form.render();
            });
        }

        //编辑回传
        function changecallbak() {
            list.get(url, param, function (r) {
                renderEventTable(r);
                form.render();
            }, function () {
                form.render();
            });
        }
        //批量编辑
        function dealAll(id, param) {
            xadmin.open('批量编辑', 'donghuan-event-edit-batch.html', '', '', id);
        }
    </script>
</body>

</html>
