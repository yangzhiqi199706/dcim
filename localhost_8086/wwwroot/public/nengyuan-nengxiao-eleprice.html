<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <!-- <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>能源管理->电价配置</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div> -->
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" placeholder="请输入名称" name="search">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <select id="ServerCode" name="ServerCode" lay-filter="ServerCode">
                                    <option value="">服务器</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <select id="AreaId" name="AreaId" lay-filter="AreaId">
                                    <option value="">区域</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>

                        <button class="layui-btn x-right"
                            onclick="xadmin.open('新增','nengyuan-nengxiao-eleprice-add.html')">
                            新增
                        </button>
                        <a class="layui-btn x-right" type="button" id="elePricetIn" style="margin-right: 10px;">导入</a>
                        <a class="layui-btn x-right" type="button" id="elePricetOut">导出</a>
                        <a href="/upfiletpl/eleprice.xls" download="" class="x-right"
                            style="margin-top: 7px;">《下载模版》</a>
                    </div>
                    <div class="layui-card-body">
                        <table class="layui-table">
                            <thead>
                                <tr>
                                    <th>编号</th>
                                    <th>所属服务器</th>
                                    <th>所属区域</th>
                                    <th>名称</th>
                                    <th>尖段</th>
                                    <th>峰段</th>
                                    <th>平段</th>
                                    <th>谷段</th>
                                    <th>尖段电价</th>
                                    <th>峰段电价</th>
                                    <th>平段电价</th>
                                    <th>谷段电价</th>
                                    <th>时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.info.length!=0}} {{each data.info as list i}}
                                    <tr>
                                        <td>{{(data.page.p-1)*15+(i+1)}}</td>
                                        <td>{{list.ServerName}}</td>
                                        <td>{{list.AreaName}}</td>
                                        <td>{{list.EleRuleName}}</td>
                                        <td>{{list.SharpTime}}</td>
                                        <td>{{list.HighTime}}</td>
                                        <td>{{list.FlatTime}}</td>
                                        <td>{{list.LowTime}}</td>
                                        <td>{{list.SharpPrice}}</td>
                                        <td>{{list.HighPrice}}</td>
                                        <td>{{list.FlatPrice}}</td>
                                        <td>{{list.LowPrice}}</td>
                                        <th>{{list.EleMonth}}</th>
                                        <td>
                                            <a title="编辑" onclick="xadmin.open('编辑','nengyuan-nengxiao-eleprice-edit.html','','','{{list.id}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe642;</i>
                                            </a>
                                            <a title="删除" onclick="x_admin_del('确认删除吗？','DelElectricPriceKey ','{{list.id}}',this)" href="javascript:;">
                                                <i class="layui-icon">&#xe640;</i>
                                            </a>
                                        </td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="12" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                    </div>
                    <table id="listOut" style="display: none;">
                        <thead>
                            <tr>
                                <th>编号</th>
                                <th>所属服务器</th>
                                <th>所属区域</th>
                                <th>名称</th>
                                <th>尖段</th>
                                <th>峰段</th>
                                <th>平段</th>
                                <th>谷段</th>
                                <th>尖段电价</th>
                                <th>峰段电价</th>
                                <th>平段电价</th>
                                <th>谷段电价</th>
                                <th>时间</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                    <script type="text/html" id="details">
                        {{if data.length!=0}} {{each data as list i}}
                            <tr>
                                <td>{{(i+1)}}</td>
                                <td>{{list.ServerName}}</td>
                                <td>{{list.AreaName}}</td>
                                <td>{{list.EleRuleName}}</td>
                                <td>{{list.SharpTime}}</td>
                                <td>{{list.HighTime}}</td>
                                <td>{{list.FlatTime}}</td>
                                <td>{{list.LowTime}}</td>
                                <td>{{list.SharpPrice}}</td>
                                <td>{{list.HighPrice}}</td>
                                <td>{{list.FlatPrice}}</td>
                                <td>{{list.LowPrice}}</td>
                                <th>{{list.EleMonth}}</th>
                            </tr>
                            {{/each}} {{else}}
                            <tr>
                                <td colspan="12" style="text-align: center">暂无相关数据</td>
                            </tr>
                        {{/if}}
                    </script>
                </div>
            </div>
        </div>
    </div>
    <script>
        //请求地址
        var url = "GetElectricPriceListKey";
        $(function () {
            //初始化数据
            list.get(url, param);
            layui.use(["form", "tree", "upload"], function () {
                $ = layui.jquery;
                var form = layui.form;
                var upload = layui.upload;
                // 服务器选择
                getServer(form, function () {
                    form.on("select(ServerCode)", function (data) {
                        param.ServerCode = data.value;
                        param.ComboBox = "all";
                        getArea(form, data);
                    });
                });
                // 搜索提交
                form.on("submit(search)", function (data) {
                    param.pageNo = 1;
                    param.search = search = data.field.search;
                    param.ServerCode = data.field.ServerCode;
                    param.AreaId = data.field.AreaId;
                    delete param['ComboBox'];
                    list.get(url, param);
                    return false;
                });
                 //导入
                upDataPtl(upload, {
                    "table": "dcim-electricprice",
                    "primary_key": "EleRuleName",
                    "primary_field_name": "EleRuleName",
                    "mappings": [
                        {
                            "excel_field": "ServerCode",
                            "lookup_table": "dcim-server",
                            "lookup_field": "ServerName",
                            "lookup_value": "id"
                        },
                        {
                            "excel_field": "AreaId",
                            "lookup_table": "dcim-area",
                            "lookup_field": "AreaName",
                            "lookup_value": "id"
                        }
                    ]
                }, () => {
                    list.get(url, param);
                }, '#elePricetIn');
                //导出
                $('#elePricetOut').click(function () {
                    list.info(url, {
                        token: token,
                        ComboBox: 'all',
                        search: param.search,
                        ServerCode: param.ServerCode,
                        AreaId: param.AreaId
                    }, function (res) {
                        if (res.data.length > 0) {
                            let htmls = template("details", res);
                            $("#listOut tbody").html(htmls);
                            displayexport('elePricetOut', 'listOut', '电价配置', true);
                        } else {
                            layer.msg("没有可导出的数据", {
                                icon: 5,
                                time: 2000
                            });
                        }
                    })
                });
            });
        })
        //分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            delete (param['ComboBox']);
            list.get(url, param);
        }

    </script>
</body>

</html>
