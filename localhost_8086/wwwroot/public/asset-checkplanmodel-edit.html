<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <script type="text/html" id="detail">
                    <div class="layui-form-item">
                        <label class="layui-form-label">计划名称<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="PlanName" value="{{data.PlanName}}" name="PlanName" lay-verify="required" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">周期性盘点<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <select id="PlanCycle" name="PlanCycle" lay-verify="required" lay-filter="PlanCycle">
                                <option value="1" {{if data.PlanCycle=='1'}}selected{{/if}}>启用</option>
                                <option value="-1" {{if data.PlanCycle=='-1'}}selected{{/if}}>禁用</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">完成天数（天）<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="number" id="PlanComplateDayName" value="{{data.ComplateDay}}" name="ComplateDay" lay-verify="required" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">执行部门<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="DeptName" value="{{data.DeptName}}" name="DeptName" lay-verify="required" autocomplete="off" class="layui-input" readonly>
                            <input type="hidden" id="DeptId" value="{{data.DeptId}}" name="DeptId" lay-verify="required" autocomplete="off" class="layui-input" readonly>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" onclick="xadmin.open('选择部门','choose-department.html?type=dept')">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">执行人<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="PersonName" value="{{data.PersonName}}" name="PersonName" lay-verify="required" autocomplete="off" class="layui-input" readonly>
                            <input type="hidden" id="EmpId" value="{{data.EmpId}}" name="EmpId" lay-verify="required" autocomplete="off" class="layui-input" readonly>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" onclick="xadmin.open('选择人员','choose-person.html?type=person')">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">派发周期<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <select id="SendCycle" name="SendCycle" lay-verify="required" lay-filter="SendCycle">
                                <option value="year" {{if data.SendCycle=='year'}}selected{{/if}}>年</option>
                                <option value="month" {{if data.SendCycle=='month'}}selected{{/if}}>月</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">派发时间<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="SendTime" value="{{data.SendTime}}" name="SendTime" lay-verify="required" autocomplete="off" class="layui-input" readonly>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" id="SendOpen">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">资产类型<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <select id="AssetsType" name="AssetsType" lay-verify="required" lay-filter="AssetsType">
                                <option value="A" {{if data.AssetsType=='A'}}selected{{/if}}>所有资产</option>
                                <option value="F" {{if data.AssetsType=='F'}}selected{{/if}}>在架资产</option>
                                <option value="CF" {{if data.AssetsType=='CF'}}selected{{/if}}>非在架资产</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">盘点方式<span class="x-red">*</span></label>
                        <div class="layui-input-block">
                            <input type="radio" name="CheckWay" value="area" title="按区域"  {{if data.CheckWay=='area'}}checked{{/if}} lay-filter="CheckWay">
                            <input type="radio" name="CheckWay" value="dept" title="按部门"   {{if data.CheckWay=='dept'}}checked{{/if}} lay-filter="CheckWay">
                            <input type="radio" name="CheckWay" value="store" title="按仓库"   {{if data.CheckWay=='store'}}checked{{/if}} lay-filter="CheckWay">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">盘点范围<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="CheckRangeName" value="{{data.CheckRangeName}}" name="CheckRangeName" lay-verify="required" autocomplete="off" class="layui-input" readonly>
                            <input type="hidden" id="CheckRange" value="{{data.CheckRange}}" name="CheckRange" lay-verify="required" autocomplete="off" class="layui-input" readonly>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" id="RangeOpen">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">监盘人</label>
                        <div class="layui-input-inline">
                            <input type="text" id="SeePerson" value="{{data.SeePerson}}" name="SeePerson" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label"></label>
                        <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                    </div>
                </script>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function(){
            var id = GetString("id");

            //获取详情
            list.info("GetCheckPlanModelDetailKey", {
                token: token,
                id: id
            }, function (r) {
                var html = template("detail", r);
                $("#formNow").html(html);
                layui.use(["form"], function () {
                    $ = layui.jquery;
                    var form = layui.form;
                    form.render();
                    //派发周期
                    $('#SendOpen').click(function(){
                        xadmin.open('选择时间',r.data.SendCycle=='year'?'choose-year.html':'choose-time.html')
                    })
                    form.on("select(SendCycle)", function (data) {
                        $('#SendTime').val('');
                        var url='';
                        if(data.value=='year'){
                            url='choose-year';
                        }else{
                            url='choose-time';
                        }
                        $('#SendOpen').unbind('click').click(function(){
                            xadmin.open('选择时间',url+'.html')
                        })
                    });
                    //盘点范围方式
                    $('#RangeOpen').click(function(){
                        var url='';
                        switch (r.data.CheckWay){
                            case 'area':url='choose-area';break;
                            case 'dept':url='choose-department';break;
                            case 'store':url='choose-store';break;
                        }
                        $('#RangeOpen').unbind('click').click(function(){
                            xadmin.open('选择范围',url+'.html?type=range')
                        })
                    })
                    form.on("radio(CheckWay)", function (data) {
                        $('#CheckRange,#CheckRangeName').val('');
                        var url='';
                        switch (data.value){
                            case 'area':url='choose-area';break;
                            case 'dept':url='choose-department';break;
                            case 'store':url='choose-store';break;
                        }
                        $('#RangeOpen').unbind('click').click(function(){
                            xadmin.open('选择范围',url+'.html?type=range')
                        })
                    });

                     //监听提交
				    form.on("submit(submit)", function (data) {
                        var strformData = new FormData($("#formNow")[0]);
                        strformData.append("token", token);
                        strformData.append("id", id);
                        list.form("ChangeCheckPlanModelKey", strformData, function (r) {
                            backToparent("修改成功");
                        });
                    });
                });
            });	
        });
    </script>
</body>
</html>
