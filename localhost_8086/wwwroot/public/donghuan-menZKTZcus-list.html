<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<style>
    #syncuser {
        margin-right: 10px !important;
    }
</style>

<body>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body mennav">
                        <a class="layui-btn">
                            用户管理
                        </a>
                        <a class="layui-btn layui-btn-primary">
                            考勤记录
                        </a>
                        <a class="layui-btn layui-btn-primary">
                            控制记录
                        </a>
                    </div>
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" placeholder="请输入" name="search">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                        <!-- <button class="layui-btn x-right" onclick="xadmin.open('添加用户', 'donghuan-menZKTcus-add.html')">
                            <i class="layui-icon"></i>添加用户
                        </button> -->
                        <button class="layui-btn x-right" type="button" id="syncuser">用户同步</button>
                    </div>
                    <div class="layui-card-body">
                        <table class="layui-table">
                            <thead>
                                <tr>
                                    <th>姓名</th>
                                    <th>工号</th>
                                    <th>门禁卡号</th>
                                    <th>权限</th>
                                    <!-- <th>操作</th> -->
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.info.length!=0}} {{each data.info as list i}}
                                    <tr>
                                        <td>{{list.PersonName}}</td>
                                        <td>{{list.PersonNumber}}</td>
                                        <td>{{list.DoorCardNum}}</td>
                                        <td>{{if list.DoorPri == 0}}普通用户
                                            {{else if list.DoorPri == 2}}登记员
                                            {{else if list.DoorPri == 6}}管理员
                                            {{else if list.DoorPri == 14}}超级管理员
                                            {{/if}}</td>
                                        <!-- <td>
                                            <a title="编辑" onclick="xadmin.open('编辑','donghuan-menZKTcus-edit.html','','','{{list.id}}&SerialNumber={{data.SerialNumber}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe642;</i>
                                            </a>
                                            <a title="删除" onclick="x_admin_del('确认删除吗？','DelDoorZktUserKey','{{list.id}}',this);" href="javascript:;">
                                                <i class="layui-icon">&#xe640;</i>
                                            </a>
                                        </td> -->
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        var id = GetString("id");
        var SN = GetString("SerialNumber");
        var url = "GetEmpListKey";
        let resGroupIds = [], resGroupId = [];
        let GroupId;
        $(function () {
            $('.mennav a').eq(0).attr('href', 'donghuan-menZKTZcus-list.html?id=' + id + '&SerialNumber=' + SN);
            $('.mennav a').eq(1).attr('href', 'donghuan-menZKTZatt-list.html?id=' + id + '&SerialNumber=' + SN);
            // $('.mennav a').eq(1).attr('href', 'donghuan-menZKTZoper-list.html?id=' + id + '&SerialNumber=' + SN);
            $('.mennav a').eq(2).attr('href', 'donghuan-menZKTZcmd-list.html?id=' + id + '&SerialNumber=' + SN);
            //获取列表数据
            param.SN = SN;
            list.get(url, param, dealdata);
            layui.use("form", function () {
                $ = layui.jquery;
                var form = layui.form;
                //获取所有分组
                $.ajaxSettings.async = false;
                list.info("GetDoorParamDetailKey", {
                    token: token,
                    ComboBox: 'all',
                    id: SN
                }, function (res) {
                    GroupId = res.data.GroupId || '';
                    resGroupId = GroupId.split(',').map(id => id.trim()).filter(id => id !== '');
                });
                $.ajaxSettings.async = true;

                //监听提交
                form.on("submit(search)", function (data) {
                    param.pageNo = 1;
                    param.search = data.field.search;
                    list.get(url, param, dealdata);
                    return false;
                });
            });
        })

        function dealdata(r) {
            r.data.SerialNumber = SN;
            r.data.info = r.data.info.filter(item => {
                if (!item.GroupId) {
                    return false;
                }
                let itemGroupIds = item.GroupId.split(',').map(id => id.trim()).filter(id => id !== '');
                // console.log(itemGroupIds);
                // console.log(resGroupId);
                return itemGroupIds.some(id => resGroupId.includes(id));
            });
        }
        //分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            list.get(url, param, dealdata);
        }

        //删除
        function x_admin_del(tips, url, id, obj) {
            layer.confirm(tips, function (index) {
                list.del(url, {
                    token: token,
                    id: id
                }, obj);
                delSync(id);
                layer.close(index);
            });
        }
        //通知删除同步数据
        function delSync(id) {
            list.info('ChangeDoorParamKey', {
                token: token,
                SN: SN,
                delUser: id
            }, function (res) { });
        }
        //用户同步
        $('#syncuser').click(function () {
            list.info('ChangeDoorParamKey', {
                token: token,
                SN: SN,
                userSync: 1
            }, function (res) {
                layer.msg("同步成功", {
                        icon: 1,
                        time: 1000
                    });
             });
        })

    </script>
</body>

</html>
