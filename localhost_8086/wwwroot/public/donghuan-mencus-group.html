<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5" id="groupForm">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" placeholder="请输入分组名称" name="search">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="layui-card-body">
                        <table class="layui-table layui-form">
                            <thead>
                                <tr>
                                    <th>编号</th>
                                    <th>分组名称</th>
                                </tr>
                            </thead>
                            <tbody id="allTable">
                                <script type="text/html" id="listtemplate">
                                    {{if data.length!=0}} {{each data as list i}}
                                    <tr onclick="chooseOne(this)" data-id="{{list.id}}" data-GroupName="{{list.GroupName}}">
                                        <td>{{list.id}}</td>
                                        <td>{{list.GroupName}}</td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <label style="clear:both">已配置项</label>
                        <table class="layui-table layui-form">
                            <thead>
                                <tr>
                                    <th>操作</th>
                                    <th>编号</th>
                                    <th>分组名称</th>
                                </tr>
                            </thead>
                            <tbody id="chooseTable" class="chooseTable"></tbody>
                        </table>
                        <div class="layui-form-item">
                            <button class="layui-btn x-right" id="submit" lay-submit lay-filter="submit"
                                type="button">确定</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 请求地址
        var url = "GetPersonGroupListKey";
        var alldata = [];    // 所有数据
        let chooseids = [];  // 上次选择的分组 id 数组
        var chooseid = [];   // 已选择的分组 id 数组
        var multi = true;    // 是否允许多选
        var idString = GetString("id");
        // console.log('idString:',idString);
        $(function () {
            layui.use(["form"], function () {
                $ = layui.jquery;
                form = layui.form;

                // 获取并解析 SN
                var idString = GetString("id");
                console.log('idString:', idString);

                // 直接处理逗号分隔的字符串
                var SN = idString.split(',').map(sn => sn.trim());
                console.log('SN:', SN);

                // 初始化数据
                param.ComboBox = "all";
                list.info(url, param, function (r) {
                    alldata = r;
                    dealdata(r);
                    setTimeout(function () {
                        var html = template("listtemplate", r);
                        $("#allTable").html(html);
                    }, 1000);
                });

                if (SN.length==1){
                    list.info('GetDoorParamListKey', {
                        token: token,
                        ComboBox: 'all',
                        DevId: SN[0]
                    }, function (res) {
                        // console.log('res:', res);
                        let data = res.data[0];
                        // 检查 data 是否包含 GroupId 属性
                        chooseids = (data && data.GroupId ? data.GroupId.trim() : '').split(',').filter(id => id !== '');
                        chooseid = chooseids; // 将上次选择的选项赋值给 chooseid
                        // console.log(chooseids);
                        dealdata(alldata); // 初始化已选择的项
                    });
                }

                // SN.forEach(sn => {
                //     console.log('sn:', sn);

                //     list.info('GetDoorParamListKey', {
                //         token: token,
                //         ComboBox: 'all',
                //         SN: sn
                //     }, function (res) {
                //         // console.log('res:', res);
                //         let data = res.data[0];
                //         // 检查 data 是否包含 GroupId 属性
                //         chooseids = (data && data.GroupId ? data.GroupId.trim() : '').split(',').filter(id => id !== '');
                //         chooseid = chooseids; // 将上次选择的选项赋值给 chooseid
                //         // console.log(chooseids);
                //         dealdata(alldata); // 初始化已选择的项
                //     });
                // });

                // 监听搜索
                form.on("submit(search)", function (data) {
                    var search = data.field.search;
                    var newdata = { 'data': [] };
                    if (alldata.length !== 0) {
                        $.each(alldata.data, function (n, val) {
                            if (val.GroupName.indexOf(search) >= 0) {
                                newdata.data.push(val);
                            }
                        });
                    }
                    var html = template("listtemplate", newdata);
                    $("#allTable").html(html);
                    form.render();
                    return false;
                });

                form.on("submit(submit)", function (data) {
                    
                    SN.forEach((sn,n) => {
                        // console.log(sn);
                        // var strformData = new FormData();
                        // strformData.append("token", token);
                        // // strformData.append("id", id);
                        // strformData.append("GroupId", formatGroupId(chooseid));
                        // strformData.append("SN", sn); // 分别提交每个 SN
                        let sendparam = {
                            token:token,
                            GroupId:formatGroupId(chooseid),
                            DevId:sn,
                            changePower:1
                        }
                        // console.log(sendparam);
                        list.info("ChangeDoorParamKey", sendparam, function (r) {
                            if(n==SN.length-1){
                                backToparent("下发成功");
                                //通知海康心跳
                                getDoorInfo('hik', '');
                            }
                        });
                    });
                });
            });
        });

        // 选择一项
        function chooseOne(obj) {
            var id = $(obj).data('id');
            var GroupName = $(obj).attr('data-GroupName');

            // 检查是否已选择
            if (chooseid.includes(id)) {
                layer.msg('设备已存在', { icon: 5, time: 1000 });
                return false;
            }
            // 检查是否支持多选
            if (chooseid.length === 1 && !multi) {
                layer.msg('只能选择一个设备', { icon: 5, time: 1000 });
                return false;
            }
            var html = `<tr>
                <td>
                    <a title="移除" onclick="removeChoose(this)" data-id="${id}" href="javascript:;">
                        <i class="layui-icon">&#xe640;</i>
                    </a>
                </td>
                <td>${id}</td>
                <td>${GroupName}</td>
            </tr>`;
            $('#chooseTable').append(html);
            chooseid.push(id);
        }

        // 删除一项
        function removeChoose(obj) {
            $(obj).parents('tr').remove();
            chooseid.splice(chooseid.indexOf($(obj).data('id')), 1);
        }

        // 数据处理：初始化已选中的数据
        function dealdata(r) {
            if (chooseid.length !== 0) {
                var html = '';
                $.each(r.data, function (x, y) {
                    if (chooseid.includes(y.id)) {
                        html += `<tr>
                            <td>
                                <a title="移除" onclick="removeChoose(this)" data-id="${y.id}" href="javascript:;">
                                    <i class="layui-icon">&#xe640;</i>
                                </a>
                            </td>
                            <td>${y.id}</td>
                            <td>${y.GroupName}</td>
                        </tr>`;
                    }
                });
                $('#chooseTable').append(html);
            }
        }

        function formatGroupId(ids) {
            return ',' + ids.join(',').replace(/(^,|,$)/g, '') + ',';
        }
    </script>
</body>

</html>
