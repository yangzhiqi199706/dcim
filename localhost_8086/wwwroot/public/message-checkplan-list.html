<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>消息中心->盘点任务</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" placeholder="请输入任务编号、任务名称" name="search">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="layui-card-body">
                        <table class="layui-table">
                            <thead>
                                <tr>
                                    <th>编号</th>
                                    <th>任务编号</th>
                                    <th>计划名称</th>
                                    <th>计划完成时间</th>
                                    <th>创建人</th>
                                    <th>执行部门</th>
                                    <th>执行人</th>
                                    <th>执行日期</th>
                                    <th>资产类型</th>
                                    <th>盘点方式</th>
                                    <th>盘点范围</th>
                                    <th>监盘人</th>
                                    <th>状态</th>
                                    <th>创建时间</th>
                                    <th>系统派发</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.info.length!=0}} {{each data.info as list i}}
                                    <tr>
                                        <td>{{(data.page.p-1)*15+(i+1)}}</td>
                                        <td>{{list.TaskNumber}}</td>
                                        <td>{{list.TaskName}}</td>
                                        <td>{{list.PlanComplateTime}}</td>
                                        <td>{{list.PersonName}}</td>
                                        <td>{{list.DeptName}}</td>
                                        <td>{{list.PersonName}}</td>
                                        <td>{{list.SendTime}}</td>
                                        <td>{{if list.AssetsType=='F'}}在架资产{{/if}}
                                            {{if list.AssetsType=='CF'}}非在架资产{{/if}}
                                            {{if list.AssetsType=='A'}}所有资产{{/if}}
                                        </td>
                                        <td>
                                            {{if list.CheckWay=='area'}}按区域执行{{/if}}
                                            {{if list.CheckWay=='dept'}}按部门执行{{/if}}
                                            {{if list.CheckWay=='store'}}按仓库执行{{/if}}
                                        </td>
                                        <td>{{list.CheckRange}}</td>
                                        <td>{{list.SeePerson}}</td>
                                        <td>{{list.PlanStatus}}</td>
                                        <td>{{list.create_time}}</td>
                                        <td>{{if list.system==1}}否{{else}}是{{/if}}</td>
                                        <td>
                                            <a title="取消" onclick="x_admin_tips('确认取消此计划吗？','CancelCheckPlanKey','{{list.id}}',this,Canceltips)" href="javascript:;">
                                                <i class="layui-icon">&#xe64f;</i>
                                            </a>
                                            <a title="执行任务" onclick="xadmin.open('执行任务','asset-checkplan-way.html','','','{{list.id}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe652;</i>
                                            </a>
                                        </td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        //请求地址
        var url = "GetCheckPlanListKey";
        $(function(){
            //初始化数据
            param.PlanStatus ='待执行';
            list.get(url, param);
            layui.use("form", function () {
                $ = layui.jquery;
                var form = layui.form;
                //监听提交
                form.on("submit(search)", function (data) {
                    param.pageNo = 1;
                    param.search = data.field.search;
                    list.get(url, param);
                    return false;
                });
            });
        })
        //分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            list.get(url, param);
        }
    </script>
</body>

</html>
