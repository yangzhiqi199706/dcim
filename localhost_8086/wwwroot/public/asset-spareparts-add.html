<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <div class="layui-form-item">
                    <label class="layui-form-label">备件编号<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="BackupsNumber" value="" name="BackupsNumber" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">备件类型<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="AssetsTypeName" value="" lay-verify="required" autocomplete="off" class="layui-input" readonly>
                        <input type="hidden" id="AssetsTypeId" value="" name="AssetsTypeId" lay-verify="required" autocomplete="off" class="layui-input" readonly>
                    </div>
                    <div class="layui-form-mid layui-word-aux">
                        <a class="layui-btn" onclick="xadmin.open('选择资产类型','choose-asset-typespar.html')">选择</a>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">型号<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="BackupsModel" value="" name="BackupsModel" lay-verify="required" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">备件名称<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="BackupsName" value="" name="BackupsName" lay-verify="required" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">厂商<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="BackupsCompany" value="" name="BackupsCompany" autocomplete="off" lay-verify="required" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">规格<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="BackupsSpec" value="" name="BackupsSpec" autocomplete="off" lay-verify="required" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">尺寸</label>
                    <div class="layui-input-inline">
                        <input type="text" id="BackupsSize" value="" name="BackupsSize" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">库存位置</label>
                    <div class="layui-input-inline">
                        <select id="StoreLocationId" name="BackupsStoreLocationId">
                            <option value="">请选择</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">管理部门</label>
                    <div class="layui-input-inline">
                        <input type="text" id="DeptName" value="" name="DeptName" autocomplete="off" class="layui-input" readonly>
                        <input type="hidden" id="DeptId" value="" name="DeptId" autocomplete="off" class="layui-input" readonly>
                    </div>
                    <div class="layui-form-mid layui-word-aux">
                        <a class="layui-btn" onclick="xadmin.open('选择部门','choose-department.html?type=dept')">选择</a>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">管理人员</label>
                    <div class="layui-input-inline">
                        <input type="text" id="PersonName" value="" name="PersonName"  autocomplete="off" class="layui-input" readonly>
                        <input type="hidden" id="EmpId" value="" name="EmpId" autocomplete="off" class="layui-input" readonly>
                    </div>
                    <div class="layui-form-mid layui-word-aux">
                        <a class="layui-btn" onclick="xadmin.open('选择人员','choose-person.html?type=person&DeptId='+$('#DeptId').val())">选择</a>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        var form;
        $(function(){
            layui.use(["form",'laydate'], function () {
                $ = layui.jquery;
                form = layui.form;
                //仓库
                getStoreLocation(form);
                //监听提交
				form.on("submit(submit)", function (data) {
                    var strformData = new FormData($("#formNow")[0]);
                    strformData.append("token", token);
                    list.form("CreateSparePartsKey", strformData, function (r) {
                        backToparent("添加成功");
                    });
                })
            });
        });
        function render(){
            form.render();
        }
    </script>
</body>
</html>
