<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>资产管理->其他业务->维保管理</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <div class="two-left three-left-big">
                            <form class="layui-form layui-col-md12">
                                <text>创建时间</text>
                                <div class="layui-input-inline">
                                    <input type="text" id="startDateTime" value="" name="startDateTime"  class="layui-input" placeholder="开始日期" >
                                </div>
                                <div class="layui-input-inline">
                                    <input type="text" id="endDateTime" value="" name="endDateTime" class="layui-input"  placeholder="结束日期" >
                                </div>
                                <text>供应商</text>
                                <select id="SupplierId" name="SupplierId">
                                    <option value="">请选择</option>
                                </select>
                                <text>关键词</text>
                                <input class="layui-input" placeholder="请输入签订人" name="search">
                                <div class="two-search">
                                    <button class="layui-btn" lay-submit lay-filter="search" type="button">搜索</button>
                                </div>
                            </form>
                        </div>
                        <div class="two-right-big">
                            <div class="x-right" style="margin-bottom:15px;">
                                <button class="layui-btn" onclick="xadmin.open('添加维保','asset-wb-add.html')">
                                    <i class="layui-icon"></i>添加维保
                                </button>
                            </div>
                            <table class="layui-table">
                                <thead>
                                    <tr>
                                        <th>合同编号</th>
                                        <th>合同名称</th>
                                        <th>供应商</th>
                                        <th>维保联系人</th>
                                        <th>维保电话</th>
                                        <th>维保类型</th>
                                        <th>承保类型</th>
                                        <th>签订人</th>
                                        <th>签订日期</th>
                                        <th>起始日期</th>
                                        <th>关联数量</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <script type="text/html" id="listtemplate">
                                        {{if data.info.length!=0}} {{each data.info as list i}}
                                        <tr>
                                            <td>{{list.MaintenanceNumber}}</td>
                                            <td>{{list.MaintenanceName}}</td>
                                            <td>{{list.SupplierName}}</td>
                                            <td>{{list.MaintenanceTelName}}</td>
                                            <td>{{list.MaintenanceTel}}</td>
                                            <td>{{list.MaintenanceType}}</td>
                                            <td>{{list.AcceptType}}</td>
                                            <td>{{list.SignPerson}}</td>
                                            <td>{{list.SignTime}}</td>
                                            <td>{{list.StartTime}}</td>
                                            <td>{{if list.RelationNumber!=0}}<a onclick="xadmin.open('关联资产','asset-wb-assetdetail.html','','','{{list.id}}')" href="javascript:;">
                                                {{list.RelationNumber}}
                                                </a>
                                                {{else}}
                                                {{list.RelationNumber}}
                                                {{/if}}
                                            </td>
                                            <td>
                                                <a title="编辑" onclick="xadmin.open('编辑','asset-wb-edit.html','','','{{list.id}}')" href="javascript:;">
                                                    <i class="layui-icon">&#xe642;</i>
                                                </a>
                                                <a title="关联资产" onclick="xadmin.open('关联资产','asset-wb-asset.html','','','{{list.id}}')" href="javascript:;">
                                                    <i class="layui-icon">&#xe674;</i>
                                                </a>
                                                {{if list.RelationNumber==0}}
                                                <a title="删除" onclick="x_admin_del('确认删除吗？','DelMaintenanceKey',{{list.id}},this)" href="javascript:;">
                                                    <i class="layui-icon">&#xe640;</i>
                                                </a>
                                                {{/if}}
                                                {{if list.MaintenanceFile}}
                                                <a title="下载附件" download="{{list.MaintenanceName}}-{{list.MaintenanceNumber}}" href="{{list.MaintenanceFile}}">
                                                    <i class="layui-icon">&#xe621;</i>
                                                </a>
                                                {{/if}}
                                            </td>
                                            
                                        </tr>
                                        {{/each}} {{else}}
                                        <tr>
                                            <td colspan="20" style="text-align: center">暂无相关数据</td>
                                        </tr>
                                        {{/if}}
                                    </script>
                                </tbody>
                            </table>
                            <div id="bottomPaging"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        //请求地址
        var url = "GetMaintenanceListKey";
        $(function(){
            param.startDateTime='';
            param.endDateTime='';
            list.get(url, param,dealdata);
            layui.use(["form",'laydate'], function () {
                $ = layui.jquery;
                var form = layui.form;
                var laydate = layui.laydate;
                laydate.render({
                    elem: '#startDateTime' 
                });
                laydate.render({
                    elem: '#endDateTime' 
                });
                //供应商
                getSupplier(form);
                //监听提交
                form.on("submit(search)", function (data) {
                    delete(param['ComboBox']);
                    param.pageNo = 1;
                    param.search = data.field.search;
                    param.startDateTime=data.field.startDateTime;
                    param.endDateTime=data.field.endDateTime;
                    param.SupplierId=data.field.SupplierId;
                    list.get(url, param,dealdata);
                    return false;
                });
            });
        });
        function dealdata(r){
            $.each(r.data.info,function(n,val){
                if(val.MaintenanceFile  && val.MaintenanceFile.indexOf('http')<0){
                    val.MaintenanceFile=imgUrl+val.MaintenanceFile;
                }
                if(val.SignTime){
                    val.SignTime = val.SignTime.substring(0,10)
                }
                if(val.StartTime){
                    val.StartTime = val.StartTime.substring(0,10)
                }
            })
        }
        //分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            list.get(url, param);
        }
    </script>
</body>
</html>
