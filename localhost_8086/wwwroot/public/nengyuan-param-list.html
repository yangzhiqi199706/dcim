<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
<div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>能源管理->自定义参数</cite>
            </a>
        </span>
    <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
        <i class="layui-icon">&#xe666;</i>
    </a>
</div>
<div class="layui-fluid">
    <div class="layui-row layui-col-space15">
        <div class="layui-col-md12">
            <div class="layui-card">
                <div class="layui-card-body">
                    <form class="layui-form layui-col-space5">
                        <div class="layui-inline layui-show-xs-block">
                            <input class="layui-input" placeholder="请输入参数名称" name="search">
                        </div>
                        <div class="layui-inline layui-show-xs-block">
                            <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                <i class="layui-icon">&#xe615;</i>
                            </button>
                        </div>
                    </form>
                    <button class="layui-btn x-right" onclick="xadmin.open('添加参数','nengyuan-param-add.html')">
                        <i class="layui-icon"></i>添加
                    </button>
                </div>
                <div class="layui-card-body">
                    <table class="layui-table">
                        <thead>
                        <tr>
                            <th>编号</th>
                            <th>名称</th>
                            <th>计算方式</th>
                            <th>参数组1</th>
                            <th>参数组2</th>
                            <th>门楣屏序号</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <script type="text/html" id="listtemplate">
                            {{if data.info.length!=0}} {{each data.info as list i}}
                            <tr>
                                <td>{{(data.page.p-1)*15+(i+1)}}</td>
                                <td>{{list.ParamName}}</td>
                                <td>{{if list.Calc=='1+2'}}参数组1和参数组2求和{{/if}}
                                    {{if list.Calc=='1-2'}}参数组1和参数组2差值{{/if}}
                                    {{if list.Calc=='1:2'}}参数组1和参数组2比值{{/if}}
                                    {{if list.Calc=='1*2'}}参数组1和参数组2相乘{{/if}}
                                    {{if list.Calc=='avg1'}}参数组1平均值{{/if}}
                                    {{if list.Calc=='sum1'}}参数组1求和{{/if}}
                                    {{if list.Calc=='dayavg'}}当天均值{{/if}}
                                    {{if list.Calc=='max'}}当前最大值{{/if}}
                                    {{if list.Calc=='min'}}当前最小值{{/if}}
                                    {{if list.Calc=='daymax'}}当天最大值{{/if}}
                                    {{if list.Calc=='daymin'}}当天最小值{{/if}}
                                </td>
                                <td style="white-space:pre-wrap;">{{list.ParamIdOne}}</td>
                                <td style="white-space:pre-wrap;">{{list.ParamIdTwo}}</td>
                                <td>{{list.DoorPushOrder}}</td>
                                <td>{{list.create_time}}</td>
                                <td>
                                    <a title="编辑"  class="detail_" onclick="xadmin.open('编辑','nengyuan-param-edit.html?id={{list.id}}')" href="javascript:;">
                                        <i class="layui-icon">&#xe642;</i>
                                    </a>
                                    <a title="删除" onclick="x_admin_del('确认删除吗？','DelParamKey ','{{list.id}}',this)" href="javascript:;">
                                        <i class="layui-icon">&#xe640;</i>
                                    </a>
                                </td>
                            </tr>
                            {{/each}} {{else}}
                            <tr>
                                <td colspan="20" style="text-align: center">暂无相关数据</td>
                            </tr>
                            {{/if}}
                        </script>
                        </tbody>
                    </table>
                    <div id="bottomPaging"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    //请求地址
    var url = "GetParamListKey ";
    $(function () {
        //初始化数据
        list.get(url, param,dealdata);
        //搜索
        layui.use("form", function () {
            $ = layui.jquery;
            var form = layui.form;
            //监听提交
            form.on("submit(search)", function (data) {
                param.pageNo = 1;
                param.search = search = data.field.search;
                list.get(url, param,dealdata);
                return false;
            });
        });
        // setInterval(() => {
        //     list.get(url, param,dealdata);
        // }, 10000);
    })
    //分页回调
    function pagechange(curr) {
        param.pageNo = curr;
        list.get(url, param,dealdata);
    }
    //数据处理
    function dealdata(r){
        $.each(r.data.info,function(n,val){
            if(val.ParamIdOne){
                if(val.ParamIdOne.indexOf('[{')>=0){
                    val.ParamIdOneArr = [];
                    var jsonarr = JSON.parse(val.ParamIdOne);
                    $.each(jsonarr,function(i,k){
                        val.ParamIdOneArr.push('设备ID['+k['id']+']参数：'+k['paramKey']);
                    })
                    val.ParamIdOne=val.ParamIdOneArr.join('\n');
                }else{
                    val.ParamIdOne='自定义参数ID['+val.ParamIdOne+']';
                }
            }
            if(val.ParamIdTwo){
                if(val.ParamIdTwo.indexOf('{')>=0){
                    val.ParamIdTwoArr = [];
                    var jsonarr = JSON.parse(val.ParamIdTwo);
                    $.each(jsonarr,function(i,k){
                        val.ParamIdTwoArr.push('设备ID['+k['id']+']参数：'+k['paramKey']);
                    })
                    val.ParamIdTwo=val.ParamIdTwoArr.join('\n');
                }else{
                    val.ParamIdTwo='自定义参数ID['+val.ParamIdTwo+']';
                }
            }
        });
    }
</script>
</body>

</html>
