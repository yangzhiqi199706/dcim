<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                资产管理->查询及报表->租用日志
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <div class="two-left three-left-big">
                            <form class="layui-form layui-col-md12">
                                <text>记录时间</text>
                                <div class="layui-input-inline">
                                    <input type="text" id="startDateTime" name="startDateTime" class="layui-input" placeholder="开始日期" >
                                </div>
                                <div class="layui-input-inline">
                                    <input type="text" id="endDateTime"  name="endDateTime" class="layui-input" placeholder="结束日期" >
                                </div>
                                <text>租户</text>
                                <select id="RentId" name="RentId"  lay-filter="RentId">
                                    <option value="">全部</option>
                                </select>
                                <text>记录状态</text>
                                <select id="RentType" name="RentType" lay-filter="RentType">
                                    <option value="">全部</option>
                                    <option value="租用">租用</option>
                                    <option value="释放">释放</option>
                                    <option value="续租">续租</option>
                                </select>
                                <div class="two-search">
                                    <button class="layui-btn" lay-submit lay-filter="search" type="button">查询</button>
                                </div>
                            </form>
                        </div>
                        <div class="two-right-big">
                            <table class="layui-table">
                                <thead>
                                    <tr>
                                        <th>编号</th>
                                        <th>租户</th>
                                        <th>所属服务器</th>
                                        <th>所属区域</th>
                                        <th>机柜列</th>
                                        <th>机柜</th>
                                        <th>记录状态</th>
                                        <th>U位信息</th>
                                        <th>记录时间</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <script type="text/html" id="listtemplate">
                                        {{if data.info.length!=0}} {{each data.info as list i}}
                                        <tr>
                                            <td>{{(data.page.p-1)*15+(i+1)}}</td>
                                            <td>{{list.TenantName}}</td>
                                            <td>{{list.ServerName}}</td>
                                            <td>{{list.AreaName}}</td>
                                            <td>{{list.column}}</td>
                                            <td>{{list.position}}</td>
                                            <td>{{list.RentType}}</td>
                                            <td>{{list.TenantUlocation}}</td>
                                            <td>{{list.create_time}}</td>
                                        </tr>
                                        {{/each}} {{else}}
                                        <tr>
                                            <td colspan="20" style="text-align: center">暂无相关数据</td>
                                        </tr>
                                        {{/if}}
                                    </script>
                                </tbody>
                            </table>
                            <div id="bottomPaging"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
       //请求地址
       var url = "GetAssetRentRecordListKey";
        $(function(){
            param.startDateTime='';
            param.endDateTime='';
            list.get(url, param);
            layui.use(["form",'laydate'], function () {
                $ = layui.jquery;
                var form = layui.form;
                var laydate = layui.laydate;
                laydate.render({
                    elem: '#startDateTime' 
                });
                laydate.render({
                    elem: '#endDateTime' 
                });
                //租户
                param.ComboBox = "all";
                list.info('GetTenantListKey',param,function(res){
                    var tenanthtml = "";
                    $.each(res.data, function (n, val) {
                        tenanthtml += "<option value=\"" + val.id + "\">" + val.TenantName + "</option>";
                    });
                    $("#RentId").append(tenanthtml);
                    form.render("select");
                })
                //监听提交
                form.on("submit(search)", function (data) {
                    delete(param['ComboBox']);
                    param.pageNo = 1;
                    param.search = data.field.search;
                    param.startDateTime = data.field.startDateTime;
                    param.endDateTime = data.field.endDateTime;
                    param.RentId = data.field.RentId;
                    param.RentType = data.field.RentType;
                    list.get(url, param);
                    return false;
                });
            });
        });
        //分页回调
        function pagechange(curr) {
            delete(param['ComboBox']);
            param.pageNo = curr;
            list.get(url, param);
        }
    </script>
</body>
</html>
