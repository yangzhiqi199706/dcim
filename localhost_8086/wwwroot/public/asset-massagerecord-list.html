<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                资产管理->查询及报表->消息记录
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <div class="two-left three-left-big">
                            <form class="layui-form layui-col-md12">
                                <text>消息类型</text>
                                <select id="MsgType" name="MsgType" lay-filter="MsgType">
                                    <option value="">全部类型</option>
                                    <option value="报废到期">报废到期</option>
                                    <option value="保修到期">保修到期</option>
                                    <option value="维保到期">维保到期</option>
                                    <option value="逾期未还">逾期未还</option>
                                    <option value="在线异常">在线异常</option>
                                </select>
                                <text>消息状态</text>
                                <select id="MsgStatus" name="MsgStatus" lay-filter="MsgStatus">
                                    <option value="">所有状态</option>
                                    <option value="未确认">未确认</option>
                                    <option value="已确认">已确认</option>
                                    <option value="确认不再提醒">确认不再提醒</option>
                                </select>
                                <text>消息时间</text>
                                <div class="layui-input-inline">
                                    <input type="text" id="startDateTime" name="startDateTime" class="layui-input" placeholder="开始日期" >
                                </div>
                                <div class="layui-input-inline">
                                    <input type="text" id="endDateTime" name="endDateTime" class="layui-input" placeholder="结束日期" >
                                </div>
                                <text>确认时间</text>
                                <div class="layui-input-inline">
                                    <input type="text" id="ComfireStartDateTime" name="ComfireStartDateTime" class="layui-input" placeholder="开始日期" >
                                </div>
                                <div class="layui-input-inline">
                                    <input type="text" id="ComfireEndDateTime" name="ComfireEndDateTime" class="layui-input" placeholder="结束日期" >
                                </div>
                                <text>关键词</text>
                                <input type="text" name="search"  placeholder="请输入主体名称、消息描述" autocomplete="off" class="layui-input">
                                <div class="two-search">
                                    <button class="layui-btn" lay-submit lay-filter="search" type="button">查询</button>
                                </div>
                            </form>
                        </div>
                        <div class="two-right-big">
                            <table class="layui-table">
                                <thead>
                                    <tr>
                                        <th>编号</th>
                                        <th>主体编号</th>
                                        <th>主体名称</th>
                                        <th>消息类型</th>
                                        <th>消息描述</th>
                                        <th>消息时间</th>
                                        <th>消息状态</th>
                                        <th>确认时间</th>
                                        <th>确认人</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <script type="text/html" id="listtemplate">
                                        {{if data.info.length!=0}} {{each data.info as list i}}
                                        <tr>
                                            <td>{{(data.page.p-1)*15+(i+1)}}</td>
                                            <td>{{list.MainNumber}}</td>
                                            <td>{{list.MainName}}</td>
                                            <td>{{list.MsgType}}</td>
                                            <td>{{list.MsgDescribe}}</td>
                                            <td>{{list.create_time}}</td>
                                            <td>{{list.MsgStatus}}</td>
                                            <td>{{list.CheckTime}}</td>
                                            <td>{{list.PersonName}}</td>
                                        </tr>
                                        {{/each}} {{else}}
                                        <tr>
                                            <td colspan="20" style="text-align: center">暂无相关数据</td>
                                        </tr>
                                        {{/if}}
                                    </script>
                                </tbody>
                            </table>
                            <div id="bottomPaging"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        //请求地址
        var url = "GetAssetMsgKey";
        $(function(){
            list.get(url, param);
            layui.use(["form",'laydate'], function () {
                $ = layui.jquery;
                var form = layui.form;
                var laydate = layui.laydate;
                laydate.render({
                    elem: '#startDateTime' 
                });
                laydate.render({
                    elem: '#endDateTime' 
                });
                laydate.render({
                    elem: '#ComfireStartDateTime' 
                });
                laydate.render({
                    elem: '#ComfireEndDateTime' 
                });
                //监听提交
                form.on("submit(search)", function (data) {
                    param.pageNo = 1;
                    param.search = data.field.search;
                    param.MsgType = data.field.MsgType;
                    param.MsgStatus = data.field.MsgStatus;
                    param.startDateTime = data.field.startDateTime;
                    param.endDateTime = data.field.endDateTime;
                    param.ComfireStartDateTime = data.field.ComfireStartDateTime;
                    param.ComfireEndDateTime = data.field.ComfireEndDateTime;
                    list.get(url, param);
                    return false;
                });
            });
        });
        //分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            list.get(url, param);
        }
    </script>
</body>
</html>
