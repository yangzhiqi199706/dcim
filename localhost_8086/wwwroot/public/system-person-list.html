<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>系统配置->人员管理</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" placeholder="请输入姓名" name="search">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <select id="GroupId" name="GroupId" lay-filter="GroupId">
                                    <option value="">全部用户组</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                        <button class="layui-btn x-right" style="margin-left: 10px;"
                            onclick="xadmin.open('添加人员','system-person-add.html')">
                            <i class="layui-icon"></i>添加人员
                        </button>
                        <button class="layui-btn x-right" type="button" id="personOut">导出</button>
                        <a class="layui-btn x-right" id="personPtl">
                            导入
                        </a>
                        <a href="person.xls" download="" class="importTpl x-right" style="margin-top: 7px;">《下载模版》</a>
                    </div>
                    <div class="layui-card-body">
                        <table class="layui-table layui-form">
                            <thead>
                                <tr>
                                    <th>编号</th>
                                    <th>工号</th>
                                    <th>姓名</th>
                                    <th>性别</th>
                                    <th>部门</th>
                                    <th>手机号</th>
                                    <th>企业微信URL</th>
                                    <th>钉钉URL</th>
                                    <th>账号</th>
                                    <th>Email</th>
                                    <th>角色权限</th>
                                    <th>用户组</th>
                                    <th>禁用</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.info.length!=0}} {{each data.info as list i}}
                                    <tr>
                                        <td>{{(data.page.p-1)*15+(i+1)}}</td>
                                        <td>{{list.PersonNumber}}</td>
                                        <td>{{list.PersonName}}</td>
                                        <td>{{list.sex}}</td>
                                        <td>{{list.DeptName}}</td>
                                        <td>{{list.PersonPhone}}</td>
                                        <td>{{list.WeicomUrl}}</td>
                                        <td>{{list.DingdingUrl}}</td>
                                        <td>{{list.PersonAccount}}</td>
                                        <td>{{list.email}}</td>
                                        <td>{{list.RoleName}}</td>
                                        <td>{{list.GroupName}}</td>
                                        <td>
                                            {{if list.id!='1'}}
                                            <input type="checkbox" name="PersonStatus" value="{{list.PersonStatus}}" data-id="{{list.id}}" lay-skin="switch" lay-text="YES|NO" lay-filter="PersonStatus" {{ list.PersonStatus == -1 ? 'checked' : '' }}>
                                            {{/if}}
                                        </td>
                                        <td>
                                            {{if list.id!='1' || (list.id=='1' && userId == '1')}}
                                            <a title="编辑" onclick="xadmin.open('编辑','system-person-edit.html','','','{{list.id}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe642;</i>
                                            </a>
                                            {{/if}}
                                            {{if list.id!='1'}}
                                            <a title="删除" onclick="deletePerson('{{list.id}}', '{{list.GroupId}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe640;</i>
                                            </a>
                                            {{/if}}
                                        </td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                    </div>
                    <table id="listout" style="display: none;">
                        <thead>
                            <tr>
                                <th>姓名*</th>
                                <th>工号*</th>
                                <th>性别*</th>
                                <th>角色权限</th>
                                <th>部门*</th>
                                <th>手机号</th>
                                <th>企业微信URL</th>
                                <th>钉钉URL</th>
                                <th>账号</th>
                                <th>密码</th>
                                <th>Email</th>
                                <th>用户组</th>
                                <th>门禁类型</th>
                                <th>门禁权限</th>
                                <th>门禁卡号（海康卡号后需注明卡类型）</th>
                                <th>访问有效期开始（中控不需要设置）</th>
                                <th>访问有效期结束（中控不需要设置）</th>
                                <th>门禁密码</th>
                                <th>备注</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                    <script type="text/html" id="detail">
                        {{if data.length!=0}} {{each data as list i}}
                        {{if list.id>1 }}
                        <tr>
                            <td>{{list.PersonName}}</td>
                            <td>{{list.PersonNumber}}</td>
                            <td>{{list.sex}}</td>
                            <td>{{list.role_name}}</td>
                            <td>{{list.DeptName}}</td>
                            <td>{{list.PersonPhone}}</td>
                            <td>{{list.WeicomUrl}}</td>
                            <td>{{list.DingdingUrl}}</td>
                            <td>{{list.PersonAccount}}</td>
                            <td></td>
                            <td>{{list.email}}</td>
                            <td>{{list.GroupName}}</td>
                            <td>{{list.DoorType}}</td>
                            <td>{{list.DoorPri}}</td>
                            <td>{{list.DoorCard}}</td>
                            <td>&nbsp;{{list.ValidStratTime}}</td>
                            <td>&nbsp;{{list.ValidEndTime}}</td>
                            <td>{{list.DoorPass}}</td>
                            <th>{{list.remark}}</th>
                        </tr>
                        {{/if}}
                        {{/each}} {{else}}
                        <tr>
                            <td colspan="20" style="text-align: center">暂无相关数据</td>
                        </tr>
                        {{/if}}
                    </script>
                </div>
            </div>
        </div>
    </div>
    <script>
        //请求地址
        var url = "GetEmpListKey";
        var form;
        var groupList = [];
        $(function () {
            layui.use(["form", "upload"], function () {
                $ = layui.jquery;
                form = layui.form;
                upload = layui.upload;
                upPtl();
                $.ajaxSettings.async = false;
                // 获取用户组列表
                list.info('GetPersonGroupListKey', {
                    token:token,
                    ComboBox:'all'
                }, function (res) {
                    groupList = res.data || [];
                    var html = '<option value="">全部用户组</option>';
                    groupList.forEach(function (group) {
                        html += '<option value="' + group.id + '">' + group.GroupName + '</option>';
                    });
                    $("#GroupId").html(html);
                    form.render('select');
                });
                $.ajaxSettings.async = true;

                //初始化数据
                loadPersonList();

                form.on("switch(PersonStatus)", function (data) {
                    var PersonStatus = data.elem.checked ? -1 : 1;
                    list.info('ChangeEmpStatusKey', {
                        token: token,
                        status: PersonStatus,
                        id: data.elem.attributes['data-id'].value
                    }, function () { });
                });

                // 监听提交
                form.on("submit(search)", function (data) {
                    param.pageNo = 1;
                    param.search = data.field.search;
                    param.GroupId = data.field.GroupId ? ',' + data.field.GroupId + ',' : '';
                    loadPersonList();
                    return false;
                });
            });

            //导出
            $('#personOut').click(function () {
                list.info(url, {
                    token: token,
                    ComboBox: 'all',
                    search: param.search,
                    GroupId: param.GroupId // 添加用户组筛选条件
                }, function (res) {
                    if (res.data.length > 0) {
                        dealdata(res, function (r) {
                            let htmls = template("detail", r);
                            $("#listout tbody").html(htmls);
                            displayexport('personOut', 'listout', '人员列表', true);
                        });
                    }
                })
            })
        });
        // 处理数据
        function dealdata(r, callback) {
            r.userId=userId;
            let data = r.data.info;
            if (callback) data = r.data;
            if (data) {
                $.each(data,function (n,item) {
                    item.GroupName = getGroupNames(item.GroupId);
                    if(item.DoorType=='1'){
                        item.DoorType = '中控';
                        if(item.ZktDoorPri){
                            switch(item.ZktDoorPri){
                                case '0':item.DoorPri='普通用户';break;
                                case '2':item.DoorPri='登记员';break;
                                case '6':item.DoorPri='管理员';break;
                                case '14':item.DoorPri='超级管理员';break;
                            }
                        }
                        item.DoorCard = item.DoorCardNum;
                    }else if(item.DoorType=='2'){
                        item.DoorType = '海康';
                        if(item.HikDoorPri){
                            switch(item.HikDoorPri){
                                case '0':item.DoorPri='普通用户';break;
                                case '2':item.DoorPri='来宾';break;
                                case '6':item.DoorPri='非授权名单';break;
                            }
                        }
                        item.DoorCard = '';
                        if(item.DoorCardList){
                            let DoorCardListArr = JSON.parse(item.DoorCardList);
                            $.each(DoorCardListArr, function (x, val) {
                                console.log(val)
                                if(val){
                                    let text;
                                    switch (val.cardType) {
                                        case 'normalCard': text = '正常卡'; break;
                                        case 'hijackCard': text = '胁迫卡'; break;
                                        case 'dismissingCard': text = '解除卡'; break;
                                    }
                                    item.DoorCard+=val.cardNo+'（'+text+'）、'
                                }
                            })
                        }
                    }
                    if(n+1 == data.length){
                        let res = {
                            data: data
                        }
                        console.log(res)
                        if (callback) callback(res);
                    }
                });
            }
        }

        function loadPersonList() {
            list.get(url, param, dealdata,function(){
                form.render();
            });
        }

        function getGroupNames(groupIdStr) {
            if (!groupIdStr) return '';
            var ids = groupIdStr.replace(/^,|,$/g, '').split(',').filter(Boolean);
            var names = [];
            for (var i = 0; i < ids.length; i++) {
                var group = groupList.find(g => g.id == ids[i]);
                if (group) names.push(group.GroupName);
            }
            return names.join('、');
        }

        // 导入功能
        function upPtl() {
            upload.render({
                elem: '#personPtl',
                data: { 'token': token },
                accept: 'file',
                exts: 'xls',
                url: ajaxUrl + 'ImportPersonKey',
                before: function (obj) {
                    layer.load();
                },
                done: function (res) {
                    layer.closeAll('loading');
                    if (res.code == 100) {
                        layer.msg("导入成功！", { icon: 1, time: 2000 });
                    } else {
                        layer.msg(res.msg, { icon: 5, time: 2000 });
                    }
                },
                error: function (res) {
                    layer.closeAll('loading');
                    layer.msg(res.msg, { icon: 5, time: 2000 });
                }
            });
        }

        //分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            loadPersonList();
        }

        //删除后重新加载数据
        function pageDataInit(){
            layer.msg("删除成功", { icon: 1, time: 2000 },function(){});
            param.pageNo = 1;
            // param.search = data.field.search;
            // param.GroupId = data.field.GroupId ? ',' + data.field.GroupId + ',' : '';
            loadPersonList();
            //通知海康心跳
            getDoorInfo('hik', '');
        }

        // 删除人员
        function deletePerson(id, groupId) {
            var allSN = [];
            x_admin_del('确认删除吗？', 'DelEmpKey', id, function () {
                if (groupId) {
                    var resGroupId = groupId.split(',').map(id => id.trim()).filter(id => id !== '');
                    $.ajaxSettings.async = false;
                    list.info('GetDoorParamListKey', {
                        token: token,
                        ComboBox: 'all'
                    }, function (res) {
                        let data = res.data;
                        $.each(data, function (n, val) {
                            if (val.GroupId) {
                                let GroupIds = val.GroupId;
                                let valGroupIds = GroupIds.split(',').map(id => id.trim()).filter(id => id !== '');
                                if (valGroupIds.some(id => resGroupId.includes(id))) {
                                    allSN.push(val.DevId);
                                }
                            }
                        });
                    });
                    $.ajaxSettings.async = true;

                    if (allSN.length > 0) {
                        submitSN(0,id);
                    } else {
                        pageDataInit();
                    }

                } else {
                    pageDataInit();
                }

            });

            //递归提交  最后一个 则提示删除成功
            function submitSN(index,PersonId) {
                if (index >= allSN.length) {
                    pageDataInit();
                    return;
                }
                var DevId = allSN[index];
                var changeDoorParamData = {
                    DevId: DevId,
                    token: token,
                    delUser: PersonId
                };

                list.info("ChangeDoorParamKey", changeDoorParamData, function (response) {
                    submitSN(index + 1,PersonId);
                });
            }

        }
        
    </script>
</body>

</html>
