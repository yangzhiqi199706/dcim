<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/echarts.js" type="text/javascript" charset="utf-8"></script>
    <style>
        .massage-box-md6{width:calc(50% - 30px);max-height:308px;overflow-y: auto;}
        .massage-chart{height:280px}
        #zichanChart{height:282px}
    </style>
</head>

<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>资产管理->资产概况</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <div class="massage-box">
                            <div class="capacity-statistics-title">IT设备分类统计</div>
                            <div id="itChart" class="massage-chart"></div>
                        </div>
                        <div class="massage-box">
                            <div class="capacity-statistics-title">基础设施分类统计</div>
                            <div id="jichuChart" class="massage-chart"></div>
                        </div>
                        <div class="massage-box">
                            <div class="capacity-statistics-title">备品备件分类统计</div>
                            <div id="beipinChart" class="massage-chart"></div>
                        </div>
                        <div class="massage-box massage-box-md6">
                            <div class="capacity-statistics-title">资产状态统计</div>
                            <div id="zichanChart" class="massage-chart"></div>
                        </div>
                        <div class="two-left massage-box-md6">
                            <div class="capacity-statistics-title">资产消息</div>
                            <table class="layui-table">
                                <thead>
                                    <tr>
                                        <th>消息描述</th>
                                        <th>消息时间</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <script type="text/html" id="listtemplate">
                                        {{if data.info.length!=0}} {{each data.info as list i}}
                                        <tr>
                                            <td>{{list.MainName}}{{list.MsgDescribe}}</td>
                                            <td>{{list.create_time}}</td>
                                        </tr>
                                        {{/each}} {{else}}
                                        <tr>
                                            <td colspan="20" style="text-align: center">暂无相关数据</td>
                                        </tr>
                                        {{/if}}
                                    </script>
                                </tbody>
                            </table>
                            <div id="bottomPaging"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        //请求地址
        var url = "GetAssetMsgKey";
        $(function () {
            //初始化消息数据
            list.get(url, param);
            //it
            list.info('GetAssetsSurplusStatisticKey', {
                token: token,
                type: 'it'
            }, function (r) {
                var chartdata = [];

                $.each(r.data, function (n, val) {
                    var have = false;
                    $.each(chartdata, function (x, y) {
                        if (val['AssetsTypeName'] == y['AssetsTypeName']) {
                            y['Number']++;
                            have = true;
                            return;
                        }
                    })
                    if (!have) {
                        chartdata.push({
                            AssetsTypeName: val['AssetsTypeName'],
                            AssetsTypeId: val['AssetsTypeId'],
                            Number: 1
                        })
                    }
                });

                var changetitle = [];
                var changedata = [];

                $.each(chartdata, function (x, y) {
                    changetitle.push({'name':y['AssetsTypeName'],'icon': 'circle'});
                    changedata.push({'value':y['Number'], 'name':y['AssetsTypeName']});
                });

                var changeChartDom = document.getElementById('itChart');
                var changeChart = echarts.init(changeChartDom);
                var changeChartoption = setChart(changetitle, changedata);
                changeChartoption && changeChart.setOption(changeChartoption);

            })
            //基础设施
            list.info('GetAssetsSurplusStatisticKey', {
                token: token,
                type: 'install'
            }, function (r) {
                var chartdata = [];

                $.each(r.data, function (n, val) {
                    var have = false;
                    $.each(chartdata, function (x, y) {
                        if (val['AssetsTypeName'] == y['AssetsTypeName']) {
                            y['Number']++;
                            have = true;
                            return;
                        }
                    })
                    if (!have) {
                        chartdata.push({
                            AssetsTypeName: val['AssetsTypeName'],
                            AssetsTypeId: val['AssetsTypeId'],
                            Number: 1
                        })
                    }
                });

                var changetitle = [];
                var changedata = [];

                $.each(chartdata, function (x, y) {
                    changetitle.push({'name':y['AssetsTypeName'],'icon': 'circle'});
                    changedata.push({'value':y['Number'], 'name':y['AssetsTypeName']});
                });

                var changeChartDom = document.getElementById('jichuChart');
                var changeChart = echarts.init(changeChartDom);
                var changeChartoption = setChart(changetitle, changedata);
                changeChartoption && changeChart.setOption(changeChartoption);

            })
            //备品备件
            list.info('GetSparepartsStatisticKey', {
                token: token
            }, function (r) {
                var chartdata = [];

                $.each(r.data, function (n, val) {
                    var have = false;
                    $.each(chartdata, function (x, y) {
                        if (val['AssetsTypeName'] == y['AssetsTypeName']) {
                            y['Number']++;
                            have = true;
                            return;
                        }
                    })
                    if (!have) {
                        chartdata.push({
                            AssetsTypeName: val['AssetsTypeName'],
                            AssetsTypeId: val['AssetsTypeId'],
                            Number: 1
                        })
                    }
                });

                var changetitle = [];
                var changedata = [];

                $.each(chartdata, function (x, y) {
                    changetitle.push({'name':y['AssetsTypeName'],'icon': 'circle'});
                    changedata.push({'value':y['Number'], 'name':y['AssetsTypeName']});
                });

                var changeChartDom = document.getElementById('beipinChart');
                var changeChart = echarts.init(changeChartDom);
                var changeChartoption = setChart(changetitle, changedata);
                changeChartoption && changeChart.setOption(changeChartoption);

            })
            //资产状态
            list.info('GetAssetStatusCountKey', {
                token: token
            }, function (r) {

                var changetitle = [];
                var changedata = [];

                $.each(r.data, function (x, val) {
                    switch (val.AssetStatus) {
                        case 'I': val.AssetStatus = '入库'; break;
                        case 'W': val.AssetStatus = '待上架'; break;
                        case 'F': val.AssetStatus = '在架'; break;
                        case 'FR': val.AssetStatus = '在架维修'; break;
                        case 'IR': val.AssetStatus = '在库维修'; break;
                        case 'L': val.AssetStatus = '领用'; break;
                        case 'G': val.AssetStatus = '赠送'; break;
                        case 'Y': val.AssetStatus = '遗失'; break;
                        case 'R': val.AssetStatus = '报废'; break;
                        case 'DF': val.AssetStatus = '外送维修（在架）'; break;
                        case 'DI': val.AssetStatus = '外送维修（在库）'; break;
                        case 'O': val.AssetStatus = '待安装'; break;
                        case 'T': val.AssetStatus = '安装'; break;
                        case 'B': val.AssetStatus = '借用'; break;
                        case 'U': val.AssetStatus = '下架'; break;
                    }
                    changetitle.push(val.AssetStatus);
                    changedata.push(val.TotalNumber);
                });

                var changeChartDom = document.getElementById('zichanChart');
                var changeChart = echarts.init(changeChartDom);
                var changeChartoption = setbarChart(changetitle, changedata);
                changeChartoption && changeChart.setOption(changeChartoption);

            })
        })
        //报表tpl
        function setChart(alarmtitle, alarmdata) {
            var changeChartoption = {
                legend: {
                    orient: 'vertical', 
                    data: alarmtitle,
                    right: 0,
                    top: 55,
                    itemWidth:6,
                    itemHeight:6,
                    textStyle: {
                        color:'#A2CAE1',
                        fontSize:'11',
                        lineHeight: 15
                    },
                    formatter: function(name){
                        var total = 0;
                        var tarValue = 0;
                        for (var i = 0, l =alarmdata.length; i < l; i++) {
                            total += parseInt(alarmdata[i].value);
                            if (alarmdata[i].name == name) {
                                tarValue = alarmdata[i].value;
                            }
                        }
                        total = total==0?1:total;
                        var p = (tarValue / total * 100).toFixed(2);
                        return name+ ' ' + p + '%';
                    }
                },
                color:['#35DFFC','#3783FF','#FFCC37','#FF9000','#F96055'],
                series: [
                    {
                        name: '',
                        type: 'pie',
                        radius: ['65%', '90%'],
                        top:25,
                        left:-80,
                        bottom:0,
                        itemStyle:{
                            shadowColor: 'rgba(225, 229, 255, 0.69)',
                            shadowBlur: 16
                        },label: {
                            show: false,
                            position: 'center',
                            textStyle: {
                                color:'#ffffff',
                                fontSize:'14',
                                lineHeight: 15
                            },
                        },
                        emphasis: {
                            label: {
                                show: true,
                                fontSize: '14.3',
                                fontWeight: 'bold',
                                formatter: '{b}：{c}'
                            }
                        },
                        data:alarmdata
                    }
                ]
            };
            return changeChartoption;
        }
        //报表tpl
        function setbarChart(changetitle, changedata) {
            var changeChartoption = {
                xAxis: {
                    type: 'category',
                    data: changetitle,
                    axisLine: {
                        show: true,
                        lineStyle: {
                            type: 'solid',
                            color: '#1898ED',
                            width: '1'
                        }
                    },
                    axisLabel: {
                        interval: 0,
                        textStyle: {
                            color: '#A2CAE1',
                            fontSize: '13'
                        },
                    }
                },
                yAxis: {
                    type: 'value',
                    axisLabel: {
                        textStyle: {
                            color: '#A2CAE1',
                            fontSize: '13'
                        },

                    },
                    splitLine: {
                            lineStyle: {
                                color: 'rgba(24, 152, 237, 0.17）',
                                type: 'dashed'
                            }
                        },
                    axisLabel: {
                        interval: 0,
                        textStyle: {
                            color: '#A2CAE1',//坐标值得具体的颜色
                        }
                    }
                },
                grid: {
                    x: 40,
                    y: 20,
                    x2: 25,
                    y2: 30
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    }
                },
                series: [{
                    data: changedata,
                    label: {
                        show: true,
                        position: 'top'
                    },
                    type: 'bar',
                    barWidth: 20,
                    showBackground: true,
                    backgroundStyle: {
                        color: '#F4F8FB'
                    },
                }]
            };
            return changeChartoption;
        }
        //分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            list.get(url, param);
        }
    </script>
</body>

</html>
