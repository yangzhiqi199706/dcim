<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <link rel="stylesheet" href="./css/dcim-dh.css">
    <link rel="stylesheet" href="./css/swiper.min.css">
    <script src="js/swiper.jquery.min.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/jessibuca.js"></script>
    <style>
        html,
        body {
            position: relative;
            height: 100%;
            min-width: 100%;
        }

        body {
            background: #030955;
            font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
            font-size: 14px;
            color: #000;
            margin: 0;
            padding: 0
        }

        .swiper-container {
            width: 100%;
            height: 100%
        }

        .swiper-slide {
            text-align: center;
            font-size: 18px;
            background: #fff;
            display: -webkit-box;
            display: -ms-flexbox;
            display: -webkit-flex;
            display: flex;
            -webkit-box-pack: center;
            -ms-flex-pack: center;
            -webkit-justify-content: center;
            justify-content: center;
            -webkit-box-align: center;
            -ms-flex-align: center;
            -webkit-align-items: center;
            align-items: center
        }

        .x-iframe {
            width: 100%;
            height: 100%
        }

        .swiper-slide .x-iframe::-webkit-scrollbar {
            width: 5px;
            height: 5px;
            background-color: #222;
        }

        .swiper-slide .x-iframe::-webkit-scrollbar-track {
            -webkit-border-radius: 6px;
            -moz-border-radius: 6px;
            border-radius: 6px;
            background-color: #222;
        }

        .swiper-slide .x-iframe::-webkit-scrollbar-thumb {
            background-color: #148cf1;
            -webkit-border-radius: 6px;
            -moz-border-radius: 6px;
            border-radius: 6px;
        }

        .swiper-pagination,
        .swiper-button-prev,
        .swiper-button-next {
            display: none;
        }
    </style>
</head>

<body>
    <!-- Swiper -->
    <div class="swiper-container">
        <div class="swiper-wrapper">
        </div>
        <!-- Add Pagination -->
        <!-- <div class="swiper-pagination swiper-pagination-white"></div> -->
        <!-- Add Navigation -->
        <div class="swiper-button-prev swiper-button-white"></div>
        <div class="swiper-button-next swiper-button-white"></div>
    </div>
    <!-- Initialize Swiper -->
    <script>

        var showOperateBtns = true; // 是否显示按钮
        var forceNoOffscreen = true; //
        var playList = [];

        //获取地址栏携带的ids
        let ids = GetString("ids");
        let idsArr = ids.split(',');
        let ani = GetString("ani");//切换动画
        let anitime = GetString("anitime");//单屏展示时间
        let anispeed = GetString("anispeed");//切换速度

        console.log(idsArr);

        $(function () {
            //先登录
            getVideoToken();

            //初始化html
            let html = '';
            if (idsArr.length > 0) {
                $.each(idsArr, function (n, val) {
                    if(val)html += `<div class="swiper-slide"><div id="video0-${n + 1}"></div></div>`;
                })
            }
            $('.swiper-wrapper').html(html);

            //swiper 配置
            var swiperOption = {
                // pagination: '.swiper-pagination',
                nextButton: '.swiper-button-next',
                prevButton: '.swiper-button-prev',
                autoplayDisableOnInteraction : false,
            };
            if (ani) swiperOption.effect = ani;
            if (anitime) swiperOption.autoplay = parseInt(anitime) * 1000;
            if (anispeed) swiperOption.speed = parseInt(anispeed);

            var swiper = new Swiper('.swiper-container', swiperOption);

            if (idsArr.length > 1) {
                $('.swiper-pagination,.swiper-button-next,.swiper-button-prev').show();
            }

            //初始化窗口
            setTimeout(function () {
                setVideoWin(idsArr.length);

                if (idsArr.length > 0) {
                    $.each(idsArr, function (n, val) {
                        var videoplayurl = 'api/play/start/' + val.split('_')[0] + '/' + val.split('_')[1];
                        playVideo(n, videoplayurl, 0);
                    })
                }
            },1000)

        })

        //播放视频流
        function playVideo(index, videoplayurl, tryTime) {
            videolist.info('get', videoplayurl, '', function (res) {
                if (res.code == 0) {
                    let player = playList[index];
                    var playUrl = (window.location.protocol === 'https:' ? res.data?.https_flv : res.data?.flv) || res.data?.ws_flv || res.data?.url || '';
                    if (playUrl) {
                        player && player.play(playUrl).then(() => {
                        }).catch((e) => {
                            console.error(e);
                        });
                    }
                } else if (res.code == -2) {
                    if (tryTime <= 3) {
                        playVideo(val, videoplayurl, tryTime++);
                    }
                }
            })
        }

        //创建播放器
        function create(num, id) {
            var $container = document.getElementById('video' + num + '-' + id);

            var jessibuca = new Jessibuca({
                container: $container,
                videoBuffer: 0.2, // 缓存时长
                isResize: false,
                text: "",
                loadingText: "加载中",
                debug: true,
                showBandwidth: showOperateBtns, // 显示网速
                operateBtns: {
                    fullscreen: showOperateBtns,
                    screenshot: showOperateBtns,
                    play: showOperateBtns,
                    audio: showOperateBtns,
                },
                forceNoOffscreen: forceNoOffscreen,
                isNotMute: false,
            },);

            jessibuca.onLog = msg => console.error(msg);
            jessibuca.onRecord = (status) => console.log('onRecord', status);
            jessibuca.onPause = () => console.log('onPause');
            jessibuca.onPlay = () => console.log('onPlay');
            jessibuca.onFullscreen = msg => console.log('onFullscreen', msg);
            jessibuca.onMute = msg => console.log('onMute', msg);
            playList.push(jessibuca);
        }
        //根据需求创建多个播放器
        function setVideoWin(len) {
            for (let i = 0; i < len; i++) {
                create('0', i + 1);
            }
        }
        //摧毁所有播放器
        function destroyVideo(len) {
            for (let i = 0; i < len; i++) {
                let player = playList[i];
                player && player.destroy()
            }
            playList = [];
        }

    </script>
</body>

</html>
