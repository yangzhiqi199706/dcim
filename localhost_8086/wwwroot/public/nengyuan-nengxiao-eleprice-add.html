<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <style>
        /* 隐藏秒选择器 */
        .laydate-time-list li:last-of-type {
            display: none
        }

        .layui-laydate-list>li {
            width: 50%
        }

        /* 新增样式 - 保持原有界面风格 */
        .time-segment-group {
            display: inline-block;
            vertical-align: top;
        }

        .time-segment-item {
            margin-bottom: 5px;
            display: flex;
            align-items: center;
        }

        .add-time-btn {
            color: #01AAED;
            cursor: pointer;
            margin-left: 5px;
            font-size: 18px;
            vertical-align: middle;
            display: inline-block;
            width: 30px;
            text-align: center;
        }

        .add-time-btn:hover {
            color: #009688;
        }

        .remove-time-btn {
            color: #FF5722;
            cursor: pointer;
            margin-left: 5px;
            font-size: 18px;
            vertical-align: middle;
            display: inline-block;
            width: 30px;
            text-align: center;
        }

        .remove-time-btn:hover {
            color: #f04124;
        }

        /* 保持原有的layui样式不变 */
        .layui-input-inline {
            position: relative;
        }

        .time-range {
            width: 190px !important;
            /* 略微调小以适应按钮 */
        }
    </style>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <div class="layui-form-item">
                    <label class="layui-form-label">名称<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="EleRuleName" value="" name="EleRuleName" lay-verify="required"
                            autocomplete="off" class="layui-input" placeholder="请输入名称">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">
                        所属服务器<span class="x-red">*</span>
                    </label>
                    <div class="layui-input-inline">
                        <select id="ServerCode" name="ServerCode" lay-verify="required" lay-filter="ServerCode">
                            <option value="">请选择</option>
                        </select>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">
                        所属区域<span class="x-red">*</span>
                    </label>
                    <div class="layui-input-inline">
                        <select id="AreaId" name="AreaId" lay-verify="required" lay-filter="AreaId">
                            <option value="">请选择</option>
                        </select>
                    </div>
                </div>

                <!-- 尖段多时间段 -->
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        尖段<span class="x-red">*</span>
                    </label>
                    <div class="layui-input-inline time-segment-group" id="SharpTimeGroup">
                        <div class="time-segment-item">
                            <input type="text" class="layui-input time-range" id="SharpTime_0" name="SharpTime[]"
                                placeholder="请选择时间段" readonly>
                            <span class="add-time-btn" onclick="addTimeSegment('Sharp')" title="添加时间段">+</span>
                        </div>
                    </div>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" id="SharpPrice" name="SharpPrice" placeholder="请输入电价">
                    </div>
                </div>

                <!-- 峰段多时间段 -->
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        峰段<span class="x-red">*</span>
                    </label>
                    <div class="layui-input-inline time-segment-group" id="HighTimeGroup">
                        <div class="time-segment-item">
                            <input type="text" class="layui-input time-range" id="HighTime_0" name="HighTime[]"
                                placeholder="请选择时间段" readonly>
                            <span class="add-time-btn" onclick="addTimeSegment('High')" title="添加时间段">+</span>
                        </div>
                    </div>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" id="HighPrice" name="HighPrice" placeholder="请输入电价">
                    </div>
                </div>

                <!-- 平段多时间段 -->
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        平段<span class="x-red">*</span>
                    </label>
                    <div class="layui-input-inline time-segment-group" id="FlatTimeGroup">
                        <div class="time-segment-item">
                            <input type="text" class="layui-input time-range" id="FlatTime_0" name="FlatTime[]"
                                placeholder="请选择时间段" readonly>
                            <span class="add-time-btn" onclick="addTimeSegment('Flat')" title="添加时间段">+</span>
                        </div>
                    </div>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" id="FlatPrice" name="FlatPrice" placeholder="请输入电价">
                    </div>
                </div>

                <!-- 谷段多时间段 -->
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        谷段<span class="x-red">*</span>
                    </label>
                    <div class="layui-input-inline time-segment-group" id="LowTimeGroup">
                        <div class="time-segment-item">
                            <input type="text" class="layui-input time-range" id="LowTime_0" name="LowTime[]"
                                placeholder="请选择时间段" readonly>
                            <span class="add-time-btn" onclick="addTimeSegment('Low')" title="添加时间段">+</span>
                        </div>
                    </div>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" id="LowPrice" name="LowPrice" placeholder="请输入电价">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">
                        时间<span class="x-red">*</span>
                    </label>
                    <div class="layui-input-inline">
                        <input type="text" class="layui-input" id="EleMonth" name="EleMonth"
                            placeholder="请输入月份，如：5,6,12">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
            </form>
        </div>
    </div>

    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>

    <script>
        layui.use(["form", "laydate"], function () {
            $ = layui.jquery;
            var form = layui.form;
            var laydate = layui.laydate;

            // 存储每个时段的时间段数量
            var segmentCount = {
                Sharp: 1,
                High: 1,
                Flat: 1,
                Low: 1
            };

            // 初始化时间选择器
            function initTimePicker(selector) {
                laydate.render({
                    elem: selector,
                    type: 'time',
                    range: true,
                    format: 'HH:mm',
                    done: function (value, date, endDate) {
                        console.log('时间选择完成，值：', value);
                        // 立即验证所有时间段
                        validateTimeOverlap();
                    }
                });
            }

            // 初始化所有时间选择器
            initTimePicker('#SharpTime_0');
            initTimePicker('#HighTime_0');
            initTimePicker('#FlatTime_0');
            initTimePicker('#LowTime_0');

            // 添加时间段
            window.addTimeSegment = function (type) {
                var groupId = '#' + type + 'TimeGroup';
                var count = segmentCount[type];

                // 最多允许添加5个时间段
                if (count >= 5) {
                    layer.msg('最多只能添加5个时间段', { icon: 0 });
                    return;
                }

                var newId = type + 'Time_' + count;
                var removeBtnId = 'remove_' + type + '_' + count;

                // 创建新的时间段输入框
                var newItem = $('<div>', {
                    class: 'time-segment-item',
                    id: 'item_' + newId
                });

                var newInput = $('<input>', {
                    type: 'text',
                    class: 'layui-input time-range',
                    id: newId,
                    name: type + 'Time[]',
                    placeholder: '请选择时间段',
                    readonly: true
                });

                var removeBtn = $('<span>', {
                    class: 'remove-time-btn',
                    id: removeBtnId,
                    title: '删除时间段',
                    html: '×',
                    onclick: 'removeTimeSegment("' + newId + '", "' + type + '")'
                });

                newItem.append(newInput);
                newItem.append(removeBtn);

                // 添加到对应的时间段组
                $(groupId).append(newItem);

                // 初始化时间选择器
                initTimePicker('#' + newId);

                // 更新计数
                segmentCount[type] = count + 1;

                // 重新渲染表单
                form.render();
            };

            // 删除时间段
            window.removeTimeSegment = function (id, type) {
                // layer.confirm('确定删除该时间段吗？', {
                //     title: '提示'
                // }, function(index) {
                $('#item_' + id).remove();
                segmentCount[type]--;
                validateTimeOverlap();
                layer.close(index);
                // });
            };

            // 服务器
            getServer(form, function () {
                form.on("select(ServerCode)", function (data) {
                    param.ServerCode = data.value;
                    param.ComboBox = "all";
                    getArea(form, data);
                });
            });

            // 监听提交
            form.on("submit(submit)", function (data) {
                // 先校验时间是否重叠
                if (!validateTimeOverlap()) {
                    return false;
                }

                var payloadResult = buildSubmitPayload();
                if (!payloadResult.valid) {
                    layer.msg(payloadResult.msg || "提交数据不完整", { icon: 5, time: 2000 });
                    return false;
                }

                var submitData = new FormData();
                submitData.append("token", token);
                Object.keys(payloadResult.data).forEach(function (key) {
                    submitData.append(key, payloadResult.data[key]);
                });

                list.form("CreateElectricPriceKey", submitData, function (r) {
                    backToparent("添加成功");
                });
            });

            function buildSubmitPayload() {
                var sharpTimes = collectSegmentValues('Sharp');
                var highTimes = collectSegmentValues('High');
                var flatTimes = collectSegmentValues('Flat');
                var lowTimes = collectSegmentValues('Low');

                var serverCode = (($('#ServerCode').val()) || '').trim();
                var areaId = (($('#AreaId').val()) || '').trim();
                var highPrice = (($('#HighPrice').val()) || '').trim();
                var flatPrice = (($('#FlatPrice').val()) || '').trim();
                var lowPrice = (($('#LowPrice').val()) || '').trim();

                if (!serverCode) return { valid: false, msg: '请选择所属服务器' };
                if (!areaId) return { valid: false, msg: '请选择所属区域' };
                if (!highTimes.length) return { valid: false, msg: '峰段至少填写一个时间段' };
                if (!flatTimes.length) return { valid: false, msg: '平段至少填写一个时间段' };
                if (!lowTimes.length) return { valid: false, msg: '谷段至少填写一个时间段' };
                if (!highPrice) return { valid: false, msg: '请输入峰段电价' };
                if (!flatPrice) return { valid: false, msg: '请输入平段电价' };
                if (!lowPrice) return { valid: false, msg: '请输入谷段电价' };

                return {
                    valid: true,
                    data: {
                        EleRuleName: (($('#EleRuleName').val()) || '').trim(),
                        SharpTime: sharpTimes.join(','),
                        HighTime: highTimes.join(','),
                        FlatTime: flatTimes.join(','),
                        LowTime: lowTimes.join(','),
                        SharpPrice: (($('#SharpPrice').val()) || '').trim(),
                        HighPrice: highPrice,
                        FlatPrice: flatPrice,
                        LowPrice: lowPrice,
                        ServerCode: serverCode,
                        AreaId: areaId,
                        EleMonth: normalizeMonths(($('#EleMonth').val()) || '')
                    }
                };
            }

            function collectSegmentValues(type) {
                var values = [];
                $('input[name="' + type + 'Time[]"]').each(function () {
                    var v = (($(this).val()) || '').trim();
                    if (!v) return;
                    var normalized = normalizeTimeRange(v);
                    if (normalized) values.push(normalized);
                });
                return values;
            }

            function normalizeTimeRange(rangeStr) {
                var str = ((rangeStr) || '').trim();
                if (!str) return '';
                str = str.replace(/\s+/g, '').replace('~', '-').replace('～', '-').replace('—', '-').replace('－', '-');
                var arr = str.split('-');
                if (arr.length !== 2) return '';
                var start = arr[0].trim();
                var end = arr[1].trim();
                if (!isValidTimeFormat(start) || !isValidTimeFormat(end)) return '';
                return start + '-' + end;
            }

            function normalizeMonths(monthStr) {
                return ((monthStr) || '')
                    .replace(/，/g, ',')
                    .replace(/\s+/g, '')
                    .replace(/,+/g, ',')
                    .replace(/^,|,$/g, '');
            }

            // 验证时间重叠
            function validateTimeOverlap() {
                console.log('开始验证时间重叠...');
                return true;

                // 清除所有错误样式
                $('.time-range').removeClass('layui-border-red');

                // 收集所有时间段
                var allPeriods = [];
                var hasError = false;
                var errorMessage = '';

                // 遍历所有时间段输入框
                $('input.time-range').each(function () {
                    var input = $(this);
                    var value = input.val();
                    var name = input.attr('name');
                    var id = input.attr('id');

                    console.log('检查输入框:', id, '值:', value);

                    if (value && value.trim() !== '') {
                        var times = parseTimeRange(value);
                        if (times) {
                            var type = 'Unknown';
                            if (name) {
                                if (name.includes('Sharp')) type = 'Sharp';
                                else if (name.includes('High')) type = 'High';
                                else if (name.includes('Flat')) type = 'Flat';
                                else if (name.includes('Low')) type = 'Low';
                            }

                            var typeName = getTypeName(type);

                            var startMinutes = timeToMinutes(times.start);
                            var endMinutes = timeToMinutes(times.end);

                            // 验证时间有效性
                            if (startMinutes === endMinutes) {
                                hasError = true;
                                errorMessage = typeName + '的开始时间和结束时间不能相同';
                                input.addClass('layui-border-red');
                                layer.msg(errorMessage, { icon: 5, time: 2000 });
                                return false; // 跳出each循环
                            }

                            allPeriods.push({
                                id: id,
                                type: type,
                                name: typeName,
                                start: times.start,
                                end: times.end,
                                startMinutes: startMinutes,
                                endMinutes: endMinutes,
                                isCrossDay: endMinutes < startMinutes
                            });
                        }
                    }
                });

                console.log('收集到的时间段:', allPeriods);

                if (hasError) return false;

                // 如果只有0或1个时间段，不需要检查重叠
                if (allPeriods.length <= 1) {
                    console.log('时间段数量<=1，不需要检查重叠');
                    return true;
                }

                // 按类型分组
                var typeGroups = {};
                $.each(allPeriods, function (i, period) {
                    if (!typeGroups[period.type]) {
                        typeGroups[period.type] = [];
                    }
                    typeGroups[period.type].push(period);
                });

                // 1. 先检查同类型内是否重叠
                for (var type in typeGroups) {
                    var periods = typeGroups[type];
                    // 如果同一类型有多个时间段，检查重叠
                    if (periods.length > 1) {
                        for (var i = 0; i < periods.length; i++) {
                            for (var j = i + 1; j < periods.length; j++) {
                                if (isTimeOverlap(periods[i], periods[j])) {
                                    hasError = true;
                                    errorMessage = periods[i].name + '内部时间段不能重叠';
                                    $('#' + periods[i].id).addClass('layui-border-red');
                                    $('#' + periods[j].id).addClass('layui-border-red');
                                    console.log('同类型重叠:', periods[i].name, periods[j].name);
                                    break;
                                }
                            }
                            if (hasError) break;
                        }
                        if (hasError) break;
                    }
                }

                // 2. 如果没有内部错误，检查不同类型之间的重叠
                if (!hasError) {
                    for (var i = 0; i < allPeriods.length; i++) {
                        for (var j = i + 1; j < allPeriods.length; j++) {
                            if (allPeriods[i].type !== allPeriods[j].type) {
                                if (isTimeOverlap(allPeriods[i], allPeriods[j])) {
                                    hasError = true;
                                    errorMessage = allPeriods[i].name + '和' + allPeriods[j].name + '时间段不能重叠';
                                    $('#' + allPeriods[i].id).addClass('layui-border-red');
                                    $('#' + allPeriods[j].id).addClass('layui-border-red');
                                    console.log('不同类型重叠:', allPeriods[i].name, allPeriods[j].name);
                                    break;
                                }
                            }
                        }
                        if (hasError) break;
                    }
                }

                if (hasError) {
                    console.log('重叠错误:', errorMessage);
                    layer.msg(errorMessage, {
                        icon: 5,
                        time: 2000
                    });
                } else {
                    console.log('验证通过，没有重叠');
                }

                return !hasError;
            }

            // 获取类型名称
            function getTypeName(type) {
                var names = {
                    'Sharp': '尖段',
                    'High': '峰段',
                    'Flat': '平段',
                    'Low': '谷段'
                };
                return names[type] || type;
            }

            // 解析时间范围字符串 "HH:mm - HH:mm"
            function parseTimeRange(rangeStr) {
                if (!rangeStr || rangeStr.trim() === '') return null;

                rangeStr = rangeStr.trim();
                var times;

                if (rangeStr.includes(' - ')) {
                    times = rangeStr.split(' - ');
                } else if (rangeStr.includes('-')) {
                    times = rangeStr.split('-');
                } else if (rangeStr.includes('~')) {
                    times = rangeStr.split('~');
                } else {
                    return null;
                }

                if (times.length === 2) {
                    var start = times[0].trim();
                    var end = times[1].trim();

                    if (isValidTimeFormat(start) && isValidTimeFormat(end)) {
                        return {
                            start: start,
                            end: end
                        };
                    }
                }
                return null;
            }

            // 验证时间格式
            function isValidTimeFormat(timeStr) {
                var pattern = /^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$/;
                return pattern.test(timeStr);
            }

            // 将时间字符串转换为分钟数
            function timeToMinutes(timeStr) {
                if (!timeStr) return 0;
                var parts = timeStr.split(':');
                if (parts.length === 2) {
                    return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
                }
                return 0;
            }

            // 判断两个时间段是否重叠
            function isTimeOverlap(p1, p2) {
                console.log('检查重叠:', p1.name, p1.start, '-', p1.end, '和', p2.name, p2.start, '-', p2.end);

                var intervals = [];

                // 处理第一个时间段
                if (p1.isCrossDay) {
                    intervals.push({
                        name: p1.name,
                        start: p1.startMinutes,
                        end: 24 * 60
                    });
                    intervals.push({
                        name: p1.name,
                        start: 0,
                        end: p1.endMinutes
                    });
                } else {
                    intervals.push({
                        name: p1.name,
                        start: p1.startMinutes,
                        end: p1.endMinutes
                    });
                }

                // 处理第二个时间段
                if (p2.isCrossDay) {
                    intervals.push({
                        name: p2.name,
                        start: p2.startMinutes,
                        end: 24 * 60
                    });
                    intervals.push({
                        name: p2.name,
                        start: 0,
                        end: p2.endMinutes
                    });
                } else {
                    intervals.push({
                        name: p2.name,
                        start: p2.startMinutes,
                        end: p2.endMinutes
                    });
                }

                // 检查所有区间之间是否有重叠
                for (var i = 0; i < intervals.length; i++) {
                    for (var j = i + 1; j < intervals.length; j++) {
                        var int1 = intervals[i];
                        var int2 = intervals[j];

                        if (int1.name === int2.name) {
                            continue;
                        }

                        var overlapStart = Math.max(int1.start, int2.start);
                        var overlapEnd = Math.min(int1.end, int2.end);

                        if (overlapStart < overlapEnd) {
                            console.log('发现重叠:', int1.name, int2.name, overlapStart, overlapEnd);
                            return true;
                        }
                    }
                }

                return false;
            }
        });
    </script>
</body>

</html>
