<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <script type="text/html" id="detail">
                <!-- <div class="layui-form-item">
                    <label class="layui-form-label">流水号<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" name="login" lay-filter="login" autocomplete="off" class="layui-input"
                            value="" lay-verify="required">
                    </div>
                </div> -->
                <div class="layui-form-item">
                    <label class="layui-form-label">指令ID<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" name="Command" lay-filter="password" autocomplete="off" class="layui-input"
                            value="{{data.Command}}" lay-verify="required">
                    </div>
                </div>
                <div class="layui-form-item layui-form-text">
                    <label class="layui-form-label">指令说明</label>
                    <div class="layui-input-block">
                        <textarea placeholder="请输入指令说明" name="remark" class="layui-textarea">{{data.remark}}</textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">设备参数<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <textarea id="ParamId" name="ParamId" lay-verify="required" class="layui-textarea" readonly>{{data.ParamId}}</textarea>
                    </div>
                    <div class="layui-form-mid layui-word-aux">
                        <a class="layui-btn" onclick="xadmin.open('选择配置项','report-tableparam-choose.html?id={{data.id}}&inputid=ParamId&&className='+encodeURI(encodeURI('短信查询')))">选择</a>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">指令ID格式:</label>
                    <div style="line-height: 38px;color: #fff;">
                        查询 - XXXX
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-submit lay-filter="submit"
                        type="button">保存</button>
                </div>
                </script>
            </form>
        </div>
    </div>
    <script>
        $(function () {
            var state = true;
            var id = GetString("id");
            $(function () {
                layui.use('form', function () {
                    var form = layui.form;
                    //权限
                    //获取详情
                    list.info("GetAlarmSmsSearchDetailKey", {
                        token: token,
                        id: id
                    }, function (r) {
                        var html = template("detail", r);
                        $("#formNow").html(html);
                    });
                    //监听状态
                    form.on('switch(state)', function (obj) {
                        state = obj.elem.checked;
                    });
                    //提交数据
                    form.on("submit(submit)", function (data) {
                        var strformData = {
                            token:token,
                            Command:data.field.Command,
                            remark:data.field.remark,
                            ParamId:data.field.ParamId,
                            id:id
                        }
                        list.info('ChangeAlarmSmsSearchKey', strformData, function (r) {
                            backToparent('修改成功');
                        })
                    })
                });
            });
        })
    </script>
</body>

</html>
