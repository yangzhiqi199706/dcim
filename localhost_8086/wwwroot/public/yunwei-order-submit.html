<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <script type="text/html" id="detail">
                <div class="layui-form-item">
                    <label class="layui-form-label">流水号:</label>
                    <div class="layui-input-inline">
                        <input type="text" id="Lsh" value="{{data.id}}" autocomplete="off"
                            class="layui-input" disabled>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">工单名称</label>
                    <div class="layui-input-inline">
                        <input type="text" id="OrderName" value="{{data.OrderName}}" autocomplete="off"
                        lay-filter="OrderName" class="layui-input" disabled>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">工单类型</label>
                    <div class="layui-input-inline">
                        <input type="text" id="NeedName" value="手动工单" autocomplete="off"
                            class="layui-input" disabled>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">故障类型</label>
                    <div class="layui-input-inline">
                        <input type="text" id="FaultTypeId" value="{{data.FaultTypeName}}" autocomplete="off"
                            class="layui-input" lay-filter="FaultTypeId" disabled>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">故障子类型</label>
                    <div class="layui-input-inline">
                        <input type="text" id="FaultSubTypeLsh" value="{{data.FaultSubTypeName}}" autocomplete="off"
                            class="layui-input" lay-filter="FaultSubTypeLsh" disabled>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">执行人</label>
                    <div class="layui-input-inline">
                        <input type="text" id="EmpId" value="{{if data.ZhuanExecuteEmpName}}{{data.ZhuanExecuteEmpName}}{{else}}{{data.EmpName}}{{/if}}" autocomplete="off"
                            class="layui-input" disabled>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">处理情况</label>
                    <div class="layui-input-block">
                        <textarea name="DealSituation" name="DealSituation" class="layui-textarea"></textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">附件</label>
                    <div class="layui-input-inline">
                        <input type="text" id="FileImg" value="" autocomplete="off" class="layui-input" readonly>
                        <input id="BaseImg" type="hidden" value="" name="OrderImg" >
                    </div>
                    <a class="layui-btn">
                        <input type="file" class="layui-btn" onchange="uploadImg(this)" accept="image/*" value="">
                        选择文件
                    </a>
                    <a class="layui-btn-warm layui-btn fancybox-view" href="" id="ViewImg">预览
                        <img src="" alt="">
                    </a>
                    <a class="layui-btn-danger layui-btn" id="CleanImg" onclick="CleanImg(this)">清空</a>
                </div>
                <!-- <div class="layui-form-item">
                    <label class="layui-form-label">启用通知</label>
                    <div>
                        <input type="checkbox" value="启用" title="" lay-skin="switch" lay-text="ON|OFF" checked>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">通知人员</label>
                    <div class="layui-input-inline">
                        <input type="text" id="NoticeEmpName" value="" name="NoticeEmpName" lay-verify="required"
                            autocomplete="off" class="layui-input" readonly>
                        <input type="hidden" id="NoticeEmpId" value="" name="NoticeEmpId" lay-verify="required"
                            autocomplete="off" class="layui-input" readonly>
                    </div>
                    <div class="layui-form-mid layui-word-aux">
                        <a class="layui-btn" onclick="xadmin.open('选择人员','choose-person.html?type=orderadd')">选择</a>
                    </div>
                </div> -->
                <div>
                    <div class="layui-form-item">
                        <label class="layui-form-label"></label>
                        <button class="layui-btn" type="button"  onclick="xadmin.open('知识库','yunwei-knowledge-listsearch.html')">查找解决方案</button>
                        <button class="layui-btn" type="button" onclick="xadmin.open('添加知识库','yunwei-knowledge-add.html?OrderName='+encodeURI(encodeURI('{{data.OrderName}}'))+'&FaultTypeName='+encodeURI(encodeURI('{{data.FaultTypeName}}'))+'&FaultSubTypeName='+encodeURI(encodeURI('{{data.FaultSubTypeName}}'))+'&FaultTypeId={{data.FaultTypeId}}')">形成知识库</button>
                        <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">提交工单</button>
                    </div>
                </div>
            </script>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function () {
            var id = GetString("id");
            //获取详情
            list.info("GetYWWorkOrderDetailKey", {
                token: token,
                id: id
            }, function (r) {
                var html = template("detail", r);
                $("#formNow").html(html);
                $('#ViewImg,#CleanImg').hide();
                layui.use(["form"], function () {
                    $ = layui.jquery;
                    var form = layui.form;
                    form.render();
                    form.on("submit(submit)", function (data) {
                        var strformData = new FormData($("#formNow")[0]);
                        strformData.append("token", token);
                        strformData.append("Lsh", id);
                        strformData.append("OrderStatus", '待审核');
                        list.form("SubmitYWWorkOrderKey", strformData, function (r) {
                            backToparent("提交成功");
                        });
                    });
                });
            });
        });


    </script>
</body>

</html>
