<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/public.dcimnew.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <a class="layui-btn layui-btn-primary" href="system-parameter-list.html">告警参数</a>
                        <a class="layui-btn layui-btn-primary" href="sms-deployment-list.html">事件关系</a>
                        <a class="layui-btn layui-btn-primary" href="donghuan-eventlevel-list.html">事件等级</a>
                        <a class="layui-btn layui-btn-primary" href="system-parameter-sms.html">短信/语音/邮件</a>
                        <a class="layui-btn layui-btn-primary" href="sms-query-list.html">短信查询定义</a>
                        <a class="layui-btn layui-btn-primary" href="sms-control-list.html">短信控制定义</a>
                        <a class="layui-btn layui-btn-primary" href="system-masterslave-list.html">主从模式</a>
                        <a class="layui-btn" href="donghuan-timealert-list.html">时段告警配置</a>
                    </div>

                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" placeholder="请输入名称" name="search">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                        <button class="layui-btn x-right" onclick="xadmin.open('新增','donghuan-timealert-add.html')">新增</button>
                    </div>

                    <div class="layui-card-body">
                        <table class="layui-table layui-form">
                            <thead>
                                <tr>
                                    <th>序号</th>
                                    <th>名称</th>
                                    <th>周一</th>
                                    <th>周二</th>
                                    <th>周三</th>
                                    <th>周四</th>
                                    <th>周五</th>
                                    <th>周六</th>
                                    <th>周日</th>
                                    <th>备注</th>
                                    <th>更新时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.length!=0}}
                                    {{each data as list i}}
                                    <tr>
                                        <td>{{(page.p-1)*pageSize+(i+1)}}</td>
                                        <td>{{list.WindowName}}</td>
                                        <td>{{list.MonSlots?list.MonSlots:'-'}}</td>
                                        <td>{{list.TueSlots?list.TueSlots:'-'}}</td>
                                        <td>{{list.WedSlots?list.WedSlots:'-'}}</td>
                                        <td>{{list.ThuSlots?list.ThuSlots:'-'}}</td>
                                        <td>{{list.FriSlots?list.FriSlots:'-'}}</td>
                                        <td>{{list.SatSlots?list.SatSlots:'-'}}</td>
                                        <td>{{list.SunSlots?list.SunSlots:'-'}}</td>
                                        <td>{{list.remark?list.remark:'-'}}</td>
                                        <td>{{list.update_time?list.update_time:list.create_time}}</td>
                                        <td class="td-manage">
                                            <a title="编辑" onclick="xadmin.open('编辑','donghuan-timealert-edit.html?id={{list.id}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe642;</i>
                                            </a>
                                            <a title="删除" onclick="removeRow('{{list.id}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe640;</i>
                                            </a>
                                        </td>
                                    </tr>
                                    {{/each}}
                                    {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align:center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging" class="x-right"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var url = "/dcim-alarmnotifywindow";
        var currentPage = 1;
        var pageSize = 15;

        function extractRows(res) {
            if (!res) return [];
            if ($.isArray(res.data)) return res.data;
            if (res.data && $.isArray(res.data.info)) return res.data.info;
            if (res.data && res.data.data && $.isArray(res.data.data)) return res.data.data;
            if (res.data && res.data.data && $.isArray(res.data.data.info)) return res.data.data.info;
            return [];
        }

        function extractTotal(res, fallback) {
            if (res && typeof res.total !== "undefined") return Number(res.total || 0);
            if (res && res.data && res.data.page) return Number(res.data.page.total || 0);
            if (res && res.data && res.data.data && res.data.data.page) return Number(res.data.data.page.total || 0);
            if (res && typeof res.count !== "undefined") return Number(res.count || 0);
            return fallback || 0;
        }

        function renderList(res) {
            var rows = extractRows(res);
            var total = extractTotal(res, rows.length);
            var viewData = {
                data: rows,
                page: { p: currentPage },
                pageSize: pageSize
            };
            var html = template("listtemplate", viewData);
            $("tbody:not('.chooseTable')").html(html);
            x_admin_page(total, pageSize, pagechange);
        }

        function buildFilterParams() {
            var search = ($('input[name=search]').val() || '').trim();
            var paramsObj = {};
            if (search) {
                paramsObj.WindowName = "%" + search + "%";
            }
            return paramsObj;
        }

        function loadList(pageNo) {
            currentPage = pageNo || 1;
            dcimNewApi.filter(
                url,
                buildFilterParams(),
                pageSize,
                currentPage,
                function (res) { renderList(res); },
                function (res) {
                    if (res && $.isArray(res.data) && typeof res.total !== "undefined") {
                        renderList(res);
                    }
                }
            );
        }

        function removeRow(id) {
            if (!id) return;
            layer.confirm('确认删除此信息吗？', function (index) {
                layer.close(index);
                dcimNewApi.get('/dcim-alarmnotifywindow/delete/' + id, {}, function () {
                    layer.msg('删除成功', { icon: 1, time: 1000 });
                    loadList(currentPage);
                }, function (res) {
                    if (res && (res.success || res.code === 100)) {
                        layer.msg('删除成功', { icon: 1, time: 1000 });
                        loadList(currentPage);
                    }
                });
            });
        }

        function pagechange(curr) {
            loadList(curr);
        }

        $(function () {
            layui.use('form', function () {
                var form = layui.form;
                form.on('submit(search)', function () {
                    loadList(1);
                    return false;
                });
                loadList(1);
            });
        });
    </script>
</body>

</html>
