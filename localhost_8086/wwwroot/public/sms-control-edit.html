<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <script type="text/html" id="detail">
                <!-- <div class="layui-form-item">
                    <label class="layui-form-label">流水号<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" name="login" lay-filter="login" autocomplete="off" class="layui-input" value="" lay-verify="required">
                    </div>
                </div> -->
                <div class="layui-form-item">
                    <label class="layui-form-label">指令ID<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" name="Command" lay-filter="Command" autocomplete="off" class="layui-input"
                            value="{{data.Command}}" lay-verify="required">
                    </div>
                </div>
                <div class="layui-form-item layui-form-text">
                    <label class="layui-form-label">指令说明</label>
                    <div class="layui-input-block">
                        <textarea placeholder="请输入指令说明" name="remark"
                            class="layui-textarea">{{data.remark}}</textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">用户组</label>
                    <div class="layui-input-block" id="ulist">

                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">事件ID</label>
                    <div class="layui-input-inline">
                        <select class="layui-input" id="ControlId" name="ControlId" lay-verify="required" lay-filter="ControlId">
                            <option value="">请选择</option>
                            <option value="1">一键布防</option>
                            <option value="2">一键撤防</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">指令ID格式:</label>
                    <div style="line-height: 38px;color: #fff;">
                        控制 - XXXX
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-submit lay-filter="submit"
                        type="button">保存</button>
                </div>
                </script>
            </form>
            <script type="text/html" id="usertemplate">
                {{each data as list i}}
                    <input type="checkbox" name="UserID" value="{{list.id}}" title="{{list.PersonName}}" lay-skin="primary" {{if list.checked==true}}checked{{/if}}>
                {{/each}}
            </script>
        </div>
    </div>
    <script>
        $(function () {
            var state = true;
            var id = GetString("id");
            $(function () {
                layui.use('form', function () {
                    var form = layui.form;

                    //获取详情
                    list.info("GetAlarmSmsControlDetailKey", {
                        token: token,
                        id: id
                    }, function (r) {
                        var html = template("detail", r);
                        $("#formNow").html(html);
                        $("#ControlId").val(r.data.ControlId);
                        form.render('select');
                        list.info("GetEmpListKey", {
                            token: token,
                            ComboBox: 'all'
                        }, function (res) {
                            var UserIdArray = [];
                            UserIdArray =r.data.UserId.split(',');
                            res.data.forEach((item,index) => {
                                UserIdArray.forEach(x=>{
                                   x === item.id?res.data[index].checked = true:'';
                                })
                            });
                            var user = template("usertemplate", res);
                            $("#ulist").html(user);
                            form.render();
                        });
                    });

                    //监听状态
                    form.on('switch(state)', function (obj) {
                        state = obj.elem.checked;
                    });
                    //提交数据
                    form.on("submit(submit)", function (data) {
                        var UserIDArray = new Array();
                        $('input[name=\'UserID\']:checked').each(function(i, val){
                            UserIDArray.push($(this).val());
                        })
                        var strformData = {
                            token: token,
                            Command: data.field.Command,
                            remark: data.field.remark,
                            UserId:UserIDArray.toString(),
                            ControlId:data.field.ControlId,
                            id: id
                        }
                        list.info('ChangeAlarmSmsControlKey', strformData, function (r) {
                            backToparent('编辑成功');
                        })
                    })
                });
            });
        })
    </script>
</body>

</html>
