<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <div class="layui-form-item">
                    <div class="layui-input-block">
                        <input type="radio" name="way" value="person" title="人工盘点" lay-filter="way" checked>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-input-block">
                        <input type="radio" name="way" value="auto" title="自动盘点" lay-filter="way">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        var id=GetString('id');
        $(function(){
            layui.use(["form"], function () {
                $ = layui.jquery;
                var form = layui.form;
                //监听提交
				form.on("submit(submit)", function (data) {
                    if(data.field.way=='person'){
                        list.info('DoCheckPlanKey',{
                            token:token,
                            id:id
                        },function(){
                            xadmin.open('人工盘点','asset-checkplan-detaillist.html','','',id);
                        })
                    }else{
                        setTimeout(function(){
                            layer.msg('设备不在线，请进行人工盘点', {
                                icon: 5,
                                time: 1000
                            });
                        },500)
                    }
                    
                })
            });
        });
        function colse(){
            var index = parent.layer.getFrameIndex(window.name);
            parent.layer.close(index);
            window.parent.location.reload();
        }
    </script>
</body>
</html>
