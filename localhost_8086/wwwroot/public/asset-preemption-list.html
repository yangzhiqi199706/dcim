<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>资产管理->资产管理->预占管理</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" placeholder="请输入机柜列" name="search">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                        <button class="layui-btn x-right" onclick="xadmin.open('预占','asset-preemption-add.html')">
                            <i class="layui-icon"></i>预占
                        </button>
                    </div>
                    <div class="layui-card-body">
                        <table class="layui-table">
                            <thead>
                                <tr>
                                    <th>编号</th>
                                    <th>所属服务器</th>
                                    <th>所属区域</th>
                                    <th>机柜列</th>
                                    <th>机柜</th>
                                    <th>预占U位</th>
                                    <th>重量(Kg)</th>
                                    <th>功率(W)</th>
                                    <th>光口(个)</th>
                                    <th>网口(个)</th>
                                    <th>电源插口(个)</th>
                                    <th>预占说明</th>
                                    <th>预占状态</th>
                                    <th>预占人</th>
                                    <th>预占日期</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.info.length!=0}} {{each data.info as list i}}
                                    <tr>
                                        <td>{{(data.page.p-1)*15+(i+1)}}</td>
                                        <td>{{list.ServerName}}</td>
                                        <td>{{list.AreaName}}</td>
                                        <td>{{list.column}}</td>
                                        <td>{{list.position}}</td>
                                        <td>{{list.PreUPosition}}</td>
                                        <td>{{list.PreWeight}}</td>
                                        <td>{{list.PrePower}}</td>
                                        <td>{{list.PreSmoothPort}}</td>
                                        <td>{{list.PreNetworkPort}}</td>
                                        <td>{{list.PreJackPort}}</td>
                                        <td>{{list.PreDescribe}}</td>
                                        <td>{{list.PreStatus}}</td>
                                        <td>{{list.CreateEmpName}}</td>
                                        <td>{{list.create_time}}</td>
                                        <td>
                                            <a title="释放U位" onclick="xadmin.open('释放U位','asset-preemption-release.html','','','{{list.id}}&pre={{list.PreUPosition}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe663;</i>
                                            </a>
                                        </td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        //请求地址
        var url = "GetPreemptionListKey";
        $(function(){
            //初始化数据
            list.get(url, param);
            //分页回调
            function pagechange(curr) {
                param.pageNo = curr;
                list.get(url, param);
            }
            layui.use("form", function () {
                $ = layui.jquery;
                var form = layui.form;
                //监听提交
                form.on("submit(search)", function (data) {
                    param.pageNo = 1;
                    param.search = data.field.search;
                    list.get(url, param);
                    return false;
                });
            });
        })
        //分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            list.get(url, param);
        }
    </script>
</body>
</html>
