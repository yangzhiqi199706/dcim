<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/jquery.qrcode.min.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>运维管理->配置->移动巡检->巡检任务</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" placeholder="请输入任务名称" name="search">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <select id="status" name="status" lay-filter="status">
                                    <option value="">全部</option>
                                    <option value="待执行">待执行</option>
                                    <option value="逾期未执行">逾期未执行</option>
                                    <option value="待确认">待确认</option>
                                    <option value="完成">完成</option>
                                    <option value="逾期终止">逾期终止</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                        <button class="layui-btn x-right" onclick="xadmin.open('添加任务','yunwei-xjtask-add.html')">
                            <i class="layui-icon"></i>添加任务
                        </button>
                    </div>
                    <div class="layui-card-body">
                        <table class="layui-table">
                            <thead>
                                <tr>
                                    <th>巡检编号</th>
                                    <th>任务名称</th>
                                    <th>描述</th>
                                    <th>巡检计划模板</th>
                                    <th>发起人</th>
                                    <th>巡检人</th>
                                    <th>计划完成时间</th>
                                    <th>状态</th>
                                    <th>任务创建时间</th>
                                    <th>系统派发</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.info.length!=0}} {{each data.info as list i}}
                                    <tr>
                                        <td>{{list.XJTaskNumber}}</td>
                                        <td>{{list.XJTaskName}}</td>
                                        <td>{{list.XJDescribe}}</td>
                                        <td>{{list.XJModelName}}</td>
                                        <td>{{list.CreateEmpName}}</td>
                                        <td>{{list.XJEmpName}}</td>
                                        <td>{{list.XJPlanComplateTime}}</td>
                                        <td>{{list.XJStatus}}</td>
                                        <td>{{list.create_time}}</td>
                                        <td>{{if list.system==1}}否{{else}}是{{/if}}</td>
                                        <td>
                                            {{if list.XJStatus=='待执行'}}
                                            <a title="编辑" onclick="xadmin.open('编辑','yunwei-xjtask-edit.html','','','{{list.id}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe642;</i>
                                            </a>
                                                {{if list.system==1}}
                                                <a title="删除" onclick="x_admin_del('确认删除吗？','DelXJTaskKey','{{list.id}}',this)" href="javascript:;">
                                                    <i class="layui-icon">&#xe640;</i>
                                                </a>
                                                {{/if}}
                                            {{/if}}
                                            {{if list.XJStatus=='待确认'}}
                                            <a title="确认" onclick="xadmin.open('确认','yunwei-xjtask-check.html','','','{{list.id}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe6b2;</i>
                                            </a>
                                            {{/if}}
                                            {{if list.XJStatus=='逾期终止' || list.XJStatus=='完成'}}
                                            -
                                            {{/if}}
                                            {{if list.XJStatus=='逾期未执行'}}
                                            <a title="终止" onclick="xadmin.open('终止','yunwei-xjtask-cancel.html','','','{{list.id}}')" href="javascript:;">
                                                <i class="layui-icon">&#x1007;</i>
                                            </a>
                                            {{/if}}
                                        </td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        //请求地址
        var url = "GetXJTaskListKey";
        if(localStorage.getItem('xjStatus'))param.status=localStorage.getItem('xjStatus');layuiSelected("status", localStorage.getItem('xjStatus'));localStorage.removeItem('xjStatus');
        $(function(){
            //初始化数据
            list.get(url, param);
            
            layui.use(["form","tree"], function () {
                $ = layui.jquery;
                var form = layui.form;
                
                //监听提交
                form.on("submit(search)", function (data) {
                    param.pageNo = 1;
                    param.search = data.field.search;
                    param.status = data.field.status;
                    list.get(url, param);
                    return false;
                });    
            });
            
        })
        //分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            list.get(url, param);
        }
    </script>
</body>

</html>
