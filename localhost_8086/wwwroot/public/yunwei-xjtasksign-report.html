<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/public.dcimnew.js" type="text/javascript" charset="utf-8"></script>
    <style>
        table tr th,
        table tr td {
            text-align: center !important;
        }
    </style>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body" style="padding: 15px 30px; ">
                        <table class="layui-table">
                            <thead>
                                <tr>
                                    <th colspan="6" id="reportTitle">巡检签到统计</th>
                                </tr>
                                <tr>
                                    <th>编号</th>
                                    <th>巡检签到表名</th>
                                    <th>设备数量</th>
                                    <th>巡检时间</th>
                                    <th>巡检人</th>
                                    <th>巡检状态</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.length!=0}} {{each data as list i}}
                                    <tr>
                                        <td>{{list.id}}</td>
                                        <td>{{list.TableNameShow}}</td>
                                        <td>{{list.DeviceCountShow}}</td>
                                        <td>{{list.SignTimeShow}}</td>
                                        <td>{{list.SignPersonShow}}</td>
                                        <td>{{list.SignStatusShow}}</td>
                                    </tr>
                                    {{/each}}
                                    {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var url = "/dcim-xjtasksign";

        function toSignStatusText(v) {
            return (v + '') === '1' ? '已签到' : '未签到';
        }

        function buildDateRange(type, year, month) {
            if (type === 'month' && month) {
                return getOnemonth(month);
            }
            var y = (year || '').trim();
            if (!y) {
                y = new Date().getFullYear() + '';
            }
            return [y + '-01-01 00:00:00', y + '-12-31 23:59:59'];
        }

        function initTitle(type, year, month) {
            if (type === 'month' && month) {
                $('#reportTitle').text('巡检签到统计（' + month + '）');
                return;
            }
            var y = (year || '').trim();
            if (!y) y = new Date().getFullYear() + '';
            $('#reportTitle').text('巡检签到统计（' + y + '年）');
        }

        function normalizeRows(rows) {
            rows = rows || [];
            $.each(rows, function (n, row) {
                var tableName = row.TableName ? row.TableName : '巡检签到表';
                var reportTime = row.ReportTime ? row.ReportTime : '';
                row.TableNameShow = tableName + reportTime;
                row.DeviceCountShow = (row.DeviceCount === undefined || row.DeviceCount === null || row.DeviceCount === '') ? '-' : row.DeviceCount;
                row.SignTimeShow = row.SignTime ? row.SignTime : '-';
                row.SignPersonShow = row.SignPerson ? row.SignPerson : '-';
                row.SignStatusShow = toSignStatusText(row.SignStatus);
            });
            rows.sort(function (a, b) {
                return (b.id || 0) - (a.id || 0);
            });
            return rows;
        }

        function renderReport(rows) {
            var listData = {
                data: normalizeRows(rows || [])
            };
            var lists = template("listtemplate", listData);
            $("tbody:not('.chooseTable')").html(lists);
        }

        function buildFilterParams(range) {
            return JSON.stringify({
                create_time: {
                    operator: "between",
                    value: "('" + range[0] + "','" + range[1] + "')"
                }
            });
        }

        function getPageRows(res) {
            if (!res || !res.data) return [];
            if ($.isArray(res.data.info)) return res.data.info;
            if ($.isArray(res.data)) return res.data;
            if (res.data.data && $.isArray(res.data.data.info)) return res.data.data.info;
            if (res.data.data && $.isArray(res.data.data)) return res.data.data;
            return [];
        }

        function getTotalCount(res, fallbackCount) {
            if (res && res.data && res.data.page) return Number(res.data.page.total || 0);
            if (res && res.data && res.data.data && res.data.data.page) return Number(res.data.data.page.total || 0);
            if (res && typeof res.total !== "undefined") return Number(res.total || 0);
            if (res && typeof res.count !== "undefined") return Number(res.count || 0);
            return fallbackCount || 0;
        }

        function fetchAllRows(baseParam, pageNo, allRows, done) {
            var limit = 200;
            dcimNewApi.filter(url, baseParam, limit, pageNo, function (res) {
                var pageRows = getPageRows(res);
                allRows = allRows.concat(pageRows);
                var total = getTotalCount(res, pageRows.length);
                var totalPage = Math.max(1, Math.ceil(total / limit));
                if (pageNo < totalPage) {
                    fetchAllRows(baseParam, pageNo + 1, allRows, done);
                } else {
                    done(allRows);
                }
            });
        }

        $(function () {
            var type = (GetString("type") || "year").toLowerCase();
            var year = GetString("year") || "";
            var month = GetString("month") || "";
            var range = buildDateRange(type, year, month);

            initTitle(type, year, month);

            var baseParam = buildFilterParams(range);
            fetchAllRows(baseParam, 1, [], function (rows) {
                renderReport(rows);
            });
        });

        function pagechange(curr) {
        }
    </script>
</body>

</html>
