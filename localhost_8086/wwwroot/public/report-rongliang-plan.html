<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/echarts.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>报表管理->容量管理->容量定制报表</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <select id="ServerCode" name="ServerCode" lay-filter="ServerCode">
                                    <option value="">请选择</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                        <div class="layui-inline layui-show-xs-block x-right">
                            <button class="layui-btn search" lay-submit type="button">导出</button>
                        </div>
                    </div>
                    <div class="layui-card-body">
                        <div class="massage-box massage-box-md6">
                            <div class="capacity-statistics-title">容量统计</div>
                            <table class="layui-table" id="view-route">
                                <thead>
                                    <tr>
                                        <th>统计项</th>
                                        <th>总容量</th>
                                        <th>使用容量</th>
                                        <th>剩余容量</th>
                                        <th>使用率</th>
                                        <th>容量单位</th>
                                    </tr>
                                </thead>
                                <tbody>
                                </tbody>
                            </table>
                        </div>
                        <div class="massage-box massage-box-md6">
                            <div class="capacity-statistics-title">容量使用率对比图</div>
                            <div id="yearChart" class="massage-chart"></div>
                        </div>
                        <div class="massage-box massage-box-md12">
                            <div class="capacity-statistics-title">容量明细</div>
                            <table class="layui-table" id="view-route" >
                                <thead>
                                    <tr>
                                        <th>区域</th>
                                        <th>所属服务器</th>
                                        <th>机柜列</th>
                                        <th>机柜</th>
                                        <th>容量</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        //请求地址
        var url = "";
        $(function(){
            var yearChartDom = document.getElementById('yearChart');
            var yearChart = echarts.init(yearChartDom);
            var yeartitle = ['L1','L2','L3','L4'];
            var yeardata = ['0','0','0','0'];
            var yeardata2 = ['0','0','0','0'];
            var yeardata3 = ['0','0','0','0'];
            var yeardata4 = ['0','0','0','0'];
            var yearChartoption={
                legend: {
                },
                xAxis: {
                    type: 'category',
                    data: yeartitle,
                    axisLine: {
                        show: true,
                        lineStyle: {
                            type: 'solid',
                            color:'#F4F8FB',
                            width:'1'
                        }
                    },
                    axisLabel: {
                        textStyle: {
                            color: '#A2CAE1',//坐标值得具体的颜色
                            lineHeight:30
                        }
                    }
                },
                yAxis: {
                    type: 'value',
                    axisLine: {
                        show: true,
                        lineStyle: {
                            type: 'solid',
                            color:'#F4F8FB',
                            width:'1'
                        }
                    },
                    splitLine:{show: false},
                    axisLabel: {
                        interval:0,
                        textStyle: {
                            color: '#A2CAE1',//坐标值得具体的颜色
                        },
                    }
                },
                grid:{
                    x:100,
                    y:40,
                    x2:25,
                    y2:30
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    }
                },
                series: [{
                    data:yeardata,
                    label:{
                        show:true,
                        position: 'top'
                    },
                    type: 'line',
                    name: 'L1',
                    barWidth:20,
                    showBackground: true,
                    backgroundStyle: {
                        color: '#F4F8FB'
                    },
                },
                {
                    data:yeardata2,
                    label:{
                        show:true,
                        position: 'top'
                    },
                    type: 'line',
                    name: 'L2',
                    barWidth:20,
                    showBackground: true,
                    backgroundStyle: {
                        color: '#F4F8FB'
                    },
                },
                {
                    data:yeardata3,
                    label:{
                        show:true,
                        position: 'top'
                    },
                    type: 'line',
                    name: 'L3',
                    barWidth:20,
                    showBackground: true,
                    backgroundStyle: {
                        color: '#F4F8FB'
                    },
                },
                {
                    data:yeardata4,
                    label:{
                        show:true,
                        position: 'top'
                    },
                    type: 'line',
                    name: 'L4',
                    barWidth:20,
                    showBackground: true,
                    backgroundStyle: {
                        color: '#F4F8FB'
                    },
                }
            ]
            };
            yearChartoption && yearChart.setOption(yearChartoption);
            

            layui.use(["form","laydate"], function () {
                $ = layui.jquery;
                var form = layui.form;
                
                //监听提交
                form.on("submit(search)", function (data) {
                    param.pageNo = 1;
                    list.get(url,param);
                    return false;
                });    
            });
        })
        
    </script>
</body>
</html>
