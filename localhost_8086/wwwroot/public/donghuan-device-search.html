<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>动环监控->设备查询</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <div id="tree"></div>
                        <table class="layui-table layui-col-tree layui-form">
                            <thead>
                                <tr>
                                    <th>编号</th>
                                    <th>名称</th>
                                    <th>点值描述</th>
                                    <th>点值</th>
                                    <th>更新时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.length!=0}} {{each data as list i}}
                                    <tr>
                                        <td>{{(data.page.p-1)*15+(i+1)}}</td>
                                        <td>{{list.AssetsNumber}}</td>
                                        <td>{{list.AssetsTypeName}}</td>
                                        <td>{{list.BrandModel}}</td>
                                        <td>{{list.AssetsDescribe}}</td>
                                        <td>{{list.StoreLocationName}}</td>
                                        <td>{{list.DeptName}}</td>
                                        <td>{{list.PersonName}}</td>
                                        <td>{{list.SupplierName}}</td>
                                        <td>{{list.CreateEmpName}}</td>
                                        <td>{{list.create_time}}</td>
                                        <td>
                                            <a title="历史" onclick="xadmin.open('历史','asset-store-edit.html','','','{{list.id}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe705;</i>
                                            </a>
                                        </td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        $(function(){
            param.ComboBox = "all";
            //树形列表
            list.info('GetDeviceListKey', param,function(r){
                var data=[];
                //按pid排序
                r.data.sort(function (a, b) {
                    if (parseInt(a.AreaId) < parseInt(b.AreaId)) {
                        return -1;
                    } else if (parseInt(a.AreaId) == parseInt(b.AreaId)) {
                        return 0;
                    } else {
                        return 1;
                    }
                });
                console.log(r)
                 //树形数据
                var firstthrchild=-1;
                $.each(r.data,function(n,val){
                    if(val.AssetsTypeParentId==0 && val.AssetsTypeName!='备品备件'){
                        var newdata={
                            title:val.AssetsTypeName,
                            id:val.id,
                            spread:false,
                            other:1,
                            children:[]
                        }
                        data.push(newdata);
                    }else{
                        $.each(data,function(x,y){
                            if(y.id==val.AssetsTypeParentId && val.AssetsTypeName!='备品备件'){
                                y.children.push({
                                    title:val.AssetsTypeName,
                                    id:val.id,
                                    spread:false,
                                    other:2,
                                    children:[]
                                })
                            }else{
                                if(y.children.length!=0){
                                    $.each(y.children,function(m,l){
                                        if(l.id==val.AssetsTypeParentId && val.AssetsTypeName!='备品备件'){
                                            l.children.push({
                                                title:val.AssetsTypeName,
                                                id:val.id,
                                                spread:false,
                                                other:3
                                            })  
                                        }
                                    })
                                }
                            }
                        })
                    }
                })
                layui.use(["form","tree"], function () {
                    $ = layui.jquery;
                    var form = layui.form;
                    var tree = layui.tree;
                    //初始化数据
                    list.info(url, param,function(r){
                        var html = template("listtemplate", r);
                        $("table tbody").html(html);
                        dealEwm(r);
                        checkall(form);
                    });

                    tree.render({
                        elem:"#tree",
                        data:data,
                        id: 'treeId',
                        click: function(obj){
                            if(obj.data.other==3){
                                $('.layui-tree-txt').removeAttr('style');
                                $(obj.elem).find('.layui-tree-txt').css('color','#148cf1');
                                //属性列表
                                param.AssetsTypeId=obj.data.id;
                                list.info(url, param,function(r){
                                    var html = template("listtemplate", r);
                                    $("table tbody").html(html);
                                    dealEwm(r);
                                    checkall(form);
                                });
                            }
                        }
                    }); 
                    //监听提交
                    form.on("submit(search)", function (data) {
                        param.search = data.field.search;
                        list.info(url, param,function(r){
                            var html = template("listtemplate", r);
                            $("table tbody").html(html);
                            dealEwm(r);
                            checkall(form);
                        });
                        return false;
                    });    
                });
            });
        })
        //生成二维码
        function dealEwm(r){
            $.each(r.data,function(n,val){
                var data='资产编号:'+val.AssetsNumber+',资产类型:'+val.AssetsTypeName+',型号:'+val.BrandModel+',资产描述:'+val.AssetsDescribe+',仓库位置:'+val.StoreLocationName+',管理部门:'+val.DeptName+',管理人员:'+val.PersonName+',供应商:'+val.SupplierName;
                var qrcode = $('#'+val.id).qrcode({
                    width: 128,
                    height: 128,
                    text: toUtf8(data)
                });
                var canvas=$('#'+val.id).find("canvas")[0];
                $('#img'+val.id).attr("href",canvas.toDataURL('image/jpeg'));
            })
        }
        //批量出库
        function dealAll(id,param,par){
            // var arr = param;
            // var newArr = [];
            // for (var i = 0; i < arr.length; i++) {
            //     if (arr.indexOf(arr[i]) == i) {
            //         newArr.push(arr[i]);
            //     }
            //     if(arr.length==i+1){
            //         if(newArr.length>1){
            //             layer.msg("只能批量出库同出库类型的资产！", {
            //                 icon: 5,
            //                 time: 2000
            //             });
            //             return false;
            //         }
            //         xadmin.open('出库','asset-putout-add.html','','',id+'&type='+encodeURI(encodeURI(par.toString())))
            //     }
            // }
            var haveu = false;
            var nothaveu = false;
            var havecu = false;
            var nothavecu = false;
            var type=0;//0出库类型不限制  1 出库类型为上架  2出库类型安装
            console.log(param)
            console.log(par)
            if (param.indexOf('0') > -1) {//0 不具有U高不能上架
                nothaveu=true;
            }
            if (param.indexOf('1') > -1) {//1 具有U高能上架
                haveu=true;
            }
            if (par.indexOf('0') > -1) {//0 不具有机柜容量不能安装
                nothavecu=true;
            }
            if (par.indexOf('1') > -1) {//1 具有机柜容量能安装
                havecu=true;
            }
            console.log(nothaveu);
            console.log(haveu);
            if(nothaveu && haveu){
                layer.msg("只能批量出库同出库类型的资产！", {
                    icon: 5,
                    time: 2000
                });
                return false;
            }
            if(nothavecu && havecu){
                layer.msg("只能批量出库同出库类型的资产！", {
                    icon: 5,
                    time: 2000
                });
                return false;
            }
            if(haveu){//u高和机柜容量不会重复存在
                type=1;
            }
            if(havecu){
                type=2;
            }
            console.log(type);
            xadmin.open('出库','asset-putout-add.html','','',id+'&type='+type)
        }
    </script>
</body>

</html>
