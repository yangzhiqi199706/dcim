<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <div class="layui-form-item">
                    <label class="layui-form-label">名称<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="EventName" value="" name="EventName" lay-verify="required"
                            autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">关键字</label>
                    <div class="layui-input-inline">
                        <input type="text" id="KeyWord" value="" name="KeyWord" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        故障类型<span class="x-red">*</span>
                    </label>
                    <div class="layui-input-inline">
                        <select id="FaultTypeId" name="FaultTypeId" lay-verify="required" lay-filter="FaultTypeId">
                            <option value="">请选择故障类型</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        故障子类型<span class="x-red">*</span>
                    </label>
                    <div class="layui-input-inline">
                        <select id="FaultSubTypeLsh" name="FaultSubTypeLsh" lay-verify="required" lay-filter="FaultSubTypeLsh">
                            <option value="">请选择故障子类型</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">解决方案</label>
                    <div class="layui-input-block">
                        <textarea name="FaultSolution" id="FaultSolution" class="layui-textarea"></textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">附件</label>
                    <div class="layui-input-inline">
                        <input type="text" id="FileImg" value="" autocomplete="off" class="layui-input" readonly>
                        <input id="BaseImg" type="hidden" value="" name="KnowledgeFile" >
                    </div>
                    <a class="layui-btn">
                        <input type="file" class="layui-btn" onchange="uploadImg(this)" accept="image/*" value="">
                        选择文件
                    </a>
                    <a class="layui-btn-warm layui-btn fancybox-view" href="" id="ViewImg">预览
                        <img src="" alt="">
                    </a>
                    <a class="layui-btn-danger layui-btn" id="CleanImg" onclick="CleanImg(this)">清空</a>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">备注</label>
                    <div class="layui-input-block">
                        <textarea name="remark" id="remark" class="layui-textarea"></textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function () {
            var OrderName=decodeURI(GetString('OrderName'));
            var FaultTypeName=decodeURI(GetString('FaultTypeName'));
            var FaultTypeId=GetString('FaultTypeId');
            var FaultSubTypeName=decodeURI(GetString('FaultSubTypeName'));

            var name=decodeURI(GetString("name"));
            var eventId=GetString("id");

            if(name)$('#EventName,#KeyWord').val(name);

            layui.use(["form"], function () {
                $ = layui.jquery;
                var form = layui.form;
                $('#ViewImg,#CleanImg').hide();
                if(OrderName)$('#EventName').val(OrderName);
                param.ComboBox = "all";
                list.info("GetFaultTypeListKey", param, function (res) {
                    var html = "<option value=''>请选择故障类型</option>";
                    $.each(res.data, function (n, val) {
                        html += "<option value=\"" + val.id + "\">" + val.FaultTypeName + "</option>";
                    });
                    $("#FaultTypeId").html(html);
                    form.render("select");
                    if(FaultTypeName)layuiSelected("FaultTypeId", FaultTypeName);
                    form.on("select(FaultTypeId)", function (data) {
                        getsub(data)
                    });
                    getsub({value:FaultTypeId},function(){
                        layuiSelected("FaultSubTypeLsh", FaultSubTypeName);
                    })
                });
                //获取子类型
                function getsub(data,callback){
                        param.FaultTypeId = data.value;
                        list.info("GetFaultSubTypeListKey", param, function (res) {
                            var subhtml = "<option value=''>请选择故障子类型</option>";
                            $.each(res.data, function (n, val) {
                                subhtml += "<option value=\"" + val.id + "\">" + val.FaultSubTypeName + "</option>";
                            });
                            $("#FaultSubTypeLsh").html(subhtml);
                            form.render("select");
                            if(callback)callback();
                        });
                    }
                //监听提交
                form.on("submit(submit)", function (data) {
                    var strformData = new FormData($("#formNow")[0]);
                    strformData.append("token", token);
                    if(!eventId){
                        strformData.append("Flag", "运维");
                    }else{
                        strformData.append("Flag", "告警");
                    }
                    list.form("CreateKnowledgeBaseKey", strformData, function (r) {
                        backToparent("添加成功");
                    });
                });
            });
        })
    </script>
</body>

</html>
