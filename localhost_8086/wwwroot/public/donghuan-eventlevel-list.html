<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <a class="layui-btn layui-btn-primary" href="system-parameter-list.html">
                            告警参数
                        </a>
                        <a class="layui-btn layui-btn-primary" href="sms-deployment-list.html">
                            事件关系
                        </a>
                        <a class="layui-btn" href="donghuan-eventlevel-list.html">
                            事件等级
                        </a>
                        <a class="layui-btn layui-btn-primary" href="system-parameter-sms.html">
                            短信/语音/邮件
                        </a>
                        <a class="layui-btn layui-btn-primary" href="sms-query-list.html">
                            短信查询定义
                        </a>
                        <a class="layui-btn layui-btn-primary" href="sms-control-list.html">
                            短信控制定义
                        </a>
                        <a class="layui-btn layui-btn-primary" href="system-masterslave-list.html">
                            主从模式
                        </a>
                        <a class="layui-btn layui-btn-primary" href="donghuan-timealert-list.html">
                            时段告警配置
                        </a>
                    </div>
                    <div class="layui-card-body">
                        <table class="layui-table">
                            <thead>
                                <tr>
                                    <th>编号</th>
                                    <th>等级名称</th>
                                    <th>完成时长(小时)</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.info.length!=0}} {{each data.info as list i}}
                                    <tr>
                                        <td>{{(data.page.p-1)*15+(i+1)}}</td>
                                        <td>{{list.LevelName}}</td>
                                        <td>{{list.Hour}}</td>
                                        <td class="td-manage">
                                            {{if list.role_id!=30}}
                                            <a title="编辑"  class="detail_" onclick="xadmin.open('编辑','donghuan-eventlevel-edit.html','','','{{list.id}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe642;</i>
                                            </a>
                                            {{/if}}
                                        </td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging" class="x-right"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        //请求地址
        var url = "GetAlarmLevelListKey";
        $(function () {
            //初始化数据
            list.get(url, param);
            layui.use("form", function () {
                $ = layui.jquery;
                var form = layui.form;
                //监听提交
                form.on("submit(search)", function (data) {
                    param.pageNo = 1;
                    param.search = data.field.search;
                    list.get(url, param);
                    return false;
                });
            });
        })
        //分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            list.get(url, param);
        }
    </script>
</body>

</html>
