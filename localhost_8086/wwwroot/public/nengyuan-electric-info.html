<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>报表管理->能源管理->电能数据</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" placeholder="请输入仪表名称" name="search">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <select id="ServerCode" name="ServerCode" lay-filter="ServerCode">
                                    <option value="">请选择</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <select id="AreaId" name="AreaId" lay-filter="AreaId">
                                    <option value="">请选择</option>
                                </select>
                            </div>

                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                                <button class="layui-btn" lay-submit lay-filter="import" type="button"
                                    onclick="displayexport('down','electrictable','电能数据')" id="down">导出</button>
                            </div>
                        </form>
                        <button class="layui-btn x-right" type="button"
                            onclick="xadmin.open('电表配置','nengyuan-electric-list.html')">电表配置</button>
                    </div>
                    <div class="layui-card-body">
                        <table class="layui-table" id="electrictable">
                            <thead>
                                <tr>
                                    <th>仪表名称</th>
                                    <th>计量方向</th>
                                    <th>当前功率（KW）</th>
                                    <th>当前电度读数（Kw.h）</th>
                                    <th>昨日电量（Kw.h）</th>
                                    <th>昨日电费（元）</th>
                                    <th>今日电量（Kw.h）</th>
                                    <th>今日电费（元）</th>
                                    <th>本月电量（Kw.h）</th>
                                    <th>本月电费（元）</th>
                                    <th>本年电量（Kw.h）</th>
                                    <th>本年电费（元）</th>
                                    <th>累计电量（Kw.h）</th>
                                    <th>累计电费（元）</th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                            <script type="text/html" id="listtemplate">
                                {{if data.length!=0}} {{each data as list i}}
                                <tr>
                                    <td>{{list.Name}}</td>
                                    <td>{{list.glValue}}</td>
                                    <td>{{list.ddValue}}</td>
                                    <td>{{list.yhnValue}}</td>
                                    <td>{{list.thnValue}}</td>
                                </tr>
                                {{/each}} {{else}}
                                <tr>
                                    <td colspan="20" style="text-align: center">暂无相关数据</td>
                                </tr>
                                {{/if}}
                            </script>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        //请求地址
        var url = "GetDNInfoKey";
        // list.info('/SetTimeVersion',{
        //     token:token
        // })
        $(function () {
            layui.use(["form", "laydate"], function () {
                $ = layui.jquery;
                var form = layui.form;
                list.info(url, param, function (r) {
                    var html = template("listtemplate", r);
                    $("tbody").html(html);
                });
                //服务器
                getServer(form, function () {
                    form.on("select(ServerCode)", function (data) {
                        param.ServerCode = data.value;
                        param.ComboBox = "all";
                        getArea(form, data, function () {
                            form.on("select(AreaId)", function (data) {
                                param.AreaId = data.value;
                            })
                        });
                    });
                });
                //监听提交
                form.on("submit(search)", function (data) {
                    param.search = data.field.search;
                    param.ServerCode = data.field.ServerCode;
                    param.AreaId = data.field.AreaId;
                    list.info(url, param, function (r) {
                        var html = template("listtemplate", r);
                        $("tbody").html(html);
                    });
                    return false;
                });
            });
        })

    </script>
</body>

</html>
