<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <select id="CheckStatus" name="CheckStatus" lay-filter="CheckStatus">
                                    <option value="">请选择状态</option>
                                    <option value="正常">正常</option>
                                    <option value="损坏">损坏</option>
                                    <option value="丢失">丢失</option>
                                    <option value="异常">异常</option>
                                    <option value="维修">维修</option>
                                    <option value="标签丢失">标签丢失</option>
                                    <option value="未写入标签">未写入标签</option>
                                    <option value="未放置标签">未放置标签</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="layui-card-body">
                        <table class="layui-table">
                            <thead>
                                <tr>
                                    <th>资产编号</th>
                                    <th>资产类型</th>
                                    <th>型号</th>
                                    <th>资产描述</th>
                                    <th>资产状态</th>
                                    <th>盘点结果</th>
                                    <th>区域</th>
                                    <th>机柜列</th>
                                    <th>机柜</th>
                                    <th>占用U位</th>
                                    <th>结果描述</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.CheckPlanData.length!=0}} {{each data.CheckPlanData as list i}}
                                    <tr> 
                                        <td>{{list.AssetsNumber}}</td>
                                        <td>{{list.AssetsTypeName}}</td>
                                        <td>{{list.BrandModel}}</td>
                                        <td>{{list.AssetsDescribe}}</td>
                                        <td>{{if list.AssetStatus=='I'}}入库
                                            {{else if list.AssetStatus=='W'}}待上架
                                            {{else if list.AssetStatus=='F'}}在架 
                                            {{else if list.AssetStatus=='FR'}}在架维修
                                            {{else if list.AssetStatus=='IR'}}在库维修
                                            {{else if list.AssetStatus=='L'}}领用
                                            {{else if list.AssetStatus=='G'}}赠送
                                            {{else if list.AssetStatus=='Y'}}遗失
                                            {{else if list.AssetStatus=='R'}}报废
                                            {{else if list.AssetStatus=='DF'}}外送维修（在架）
                                            {{else if list.AssetStatus=='DI'}}外送维修（在库）
                                            {{else if list.AssetStatus=='O'}}待安装
                                            {{else if list.AssetStatus=='T'}}安装
                                            {{else if list.AssetStatus=='B'}}借用
                                            {{else}}下架
                                            {{/if}}
                                        </td>
                                        <td>{{list.CheckStatus}}</td>
                                        <td>{{list.AreaName}}</td>
                                        <td>{{list.column}}</td>
                                        <td>{{list.position}}</td>
                                        <td>{{list.ULocation}}</td>
                                        <th>{{list.remark}}</th>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        var id=GetString('id');
        $(function(){
            var paramStatus={
                token:token,
                id:id,
                CheckStatus:''
            }
            var form;
            layui.use(["form","tree"], function () {
                $ = layui.jquery;
                form = layui.form;
                getInfo(function(){
                    //监听提交
                    form.on("submit(search)", function (data) {
                        paramStatus.CheckStatus = data.field.CheckStatus;
                        getInfo();
                        return false;
                    });
                })
            });
            function getInfo(back){
                list.info("GetCheckPlanDetailKey",paramStatus,function(r){
                    var lists = template("listtemplate", r);
                    $("tbody").html(lists);
                    form.render();
                    if(back)back();
                })
            }
        })
    </script>
</body>
</html>
