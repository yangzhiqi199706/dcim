<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/jquery.qrcode.min.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>运维管理->配置->值班计划->班次定义</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <form class="layui-form layui-card-body">
                        <table class="layui-table">
                            <thead>
                                <tr>
                                    <th>编号</th>
                                    <th>班次名称</th>
                                    <th>开始时间</th>
                                    <th>结束时间</th>
                                    <th>启用</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.info.length!=0}} {{each data.info as list i}}
                                    <tr>
                                        <td>{{(data.page.p-1)*15+(i+1)}}</td>
                                        <td>{{list.BCName}}</td>
                                        <td>{{list.BCstart}}</td>
                                        <td>{{list.BCend}}</td>
                                        <td>
                                            <input data-id="{{list.id}}" data-BCstart="{{list.BCstart}}" data-BCend="{{list.BCend}}" type="checkbox" name="BCDisable" lay-skin="switch" lay-filter="BCDisable"  lay-text="开启|关闭" {{if list.BCDisable == '1'}}checked{{/if}}>
                                        </td>
                                        <td>
                                            <a title="编辑" onclick="xadmin.open('编辑','yunwei-banci-edit.html','','','{{list.id}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe642;</i>
                                            </a>
                                        </td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script>
        var url = "GetBCListKey";
        $(function () {
            //初始化数据
            list.get(url, param, '', function (r) {
                layui.use(["form", "tree"], function () {
                    $ = layui.jquery;
                    var form = layui.form;
                    form.render();
                    form.on("switch(BCDisable)", function (data) {
                        var BCDisable=data.elem.checked?1:-1;
                        list.info('ChangeBCKey',{
                            token:token,
                            BCDisable:BCDisable,
                            id:data.elem.attributes['data-id'].value,
                            BCstart:data.elem.attributes['data-BCstart'].value,
                            BCend:data.elem.attributes['data-BCend'].value
                        },function(r){
                        })
                    });
                });
            });
        })
        //分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            list.get(url, param);
        }
    </script>
</body>

</html>
