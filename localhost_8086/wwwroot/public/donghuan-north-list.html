<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <style>
        a.layui-btn:hover {
            color: #fff !important
        }
    </style>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" placeholder="请输入设备名称" name="search">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <select id="DataType" name="DataType" lay-filter="DataType">
                                    <option value="">数据类型</option>
                                    <option value="1,3">遥测</option>
                                    <option value="2">遥信</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                        <a class="layui-btn x-right" onclick="xadmin.open('点表控制','donghuan-north-ctl.html')"
                            style="margin-left: 10px;">
                            点表控制
                        </a>
                        <a class="layui-btn x-right" id="snmpPointImport" style="margin-left: 10px;">
                            点表导入
                        </a>
                        <a class="layui-btn x-right" id="snmpPointExport" style="margin-left: 10px;">
                            点表导出
                        </a>
                        <a class="layui-btn x-right" id="paramExport">
                            属性导出
                        </a>
                        <!-- <a class="layui-btn x-right" id="dealNotify">
                            数据处理
                        </a> -->
                    </div>
                    <div class="layui-card-body">
                        <table class="layui-table">
                            <thead>
                                <tr>
                                    <th>点号</th>
                                    <th>属性ID</th>
                                    <th>属性</th>
                                    <th>设备ID</th>
                                    <th>设备名</th>
                                    <th>值</th>
                                    <th>采集值</th>
                                    <th>值范围</th>
                                    <th>信号单位</th>
                                    <th>数据类型</th>
                                    <th>OId</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.info.length!=0}} {{each data.info as list i}}
                                    <tr>
                                        <td>{{(data.page.p-1)*15+(i+1)}}</td>
                                        <td>{{list.id}}</td>
                                        <td>{{list.AlarmKey}}</td>
                                        <td>{{list.DevId}}</td>
                                        <td>{{list.DeviceName}}</td>
                                        <td>{{list.Value}}</td>
                                        <td>{{list.SendValue}}</td>
                                        <td>{{list.ValueRange}}</td>
                                        <td>{{list.Unit}}</td>
                                        <td>{{list.DataType}}</td>
                                        <td>{{list.OId}}</td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        //请求地址
        var url = "GetParamValListKey";
        var search = '', form, upload;
        $(function () {
            layui.use(["form", "upload"], function () {
                $ = layui.jquery;
                form = layui.form;
                upload = layui.upload;
                ImportParamVal();

                list.get(url, param, dealdata);
                //搜索
                form.on("submit(search)", function (data) {
                    param.pageNo = 1;
                    param.search = data.field.search;
                    param.DataType = data.field.DataType;
                    list.get(url, param, dealdata);
                    return false;
                });
                //104导出
                $('#paramExport').click(function () {
                    var html = '<a href=' + ajaxUrl + 'ExportParamValDataKey?token=' + token;
                    if (param.search) html += '&search=' + param.search;
                    if (param.DataType) html += '&DataType=' + param.DataType;
                    html += ' id="exportlist"></a>';
                    $(this).parent().append(html);
                    $('#exportlist')[0].click();
                    setTimeout(function () {
                        $('#exportlist').remove();
                    }, 3000);
                })
                //点表导出
                $('#snmpPointExport').click(function () {
                    var html = '<a href=' + ajaxUrl + 'ExportParamValDataKey?type=oid&token=' + token;
                    if (param.search) html += '&search=' + param.search;
                    if (param.DataType) html += '&DataType=' + param.DataType;
                    html += ' id="exportlist"></a>';
                    $(this).parent().append(html);
                    $('#exportlist')[0].click();
                    setTimeout(function () {
                        $('#exportlist').remove();
                    }, 3000);
                })

            });
        })
        //点表导入
        function ImportParamVal() {
            upload.render({
                elem: '#snmpPointImport',
                data: {
                    'token': token
                },
                accept: 'file',
                exts: 'xls',
                url: ajaxUrl + 'ImportParamValDataKey', //上传接口
                before: function (obj) {
                    layer.load(); //上传loading
                },
                done: function (res) {
                    layer.closeAll('loading'); //关闭loading
                    if (res.code == 100) {
                        layer.msg("导入成功！", {
                            icon: 1,
                            time: 1000
                        });
                        changecallbak();
                    } else {
                        layer.msg(res.msg, {
                            icon: 5,
                            time: 3000
                        });
                    }
                }, error: function (res) {
                    layer.closeAll('loading'); //关闭loading
                    layer.msg(res.msg, {
                        icon: 5,
                        time: 3000
                    });
                }
            });
        }
        //数据处理
        function dealdata(res) {
            if (res.data.info.length > 0) {
                $.each(res.data.info, function (n, val) {
                    let newValue = '';
                    let newSendValue = '';
                    let Unit = '';
                    if (val['LastReceiveData']) {
                        //采集值转json
                        let receiveDataJson = JSON.parse(val['LastReceiveData'].replaceAll("'", '"'));
                        //根据 ParamName 匹配采集数值
                        if (val['AlarmKey'] in receiveDataJson) {
                            let collectorVal = receiveDataJson[val['AlarmKey']]; //20(A)
                            let collectorValArr = collectorVal.split('(');//[20,A)]
                            newSendValue = collectorValArr[0];
                            newValue = parseFloat(newSendValue).toFixed(1);
                            if (collectorValArr[1]) {//单位 
                                let unitArr = collectorValArr[1].split(')');
                                Unit = unitArr[0];
                            }
                        }
                    }
                    let DataType = '遥测';
                    let ValueRange = '0-65535';
                    if (val['DataType'] && val['DataType'] == '2') {
                        DataType = '遥信';
                        ValueRange = '0/1';
                    }
                    val['Value'] = newValue;
                    val['SendValue'] = newSendValue;
                    val['ValueRange'] = ValueRange;
                    val['Unit'] = Unit;
                    val['DataType'] = DataType;
                })
            }
            // console.log(res)
        }

        //分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            list.get(url, param, dealdata);
        }

        //其它页面回到此页面
        function changecallbak() {
            list.get(url, param, dealdata);
        }
    </script>
</body>

</html>
