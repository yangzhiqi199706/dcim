<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <div class="layui-col-2">
                    <div class="layui-form-item">
                        <label class="layui-form-label">区域名称<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="AreaName" value="" name="AreaName" lay-verify="required" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">上级区域<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <select id="AreaParentId" name="AreaParentId" lay-verify="required" lay-filter="AreaParentId">
                                <option value="0">顶级区域</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">等级<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <select id="AreaLevel" name="AreaLevel" lay-verify="required">
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="D">D</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">联系电话</label>
                        <div class="layui-input-inline">
                            <input type="text" id="EmpPhone" value="" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">额定功率(W)</label>
                        <div class="layui-input-inline">
                            <input type="text" id="EPower" value="" name="EPower" lautocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">UPS额定容量(W)</label>
                        <div class="layui-input-inline">
                            <input type="text" id="ECold" value="" name="ECold" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">承重(kg)</label>
                        <div class="layui-input-inline">
                            <input type="text" id="AreaWeight" value="" name="AreaWeight" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">电度ID</label>
                        <div class="layui-input-inline">
                            <textarea id="DegreeID" name="DegreeID" class="layui-textarea" readonly></textarea>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" onclick="xadmin.open('选择配置项','report-tableparam-choose.html?inputid=DegreeID&className='+encodeURI(encodeURI('总表')))">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">UPS功率ID</label>
                        <div class="layui-input-inline">
                            <textarea id="UPSPowerID" name="UPSPowerID" class="layui-textarea" readonly></textarea>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" onclick="xadmin.open('选择配置项','report-tableparam-choose.html?inputid=UPSPowerID&className='+encodeURI(encodeURI('总表')))">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">制冷负载系数ID</label>
                        <div class="layui-input-inline">
                            <textarea id="ColdRatioID" name="ColdRatioID" class="layui-textarea" readonly></textarea>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" onclick="xadmin.open('选择配置项','report-tableparam-choose.html?inputid=ColdRatioID&className='+encodeURI(encodeURI('总表')))">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">区域展示宽度(像素)</label>
                        <div class="layui-input-inline">
                            <input type="text" id="AreaWidth" value="" name="AreaWidth" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                </div>
                <div class="layui-col-2">
                    <div class="layui-form-item">
                        <label class="layui-form-label">
                            所属服务器<span class="x-red">*</span>
                        </label>
                        <div class="layui-input-inline">
                            <select id="ServerCode" name="ServerCode" lay-verify="required" lay-filter="ServerCode">
                                <option value="">请选择</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">负责人</label>
                        <div class="layui-input-inline">
                            <input type="text" id="EmpId" value="1" name="EmpId" autocomplete="off" class="layui-input" readonly onclick="xadmin.open('选择人员','choose-person.html?type=person')">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">额定机柜数</label>
                        <div class="layui-input-inline">
                            <input type="text" id="ECabinet" value="" name="ECabinet" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">额定制冷率(W)</label>
                        <div class="layui-input-inline">
                            <input type="text" id="ECold" value="" name="ECold" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">面积(m²)</label>
                        <div class="layui-input-inline">
                            <input type="text" id="AreaArea" value="" name="AreaArea" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">PUE ID</label>
                        <div class="layui-input-inline">
                            <textarea id="PUEID" name="PUEID" class="layui-textarea" readonly></textarea>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" onclick="xadmin.open('选择配置项','report-tableparam-choose.html?inputid=PUEID&className='+encodeURI(encodeURI('总表')))">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">功率ID</label>
                        <div class="layui-input-inline">
                            <textarea id="PowerID" name="PowerID" class="layui-textarea" readonly></textarea>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" onclick="xadmin.open('选择配置项','report-tableparam-choose.html?inputid=PowerID&className='+encodeURI(encodeURI('总表')))">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">制冷功率ID</label>
                        <div class="layui-input-inline">
                            <textarea id="ColdPowerID" name="ColdPowerID" class="layui-textarea" readonly></textarea>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" onclick="xadmin.open('选择配置项','report-tableparam-choose.html?inputid=ColdPowerID&className='+encodeURI(encodeURI('总表')))">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">供电负载系数ID</label>
                        <div class="layui-input-inline">
                            <textarea id="PowerSupplyID" name="PowerSupplyID" class="layui-textarea" readonly></textarea>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" onclick="xadmin.open('选择配置项','report-tableparam-choose.html?inputid=PowerSupplyID&className='+encodeURI(encodeURI('总表')))">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">区域展示高度(像素)</label>
                        <div class="layui-input-inline">
                            <input type="text" id="AreaHeight" value="" name="AreaHeight" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">区域3D顶视图</label>
                    <div class="layui-input-inline">
                        <input type="text" id="FileImg" autocomplete="off" class="layui-input" readonly>
                        <input id="BaseImg" type="hidden" value="" name="AreaImg" >
                    </div>
                    <a class="layui-btn">
                        <input type="file" class="layui-btn" onchange="uploadImg(this)" accept="image/*" value="">
                        选择文件
                    </a>
                    <a class="layui-btn-warm layui-btn fancybox-view" href="" id="ViewImg">预览
                        <img src="" alt="">
                    </a>
                    <a class="layui-btn-danger layui-btn" id="CleanImg" onclick="CleanImg(this)">清空</a>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function(){

            $('#ViewImg,#CleanImg').hide();
            
            layui.use(["form"], function () {
                $ = layui.jquery;
                var form = layui.form;
                //服务器
                getServer(form,function(){
                    form.on("select(ServerCode)", function (data) {
                        param.ServerCode=data.value;
	                    $("#AreaParentId").html('<option value="0">顶级区域</option>');
                        list.info("GetAreaListKey", param, function (res) {
                            var areahtml = "";
                            $.each(res.data, function (n, val) {
                                areahtml += "<option value=\"" + val.id + "\">" + val.AreaName + "</option>";
                            });
                            $("#AreaParentId").append(areahtml);
                            form.render("select");
                        });
                    });
                });
                 //监听提交
				form.on("submit(submit)", function (data) {
                    var strformData = new FormData($("#formNow")[0]);
                    strformData.append("token", token);
                    list.form("CreateAreaKey", strformData, function (r) {
                        backToparent("添加成功");
                    });
                });
            });
        });
        
    </script>
</body>

</html>
