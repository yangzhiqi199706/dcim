<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <style>
        .imgPos {
            position: relative;
            top: -2px;
            width: 18px
        }
    </style>
</head>

<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite id="titlename"></cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" placeholder="请输入设备名称" name="search">
                            </div>
                            <div class="layui-inline layui-show-xs-block" id="serverCodeDiv">
                                <select id="ServerCode" name="ServerCode" lay-filter="ServerCode">
                                    <option value="">服务器</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block" id="areaIdDiv">
                                <select id="AreaId" name="AreaId" lay-filter="AreaId">
                                    <option value="">区域</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block" id="deviceClassDiv">
                                <select id="DeviceClass" name="DeviceClass" lay-filter="DeviceClass">
                                    <option value="">设备分类</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>

                        <button class="layui-btn x-right" onclick="xadmin.open('新增设备','donghuan-device-add.html')">
                            新增设备
                        </button>
                        <button class="layui-btn x-right" onclick="SendAll()" id="SendAll" style="display:none;">
                            一键下发
                        </button>
                        <button class="layui-btn x-right" type="button" style="margin-right: 10px;"
                            onclick="xadmin.open('分类管理','donghuan-class-list.html')">分类管理</button>
                        <button class="layui-btn x-right" onclick="xadmin.open('点表数据','donghuan-north-list.html')">
                            点表数据
                        </button>
                        <!-- <button class="layui-btn x-right" onclick="xadmin.open('主机布防','donghuan-device-hostdeploy-list.html')">
                            主机布防
                        </button> -->
                        <a class="layui-btn x-right" id="devicePtl">
                            协议导入
                        </a>
                        <button class="layui-btn x-right" type="button" id="deviceOut">导出</button>
                    </div>
                    <div class="layui-card-body">
                        <table class="layui-table layui-form">
                            <thead>
                                <tr>
                                    <th class="showcheck">
                                        <input type="checkbox" id="checkall" lay-filter="checkall" lay-skin="primary">
                                    </th>
                                    <th>编号</th>
                                    <th>设备名称</th>
                                    <th>设备ID</th>
                                    <th>设备型号</th>
                                    <th>IP:端口/串口地址</th>
                                    <!-- <th>序列号/唯一标识</th> -->
                                    <!-- <th>当前值</th> -->
                                    <th>设备分类</th>
                                    <th>所属服务器</th>
                                    <th>所属区域</th>
                                    <th>当前状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                {{if data.info.length!=0}} {{each data.info as list i}}
                                <tr {{if list.ClassName!='门禁' && list.ClassName!='微信网关' && list.DeviceClass!='6' &&
                                    list.DeviceClass!='7' && list.DeviceClass!='19' && list.DeviceStatus==0}}
                                    class="colorred" {{/if}}>

                                    <td width="80" class="tdshowcheck">
                                        <input type="checkbox" value="{{list.id}}" name="id" lay-filter="checkone"
                                            lay-skin="primary" data-sn="{{list.SerialNumber}}" data-id="{{list.id}}">
                                    </td>
                                    <td>{{(data.page.p-1)*15+(i+1)}}</td>
                                    <td name="name">{{list.DeviceName}}</td>
                                    <td>{{list.id}}</td>
                                    <td>{{list.DeviceType}}</td>
                                    <td>{{if list.LinkMode==1 ||
                                        list.LinkMode==3}}{{list.DeviceIP}}:{{list.DevicePort}}
                                        {{else if list.LinkMode==2}}{{list.DeviceIP}}{{/if}}</td>
                                    <!-- <td>{{list.DeviceLastData}}</td> -->
                                    <!-- <td>{{if list.SerialNumber}}{{list.SerialNumber}}{{/if}}/{{if list.OnlyCode}}{{list.OnlyCode}}{{/if}}</td> -->
                                    <td>{{list.ClassName}}</td>
                                    <td>{{list.ServerName}}</td>
                                    <td>{{list.AreaName}}</td>
                                    <td>{{if list.ClassName!='门禁' && list.ClassName!='微信网关' && list.DeviceClass!='6' &&
                                        list.DeviceClass!='7' && list.DeviceClass!='19'}}{{if list.DeviceStatus==0}} 离线
                                        {{else}} 在线 {{/if}}{{else}}-{{/if}}</td>
                                    <td>
                                        {{if list.ClassName!='微信网关' && list.DeviceClass!='6' && list.DeviceClass!='7' &&
                                        list.DeviceClass!='19'}}
                                        <a title="当前值"
                                            onclick="xadmin.open('当前值','donghuan-device-value.html','','','{{list.id}}&LinkMode={{list.LinkMode}}')"
                                            href="javascript:;">
                                            <i class="layui-icon">&#xe714;</i>
                                        </a>
                                        {{if list.ProtocolCode!='18001' && list.ClassName!='门禁'}}
                                        {{if list.LinkMode!=3}}
                                        <a title="采集指令/控制指令"
                                            onclick="xadmin.open('采集指令/控制指令','donghuan-device-commandRev.html','','',
                                            '{{list.id}}&code={{list.ProtocolCode}}&linktype={{list.LinkMode}}')"
                                            href="javascript:;">
                                            <i class="layui-icon">&#xe808;</i>
                                        </a>
                                        {{else}}
                                        <a title="控制指令"
                                            onclick="xadmin.open('控制指令','donghuan-device-command.html','','',
                                            '{{list.id}}&code={{list.ProtocolCode}}&linktype={{list.LinkMode}}')"
                                            href="javascript:;">
                                            <i class="layui-icon">&#xe808;</i>
                                        </a>
                                        {{/if}}
                                        {{/if}}
                                        {{/if}}
                                        <a title="编辑"
                                            onclick="xadmin.open('编辑','donghuan-device-edit.html','','','{{list.id}}')"
                                            href="javascript:;">
                                            <i class="layui-icon">&#xe642;</i>
                                        </a>
                                        <a title="删除" onclick="x_admin_del('确认删除吗？','DelDeviceKey','{{list.id}}',this)"
                                            href="javascript:;">
                                            <i class="layui-icon">&#xe640;</i>
                                        </a>
                                        <a title="事件"
                                            onclick="xadmin.open('事件','donghuan-event-list.html','','','{{list.id}}')"
                                            href="javascript:;">
                                            <i class="layui-icon">&#xe656;</i>
                                        </a>
                                        {{if list.ClassName=='门禁'}}
                                        <a title="下发权限"
                                            onclick="xadmin.open('下发权限','donghuan-mencus-group.html','','','{{list.id}}')"
                                            href="javascript:;">
                                            <i class="layui-icon">&#xe609;</i>
                                        </a>
                                        {{if list.ProtocolCode=='14003'}}
                                        <a title="门禁管理"
                                            onclick="xadmin.open('门禁管理','donghuan-menDAHUA-list.html','','',
                                            '{{list.id}}&ip={{list.DeviceIP}}&port={{list.DevicePort}}&user={{list.account}}&password={{list.password}}')"
                                            href="javascript:;">
                                            <i class="layui-icon">&#xe672;</i>
                                        </a>
                                        {{else if list.ProtocolCode=='14004'}}
                                        <a title="门禁管理"
                                            onclick="xadmin.open('门禁管理','donghuan-menAndakai-list.html','','','{{list.id}}')"
                                            href="javascript:;">
                                            <i class="layui-icon">&#xe672;</i>
                                        </a>
                                        {{else}}
                                        <a title="门禁管理"
                                            onclick="xadmin.open('门禁管理','donghuan-menCus-list.html','','',
                                            '{{list.id}}&SerialNumber={{list.SerialNumber}}&code={{list.ProtocolCode}}')"
                                            href="javascript:;">
                                            <i class="layui-icon">&#xe672;</i>
                                        </a>
                                        {{/if}}
                                        {{/if}}
                                        {{if list.LinkMode==3}}
                                        <a title="导入参数" href="javascript:;" id="oid{{list.id}}">
                                            <i class="layui-icon">&#xe610;</i>
                                        </a>
                                        <a title="导入trap告警参数" href="javascript:;" id="alarm{{list.id}}">
                                            <i class="layui-icon">&#xe667;</i>
                                        </a>
                                        {{/if}}
                                        {{if list.ProtocolCode=='18001'}}
                                        <a title="导入U位信息" href="javascript:;" id="u{{list.id}}">
                                            <i class="layui-icon">&#xe681;</i>
                                        </a>
                                        <a title="导入温湿度信息" href="javascript:;" id="th{{list.id}}">
                                            <i class="layui-icon">&#xe67c;</i>
                                        </a>
                                        {{/if}}
                                        <a title="撤防" onclick="SetAlarmCloseNotice(this,'{{list.id}}')"
                                            href="javascript:;" {{if list.Deploy=="0" }}style="display: none;" {{/if}}>
                                            <img src="images/closenotice.png" class="imgPos">
                                        </a>
                                        <a title="布防" onclick="SetAlarmNotice(this,'{{list.id}}')" href="javascript:;"
                                            {{if list.Deploy=="1" }}style="display: none;" {{/if}}>
                                            <img src="images/notice.png" class="imgPos">
                                        </a>
                                    </td>
                                </tr>
                                {{/each}} {{else}}
                                <tr>
                                    <td colspan="20" style="text-align: center">暂无相关数据</td>
                                </tr>
                                {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                    </div>
                    <table id="listOut" style="display: none;">
                        <thead>
                            <tr>
                                <th>编号</th>
                                <th>设备名称</th>
                                <th>设备ID</th>
                                <th>设备型号</th>
                                <th>IP:端口/串口地址</th>
                                <!-- <th>序列号/唯一标识</th> -->
                                <!-- <th>当前值</th> -->
                                <th>设备分类</th>
                                <th>所属服务器</th>
                                <th>所属区域</th>
                                <th>当前状态</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                    <script type="text/html" id="details">
                    {{if data.length!=0}} {{each data as list i}}
                    <tr {{if list.ClassName!='门禁' && list.ClassName!='微信网关' && list.DeviceClass!='6' &&
                        list.DeviceClass!='7' && list.DeviceClass!='19' && list.DeviceStatus==0}} class="colorred"
                        {{/if}}>
                        <td>{{(i+1)}}</td>
                        <td name="name">{{list.DeviceName}}</td>
                        <td>{{list.id}}</td>
                        <td>{{list.DeviceType}}</td>
                        <td>{{if list.LinkMode==1 || list.LinkMode==3}}{{list.DeviceIP}}:{{list.DevicePort}}
                            {{else if list.LinkMode==2}}{{list.DeviceIP}}{{/if}}</td>
                        <!-- <td>{{list.DeviceLastData}}</td> -->
                        <!-- <td>{{if list.SerialNumber}}{{list.SerialNumber}}{{/if}}/{{if list.OnlyCode}}{{list.OnlyCode}}{{/if}}</td> -->
                        <td>{{list.ClassName}}</td>
                        <td>{{list.ServerName}}</td>
                        <td>{{list.AreaName}}</td>
                        <td>{{if list.ClassName!='门禁' && list.ClassName!='微信网关' && list.DeviceClass!='6' &&
                            list.DeviceClass!='7' && list.DeviceClass!='19'}}{{if list.DeviceStatus==0}} 离线 {{else}} 在线
                            {{/if}}{{else}}-{{/if}}</td>
                    </tr>
                    {{/each}} {{else}}
                    <tr>
                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                    </tr>
                    {{/if}}
                    </script>
                </div>
            </div>
        </div>
    </div>
    <script>
        // 请求地址
        var url = "GetDeviceListKey";
        let devclass = GetString("devclass");
        var search = '', form, upload;
        var selectedDevices = []; // 存储选中的设备序列号
        //
        $(function () {
            // 初始化Layui模块
            layui.use(["form", "upload"], function () {
                $ = layui.jquery;
                form = layui.form;
                upload = layui.upload;
                form.render();
                upPtl();

                if (devclass == 14) {
                    $("#titlename").html("动环监控-><span style='color: #FFA666;'>门禁管理</span>");
                    $("#SendAll").show();
                    $("#serverCodeDiv").hide();
                    $("#areaIdDiv").hide();
                    $("#deviceClassDiv").hide();
                    $("button:contains('新增设备')").hide();
                    $("button:contains('分类管理')").hide();
                    $("button:contains('点表数据')").hide();
                    $("#devicePtl").hide();

                } else {
                    $("#titlename").html("动环监控-><span style='color: #FFA666;'>设备管理</span>");
                }

                // 服务器选择
                getServer(form, function () {
                    form.on("select(ServerCode)", function (data) {
                        param.ServerCode = data.value;
                        param.ComboBox = "all";
                        getArea(form, data);
                    });
                });

                // 设备分类
                list.info("GetClassListKey", {
                    token: token,
                    ComboBox: 'all'
                }, function (res) {
                    var classhtml = '<option value="">请选择</option>';
                    $.each(res.data, function (n, val) {
                        classhtml += "<option value=\"" + val.ClassName + "\">" + val.ClassName + "</option>";
                    });
                    $("#DeviceClass").html(classhtml);
                    form.render("select");
                });

                // 初始化数据
                delete param['ComboBox'];
                if (devclass == 14) {
                    param.ClassName = '门禁';
                }
                list.get(url, param, dealdata, dealupload);

                // 搜索提交
                form.on("submit(search)", function (data) {
                    param.pageNo = 1;
                    param.search = search = data.field.search;
                    param.ServerCode = data.field.ServerCode;
                    param.AreaId = data.field.AreaId;
                    if (devclass == 14) {
                        param.ClassName = '门禁';
                    } else {
                        param.ClassName = data.field.DeviceClass;
                    }
                    delete param['ComboBox'];
                    list.get(url, param, dealdata, dealupload);
                    return false;
                });

                // 修改后的全选/单选事件处理
                form.on('checkbox(checkall)', function (data) {
                    var child = $(data.elem).closest('.layui-table').find('tbody input[type="checkbox"][lay-filter="checkone"]');
                    selectedDevices = []; // 清空数组

                    child.each(function () {
                        this.checked = data.elem.checked;
                        var sn = $(this).data('id');
                        if (data.elem.checked && sn) {
                            selectedDevices.push(sn);
                        }
                    });
                    form.render('checkbox');
                    console.log('全选操作:', selectedDevices); // 调试
                });

                form.on('checkbox(checkone)', function (data) {
                    var sn = $(data.elem).data('id');
                    if (data.elem.checked) {
                        if (sn && !selectedDevices.includes(sn)) {
                            selectedDevices.push(sn);
                        }
                    } else {
                        selectedDevices = selectedDevices.filter(item => item !== sn);
                    }

                    // 更新全选状态
                    var allChecked = selectedDevices.length === $(data.elem).closest('.layui-table').find('tbody input[type="checkbox"][lay-filter="checkone"]').length;
                    $("#checkall").prop('checked', allChecked);
                    form.render('checkbox');
                    console.log('单选操作:', selectedDevices); // 调试
                });
            });

            // 定时刷新数据
            var time = setInterval(function () {
                delete param['ComboBox'];
                list.get(url, param, dealdata, dealupload);
            }, 120000);
        })

        // 一键下发功能
        function SendAll() {
            console.log('当前选中设备:', selectedDevices);
            var currentSelected = [];
            $('input[type="checkbox"][lay-filter="checkone"]:checked').each(function (n, val) {
                var sn = $(this).data('id');
                if (sn) currentSelected.push(sn);
            });

            if (currentSelected.length === 0) {
                layer.msg('请至少选择一个门禁设备', { icon: 5, time: 1000 });
                return false;
            }
            xadmin.open('批量下发权限', 'donghuan-mencus-group.html', '', '', currentSelected.join(','));
            return false;
        }

        // 去除重复设备
        function unique(arr, devlist) {
            let newarr = [];
            $.each(arr, function (n, val) {
                let findnew = newarr.findIndex(v => v.DevID == val.DevID);
                let finddev = devlist.findIndex(v => v.DevID == val.DevID);
                if (findnew < 0 && finddev > -1) {
                    val.DeviceStatus = devlist[finddev].DeviceStatus;
                    newarr.push(val);
                }
            })
            return newarr;
        }

        //导出
        $('#deviceOut').click(function () {
            list.info(url, {
                token: token,
                ComboBox: 'all',
                search: param.search,
                ServerCode: param.ServerCode,
                AreaId: param.AreaId,
                ClassName: param.ClassName
            }, function (res) {
                if (res.data.length > 0) {
                    dealdata(res, function (r) {
                        // console.log(r);
                        let htmls = template("details", r);
                        $("#listOut tbody").html(htmls);
                        displayexport('deviceOut', 'listOut', '设备列表', true);
                    });
                } else {
                    layer.msg("没有可导出的数据", {
                        icon: 5,
                        time: 1000
                    });
                }
            })
        });

        // 处理数据
        function dealdata(r, callback) {
            let data = r.data;
            // console.log(r);
            if (callback) {
                let res = {
                    data: data
                }
                callback(res);
            }
        }

        // 协议导入功能
        function upPtl() {
            upload.render({
                elem: '#devicePtl',
                headers: {
                    Auth: token
                },
                accept: 'file',
                exts: 'xls|xlsx',
                field: 'file',
                url: '/ImportDevicePtlKeyV2',
                before: function (obj) {
                    layer.load();
                },
                done: function (res) {
                    layer.closeAll('loading');
                    if (res.code == 100) {
                        layer.msg("导入成功！", { icon: 1, time: 1000 });
                    } else {
                        layer.msg(res.msg, { icon: 5, time: 2000 });
                    }
                },
                error: function (res) {
                    layer.closeAll('loading');
                    layer.msg(res.msg, { icon: 5, time: 1000 });
                }
            });
        }

        // 处理导入参数
        function dealupload(res) {
            $.each(res.data.info, function (n, val) {
                if (val.LinkMode == 3) {
                    //导入oid
                    setUpload(upload, '#oid' + val.id, {
                        'DevId': val.id,
                        'token': token
                    }, 'xls', 'ImportSnmpKey');
                    //导入alarm
                    setUpload(upload, '#alarm' + val.id, {
                        'DevId': val.id,
                        'token': token
                    }, 'xlsx', 'ImportSnmpAlarmKey');
                }
                if (val.ProtocolCode == '18001') {
                    //导入U位信息
                    setUpload(upload, '#u' + val.id, {
                        'DevId': val.id,
                        'token': token
                    }, 'json', 'ImportUDeviceJsonKey');
                    //导入温湿度信息
                    setUpload(upload, '#th' + val.id, {
                        'DevId': val.id,
                        'token': token
                    }, 'json', 'ImportUDeviceTHJsonKey');
                }
            })
            form.render();
            if (devclass == 14) {
                $('.showcheck,.tdshowcheck').show();
            } else {
                $('.showcheck,.tdshowcheck').hide();
            }
        }

        // 文件上传实例
        function setUpload(upload, key, param, type, url) {
            upload.render({
                elem: key,
                data: param,
                accept: 'file',
                exts: type,
                url: ajaxUrl + url,
                before: function (obj) {
                    layer.load();
                },
                done: function (res) {
                    layer.closeAll('loading');
                    if (res.code == 100) {
                        layer.msg("导入成功！", { icon: 1, time: 1000 });
                    } else {
                        layer.msg(res.msg, { icon: 5, time: 2000 });
                    }
                },
                error: function () {
                    layer.closeAll('loading');
                    layer.msg(r.msg, { icon: 5, time: 1000 });
                }
            });
        }

        //设备布防
        function SetAlarmNotice(obj, id) {
            list.info('SetAlarmNoticeKey', {
                token: token,
                DevId: id
            }, function (r) {
                if (r.data == true) {
                    layer.msg("布防成功！", {
                        icon: 1,
                        time: 1000
                    });
                    $(obj).hide().prev().css('display', 'inline-block');
                } else {
                    layer.msg("布防失败！", {
                        icon: 5,
                        time: 2000
                    });
                }
            })
        }
        //设备撤防
        function SetAlarmCloseNotice(obj, id) {
            list.info('SetAlarmCloseNoticeKey', {
                token: token,
                DevId: id
            }, function (r) {
                if (r.data == true) {
                    layer.msg("撤防成功！", {
                        icon: 1,
                        time: 1000
                    });
                    $(obj).hide().next().css('display', 'inline-block');
                } else {
                    layer.msg("撤防失败！", {
                        icon: 5,
                        time: 2000
                    });
                }
            })
        }

        // 分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            delete param['ComboBox'];
            list.get(url, param, dealdata, dealupload);
        }

        //其它页面回到此页面
        function changecallbak() {
            delete param['ComboBox'];
            list.get(url, param, dealdata, dealupload);
        }
    </script>
</body>

</html>
