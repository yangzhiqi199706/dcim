<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        班组<span class="x-red">*</span>
                    </label>
                    <div class="layui-input-inline">
                        <select id="bground" name="bground" lay-verify="required" lay-filter="bground">
                            <option value="">请选择</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        人员<span class="x-red">*</span>
                    </label>
                    <div class="layui-input-inline">
                        <select id="EmpId" name="EmpId" lay-verify="required" lay-filter="EmpId">
                            <option value="">请选择</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确认</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        $(function () {
            var type = GetString("type");
            //初始化数据
            param.ComboBox = "all";
            layui.use(["form", "tree"], function () {
                $ = layui.jquery;
                var form = layui.form;
                var id,title;
                //班组
                list.info( "GetZBZListKey", param, function (res) {
                    var html = "";
                    $.each(res.data, function (n, val) {
                        html += "<option value=\"" + val.ZBZGround + "\">" + val.ZBZGround + "</option>";
                    });
                    $("#bground").append(html);
                    form.render("select");
                    form.on("select(bground)", function (data) {
                        param.search=data.value;
                        list.info("GetZBZListKey", param,function(r){
                            $("#EmpId").html('');
                            var personhtml =`<option value="">请选择</option>`;
                            $.each(r.data, function (n, val) {
                                personhtml += "<option value=\"" + val.ZBZEmpId + "\">" + val.PersonName + "</option>";
                            });
                            $("#EmpId").html(personhtml);
                            form.render("select");
                            form.on("select(EmpId)", function (data) {
                                id=data.value;
                                title=data.elem[data.elem.selectedIndex].text;
                            });
                        })
                    });
                });
                form.on("submit(submit)", function (data) {
                    var index = parent.layer.getFrameIndex(window.name);
                    parent.layer.close(index);
                    var nameobj, idobj;
                    switch (type) {
                        case 'morning': nameobj = 'MorningEmpName'; idobj = 'MorningEmpId'; break;
                        case 'middle': nameobj = 'MiddleEmpName'; idobj = 'MiddleEmpId'; break;
                        case 'evening': nameobj = 'EveningEmpName'; idobj = 'EveningEmpId'; break;
                    }
                    $(window.parent.document).find('#' + nameobj).val(title);
                    $(window.parent.document).find('#' + idobj).val(id);
                });
            });
        })
    </script>
</body>

</html>
