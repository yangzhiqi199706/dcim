<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/public.dcimnew.js" type="text/javascript" charset="utf-8"></script>
    <style>
        .slot-tip {
            color: #999;
            line-height: 20px;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" id="formNow">
                <div class="layui-form-item">
                    <label class="layui-form-label">名称<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="WindowName" name="WindowName" lay-verify="required" autocomplete="off"
                            class="layui-input" placeholder="请输入名称">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">周一</label>
                    <div class="layui-input-inline"><input type="text" id="MonSlots" class="layui-input" placeholder="">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">周二</label>
                    <div class="layui-input-inline"><input type="text" id="TueSlots" class="layui-input" placeholder="">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">周三</label>
                    <div class="layui-input-inline"><input type="text" id="WedSlots" class="layui-input" placeholder="">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">周四</label>
                    <div class="layui-input-inline"><input type="text" id="ThuSlots" class="layui-input" placeholder="">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">周五</label>
                    <div class="layui-input-inline"><input type="text" id="FriSlots" class="layui-input" placeholder="">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">周六</label>
                    <div class="layui-input-inline"><input type="text" id="SatSlots" class="layui-input" placeholder="">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">周日</label>
                    <div class="layui-input-inline"><input type="text" id="SunSlots" class="layui-input" placeholder="">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <div class="layui-input-block">
                        <div class="slot-tip">多时段用英文逗号分隔。格式：HH:mm-HH:mm，例如 08:00-12:00,14:00-18:00</div>
                    </div>
                </div>
                <div class="layui-form-item layui-form-text">
                    <label class="layui-form-label">备注</label>
                    <div class="layui-input-block">
                        <textarea id="remark" class="layui-textarea" maxlength="255"></textarea>
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" lay-submit lay-filter="submit" type="button">保存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        var editId = GetString("id");
        var currentEnabled = "1";

        function pad2(n) {
            return n < 10 ? ("0" + n) : ("" + n);
        }

        function toMinutes(hm) {
            var p = hm.split(":");
            return parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
        }

        function normalizeHM(hm) {
            var m = /^([0-1]?\d|2[0-3]):([0-5]\d)$/.exec(hm || "");
            if (!m) return "";
            return pad2(parseInt(m[1], 10)) + ":" + m[2];
        }

        function normalizeDaySlots(dayLabel, raw) {
            var src = ((raw || "") + "").replace(/，/g, ",").replace(/\s+/g, "").trim();
            if (!src) return { ok: true, value: "" };

            var parts = src.split(",").filter(function (x) { return !!x; });
            var list = [];

            for (var i = 0; i < parts.length; i++) {
                var seg = parts[i];
                var arr = seg.split("-");
                if (arr.length !== 2) {
                    return { ok: false, msg: dayLabel + " 时间段格式错误：" + seg };
                }
                var start = normalizeHM(arr[0]);
                var end = normalizeHM(arr[1]);
                if (!start || !end) {
                    return { ok: false, msg: dayLabel + " 时间格式错误：" + seg + "，应为 HH:mm-HH:mm" };
                }

                var sm = toMinutes(start);
                var em = toMinutes(end);
                if (sm >= em) {
                    return { ok: false, msg: dayLabel + " 时间段开始必须小于结束：" + seg };
                }

                list.push({ start: start, end: end, sm: sm, em: em });
            }

            list.sort(function (a, b) { return a.sm - b.sm; });
            for (var j = 0; j < list.length - 1; j++) {
                if (list[j].em > list[j + 1].sm) {
                    return { ok: false, msg: dayLabel + " 时间段存在重叠" };
                }
            }

            var value = list.map(function (x) { return x.start + "-" + x.end; }).join(",");
            if (value.length > 255) {
                return { ok: false, msg: dayLabel + " 超过255字符，请减少时间段" };
            }
            return { ok: true, value: value };
        }

        function buildPayload(field) {
            var days = [
                { key: "MonSlots", label: "周一" },
                { key: "TueSlots", label: "周二" },
                { key: "WedSlots", label: "周三" },
                { key: "ThuSlots", label: "周四" },
                { key: "FriSlots", label: "周五" },
                { key: "SatSlots", label: "周六" },
                { key: "SunSlots", label: "周日" }
            ];

            var payload = {
                // id: editId,
                WindowName: ((field.WindowName || "") + "").trim(),
                Enabled: currentEnabled,
                remark: (($("#remark").val() || "") + "").trim()
            };

            if (!payload.WindowName) {
                return { ok: false, msg: "请输入名称" };
            }
            if (payload.WindowName.length > 100) {
                return { ok: false, msg: "名称不能超过100字符" };
            }
            if (payload.remark.length > 255) {
                return { ok: false, msg: "备注不能超过255字符" };
            }

            for (var i = 0; i < days.length; i++) {
                var d = days[i];
                var raw = $("#" + d.key).val();
                var r = normalizeDaySlots(d.label, raw);
                if (!r.ok) return r;
                payload[d.key] = r.value;
            }

            return { ok: true, data: payload };
        }

        function pickInfo(payload) {
            var d = payload || {};
            if (d.info && !Array.isArray(d.info)) return d.info;
            if (Array.isArray(d.info) && d.info.length) return d.info[0];
            if (Array.isArray(d.data) && d.data.length) return d.data[0];
            if (d.data && !Array.isArray(d.data)) return d.data;
            return d;
        }

        function fillForm(info) {
            info = info || {};
            $("#WindowName").val(info.WindowName || "");
            $("#MonSlots").val(info.MonSlots || "");
            $("#TueSlots").val(info.TueSlots || "");
            $("#WedSlots").val(info.WedSlots || "");
            $("#ThuSlots").val(info.ThuSlots || "");
            $("#FriSlots").val(info.FriSlots || "");
            $("#SatSlots").val(info.SatSlots || "");
            $("#SunSlots").val(info.SunSlots || "");
            $("#remark").val(info.remark || "");
            currentEnabled = String(info.Enabled);
            if (currentEnabled !== "0" && currentEnabled !== "1") {
                currentEnabled = "1";
            }
        }

        $(function () {
            layui.use(["form"], function () {
                var form = layui.form;

                if (!editId) {
                    layer.msg("缺少ID", { icon: 5, time: 1500 });
                    return;
                }

                dcimNewApi.get("/dcim-alarmnotifywindow/" + editId, {
                }, function (payload) {
                    fillForm(pickInfo(payload));
                });

                form.on("submit(submit)", function (data) {
                    var result = buildPayload(data.field || {});
                    if (!result.ok) {
                        layer.msg(result.msg || "数据校验失败", { icon: 5, time: 1800 });
                        return false;
                    }

                    dcimNewApi.post("/dcim-alarmnotifywindow/update/" + editId, result.data, function () {
                        backToparent("保存成功");
                    });
                    return false;
                });
            });
        });
    </script>
</body>

</html>
