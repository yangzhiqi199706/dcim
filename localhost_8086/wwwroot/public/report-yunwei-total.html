<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <script src="js/echarts.js" type="text/javascript" charset="utf-8"></script>
    <style>
        .massage-chart{height:280px}
    </style>
</head>
<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>报表管理->运维管理->总表</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input type="radio" name="type" value="month" title="本月" lay-filter="type"  checked>
                                <input type="radio" name="type" value="upmonth" title="上月" lay-filter="type">
                                <input type="radio" name="type" value="auto" title="自定义" lay-filter="type">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <input type="text" id="startDateTime" name="startDateTime" class="layui-input" placeholder="开始日期" style="display:none;">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <input type="text" id="endDateTime" name="endDateTime" class="layui-input" placeholder="结束日期" style="display:none;">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                        <div class="layui-inline layui-show-xs-block x-right">
                            <button class="layui-btn search" lay-submit type="button" onclick="displayexport('down','cattable','运维总表')" id="down">导出</button>
                        </div>
                    </div>
                    <div class="layui-card-body">
                        <div class="two-left1  massage-box-md12">
                            <table class="layui-table" id="cattable">
                                <thead>
                                    <tr>
                                        <th>类别</th>
                                        <th>之前遗留</th>
                                        <th>当期发起</th>
                                        <th>当期待解决</th>
                                        <th>当期解决</th>
                                        <th>往后移交</th>
                                        <th>解决率</th>
                                    </tr>
                                </thead>
                                <tbody id="list">
                                    <script type="text/html" id="listtemplate">
                                        <tr>
                                            <td>故障工单</td>
                                            <td>{{data.OrderZQYL}}</td>
                                            <td>{{data.OrderFQ}}</td>
                                            <td>{{data.OrderDJJ}}</td>
                                            <td>{{data.OrderYJJ}}</td>
                                            <td>{{data.OrderWHYJ}}</td>
                                            <td>{{data.OrderJJL}}%</td>
                                        </tr>
                                        <tr>
                                            <td>巡检任务</td>
                                            <td>{{data.XJZQYL}}</td>
                                            <td>{{data.XJFQ}}</td>
                                            <td>{{data.XJDJJ}}</td>
                                            <td>{{data.XJYJJ}}</td>
                                            <td>{{data.XJWHYJ}}</td>
                                            <td>{{data.XJJJL}}%</td>
                                        </tr>
                                        <tr>
                                            <td>维护任务</td>
                                            <td>{{data.WHZQYL}}</td>
                                            <td>{{data.WHFQ}}</td>
                                            <td>{{data.WHDJJ}}</td>
                                            <td>{{data.WHYJJ}}</td>
                                            <td>{{data.WHWHYJ}}</td>
                                            <td>{{data.WHJJL}}%</td>
                                        </tr>
                                        <tr>
                                            <td>总计</td>
                                            <td>{{data.OrderZQYL+data.XJZQYL+data.WHZQYL}}</td>
                                            <td>{{data.OrderFQ+data.XJFQ+data.WHFQ}}</td>
                                            <td>{{data.OrderDJJ+data.XJDJJ+data.WHDJJ}}</td>
                                            <td>{{data.OrderYJJ+data.XJYJJ+data.WHYJJ}}</td>
                                            <td>{{data.OrderWHYJ+data.XJWHYJ+data.WHWHYJ}}</td>
                                            <td>{{((data.OrderYJJ+data.XJYJJ+data.WHYJJ)*100/((data.OrderZQYL+data.XJZQYL+data.WHZQYL)+(data.OrderFQ+data.XJFQ+data.WHFQ))).toFixed(2)}}%</td>
                                        </tr>
                                    </script>
                                </tbody>
                            </table>
                        </div>
                        <div class="massage-box massage-box-md6">
                            <div class="capacity-statistics-title">当期情况</div>
                            <div id="yearChart" class="massage-chart"></div>
                        </div>
                        <div class="massage-box massage-box-md6">
                            <div class="capacity-statistics-title">当期总计情况</div>
                            <div id="totalChart" class="massage-chart"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        $(function(){
            var m = new Date().getMonth() + 1;
	        m = m < 10 ? ("0" + m) : m;
             //参数
             var dataparam={
                token:token,
                startDateTime:getOnemonth(new Date().getFullYear()+'-'+m)[0],
                endDateTime:getOnemonth(new Date().getFullYear()+'-'+m)[1]
            }
            //统计
            GetData(dataparam);
            function GetData(dataparam){
                list.info('GetYWAllHisInfoKey',dataparam,function(r){

                    var html = template("listtemplate", r);
                    $("#list").html(html);

                    var yearChartDom = document.getElementById('yearChart');
                    var yearChart = echarts.init(yearChartDom);
                    var yeartitle = ['故障工单','巡检任务','维护任务'];
                    var yeardata = [r.data.OrderDJJ,r.data.XJDJJ,r.data.WHDJJ];
                    var yeardata2 = [r.data.OrderYJJ,r.data.XJYJJ,r.data.XJYJJ];
                    var yearChartoption={
                        legend: {
                            textStyle: {
                                color:'#A2CAE1',
                                fontSize:'11',
                                lineHeight: 15
                            },
                        },
                        xAxis: {
                            type: 'category',
                            data: yeartitle,
                            axisLine: {
                                show: true,
                                lineStyle: {
                                    type: 'solid',
                                    color:'#F4F8FB',
                                    width:'1'
                                }
                            },
                            axisLabel: {
                                textStyle: {
                                    color: '#A2CAE1',//坐标值得具体的颜色
                                    lineHeight:30
                                }
                            }
                        },
                        yAxis: {
                            type: 'value',
                            axisLine: {
                                show: true,
                                lineStyle: {
                                    type: 'solid',
                                    color:'#F4F8FB',
                                    width:'1'
                                }
                            },
                            splitLine:{show: false},
                            axisLabel: {
                                interval:0,
                                textStyle: {
                                    color: '#A2CAE1',//坐标值得具体的颜色
                                },
                            }
                        },
                        grid:{
                            x:100,
                            y:40,
                            x2:25,
                            y2:30
                        },
                        tooltip: {
                            trigger: 'axis',
                            axisPointer: {
                                type: 'shadow'
                            }
                        },
                        series: [{
                            data:yeardata,
                            label:{
                                show:true,
                                position: 'top'
                            },
                            type: 'bar',
                            name: '当期待解决',
                            barWidth:20,
                            showBackground: true,
                            backgroundStyle: {
                                color: '#F4F8FB'
                            },
                        },
                        {
                            data:yeardata2,
                            label:{
                                show:true,
                                position: 'top'
                            },
                            type: 'bar',
                            name: '当期解决',
                            barWidth:20,
                            showBackground: true,
                            backgroundStyle: {
                                color: '#F4F8FB'
                            },
                        }
                    ]
                    };
                    yearChartoption && yearChart.setOption(yearChartoption);

                    var totalChartDom = document.getElementById('totalChart');
                    var totalChart = echarts.init(totalChartDom);
                    var totaltitle=[{'name':'当前解决','icon': 'circle'},
                        {'name':'往后移交','icon': 'circle'}];
                    var totaldata=[{'value': r.data.OrderYJJ+r.data.XJYJJ+r.data.WHYJJ, 'name':'当前解决'},
                        {'value': r.data.OrderWHYJ+r.data.XJWHYJ+r.data.WHWHYJ, 'name': '往后移交'}];
                    var totalChartoption={
                    legend: {
                        orient: 'vertical', 
                        data: totaltitle,
                        right: 0,
                        top: 55,
                        itemWidth:6,
                        itemHeight:6,
                        textStyle: {
                        color:'#A2CAE1',
                        fontSize:'11',
                        lineHeight: 15,
                        },
                        formatter: function(name){
                        var total = 0;
                        var tarValue = 0;
                        for (var i = 0, l =totaldata.length; i < l; i++) {
                            total += parseInt(totaldata[i].value);
                            if (totaldata[i].name == name) {
                                tarValue = totaldata[i].value;
                            }
                        }
                        total = total==0?1:total;
                        var p = (tarValue / total * 100).toFixed(2);
                        return name+ ' ' + p + '%';
                        }
                    },
                    color:['#35DFFC','#3783FF','#FFCC37','#FF9000','#F96055'],
                    series: [
                        {
                            name: '',
                            type: 'pie',
                            radius: ['65%', '90%'],
                            top:25,
                            left:-80,
                            bottom:0,
                            itemStyle:{
                                shadowColor: 'rgba(225, 229, 255, 0.69)',
                                shadowBlur: 16
                            },label: {
                                show: false,
                                position: 'center',
                                textStyle: {
                                    color:'#ffffff',
                                    fontSize:'14',
                                    lineHeight: 15
                                },
                            },
                            emphasis: {
                                label: {
                                    show: true,
                                    fontSize: '14.3',
                                    fontWeight: 'bold',
                                    formatter: '{b}：{c}'
                                }
                            },
                            data:totaldata
                        }
                    ]
                    };
                    totalChartoption && totalChart.setOption(totalChartoption);
                })
            }
            

            layui.use(["form","laydate"], function () {
                $ = layui.jquery;
                var form = layui.form;
                var laydate = layui.laydate;
                laydate.render({
                    elem: '#startDateTime',
                    type:'datetime'
                });
                laydate.render({
                    elem: '#endDateTime',
                    type:'datetime'
                });
                form.render();
                var type='month';
                //监听提交
                form.on("radio(type)", function (data) {
                    type=data.value;
                    if(data.value!='auto'){
                        $('#startDateTime,#endDateTime').hide();
                    }else{
                        $('#startDateTime,#endDateTime').show();
                    }
                    return false;
                });  
                form.render();
                //监听提交
                form.on("submit(search)", function (data) {
                    switch (type) {
                        case 'month':
                            dataparam.startDateTime=getOnemonth(new Date().getFullYear()+'-'+m)[0];
                            dataparam.endDateTime=getOnemonth(new Date().getFullYear()+'-'+m)[1];
                            break;
                        case 'upmonth':
                            var year = new Date().getFullYear();
                            var upm=m;
                            if(upm=='01'){
                                upm='12';
                                year=year-1;
                            }else{
                                upm=upm-1;
                            }
                            dataparam.startDateTime=getOnemonth(year+'-'+upm)[0];
                            dataparam.endDateTime=getOnemonth(year+'-'+upm)[1];
                            break;
                        case 'auto':
                            dataparam.startDateTime=data.field.startDateTime;
                            dataparam.endDateTime=data.field.endDateTime;
                            break;
                    }
                    GetData(dataparam);
                    return false;
                });    
            });
            
        })
        
    </script>
</body>
</html>
