<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
    <style>
        .parname.check {
            font-size: 20px;
            color: #148cf1 !important;
        }

        .chotitle {
            width: 50%;
            float: left;
        }

        .hisclear {
            display: block;
            width: 60px;
            float: right;
            text-align: right;
            color: #148cf1;
            cursor: pointer;
        }

        body {
            min-width: 1024px;
        }

        .x-nav {
            position: fixed;
            left: 0;
            right: 0;
            top: 0
        }

        .two-left {
            position: fixed;
            top: 50px;
            height: calc(100vh - 91px)
        }

        .two-left:nth-child(2) {
            left: 243px
        }

        .three-right {
            margin-top: 43px;
        }

        .history-table-wrap {
            max-height: calc(100vh - 95px);
            overflow-y: auto;
            overflow-x: auto;
        }

        .history-table-wrap .layui-table {
            margin-bottom: 0;
        }

        .history-table-wrap .layui-table thead th {
            position: sticky;
            top: 0;
            z-index: 5;
            background: linear-gradient(180deg, #566EFA 0%, #0922B0 100%);
        }

        #bottomPaging {
            position: fixed;
            bottom: -10px;
            z-index: 1000;
            text-align: right;
            pointer-events: none;
        }

        #bottomPaging .layui-laypage {
            display: inline-block;
            margin: 0;
            padding: 6px 8px;
            border-radius: 4px;
            pointer-events: auto;
        }

        #devParam {
            min-height: 100px;
            padding: 10px;
            clear: both;
            overflow: auto;
        }

        #devParam ul li {
            cursor: pointer;
        }

        #devParam ul li.check {
            color: #148cf1
        }

        #devParam ul li.hide {
            display: none;
        }

        .paramSrc {
            margin-top: 7px !important;
            width: 105px !important;
            display: inline-block !important;
            height: 28px !important
        }
    </style>
</head>

<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>报表->动环监控->历史记录</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <div class="two-left">
                            <form class="layui-form layui-col-md12">
                                <text>设备列表</text>
                                <div class="three-left" style="height: 686px;max-height:686px">
                                    <ul>
                                        <script type="text/html" id="listdevicetemplate">
                                        {{if data.length!=0}}

                        <div class="two-left three-left-big">

    <!-- 时间默认 -->
    <script>
        var url = 'GetHistoryAlarmsKey';
        var parkey = [];//参数key
        var devkey = [];//idkey
        var devsnmpkey = [];//snmpidkey
        var devname = [];//name
        var alldata;
        var alldevice;
        var allProtocol;
        var serverurl = '';
        var servercodechoose = '';
        var chartLineData = '';//需要展示的曲线数据
        var snmpParam;//snmp协议采集值解析
        var devParamList = [];
        var HISTORY_PAGE_SIZE = 15;
        var historyPageNo = 1;
        var historyPageSize = HISTORY_PAGE_SIZE;
        var historyRequestSeq = 0;
        var historyActiveRequestSeq = 0;
        var historyQuery = {
            startDateTime: '',
            endDateTime: '',
            localDevIDs: '',
            remoteDevIDs: '',
            serverurl: ''
        };
        var historyExporting = false;
        var historyFilterCacheKey = '';
        var historyFilteredDisplayRows = null;
        var historyChartRowsForLine = null;
        var historyFilterRequestSeq = 0;
        var historyLoadingState = {
            idx: 0,
            token: 0
        };
        var historyProtocolDebug = {
            enabled: true,
            maxLogs: 3000,
            keyLimitPerRow: 40
        };

        function initHistoryProtocolDebug() {
            try {
                var search = new URLSearchParams(window.location.search || '');
                var flag = String(search.get('protoDebug') || '').toLowerCase();
                if (flag === '0' || flag === 'false' || flag === 'off') historyProtocolDebug.enabled = false;
                if (flag === '1' || flag === 'true' || flag === 'on') historyProtocolDebug.enabled = true;
            } catch (e) { }

            window.__historyProtocolDebugLogs = Array.isArray(window.__historyProtocolDebugLogs)
                ? window.__historyProtocolDebugLogs
                : [];

            window.enableHistoryProtocolDebug = function (flag) {
                historyProtocolDebug.enabled = !!flag;
                // console.log('[history-protocol] debug enabled:', historyProtocolDebug.enabled);
                return historyProtocolDebug.enabled;
            };
            window.clearHistoryProtocolDebugLogs = function () {
                window.__historyProtocolDebugLogs = [];
                // console.log('[history-protocol] debug logs cleared');
            };
        }

        function protocolDebugLog(step, payload) {
            if (!historyProtocolDebug.enabled) return;
            var entry = {
                time: new Date().toISOString(),
                step: step,
                payload: payload || {}
            };
            if (!Array.isArray(window.__historyProtocolDebugLogs)) {
                window.__historyProtocolDebugLogs = [];
            }
            window.__historyProtocolDebugLogs.push(entry);
            if (window.__historyProtocolDebugLogs.length > historyProtocolDebug.maxLogs) {
                window.__historyProtocolDebugLogs.splice(0, window.__historyProtocolDebugLogs.length - historyProtocolDebug.maxLogs);
            }
            // console.log('[history-protocol]', step, payload || {});
        }

        $(function () {
            initHistoryProtocolDebug();
            $('#setline').hide();///在没有数据的情况，不能生成曲线数据
            param.ComboBox = "all";
            bindHistoryPagingPosition();
            setTimeout(updateHistoryPagingPosition, 0);
            //查询设备协议
            list.info('GetDeviceProtocolListKey', param, function (r) {
                allProtocol = r.data;
            });

            layui.use(["form", "laydate"], function () {
                $ = layui.jquery;
                var form = layui.form;
                var laydate = layui.laydate;

                laydate.render({
                    elem: '#startDateTime',
                    type: 'datetime',
                    format: 'yyyy-MM-dd HH:mm:ss',
                    value: new Date(new Date() - 1000 * 60 * 60 * 24 * 1), // 指定值
                });
                laydate.render({
                    elem: '#endDateTime',
                    type: 'datetime',
                    format: 'yyyy-MM-dd HH:mm:ss',
                    value: new Date(), // 指定值
                });

                getDevice();

                //服务器
                list.info("GetServerListKey", {
                    token: token,
                    ComboBox: 'all'
                }, function (res) {
                    var serverhtml = '<option value="">请选择</option>';
                    $.each(res.data, function (n, val) {
                        serverhtml += "<option value=\"" + val.id + "\" data-code=\"" + val.ServerCode + "\" data-url=\"" + val.ServerIP + "\">" + val.ServerName + "</option>";
                    });
                    $("#ServerCode").html(serverhtml);
                    form.render("select");
                });
                form.on("select(ServerCode)", function (data) {
                    getArea(data.value);
                    $('#AreaId').val('');
                    getDevice();
                    $('#clearDev,#clearPar').trigger('click');
                });
                //区域
                function getArea(ServerCode) {
                    list.info("GetAreaListKey", {
                        token: token,
                        ServerCode: ServerCode,
                        ComboBox: 'all'
                    }, function (res) {
                        var areahtml = '<option value="">请选择区域</option>';
                        $.each(res.data, function (n, val) {
                            areahtml += "<option value=\"" + val.id + "\">" + val.AreaName + "</option>";
                        });
                        $("#AreaId").html(areahtml);
                        form.render("select");
                        form.on("select(AreaId)", function (data) {
                            getDevice();
                        })
                    });
                }

                //分类
                list.info("GetClassListKey", {
                    token: token,
                    ComboBox: 'all'
                }, function (res) {
                    var classhtml = '<option value="">请选择分类</option>';
                    $.each(res.data, function (n, val) {
                        classhtml += "<option value=\"" + val.ClassName + "\">" + val.ClassName + "</option>";
                    });
                    $("#ClassName").html(classhtml);
                    form.render("select");
                    form.on("select(ClassName)", function (data) {
                        getDevice();
                    })
                });

                param.startDateTime = $('input[name="startDateTime"]').val();
                param.endDateTime = $('input[name="endDateTime"]').val();

                //清空选择设备
                $('#clearDev').click(function () {
                    devkey = [];//idkey
                    devsnmpkey = [];//snmpkey
                    devname = [];//name
                    servercodechoose = '';
                    $('textarea[name=search]').val('');
                    //清空所有选中样式
                    $(".three-left ul>li").removeClass('check');
                    $('#devParam ul').html('');
                    resetHistoryFilterState();
                    $('#bottomPaging').html('');
                    $('#setline').hide();
                    $("tbody").html('');
                })
                //清空选择设备参数
                $('#clearPar').click(function () {
                    parkey = [];//参数key
                    $('#devParam ul li').removeClass('check');
                    resetHistoryFilterState();
                })
                //参数搜索
                $('.paramSrc').on('input', (function () {
                    let paramSrc = $('.paramSrc').val();
                    parkey = [];//参数key
                    $('#devParam ul li').removeClass('check').each(function () {
                        let devParTxt = $(this).text();
                        if (devParTxt.indexOf(paramSrc) < 0) {
                            $(this).addClass('hide');
                        } else {
                            $(this).removeClass('hide');
                        }
                    })
                    resetHistoryFilterState();
                }))

                //监听事件提交
                form.on("submit(search)", function (data) {
                    if (devkey.length == 0) {
                        layer.msg("请选择设备！", {
                            icon: 5,
                            time: 2000
                        });
                        return false;
                    }

                    param.DevID = devkey.join(',');
                    param.startDateTime = $('input[name="startDateTime"]').val();
                    param.endDateTime = $('input[name="endDateTime"]').val();

                    if (servercodechoose) {
                        if (!isNaN(Number(servercodechoose))) {
                            serverurl = '';
                        } else {
                            serverurl = $("#ServerCode").find("option[data-code=" + servercodechoose + "]").attr('data-url');
                        }
                    } else {
                        serverurl = '';
                    }

                    historyQuery.startDateTime = param.startDateTime;
                    historyQuery.endDateTime = param.endDateTime;
                    historyQuery.localDevIDs = devkey.join(',');
                    historyQuery.serverurl = serverurl || '';
                    historyQuery.remoteDevIDs = devkey.map(function (id) {
                        var oldid = alldevice.find(function (v) { return v.id == id; });
                        return (oldid && oldid.OnlyCode) ? oldid.OnlyCode : id;
                    }).join(',');

                    resetHistoryFilterState();
                    requestHistoryPage(1, historyPageSize);
                    return false;
                });
            });
        })

        // 设备数据数据
        function getDevice() {
            let devparam = {
                ComboBox: 'all',
                token: token
            }
            let ClassName = $('#ClassName').val();
            let AreaId = $('#AreaId').val();
            // let ServerCode = $('#ServerCode').find("option:selected").attr('data-code');
            let ServerCode = $('#ServerCode').val();
            if (ServerCode) devparam.ServerCode = ServerCode;
            if (AreaId) devparam.AreaId = AreaId;
            if (ClassName) devparam.ClassName = ClassName;
            list.info('GetDeviceListKey', devparam, function (r) {
                alldevice = r.data;
                var lists = template("listdevicetemplate", r);
                $(".three-left ul").html(lists);
            });
        }

        //数据处理
        // newdata false表示接口返回数据
        function dealdata(r, newdata, options) {
            processData(r, newdata, options);
        }

        function normalizeHistoryResponse(response) {
            response = response || {};
            var dataRoot = response.data || [];
            var pageInfo = (!Array.isArray(dataRoot) && dataRoot && dataRoot.page) ? dataRoot.page : null;
            var rows = Array.isArray(dataRoot) ? dataRoot : (Array.isArray(dataRoot.info) ? dataRoot.info : []);
            return {
                rows: rows,
                pageInfo: pageInfo
            };
        }

        function loadSnmpParamSync() {
            if (devsnmpkey.length > 0) {
                $.ajaxSettings.async = false;
                list.info('GetSnmpParamListKey', {
                    DevIDs: devsnmpkey.join(','),
                    DataType: '枚举',
                    ComboBox: 'all'
                }, function (res) {
                    snmpParam = res.data || [];
                });
                $.ajaxSettings.async = true;
            } else {
                snmpParam = [];
            }
        }

        function resetHistoryFilterState() {
            historyFilterCacheKey = '';
            historyFilteredDisplayRows = null;
            historyChartRowsForLine = null;
            historyFilterRequestSeq = 0;
        }

        function getHistoryFilterCacheKey() {
            var selectedParams = Array.from(new Set((parkey || []).map(function (v) {
                return String(v || '').trim();
            }).filter(function (v) { return v !== ''; }))).sort();
            return [
                historyQuery.localDevIDs || '',
                historyQuery.remoteDevIDs || '',
                historyQuery.serverurl || '',
                historyQuery.startDateTime || '',
                historyQuery.endDateTime || '',
                selectedParams.join('|')
            ].join('||');
        }

        function hasActiveParamFilter() {
            return Array.isArray(parkey) && parkey.some(function (v) {
                return String(v || '').trim() !== '';
            });
        }

        function showHistoryLoading() {
            historyLoadingState.token += 1;
            var token = historyLoadingState.token;
            if (historyLoadingState.idx) {
                layer.close(historyLoadingState.idx);
                historyLoadingState.idx = 0;
            }
            historyLoadingState.idx = layer.load(2, { shade: 0.15 });
            return token;
        }

        function hideHistoryLoading(token) {
            if (token && token !== historyLoadingState.token) return;
            if (historyLoadingState.idx) {
                layer.close(historyLoadingState.idx);
                historyLoadingState.idx = 0;
            }
        }

        function paginateFilteredRows(rows, pageNo, pageSizeLimit) {
            var listRows = Array.isArray(rows) ? rows : [];
            var limit = HISTORY_PAGE_SIZE;
            var pageIndex = Number(pageNo) || 1;
            if (pageIndex <= 0) pageIndex = 1;
            var total = listRows.length;
            var start = (pageIndex - 1) * limit;
            if (start < 0) start = 0;
            if (start >= total) {
                start = total > 0 ? Math.floor((total - 1) / limit) * limit : 0;
                pageIndex = Math.floor(start / limit) + 1;
            }
            var end = start + limit;
            return {
                rows: listRows.slice(start, end),
                total: total,
                pageNo: pageIndex,
                pageSize: limit
            };
        }

        // 将每条记录的多参数展开为展示行，保证按表格行数分页
        function flattenHistoryDisplayRows(rows) {
            rows = Array.isArray(rows) ? rows : [];
            var displayRows = [];
            rows.forEach(function (item) {
                var infos = Array.isArray(item.info) ? item.info : [];
                if (!infos.length) return;
                infos.forEach(function (infoRow) {
                    var cloned = $.extend({}, item);
                    cloned.info = [infoRow];
                    displayRows.push(cloned);
                });
            });
            return displayRows;
        }

        function decorateHistoryRows(rows) {
            rows = Array.isArray(rows) ? rows : [];
            var selectedParamSet = new Set((parkey || []).map(function (v) {
                return String(v || '').trim();
            }).filter(function (v) { return v !== ''; }));
            rows.forEach(function (item) {
                const isSNMP = devsnmpkey.includes(item.DevID);
                const deviceMatch = findDeviceForHistoryItem(item);
                const device = deviceMatch.device;
                const protocol = device && device.ProtocolCode
                    ? allProtocol.find(function (p) {
                        return String(p.ProtocolCode || '').trim() === String(device.ProtocolCode || '').trim();
                    })
                    : null;
                const commType = String(item.CommType || item.CommandType || item.CollectType || '').trim();
                const protocolDataMap = protocol ? getProtocolMap(protocol, commType, {
                    DevID: item.DevID,
                    DeviceName: item.DeviceName,
                    CommType: commType,
                    ProtocolCode: protocol.ProtocolCode
                }) : null;
                protocolDebugLog('row_match_base', {
                    DevID: item.DevID,
                    DeviceName: item.DeviceName,
                    CommTypeRaw: item.CommType,
                    CommTypeUsed: commType,
                    isSNMP: isSNMP,
                    deviceMatched: !!device,
                    deviceMatchBy: deviceMatch.matchBy,
                    deviceProtocolCode: device ? device.ProtocolCode : '',
                    protocolMatched: !!protocol,
                    protocolName: protocol ? protocol.ProtocolName : '',
                    protocolCode: protocol ? protocol.ProtocolCode : '',
                    mapKeyCount: protocolDataMap ? Object.keys(protocolDataMap).length : 0,
                    mapKeysSample: protocolDataMap ? Object.keys(protocolDataMap).slice(0, 20) : []
                });

                let rawData = item.Data;
                if (typeof rawData === 'string') {
                    rawData = rawData.replace(/'/g, '"');
                }

                let parsedData;
                try {
                    parsedData = typeof rawData === 'string' ? JSON.parse(rawData) : (rawData || {});
                } catch {
                    console.warn("解析失败：", item.Data);
                    protocolDebugLog('row_data_parse_failed', {
                        DevID: item.DevID,
                        DeviceName: item.DeviceName,
                        Data: item.Data
                    });
                    item.info = [];
                    item.originalinfo = [];
                    return;
                }
                protocolDebugLog('row_data_parse_ok', {
                    DevID: item.DevID,
                    DeviceName: item.DeviceName,
                    dataKeys: Object.keys(parsedData || {}),
                    dataSnapshot: parsedData
                });

                item.info = [];
                item.originalinfo = [];

                let keyLogIndex = 0;
                for (let key in parsedData) {
                    const originalVal = parsedData[key];
                    const includeParam = selectedParamSet.size === 0 || selectedParamSet.has((item.DeviceName + '/' + key).trim());

                    if (includeParam) {
                        item.originalinfo.push({ paramKey: key, paramVal: originalVal });
                    }

                    let val = originalVal;

                    const keyMatch = getProtocolRuleByKey(protocolDataMap, key);
                    const enumRule = keyMatch.rule;
                    const logNoRule = function () {
                        if (keyLogIndex < historyProtocolDebug.keyLimitPerRow) {
                            protocolDebugLog('key_no_rule', {
                                DevID: item.DevID,
                                DeviceName: item.DeviceName,
                                key: key,
                                includeParam: includeParam,
                                rawValue: originalVal,
                                protocolRuleFound: false,
                                snmpRuleFound: false
                            });
                        }
                    };
                    if (enumRule) {
                        const enumResult = parseEnumMappingResult(val, enumRule);
                        val = enumResult.value;
                        if (keyLogIndex < historyProtocolDebug.keyLimitPerRow) {
                            protocolDebugLog('key_protocol_enum', {
                                DevID: item.DevID,
                                DeviceName: item.DeviceName,
                                CommType: commType,
                                key: key,
                                includeParam: includeParam,
                                keyMatchType: keyMatch.matchType,
                                keyMatchKey: keyMatch.matchKey,
                                enumRule: enumRule,
                                rawValue: originalVal,
                                rawValueType: typeof originalVal,
                                valueText: enumResult.valueText,
                                comparableValue: enumResult.comparableValue,
                                matched: enumResult.matched,
                                matchedRule: enumResult.matchedRule,
                                mappedValue: enumResult.value,
                                reason: enumResult.reason,
                                ruleKeysSample: enumResult.ruleKeysSample
                            });
                        }
                    } else if (isSNMP) {
                        const snmpMatch = (snmpParam || []).find(p => p.OIDName === key);
                        if (snmpMatch && snmpMatch.DataList && snmpMatch.DataList.includes('/')) {
                            const enumResult = parseEnumMappingResult(val, snmpMatch.DataList);
                            val = enumResult.value;
                            if (keyLogIndex < historyProtocolDebug.keyLimitPerRow) {
                                protocolDebugLog('key_snmp_enum', {
                                    DevID: item.DevID,
                                    DeviceName: item.DeviceName,
                                    key: key,
                                    includeParam: includeParam,
                                    snmpDataList: snmpMatch.DataList,
                                    rawValue: originalVal,
                                    rawValueType: typeof originalVal,
                                    matched: enumResult.matched,
                                    mappedValue: enumResult.value,
                                    reason: enumResult.reason,
                                    ruleKeysSample: enumResult.ruleKeysSample
                                });
                            }
                        } else {
                            logNoRule();
                        }
                    } else {
                        logNoRule();
                    }
                    keyLogIndex += 1;

                    if (includeParam) {

            function pullNextPage() {

                    var firstRow = rows.length > 0 ? (rows[0] || {}) : {};
                    var lastRow = rows.length > 0 ? (rows[rows.length - 1] || {}) : {};
                    var fingerprint = [

                        String(firstRow.id || firstRow.ID || firstRow.Lsh || firstRow.create_time || ''),
                        String(lastRow.id || lastRow.ID || lastRow.Lsh || lastRow.create_time || '')
                    ].join('|');
                    if (fingerprint === lastPageFingerprint) {

                    if (pullPageNo > 1 && samePageFingerprintCount >= 1) {
                        pushFilteredResult();

                    if (!pageInfo) {
                        pushFilteredResult();

                    var current = Number(pageInfo.p || pageInfo.pageNo || pullPageNo) || pullPageNo;

        function normalizeDictKey(value) {

        function isSameHistoryDeviceId(a, b) {
            const ta = String(a == null ? '' : a).trim();
            const tb = String(b == null ? '' : b).trim();
            if (!ta || !tb) return false;
            if (ta === tb) return true;
            if (/^-?\d+(\.\d+)?$/.test(ta) && /^-?\d+(\.\d+)?$/.test(tb)) {
                return Number(ta) === Number(tb);
            }
            return false;
        }

        function findDeviceForHistoryItem(item) {
            const result = { device: null, matchBy: '' };
            if (!Array.isArray(alldevice) || !alldevice.length || !item) return result;

            const devID = String(item.DevID || item.DevId || item.DeviceId || '').trim();
            const devName = normalizeDictKey(item.DeviceName);
            const isRemote = !!(historyQuery && historyQuery.serverurl);

            if (isRemote) {
                const byOnlyCode = alldevice.find(function (v) { return isSameHistoryDeviceId(v.OnlyCode, devID); });
                if (byOnlyCode) return { device: byOnlyCode, matchBy: 'onlycode' };
            }

            const byId = alldevice.find(function (v) { return isSameHistoryDeviceId(v.id, devID); });
            if (byId) return { device: byId, matchBy: 'id' };

            const byOnlyCodeFallback = alldevice.find(function (v) { return isSameHistoryDeviceId(v.OnlyCode, devID); });
            if (byOnlyCodeFallback) return { device: byOnlyCodeFallback, matchBy: 'onlycode_fallback' };

            if (devName) {
                const byName = alldevice.find(function (v) {
                    return normalizeDictKey(v.DeviceName) === devName;
                });
                if (byName) return { device: byName, matchBy: 'name' };
            }

            return result;
        }

        function getProtocolRuleByKey(mapping, key) {
            var detail = {
                rule: '',
                matchKey: '',
                matchType: 'not_found'
            };
            if (!mapping) return detail;
            const rawKey = String(key == null ? '' : key);
            const trimKey = rawKey.trim();

            if (Object.prototype.hasOwnProperty.call(mapping, rawKey)) {
                detail.rule = mapping[rawKey];
                detail.matchKey = rawKey;
                detail.matchType = 'raw';
                return detail;
            }
            if (Object.prototype.hasOwnProperty.call(mapping, trimKey)) {
                detail.rule = mapping[trimKey];
                detail.matchKey = trimKey;
                detail.matchType = 'trim';
                return detail;
            }

            if (/^-?\d+(\.\d+)?$/.test(trimKey)) {
                const numVal = Number(trimKey);
                if (Number.isFinite(numVal)) {
                    const intKey = String(parseInt(trimKey, 10));
                    if (Object.prototype.hasOwnProperty.call(mapping, intKey)) {
                        detail.rule = mapping[intKey];
                        detail.matchKey = intKey;
                        detail.matchType = 'numeric_int';
                        return detail;
                    }
                    const allKeys = Object.keys(mapping);
                    for (let i = 0; i < allKeys.length; i++) {
                        const mk = String(allKeys[i] || '').trim();
                        if (!/^-?\d+(\.\d+)?$/.test(mk)) continue;
                        if (Number(mk) === numVal) {
                            detail.rule = mapping[allKeys[i]];
                            detail.matchKey = allKeys[i];
                            detail.matchType = 'numeric_equal';
                            return detail;
                        }
                    }
                }
            }
            return detail;
        }

        // 解析协议映射字符串为键值对
        function getProtocolMap(protocol, commType, debugCtx) {
            if (!protocol) return null;
            const mapping = {};
            var debugBase = $.extend({}, debugCtx || {}, {
                protocolName: protocol.ProtocolName || '',
                protocolCode: protocol.ProtocolCode || '',
                commType: String(commType || '').trim()
            });

            function normalizeEnumRule(rawRule) {
                if (!rawRule || typeof rawRule !== 'string') return '';
                const rule = rawRule.replace(/\\\//g, '/').trim();
                if (rule.indexOf('=') === -1 || rule.indexOf('/') === -1) return '';
                return rule;
            }

            function addRuleForParam(param) {
                if (!param) return;
                const enumRule = normalizeEnumRule(
                    param.Unit || param.DataList || (param.AlarmMode && param.AlarmMode.AlarmValue) || ''
                );
                if (!enumRule) return;

                [param.ParamName, param.AlarmKey, param.ParamNo].forEach(k => {
                    const keyText = normalizeDictKey(k);
                    if (keyText !== '') {
                        mapping[keyText] = enumRule;
                    }
                });
            }

            // 新版协议：ProtocolJson
            if (protocol.ProtocolJson) {
                let protocolJsonObj = protocol.ProtocolJson;
                if (typeof protocolJsonObj === 'string') {
                    try {
                        protocolJsonObj = JSON.parse(protocolJsonObj);
                    } catch (e) {
                        protocolJsonObj = null;
                        protocolDebugLog('map_protocol_json_parse_failed', $.extend({}, debugBase, {
                            ProtocolJson: protocol.ProtocolJson
                        }));
                    }
                }

                const parseModels = (protocolJsonObj && Array.isArray(protocolJsonObj.parseModels))
                    ? protocolJsonObj.parseModels
                    : [];
                if (parseModels.length) {
                    const targetCmd = String(commType || '').trim().toUpperCase();
                    var matchedModelCount = 0;
                    parseModels.forEach(model => {
                        const modelCmd = String(model.CommandType || '').trim().toUpperCase();
                        if (targetCmd && modelCmd !== targetCmd) return;
                        matchedModelCount += 1;
                        const params = Array.isArray(model.Params) ? model.Params : [];
                        params.forEach(addRuleForParam);
                    });
                    protocolDebugLog('map_protocol_json_done', $.extend({}, debugBase, {
                        targetCmd: targetCmd,
                        parseModelTotal: parseModels.length,
                        parseModelMatched: matchedModelCount,
                        mapKeyCount: Object.keys(mapping).length,
                        mapKeysSample: Object.keys(mapping).slice(0, 30)
                    }));
                    if (Object.keys(mapping).length) return mapping;
                }
            }

            // 旧版协议兜底：ProtocolData
            if (protocol.ProtocolData) {
                const targetCmd = String(commType || '').trim().toUpperCase();
                const entry = String(protocol.ProtocolData).split('|').find(function (p) {
                    const oneCmd = String((p || '').split("&")[0] || '').trim().toUpperCase();
                    if (!targetCmd) return !!oneCmd;
                    return oneCmd === targetCmd;
                });
                if (!entry) {
                    protocolDebugLog('map_protocol_data_not_found', $.extend({}, debugBase, {
                        targetCmd: targetCmd,
                        mapKeyCount: Object.keys(mapping).length
                    }));
                    return Object.keys(mapping).length ? mapping : null;
                }

                const parts = entry.split('&');
                const paramStr = parts.length > 2 ? parts[2] : '';
                if (!paramStr) return Object.keys(mapping).length ? mapping : null;

                paramStr.split(':').forEach(p => {
                    const cols = p.split(',');
                    const name = cols.length > 1 ? cols[1] : '';
                    const enumRule = normalizeEnumRule(
                        cols.find(v => v.indexOf('=') > -1 && v.indexOf('/') > -1) || ''
                    );
                    const nameText = normalizeDictKey(name);
                    if (nameText && enumRule) mapping[nameText] = enumRule;
                });
            }
            return Object.keys(mapping).length ? mapping : null;
        }

        function parseEnumMappingResult(value, enumStr) {
            const res = {
                value: value,
                matched: false,
                matchedRule: '',
                valueText: String(value == null ? '' : value).trim(),
                comparableValue: String(value == null ? '' : value).trim(),
                reason: '',
                ruleKeysSample: []
            };
            if (!enumStr || typeof enumStr !== 'string') {
                res.reason = 'enum_invalid';
                return res;
            }

            if (/^-?\d+(\.\d+)?$/.test(res.valueText)) {
                const numVal = Number(res.valueText);
                if (Number.isFinite(numVal)) {
                    res.comparableValue = String(numVal);
                }
            }

            const rules = enumStr.split('/');
            for (let i = 0; i < rules.length; i++) {
                const oneRule = rules[i];
                if (!oneRule || oneRule.indexOf('=') < 0) continue;
                const parts = oneRule.split('=');
                const leftRaw = parts.shift();
                const rightRaw = parts.join('=');
                const leftText = String(leftRaw == null ? '' : leftRaw).trim();
                if (leftText === '') continue;
                if (res.ruleKeysSample.length < 20) res.ruleKeysSample.push(leftText);

                if (leftText === res.valueText) {
                    res.value = rightRaw;
                    res.matched = true;
                    res.matchedRule = oneRule;
                    res.reason = 'exact';
                    return res;
                }

                if (/^-?\d+(\.\d+)?$/.test(leftText) && /^-?\d+(\.\d+)?$/.test(res.comparableValue)) {
                    if (Number(leftText) === Number(res.comparableValue)) {
                        res.value = rightRaw;
                        res.matched = true;
                        res.matchedRule = oneRule;
                        res.reason = 'numeric_equal';
                        return res;
                    }
                }
            }

            res.reason = 'rule_not_matched';
            return res;
        }

        var clicktime = null;
        var devclicktime = null;


        //增加设备
        function addDev(obj, name, id, servercode, LinkMode, OnlyCode) {
            // console.log(id)
            clearTimeout(devclicktime);
            if (!servercodechoose) servercodechoose = servercode;
            if (!Number(servercode) && (servercodechoose != servercode) || (Number(servercode) && !Number(servercodechoose))) {
                layer.msg('主从机设备不能同时查询！', {
                    icon: 5,
                    time: 2000
                })
                return false
            }
            devclicktime = setTimeout(function () {
                let havparam = devkey.findIndex(v => v == id);
                if (havparam == -1) {
                    $(obj).addClass('check');
                    devkey.push(id);
                    devname.push(name);
                    $('textarea[name=search]').val(devname.join('\n'));
                    // console.log(devkey)
                    if (LinkMode == '3') {//增加snmp设备的，用于获取参数枚举解析值
                        devsnmpkey.push(id)
                    }
                    //将选择设备展示设备参数
                    let chooseDevParamIndex = alldevice.findIndex(v => v.id == id);
                    let chooseDevParamStr = alldevice[chooseDevParamIndex].DeviceLastData;
                    if (chooseDevParamStr) {
                        const jsonObj = JSON.parse(chooseDevParamStr.replace(/'/g, '"'));
                        for (var key in jsonObj) {
                            let paramName = alldevice[chooseDevParamIndex].DeviceName + '/' + key
                            devParamList.push(paramName);
                            $('#devParam ul').append(`<li data-devid="${id}">${paramName}</li>`);
                        }

                        //绑定参数点击事件
                        $('#devParam ul li').unbind('click').click(function () {
                            var selectedParam = $(this).text().trim();
                            if ($(this).hasClass('check')) {
                                $(this).removeClass('check');
                                parkey = (parkey || []).filter(function (v) {
                                    return String(v || '').trim() !== selectedParam;
                                });
                            } else {
                                $(this).addClass('check');
                                if (selectedParam) {
                                    parkey = (parkey || []).filter(function (v) {
                                        return String(v || '').trim() !== selectedParam;
                                    });
                                    parkey.push(selectedParam);
                                }
                            }
                            resetHistoryFilterState();
                            if (historyQuery.localDevIDs) {
                                requestHistoryPage(1, historyPageSize);
                            }
                        })
                    }
                }
            }, 300)
        }
        //取消设备
        function cancelDev(obj, name, id, servercode) {
            clearTimeout(devclicktime);
            let havparam = devkey.findIndex(v => v == id);
            if (havparam > -1) {
                $(obj).removeClass('check');
                devkey.splice(havparam, 1);
                devname.splice(havparam, 1);
                $('textarea[name=search]').val(devname.join('\n'));
                $(`#devParam ul li[data-devid=${id}]`).remove();
                parkey = (parkey || []).filter(function (v) {
                    return String(v || '').indexOf(name + '/') !== 0;
                });
                if (devkey.length == 0) {//删除到最后一个设备 清除选择服务器
                    servercodechoose = '';
                }
                //处理snmp选择设备
                let havsnmparam = devsnmpkey.findIndex(v => v == id);
                if (havsnmparam > -1) {
                    devsnmpkey.splice(havsnmparam, 1);
                }
                resetHistoryFilterState();
            }

        }
        //传递给子页面的数据
        function theChartData() {
            return [chartLineData, param.startDateTime, param.endDateTime];
        }
    </script>
