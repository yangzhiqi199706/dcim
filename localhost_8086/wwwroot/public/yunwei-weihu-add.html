<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <div class="layui-form-item">
                    <label class="layui-form-label">维护任务名称<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="WHTaskName" value="" name="WHTaskName" lay-verify="required"
                            autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">维护内容<span class="x-red">*</span></label>
                    <div class="layui-input-block">
                        <textarea name="WHTaskCon" id="WHTaskCon" class="layui-textarea" lay-verify="required" placeholder="请输入"></textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">关联设备<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="DeviceId" value="" name="WHDeviceId" lay-verify="required"
                            autocomplete="off" class="layui-input" readonly>
                    </div>
                    <div class="layui-form-mid layui-word-aux">
                        <a class="layui-btn" onclick="xadmin.open('选择设备','choose-device.html?inputid=DeviceId&value='+$('#DeviceId').val())">选择</a>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">维护负责人<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="WHEmpName" value="" name="WHEmpName" lay-verify="required"
                            autocomplete="off" class="layui-input" readonly>
                        <input type="hidden" id="WHEmpId" value="" name="WHEmpId" lay-verify="required"
                            autocomplete="off" class="layui-input" readonly>
                    </div>
                    <div class="layui-form-mid layui-word-aux">
                        <a class="layui-btn" onclick="xadmin.open('选择人员','choose-person.html?type=weihu')">选择</a>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">计划完成时间<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="PlanComplateDate" value="" name="PlanComplateDate" lay-verify="required"
                            autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function () {
            layui.use(["form", "laydate"], function () {
                $ = layui.jquery;
                var form = layui.form;
                var laydate = layui.laydate;
                laydate.render({
                    elem: '#PlanComplateDate' ,//指定元素
                    type:'datetime',
                    format: 'yyyy-MM-dd'
                });
                //监听提交
                form.on("submit(submit)", function (data) {
                    var strformData = new FormData($("#formNow")[0]);
                    strformData.append("token", token);
                    list.form("CreateWHTaskKey", strformData, function (r) {
                        backToparent("添加成功");
                    });
                });
            });
        })
    </script>
</body>

</html>
