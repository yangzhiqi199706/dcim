    <script>
        $(function () {
            //今天
            var dayObj = getLast30DaysRange();
            var endDate = dayObj.endDate;
            var startDate = dayObj.startDate;

            var chartparam = {
                token: token,
                ServerCode: '',
                AreaId: '',
                startDate: startDate,
                endDate: endDate
            }
            getdata(chartparam);
            layui.use(["form", "laydate"], function () {
                $ = layui.jquery;
                var form = layui.form;
                var laydate = layui.laydate;

                laydate.render({
                    elem: '#endDate',
                    type: 'date',
                    value: endDate
                });

                laydate.render({
                    elem: '#startDate',
                    type: 'date',
                    value: startDate
                });

                form.render();

                //服务器
                getServer(form, function (r) {
                    form.on("select(ServerCode)", function (data) {
                        getArea(form, data);
                    });
                });

                //监听提交
                form.on("submit(search)", function (data) {
                    chartparam.ServerCode = data.field.ServerCode;
                    chartparam.AreaId = data.field.AreaId;
                    chartparam.startDate = data.field.startDate;
                    chartparam.endDate = data.field.endDate;
                    getdata(chartparam);
                    return false;
                });
            });
        })
        function getdata(chartparam) {
            list.info('GetPayInfoKey', chartparam, function (r) {
                var html = template("listtemplate", r);
                $("#moneytable tbody").html(html);
                if (r.data) {
                    var monthnenghaotitle = [];
                    var monthnenghaodata = [];
                    var monthmoneydata = [];
                    $.each(r.data, function (n, val) {
                        monthnenghaotitle.push(val.Date);
                        monthnenghaodata.push(val.TotalNH);
                        monthmoneydata.push(val.TotalDF);
                    })
                }
            })
        }
        // 获取当前时间的前一天日期
        function getYesterday() {
            var today = new Date();
            var yesterday = new Date(today);
            yesterday.setDate(today.getDate() - 1);
            return yesterday;
        }
        // 获取最近30天的日期范围（从今天往前推30天）
        function getLast30DaysRange() {
            var today = new Date();
            var thirtyDaysAgo = new Date(today);
            thirtyDaysAgo.setDate(today.getDate() - 30);

            function formatDate(date) {
                var year = date.getFullYear();
                var month = (date.getMonth() + 1).toString().padStart(2, '0');
                var day = date.getDate().toString().padStart(2, '0');
                return year + '-' + month + '-' + day;
            }

            return {
                startDate: formatDate(thirtyDaysAgo),
                endDate: formatDate(today),
                start: thirtyDaysAgo,
                end: today
            };
        }
        //使用 table2excel 导出表格
        function exportExcel(obj,name){
            var table = $(obj);
            if(table && table.length){
                var preserveColors = (table.hasClass('layui-table') ? true : false);
                $(table).table2excel({
                    exclude: ".noExl",
                    name: "name",
                    filename: name + ".xls",//getDateTime().replace(/[\-\:\ \.]/g, "")
                    fileext: ".xls",
                    exclude_img: true,
                    exclude_links: true,
                    exclude_inputs: true,
                    preserveColors: false,
                });
            }
        }
    </script>
