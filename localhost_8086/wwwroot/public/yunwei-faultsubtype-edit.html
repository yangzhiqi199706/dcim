<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <script type="text/html" id="detail">
                <div class="layui-form-item">
                    <label class="layui-form-label">类型名称<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="FaultSubTypeName" value="{{data.FaultSubTypeName}}" name="FaultSubTypeName" lay-verify="required"
                            autocomplete="off" class="layui-input" readonly>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">
                        关联故障类型<span class="x-red">*</span>
                    </label>
                    <div class="layui-input-inline">
                        <select id="FaultTypeId" name="FaultTypeId" value="" lay-verify="required"
                            lay-filter="FaultTypeId">
                            <option value="1 动环监控">1 动环监控</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">默认执行人<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="ExecutorPersonName" value="{{data.ExecutorEmpName}}" name="ExecutorPersonName"
                            lay-verify="required" autocomplete="off" class="layui-input" readonly>
                        <input type="hidden" id="ExecutorEmpId" value="{{data.ExecutorEmpId}}" name="ExecutorEmpId"
                            autocomplete="off" class="layui-input" readonly>
                    </div>
                    <div class="layui-form-mid layui-word-aux">
                        <a class="layui-btn"
                            onclick="xadmin.open('选择人员','choose-person.html?type=falutsubtypeEx')">选择</a>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">其他执行人员</label>
                    <div class="layui-input-inline">
                        <input type="text" id="OtherExecutorPersonName" value="{{data.OtherExecutorEmpName}}" name="OtherExecutorPersonName"
                             autocomplete="off" class="layui-input" readonly>
                        <input type="hidden" id="OtherExecutorEmpId" value="{{data.OtherExecutorEmpId}}" name="OtherExecutorEmpId"
                             autocomplete="off" class="layui-input" readonly>
                    </div>
                    <div class="layui-form-mid layui-word-aux">
                        <a class="layui-btn"
                            onclick="xadmin.open('选择人员','choose-person.html?type=falutsubtypeOt')">选择</a>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">审核人<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="ExaminePersonName" value="{{data.ExamineEmpName}}" name="ExaminePersonName"
                            lay-verify="required" autocomplete="off" class="layui-input" readonly>
                        <input type="hidden" id="ExamineEmpId" value="{{data.ExamineEmpId}}" name="ExamineEmpId"
                            autocomplete="off" class="layui-input" readonly>
                    </div>
                    <div class="layui-form-mid layui-word-aux">
                        <a class="layui-btn"
                            onclick="xadmin.open('选择人员','choose-person.html?type=falutsubtypeCh')">选择</a>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
                </script>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function () {
            var id = GetString("id");
            //获取详情
            list.info("GetFaultSubTypeDetailKey", {
                token: token,
                id: id
            }, function (r) {
                var html = template("detail", r);
                $("#formNow").html(html);
                layui.use(["form"], function () {
                    $ = layui.jquery;
                    var form = layui.form;
                    param.ComboBox = "all";
                    list.info("GetFaultTypeListKey", param, function (res) {
                        var serverhtml = "<option value=''>请选择故障类型</option>";
                        $.each(res.data, function (n, val) {
                            serverhtml += "<option disabled value=\"" + val.id + "\">" + val.FaultTypeName + "</option>";
                        });
                        $("#FaultTypeId").html(serverhtml);
                        form.render("select");
                        layuiSelected("FaultTypeId", r.data.FaultTypeName);
                    })
                    //监听提交
                    form.on("submit(submit)", function (data) {
                        var strformData = new FormData($("#formNow")[0]);
                        strformData.append("token", token);
                        strformData.append("id", id);
                        strformData.append("FaultTypeId", r.data.FaultTypeId);
                        list.form("ChangeFaultSubTypeKey", strformData, function (r) {
                            backToparent("修改成功");
                        });
                    });
                });
            });
        });
    </script>
</body>

</html>
