<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>运维管理->运维统计</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <div class="head-nav">
                            <a class="layui-btn">按月</a>
                            <a class="layui-btn layui-btn-primary">按季度</a>
                            <a class="layui-btn layui-btn-primary">按年</a>
                            <a class="layui-btn layui-btn-primary">自定义</a>
                        </div>
                    </div>
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5" id="monthForm">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" name="month" id="month" placeholder="年月" lay-verify="required">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="monthForm" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                        <form class="layui-form layui-col-space5" id="quarterForm">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" name="quarteryear" id="quarteryear" placeholder="年" lay-verify="required">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <select id="order" name="order" lay-verify="required">
                                    <option value="1">第一季度</option>
                                    <option value="2">第二季度</option>
                                    <option value="3">第三季度</option>
                                    <option value="4">第四季度</option>
                                </select>
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="quarterForm" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                        <form class="layui-form layui-col-space5"  id="yearForm">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" name="year" id="year" placeholder="年" lay-verify="required">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="yearForm" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                        <form class="layui-form layui-col-space5" id="userForm">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" name="startDateTime" id="startDateTime" placeholder="开始时间" lay-verify="required">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" name="endDateTime" id="endDateTime" placeholder="结束时间" lay-verify="required">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="userForm" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="layui-card-body">
                        <table class="layui-table">
                            <thead>
                                <tr>
                                    <th>执行人ID</th>
                                    <th>执行人</th>
                                    <th>工单处理数量</th>
                                    <th>执行巡检任务数量</th>
                                    <th>执行维护任务数量</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.length!=0}} {{each data as list i}}
                                    <tr>
                                        <td>{{list.EmpId}}</td>
                                        <td>{{list.PersonName}}</td>
                                        <td>{{list.OrderNumber}}</td>
                                        <td>{{list.XJNumber}}</td>
                                        <td>{{list.WHNumber}}</td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        $(function(){
            layui.use(["form","laydate"], function () {
                $ = layui.jquery;
                var form = layui.form;
                var laydate = layui.laydate;
                var month = new Date().getMonth() + 1;
                month = (month < 10 ? "0" + month : month);
                var firstMonth = new Date().getFullYear()+'-'+month;
                laydate.render({
                    elem: '#month',
                    type: 'month',
                    value:firstMonth
                });
                laydate.render({
                    elem: '#year',
                    type: 'year',
                    value:new Date().getFullYear()
                });
                laydate.render({
                    elem: '#quarteryear',
                    type: 'year',
                    value:new Date().getFullYear()
                });
                laydate.render({
                    elem: '#startDateTime',
                    type:'datetime'
                });
                laydate.render({
                    elem: '#endDateTime',
                    type:'datetime'
                });
                //初始化数据
                getList(getOnemonth(firstMonth)[0],getOnemonth(firstMonth)[1]);
                //切换
                $('.head-nav a').click(function(){
                    $(this).removeClass('layui-btn-primary').siblings().addClass('layui-btn-primary');
                    $('.layui-card-body form').eq($(this).index()).show().siblings().hide();
                }).first().click();
                //监听提交
                form.on("submit(monthForm)", function (data) {
                    getList(getOnemonth(data.field.month)[0],getOnemonth(data.field.month)[1]);
                });
                form.on("submit(quarterForm)", function (data) {
                    let start='',end='';
                    switch (data.field.order) {
                        case '1' :start=data.field.quarteryear+'-01-01 00:00:00';end=data.field.quarteryear+'-03-31 23:59:59';break;
                        case '2' :start=data.field.quarteryear+'-04-01 00:00:00';end=data.field.quarteryear+'-06-30 23:59:59';break;
                        case '3' :start=data.field.quarteryear+'-07-01 00:00:00';end=data.field.quarteryear+'-09-30 23:59:59';break;
                        case '4' :start=data.field.quarteryear+'-10-01 00:00:00';end=data.field.quarteryear+'-12-31 23:59:59';break;
                    }
                    getList(start,end);
                    return false;
                });
                form.on("submit(yearForm)", function (data) {
                    let start=data.field.year+'-01-01 00:00:00';
                    let end=data.field.year+'-12-31 23:59:59';
                    getList(start,end);
                    return false;
                });
                form.on("submit(userForm)", function (data) {
                    let start=data.field.startDateTime;
                    let end=data.field.endDateTime;
                    getList(start,end);
                    return false;
                });
                //获取列表数据
                function getList(start,end){
                    list.info('GetYWStatisticKey',{
                        token:token,
                        startDateTime:start,
                        endDateTime:end
                    },function(r){
                        var html = template("listtemplate", r);
                        $("tbody").html(html);
                    })
                }
            });
        })
        
    </script>
</body>
</html>
