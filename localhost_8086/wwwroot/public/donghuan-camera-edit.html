<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <script type="text/html" id="detail">
                    <div class="layui-form-item">
                        <label class="layui-form-label">设备品牌<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <select class="layui-input" id="CameraBrand" name="CameraBrand" lay-verify="required" lay-filter="CameraBrand">
                                <option value="">请选择</option>
                                <option value="海康" {{if data.CameraBrand=='海康'}} selected {{/if}}>海康</option>
                                <option value="大华" {{if data.CameraBrand=='大华'}} selected {{/if}}>大华</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">名称<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="CameraName" value="{{data.CameraName}}" name="CameraName" lay-verify="required" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">IP<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="CameraIP" value="{{data.CameraIP}}" name="CameraIP" lay-verify="required" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">端口<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="CameraPort" value="{{data.CameraPort}}" name="CameraPort" lay-verify="required" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">用户名<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="CameraLoginName" value="{{data.CameraLoginName}}" name="CameraLoginName" lay-verify="required" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">密码<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="CameraLoginPass" value="{{data.CameraLoginPass}}" name="CameraLoginPass" lay-verify="required" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">所属服务器<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <select class="layui-input" id="ServerCode" name="ServerCode" lay-verify="required" lay-filter="ServerCode">
                                <option value="">请选择</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">所属区域<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <select class="layui-input" id="AreaId" name="AreaId" lay-verify="required" lay-filter="AreaId">
                                <option value="">请选择</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label"></label>
                        <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                    </div>
                </script>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function(){
            var id = GetString("id");

            //获取详情
            list.info("GetCameraDetailKey", {
                token: token,
                id: id
            }, function (r) {
                var html = template("detail", r);
                $("#formNow").html(html);
                layui.use(["form"], function () {
                    $ = layui.jquery;
                    var form = layui.form;
                    //服务器
                    getServer(form,function(){
                        //继成上个接口
                        layuiSelected("ServerCode", r.data.ServerName);
                        form.on("select(ServerCode)", function (data) {
                            getArea(form,data);
                        });
                        getArea(form,{value:r.data.ServerCode},function(){
                            //继成上个接口
                            layuiSelected("AreaId", r.data.AreaName);
                        });
                    });
                     //监听提交
				    form.on("submit(submit)", function (data) {
                        var strformData = new FormData($("#formNow")[0]);
                        strformData.append("token", token);
                        strformData.append("id", id);
                        list.form("ChangeCameraKey", strformData, function (r) {
                            backToparent("修改成功");
                        });
                    });
                });
            });	
        })
    </script>
</body>

</html>
