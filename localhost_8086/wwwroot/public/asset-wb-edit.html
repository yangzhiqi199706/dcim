<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <script type="text/html" id="detail">
                <div class="layui-form-item">
                    <label class="layui-form-label">合同名称<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="MaintenanceName" value="{{data.MaintenanceName}}" name="MaintenanceName" lay-verify="required" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">合同编号<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="MaintenanceNumber" value="{{data.MaintenanceNumber}}" name="MaintenanceNumber" lay-verify="required" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">维保类型<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <select id="MaintenanceType" name="MaintenanceType" lay-verify="required">
                            <option value="次服务" {{if data.MaintenanceType=='次服务'}}selected{{/if}}>次服务</option>
                            <option value="月服务"  {{if data.MaintenanceType=='月服务'}}selected{{/if}}>月服务</option>
                            <option value="季服务"  {{if data.MaintenanceType=='季服务'}}selected{{/if}}>季服务</option>
                            <option value="年服务"  {{if data.MaintenanceType=='年服务'}}selected{{/if}}>年服务</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">供应商<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <select id="SupplierId" name="SupplierId" lay-verify="required">
                            <option value="">请选择</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">签订人<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="SignPerson" value="{{data.SignPerson}}" name="SignPerson" lay-verify="required" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">签订日期<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="SignTime" value="{{data.SignTime}}" name="SignTime" autocomplete="off" lay-verify="required" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">维保期限(月)<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="number" id="MaintenanceMonth" value="{{data.MaintenanceMonth}}" name="MaintenanceMonth" lay-verify="required" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">维保起始日期<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="StartTime" value="{{data.StartTime}}" name="StartTime" autocomplete="off" lay-verify="required" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">维保联系人</label>
                    <div class="layui-input-inline">
                        <input type="text" id="MaintenanceTelName" value="{{data.MaintenanceTelName}}" name="MaintenanceTelName" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">维保电话</label>
                    <div class="layui-input-inline">
                        <input type="phone" id="MaintenanceTel" value="{{data.MaintenanceTel}}" name="MaintenanceTel" autocomplete="off" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">承保类型<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <select id="AcceptType" name="AcceptType" lay-verify="required">
                            <option value="原厂商承包"  {{if data.AcceptType=='原厂商承包'}}selected{{/if}}>原厂商承包</option>
                            <option value="第三方承包"  {{if data.AcceptType=='第三方承包'}}selected{{/if}}>第三方承包</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item layui-form-text">
                    <label class="layui-form-label">服务内容</label>
                    <div class="layui-input-block">
                        <textarea placeholder="请输入内容" id="MaintenanceCon" name="MaintenanceCon" class="layui-textarea">{{data.MaintenanceCon}}</textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">附件</label>
                    <div class="layui-input-inline">
                        <input type="text" id="FileImg" value="{{data.MaintenanceFile}}" autocomplete="off" class="layui-input" readonly>
                        <input id="BaseImg" type="hidden" value="{{data.MaintenanceFile}}" name="MaintenanceFile" >
                    </div>
                    <a class="layui-btn">
                        <input type="file" class="layui-btn" onchange="uploadImg(this)" accept="image/*" value="{{data.MaintenanceFile}}">
                        选择文件
                    </a>
                    <a class="layui-btn-warm layui-btn fancybox-view" href="{{data.MaintenanceFile}}" id="ViewImg">预览
                        <img src="{{data.MaintenanceFile}}" alt="">
                    </a>
                    <a class="layui-btn-danger layui-btn" id="CleanImg" onclick="CleanImg(this)">清空</a>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
            </script>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function(){
            var id = GetString("id");

            //获取详情
            list.info("GetMaintenanceDetailKey", {
                token: token,
                id: id
            }, function (r) {
                let hasimg=false;//是否存在图片
                if(r.data.MaintenanceFile && r.data.MaintenanceFile.indexOf('http')<0){
                    r.data.MaintenanceFile=imgUrl+r.data.MaintenanceFile;
                    hasimg=true;
                }
                if(r.data.SignTime){
                    r.data.SignTime = r.data.SignTime.substring(0,10)
                }
                if(r.data.StartTime){
                    r.data.StartTime = r.data.StartTime.substring(0,10)
                }
                var html = template("detail", r);
                $("#formNow").html(html);
                if(!hasimg){
                    $('#ViewImg,#CleanImg').hide();
                }
                layui.use(["form","laydate"], function () {
                    $ = layui.jquery;
                    var form = layui.form;
                    var laydate = layui.laydate;
                    laydate.render({
                        elem: '#SignTime' 
                    });
                    laydate.render({
                        elem: '#StartTime' 
                    });
                    //供应商
                    getSupplier(form,function(){
                        //继成上个接口
                        layuiSelected("SupplierId", r.data.SupplierName);
                    });
                    //预览图片
                    fnFancyBox('.fancybox-view');
                    //监听提交
				    form.on("submit(submit)", function (data) {
                        var strformData = new FormData($("#formNow")[0]);
                        strformData.append("token", token);
                        strformData.append("id", id);
                        list.form("ChangeMaintenanceKey", strformData, function (r) {
                            backToparent("修改成功");
                        });
                    });
                });
            });	
        })
    </script>
</body>
</html>
