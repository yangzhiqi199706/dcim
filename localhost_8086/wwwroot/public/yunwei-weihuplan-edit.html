<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <script type="text/html" id="detail">
                    <div class="layui-form-item">
                        <label class="layui-form-label">计划名称<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="WHPlanName" value="{{data.WHPlanName}}" name="WHPlanName" lay-verify="required"
                                autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">完成期限(天)<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="number" id="WHComplateDays" value="{{data.WHComplateDays}}" name="WHComplateDays" autocomplete="off" lay-verify="required"
                                class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">派发周期<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <select id="DistributeCycle" name="DistributeCycle" lay-filter="DistributeCycle" lay-verify="required">
                                <option value="year" {{if data.DistributeCycle=='year'}}selected{{/if}}>年</option>
                                <option value="month" {{if data.DistributeCycle=='month'}}selected{{/if}}>月</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">
                            派发时间<span class="x-red">*</span>
                        </label>
                        <div class="layui-input-inline">
                            <input type="text" id="SendTime" value="{{data.DistributeTime}}" name="DistributeTime" lay-verify="required"
                                autocomplete="off" class="layui-input" readonly>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" id="SendOpen">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">关联设备<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="DeviceId" value="{{data.DeviceId}}" name="DeviceId" lay-verify="required"
                                autocomplete="off" class="layui-input" readonly>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" onclick="xadmin.open('选择设备','choose-device.html?inputid=DeviceId&value='+$('#DeviceId').val())">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">维护负责人<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="PersonName" value="{{data.WHEmpName}}" name="WHEmpName" lay-verify="required" autocomplete="off" class="layui-input" readonly>
                            <input type="hidden" id="EmpId" value="{{data.WHEmpId}}" name="WHEmpId" lay-verify="required" autocomplete="off" class="layui-input" readonly>
                        </div>
                        <div class="layui-form-mid layui-word-aux">
                            <a class="layui-btn" onclick="xadmin.open('选择人员','choose-person.html?type=person')">选择</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">周期性维护<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <select id="WHCycle" name="WHCycle" lay-verify="required" lay-filter="WHCycle">
                                <option value="1" {{if data.WHCycle==1}}selected{{/if}}>启用</option>
                                <option value="-1" {{if data.WHCycle==-1}}selected{{/if}}>禁用</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">维护内容<span class="x-red">*</span></label>
                        <div class="layui-input-block">
                            <textarea name="WHContent" id="WHContent" class="layui-textarea" lay-verify="required">{{data.WHContent}}</textarea>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">备注</label>
                        <div class="layui-input-block">
                            <textarea name="remark" id="remark" class="layui-textarea">{{data.remark}}</textarea>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label"></label>
                        <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                    </div>
                </script>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function () {
            var id = GetString("id");
            //获取详情
            list.info("GetWHPlanDetailKey", {
                token: token,
                id: id
            }, function (r) {
                var html = template("detail", r);
                $("#formNow").html(html);
                //派发周期
                $('#SendOpen').click(function(){
                    if(r.data.DistributeCycle=='year'){
                        xadmin.open('选择时间','choose-year.html')
                    }else{
                        xadmin.open('选择时间','choose-time.html')
                    }
                })
                layui.use(["form"], function () {
                    $ = layui.jquery;
                    var form = layui.form;
                    form.on("select(DistributeCycle)", function (data) {
                        $('#SendTime').val('');
                        var url='';
                        if(data.value=='year'){
                            url='choose-year';
                        }else{
                            url='choose-time';
                        }
                        $('#SendOpen').unbind('click').click(function(){
                            xadmin.open('选择时间',url+'.html')
                        })
                    });
                    form.render();
                    form.on("submit(submit)", function (data) {
                        var strformData = new FormData($("#formNow")[0]);
                        strformData.append("token", token);
                        strformData.append("id", id);
                        list.form("ChangeWHPlanKey", strformData, function (r) {
                            backToparent("修改成功");
                        });
                    });
                });
            });
        })

    </script>
</body>

</html>
