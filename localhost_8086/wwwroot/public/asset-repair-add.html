<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>
<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <div class="layui-form-item">
                    <label class="layui-form-label">资产编号</label>
                    <div class="layui-input-inline">
                        <input type="text" id="AssetsNumber" value="" autocomplete="off" class="layui-input" readonly>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">型号</label>
                    <div class="layui-input-inline">
                        <input type="text" id="BrandModel" value="" autocomplete="off" class="layui-input" readonly>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">维修类型<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <select id="RepairType" name="RepairType" lay-verify="required">
                            <option value="">请选择</option>
                            <option value="IR" class="storerepair">在库维修</option>
                            <option value="DI" class="storerepair">外送维修（在库）</option>
                            <option value="FR" class="groundingrepair">在架维修</option>
                            <option value="DF" class="groundingrepair">外送维修（在架）</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">维修日期<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="RepairTime" value="" name="RepairTime" autocomplete="off" lay-verify="required" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">维修人<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="RepairEmp" value="" name="RepairEmp" autocomplete="off" lay-verify="required" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">负责部门<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="DeptName" value="" name="DeptName" lay-verify="required" autocomplete="off" class="layui-input" readonly>
                        <input type="hidden" id="DeptId" value="" name="DeptId" lay-verify="required" autocomplete="off" class="layui-input" readonly>
                    </div>
                    <div class="layui-form-mid layui-word-aux">
                        <a class="layui-btn" onclick="xadmin.open('选择部门','choose-department.html?type=dept')">选择</a>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">负责人<span class="x-red">*</span></label>
                    <div class="layui-input-inline">
                        <input type="text" id="PersonName" value="" name="PersonName" lay-verify="required" autocomplete="off" class="layui-input" readonly>
                        <input type="hidden" id="EmpId" value="" name="EmpId" lay-verify="required" autocomplete="off" class="layui-input" readonly>
                    </div>
                    <div class="layui-form-mid layui-word-aux">
                        <a class="layui-btn" onclick="xadmin.open('选择人员','choose-person.html?type=person&DeptId='+$('#DeptId').val())">选择</a>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">故障图像</label>
                    <div class="layui-input-inline">
                        <input type="text" id="FileImg" autocomplete="off" class="layui-input" readonly>
                        <input id="BaseImg" type="hidden" value="" name="FaultImg" >
                    </div>
                    <a class="layui-btn">
                        <input type="file" class="layui-btn" onchange="uploadImg(this)" accept="image/*" value="">
                        选择文件
                    </a>
                    <a class="layui-btn-warm layui-btn fancybox-view" href="" id="ViewImg">预览
                        <img src="" alt="">
                    </a>
                    <a class="layui-btn-danger layui-btn" id="CleanImg" onclick="CleanImg(this)">清空</a>
                </div>
                <div class="layui-form-item layui-form-text">
                    <label class="layui-form-label">故障描述<span class="x-red">*</span></label>
                    <div class="layui-input-block">
                        <textarea placeholder="请输入内容" id="FaultDescribe" name="FaultDescribe" class="layui-textarea" lay-verify="required"></textarea>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function(){
            var id = GetString("id");
            var AssetsNumber = decodeURI(GetString("AssetsNumber"));
            var BrandModel = decodeURI(GetString("BrandModel"));
            var AssetsId = GetString("AssetsId");
            var type = GetString("type");//type有值说明是资产在库，无说明是在架
            $('#AssetsNumber').val(AssetsNumber);
            $('#BrandModel').val(BrandModel);
            $('#ViewImg,#CleanImg').hide();
            layui.use(["form",'laydate'], function () {
                $ = layui.jquery;
                var form = layui.form;
                var laydate = layui.laydate;
                laydate.render({
                    elem: '#RepairTime',
                    type: 'datetime' 
                });
                if(type){
                    $('.groundingrepair').remove();
                }else{
                    $('.storerepair').remove();
                }
                form.render('select');
                    //监听提交
                form.on("submit(submit)", function (data) {
                    var strformData = new FormData($("#formNow")[0]);
                    strformData.append("token", token);
                    strformData.append("id", id);
                    strformData.append("AssetsId", AssetsId);
                    list.form("CreateRepairPlanKey", strformData, function (r) {
                        backToparent("已维修");
                    });
                });
            });
        });
    </script>
</body>
</html>
