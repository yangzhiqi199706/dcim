<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="x-nav">
        <span class="layui-breadcrumb">
            <a>
                <cite>资产管理->基础配置->资产信息->属性管理</cite>
            </a>
        </span>
        <a class="layui-btn layui-btn-small refresh" href="javascript:location.replace(location.href);" title="刷新">
            <i class="layui-icon">&#xe666;</i>
        </a>
    </div>
    <div class="layui-fluid">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-body">
                        <form class="layui-form layui-col-space5">
                            <div class="layui-inline layui-show-xs-block">
                                <input class="layui-input" placeholder="请输入属性名称" name="search">
                            </div>
                            <div class="layui-inline layui-show-xs-block">
                                <button class="layui-btn search" lay-submit lay-filter="search" type="button">
                                    <i class="layui-icon">&#xe615;</i>
                                </button>
                            </div>
                        </form>
                        <button class="layui-btn x-right" onclick="xadmin.open('添加属性','asset-attr-add.html')">
                            <i class="layui-icon"></i>添加属性
                        </button>
                        <a class="layui-btn x-right" id="importBtn" style="margin-right: 10px;">
                            导入
                        </a>
                        <a href="/upfiletpl/assetAttr.xls" download="" class="importTpl x-right"
                            style="margin-top: 7px;">《下载模版》</a>
                    </div>
                    <div class="layui-card-body">
                        <div id="tree"></div>
                        <table class="layui-table layui-col-tree">
                            <thead>
                                <tr>
                                    <th>属性编号</th>
                                    <th>属性名称</th>
                                    <th>分类</th>
                                    <th>数据类型</th>
                                    <th>属性单位</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <script type="text/html" id="listtemplate">
                                    {{if data.info.length!=0}} {{each data.info as list i}}
                                    <tr>
                                        <td>{{list.AttrNumber}}</td>
                                        <td>{{list.AttrName}}</td>
                                        <td>{{list.AttrClass}}</td>
                                        <td>{{list.DataType}}</td>
                                        <td>{{list.AttrUnit}}</td>
                                        <td>
                                            {{if list.AttrAddWay=='1'}}
                                            <a title="编辑" onclick="xadmin.open('编辑','asset-attr-edit.html','','','{{list.id}}')" href="javascript:;">
                                                <i class="layui-icon">&#xe642;</i>
                                            </a>
                                            <a title="删除" onclick="x_admin_del('确认删除吗？','DelAssetsAttrKey','{{list.id}}',this)" href="javascript:;">
                                                <i class="layui-icon">&#xe640;</i>
                                            </a>
                                            {{/if}}
                                        </td>
                                    </tr>
                                    {{/each}} {{else}}
                                    <tr>
                                        <td colspan="20" style="text-align: center">暂无相关数据</td>
                                    </tr>
                                    {{/if}}
                                </script>
                            </tbody>
                        </table>
                        <div id="bottomPaging"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        //请求地址
        var url = "GetAssetsAttrListKey";
        $(function () {
            //初始化数据
            list.get(url, param);
            var search = '';
            layui.use(["form", "tree", "upload"], function () {
                $ = layui.jquery;
                var form = layui.form;
                var tree = layui.tree;
                var upload = layui.upload;

                //导入
                upDataPtl(upload, {
                    "table": "dcim-assetattr",
                    "primary_key": "AttrName",
                    "primary_field_name": "AttrName",
                    "mappings": []
                }, () => {
                    list.get(url, param);
                })

                tree.render({
                    elem: "#tree",
                    data: [
                        {
                            title: '资产属性',
                            spread: true,
                            children: [
                                { title: '物理属性' },
                                { title: '功耗属性' },
                                { title: '端口属性' },
                                { title: '私有属性' }
                            ]
                        },
                        {
                            title: '配置属性',
                            spread: true,
                            children: [
                                { title: '硬件属性' },
                                { title: '操作系统' },
                                { title: '其它' }
                            ]
                        }
                    ],
                    click: function (obj) {
                        if (!obj.data.children) {
                            $('.layui-tree-txt').removeAttr('style');
                            $(obj.elem).find('.layui-tree-txt').css('color', '#148cf1');
                            param.pageNo = 1;
                            param.search = search;
                            param.AttrClass = obj.data.title;
                            list.get(url, param);
                        }
                    }
                });
                //监听提交
                form.on("submit(search)", function (data) {
                    param.pageNo = 1;
                    param.search = search = data.field.search;
                    list.get(url, param);
                    return false;
                });
            });
        })
        //分页回调
        function pagechange(curr) {
            param.pageNo = curr;
            list.get(url, param);
        }

    </script>
</body>

</html>
