<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <script src="js/head.js" type="text/javascript" charset="utf-8"></script>
</head>

<body>
    <div class="layui-fluid">
        <div class="layui-row">
            <form class="layui-form" method="post" enctype="multipart/form-data" id="formNow">
                <div class="layui-col-md6">
                    <div class="layui-form-item">
                        <label class="layui-form-label">姓名<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="PersonName" value="" name="PersonName" lay-verify="required"
                                autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">工号<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="PersonNumber" value="" name="PersonNumber" lay-verify="required"
                                autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">性别<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <select id="sex" name="sex" lay-verify="required">
                                <option value="男">男</option>
                                <option value="女">女</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">
                            角色名称<span class="x-red">*</span>
                        </label>
                        <div class="layui-input-inline">
                            <select id="RoleId" name="RoleId" lay-verify="required" lay-filter="RoleId">
                                <option value="">请选择角色名称</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">
                            部门<span class="x-red">*</span>
                        </label>
                        <div class="layui-input-inline">
                            <select id="DeptId" name="DeptId" lay-verify="required" lay-filter="DeptId">
                                <option value="">请选择</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">账号<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="text" id="PersonAccount" value="" name="PersonAccount" lay-verify="required"
                                autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">密码<span class="x-red">*</span></label>
                        <div class="layui-input-inline">
                            <input type="password" id="PersonPass" value="" name="PersonPass" lay-verify="required"
                                autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">手机号</label>
                        <div class="layui-input-inline">
                            <input type="text" id="PersonPhone" value="" name="PersonPhone" autocomplete="off"
                                class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">企业微信URL</label>
                        <div class="layui-input-inline">
                            <input type="text" id="WeicomUrl" value="" name="WeicomUrl" autocomplete="off"
                                class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">钉钉URL</label>
                        <div class="layui-input-inline">
                            <input type="text" id="DingdingUrl" value="" name="DingdingUrl" autocomplete="off"
                                class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">Email</label>
                        <div class="layui-input-inline">
                            <input type="text" id="email" value="" name="email" autocomplete="off" class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">用户组</label>
                        <div class="layui-input-block" id="groupCheckboxes">
                        </div>
                    </div>
                    <div class="layui-form-item layui-form-text">
                        <label class="layui-form-label">备注</label>
                        <div class="layui-input-block">
                            <textarea placeholder="请输入内容" id="remark" name="remark" class="layui-textarea"></textarea>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md6">
                    <div id="zkt">
                        <div class="layui-form-item">
                            <label class="layui-form-label">中控门禁权限<span class="x-red">*</span></label>
                            <div class="layui-input-inline">
                                <select id="ZktDoorPri" name="ZktDoorPri" lay-filter="ZktDoorPri">
                                    <option value="">请选择</option>
                                    <option value="0">普通用户</option>
                                    <option value="2">登记员</option>
                                    <option value="6">管理员</option>
                                    <option value="14">超级管理员</option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">中控门禁卡号</label>
                            <div class="layui-input-inline">
                                <input type="text" id="DoorCardNum" value="" name="DoorCardNum" autocomplete="off"
                                    class="layui-input">
                            </div>
                        </div>
                    </div>
                    <div id="hik">
                        <div class="layui-form-item">
                            <label class="layui-form-label">海康门禁权限<span class="x-red">*</span></label>
                            <div class="layui-input-inline">
                                <select id="HikDoorPri" name="HikDoorPri" lay-filter="HikDoorPri">
                                    <option value="">请选择</option>
                                    <option value="0">普通用户</option>
                                    <option value="2">来宾</option>
                                    <option value="6">非授权名单</option>
                                </select>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">海康访问有效期<span class="x-red">*</span></label>
                            <div class="layui-input-inline">
                                <input type="text" id="ValidStratTime" value="" name="ValidStratTime" autocomplete="off"
                                    class="layui-input" placeholder="开始时间">
                                <input type="text" id="ValidEndTime" value="" name="ValidEndTime" autocomplete="off"
                                    class="layui-input" placeholder="结束时间">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label">海康卡号凭证</label>
                            <div class="layui-form-mid layui-word-aux">
                                <a class="layui-btn" onclick="xadmin.open('绑定卡号','donghuan-menCard-add.html')">绑定卡号</a>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label"></label>
                            <div class="layui-input-block" id="cardbox">
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">门禁密码</label>
                        <div class="layui-input-inline">
                            <input type="password" id="DoorPass" value="" name="DoorPass" autocomplete="off"
                                class="layui-input">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">面部图像</label>
                        <div class="layui-input-inline">
                            <input type="text" id="FileImg" autocomplete="off" class="layui-input"
                                placeholder="大小限制100kb以内" readonly>
                            <input id="BaseImg" type="hidden" value="" name="FaceImg">
                        </div>
                        <a class="layui-btn">
                            <input type="file" class="layui-btn" onchange="uploadImg(this,'jpeg')" accept="image/*"
                                value="">
                            选择文件
                        </a>
                        <a class="layui-btn-warm layui-btn fancybox-view" href="" id="ViewImg">预览
                            <img src="" alt="">
                        </a>
                        <a class="layui-btn-danger layui-btn" id="CleanImg" onclick="CleanImg(this)">清空</a>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"></label>
                    <button class="layui-btn" id="submit" lay-submit lay-filter="submit" type="button">确定</button>
                </div>
            </form>
        </div>
    </div>
    <div class="wait">
        <img src="images/time.gif" alt="">
    </div>
    <script>
        $(function () {

            $('#ViewImg,#CleanImg').hide();
            layui.use(["form", "laydate"], function () {
                $ = layui.jquery;
                var form = layui.form;
                var laydate = layui.laydate;
                laydate.render({
                    elem: '#ValidStratTime,#ValidEndTime',
                    type: 'datetime'
                });
                form.render();

                // $('#zkt,#hik').hide();

                // $('#uploadFinger').hide();
                // // 手指选择事件
                // form.on("select(FingerId)", function (data) {
                //     var fingerSelected = data.value !== '';
                //     if (fingerSelected) {
                //         $('#uploadFinger').show();
                //     } else {
                //         $('#uploadFinger').hide();
                //     }
                //     form.render("select");
                // });

                //用户组
                list.info('GetPersonGroupListKey', {
                    token: token,
                    ComboBox: 'all'
                }, function (res) {
                    var grouphtml = "";
                    $.each(res.data, function (n, val) {
                        grouphtml += "<input type='checkbox' name='GroupId' lay-skin='primary' value='" + val.id + "' title='" + val.GroupName + "'>";
                    });
                    $("#groupCheckboxes").html(grouphtml);
                    form.render("checkbox");
                });

                // 加载角色列表
                list.info('RoleList', {
                    token: token,
                    ComboBox: 'all'
                }, function (res) {
                    var tenanthtml = "";
                    $.each(res.data, function (n, val) {
                        tenanthtml += "<option value=\"" + val.id + "\">" + val.role_name + "</option>";
                    });
                    $("#RoleId").append(tenanthtml);
                    form.render("select");

                    // 角色选择事件
                    form.on("select(RoleId)", function (data) {
                        if (data.elem[data.elem.selectedIndex].text == '门禁权限组') {
                            $('#PersonAccount,#PersonPass').removeAttr('lay-verify');
                            $('#PersonAccount,#PersonPass').parent().parent().hide();
                        } else {
                            $('#PersonAccount,#PersonPass').parent().parent().show();
                            $('#PersonAccount,#PersonPass').attr('lay-verify', 'required');
                        }
                    });
                });

                // 部门数据加载
                list.info("GetDeptListKey", {
                    token: token,
                    ComboBox: 'all'
                }, function (res) {
                    var dpthtml = "";
                    $.each(res.data, function (n, val) {
                        dpthtml += "<option value=\"" + val.id + "\">" + val.DeptName + "</option>";
                    });
                    $("#DeptId").append(dpthtml);
                    form.render("select");
                });

                // // 门禁类型
                // form.on("select(DoorType)", function (data) {
                //     if (data.elem[data.elem.selectedIndex].text == '中控') {
                //         $('#zkt').show();
                //         $('#hik').hide();
                //     } else if (data.elem[data.elem.selectedIndex].text == '海康') {
                //         $('#hik').show();
                //         $('#zkt').hide();
                //     } else {
                //         $('#hik').hide();
                //         $('#zkt').hide();
                //     }
                // })

                // 提交表单
                form.on("submit(submit)", async function (data) {
                    var strformData = new FormData($("#formNow")[0]);
                    strformData.append("token", token);

                    // 获取选中的 GroupId
                    var selectedGroupIds = [];
                    $("input[name='GroupId']:checked").each(function () {
                        selectedGroupIds.push($(this).val());
                    });

                    // 获取设备参数并匹配 SN
                    var allSN = [];
                    try {
                        const res = await new Promise((resolve, reject) => {
                            list.info('GetDoorParamListKey', {
                                token: token,
                                ComboBox: 'all'
                            }, function (response) {
                                resolve(response);
                            });
                        });

                        if (res.data) {
                            //查询门禁参数中用户组是否包含在新的用户中
                            $.each(res.data, function (n, val) {
                                if (val.GroupId) {
                                    let valGroupIds = val.GroupId.split(',').map(id => id.trim()).filter(id => id !== '');
                                    let hasMatch = valGroupIds.some(id => selectedGroupIds.includes(id));
                                    if (hasMatch) {
                                        allSN.push(val.DevId);
                                    }
                                }
                            });
                        }
                    } catch (err) {
                        console.error('获取设备参数失败:', err);
                    }

                    // 格式化 GroupId
                    if (selectedGroupIds.length > 0) {
                        var formattedGroupIds = "," + selectedGroupIds.join(',') + ",";
                        strformData.append("GroupId", formattedGroupIds);
                    }

                    // 判断是否是“门禁权限组”
                    var RoleText = $('#RoleId option:selected').text();
                    if (RoleText === '门禁权限组') {
                        strformData.set('PersonAccount', '');
                        strformData.set('PersonPass', '');
                    }

                    //替换门禁权限的值
                    var DoorType = $('#DoorType option:selected').text();
                    strformData.append('DoorCardList', '');
                    // if (DoorType == '中控') {
                    //     strformData.append('DoorPri', strformData.get('zktDoorPri'));
                    //     strformData.delete('ValidStratTime');
                    //     strformData.delete('ValidEndTime');

                    // } else if (DoorType == '海康') {
                    //     strformData.append('DoorPri', strformData.get('hikDoorPri'));
                    //     strformData.set('DoorCardNum', '');
                        let carList = [];
                        if ($("input[name=cardNo]").length > 0) {
                            $.each($("input[name=cardNo]"), function (n, val) {
                                carList.push({
                                    "employeeNo": strformData.get('PersonNumber'),
                                    "cardNo": $(val).attr('data-cardNo'),
                                    "cardType": $(val).attr('data-cardType'),
                                    // "checkEmployeeNo": false,
                                    // "checkCardNo": false,
                                    // "operateType": "byTerminal",
                                    // "terminalNoList": [1]
                                })
                                if (n + 1 == $("input[name=cardNo]").length) {
                                    strformData.set('DoorCardList', JSON.stringify(carList));
                                }
                            })
                        }
                    if(!strformData.get('ValidStratTime')){
                        strformData.set('ValidStratTime','')
                    }
                    if(!strformData.get('ValidEndTime')){
                        strformData.set('ValidEndTime','')
                    }
                    // } else {
                    //     strformData.delete('ValidStratTime');
                    //     strformData.delete('ValidEndTime');
                    // }
                    // strformData.delete('zktDoorPri');
                    // strformData.delete('hikDoorPri');

                    // const formObject = {};
                    // strformData.forEach((value, key) => {
                    // formObject[key] = value;
                    // });
                    // console.log(formObject);
                    // return false;

                    // 提交创建员工请求
                    list.form("CreateEmpKey", strformData, function (r) {

                        if (selectedGroupIds.length > 0) {
                            // console.log('变动门禁设备！')
                            // console.log(allSN)

                            (async function () {
                                try {
                                    await backToparentPromise("添加成功");

                                    var safeParent = window.parent || window;
                                    const topLayer = (window.top || window).layer;

                                    const dialogIndex = topLayer.open({
                                        title: '提示',
                                        content: '有变动数据未同步到设备,请及时同步！',
                                        skin: 'tipbox',
                                        offset: ['calc(100% - 10px)', '10px'],
                                        shadeClose: true,
                                        shade: 0.4,
                                        anim: 0,
                                        success: function (layero, successIndex) {
                                            layero.find('.layui-layer-max,.layui-layer-min').hide();
                                            layero.css('background-color', '#000A54');
                                            layero.find('.layui-layer-content').css('color', '#ffffff');

                                            const currentTop = parseInt(layero.css('top'));
                                            const currentLeft = parseInt(layero.css('left'));
                                            layero.css({
                                                'top': (currentTop - 170) + 'px',
                                                'left': (currentLeft + 10) + 'px'
                                            });

                                            var btnHtml = `<a class="layui-layer-btn0 my-custom-btn" onclick="PersonAlarm('${allSN.join(',')}')">立即同步</a>`;
                                            $(layero).find('.layui-layer-btn').html(btnHtml);
                                        }
                                    });
                                } catch (error) {
                                    console.error('backToparent 执行出错:', error);
                                }
                            })();
                        } else {
                            backToparent("添加成功");
                        }
                    });
                });
            });
        });

        function backToparentPromise(tips) {
            return new Promise((resolve) => backToparent(tips, resolve));
        }

        function backToparent(tips, callback) {
            layer.msg(tips, { icon: 1, time: 1000 }, function () {
                var index = parent.layer.getFrameIndex(window.name);
                parent.layer.close(index);
                if (window.parent.changecallbak) {
                    window.parent.changecallbak();
                } else {
                    window.parent.location.reload();
                }
                if (callback) callback();
            });
        }

        //编辑卡
        function editCard(obj, cardNo, cardType) {
            xadmin.open('编辑卡号', 'donghuan-menCard-edit.html?cardNo=' + cardNo + '&cardType=' + cardType)
        }
        //删除卡
        function delCard(obj, cardNo) {
            $('#' + cardNo).remove();
        }
    </script>
</body>

</html>
