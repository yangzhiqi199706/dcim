<!doctype html>
<html lang="zh-CN" data-design-prototype="graphite">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>石墨工作台</title>
  <style>
    :root { --bg: #1a1d20; --surface: #24292d; --surface-2: #2d3338; --line: #3c454d; --text: #f0f4f5; --muted: #aab4ba; --accent: #2cc7ae; --blue: #4c97df; --warn: #e7b457; --canvas: #eef1f2; font-family: system-ui, "Microsoft YaHei", "PingFang SC", sans-serif; color: var(--text); background: var(--bg); }
    * { box-sizing: border-box; } body { min-width: 320px; margin: 0; background: var(--bg); } button, input { font: inherit; } button { color: inherit; cursor: pointer; }
    .app { display: grid; grid-template-rows: 64px minmax(0, 1fr) 32px; height: 100vh; min-height: 650px; overflow: hidden; }
    .header { display: flex; align-items: center; gap: 14px; padding: 0 18px; border-bottom: 1px solid var(--line); background: #202428; }
    .brand { display: flex; align-items: center; gap: 9px; padding-right: 14px; border-right: 1px solid var(--line); font-weight: 750; white-space: nowrap; }
    .brand-mark { display: grid; width: 28px; height: 28px; place-items: center; border: 1px solid var(--accent); color: var(--accent); font-size: 18px; }
    .crumb { color: var(--muted); font-size: 13px; white-space: nowrap; } .page-name { min-width: 180px; color: var(--text); font-weight: 650; }
    .spacer { flex: 1; } .save-state { display: inline-flex; align-items: center; gap: 7px; color: #a8dbcf; font-size: 13px; white-space: nowrap; } .save-state b { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .header-actions, .context-actions { display: flex; align-items: center; gap: 8px; } .button { min-height: 40px; padding: 0 13px; border: 1px solid var(--line); border-radius: 5px; background: #292f34; font-size: 14px; } .button:hover { border-color: #60717c; background: #323a40; } .button.primary { border-color: var(--accent); background: var(--accent); color: #092a27; font-weight: 750; } .button:focus-visible, .icon:focus-visible, input:focus-visible { outline: 3px solid var(--warn); outline-offset: 2px; }
    .workbench { display: grid; grid-template-columns: 72px 254px minmax(0, 1fr) 310px; min-height: 0; }
    .rail { display: flex; flex-direction: column; gap: 7px; align-items: center; padding: 12px 0; border-right: 1px solid var(--line); background: #202428; } .rail .bottom { margin-top: auto; }
    .icon { display: grid; width: 44px; height: 44px; place-items: center; border: 1px solid transparent; border-radius: 5px; background: transparent; color: #b4c0c5; font-size: 19px; } .icon.active { border-color: #3c716a; background: #23413d; color: #68e3cd; } .icon:hover { background: #2d3439; }
    .library { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); background: var(--surface); } .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 14px 12px; font-size: 14px; font-weight: 750; } .panel-head button { border: 0; background: transparent; color: var(--muted); }
    .search { width: calc(100% - 28px); min-height: 38px; margin: 0 14px 12px; padding: 0 10px; border: 1px solid var(--line); border-radius: 4px; background: #1f2326; color: var(--text); } .tabs { display: flex; gap: 13px; padding: 0 14px 10px; border-bottom: 1px solid var(--line); } .tabs button { min-height: 32px; padding: 0; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); } .tabs button.active { border-color: var(--accent); color: var(--text); }
    .asset-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; overflow: auto; padding: 14px; } .asset { min-height: 96px; padding: 10px; border: 1px solid var(--line); border-radius: 5px; background: #292e32; text-align: left; } .asset:hover { border-color: #4d817a; } .asset-symbol { display: grid; width: 34px; height: 34px; place-items: center; margin-bottom: 10px; border: 1px solid #55727a; color: #8ce5d5; font-size: 18px; } .asset span { display: block; font-size: 12px; color: #d7dfe2; }
    .workspace { display: grid; grid-template-rows: 58px minmax(0, 1fr); min-width: 0; background: #31383d; } .context { display: flex; align-items: center; gap: 12px; overflow-x: auto; padding: 0 16px; border-bottom: 1px solid #465058; background: #293035; } .context-label { min-width: fit-content; color: #d6e0e3; font-size: 13px; } .tool { width: 40px; height: 40px; border: 0; border-radius: 4px; background: transparent; color: #ccd8dc; font-size: 17px; } .tool:hover, .tool.active { background: #3b4f52; color: #6ce1cf; }
    .canvas-scroll { min-width: 0; overflow: auto; padding: 42px; } .artboard { position: relative; width: min(100%, 930px); min-height: 560px; margin: 0 auto; overflow: hidden; border: 1px solid #cbd2d5; background: var(--canvas); box-shadow: 0 18px 38px rgba(0,0,0,.25); color: #1c252a; } .artboard::before { content: ""; position: absolute; inset: 0; opacity: .6; background-image: linear-gradient(#d8dfe1 1px, transparent 1px), linear-gradient(90deg, #d8dfe1 1px, transparent 1px); background-size: 20px 20px; pointer-events: none; }
    .dashboard { position: relative; z-index: 1; display: grid; grid-template-columns: 1.1fr 1.3fr .85fr; grid-template-rows: 94px 254px 150px; gap: 14px; padding: 24px; } .widget { min-width: 0; border: 1px solid #bec9cc; background: rgba(255,255,255,.94); box-shadow: 0 2px 0 rgba(17,28,34,.04); } .widget.selected { border: 2px solid var(--blue); box-shadow: 0 0 0 3px rgba(76,151,223,.18); } .widget h3 { margin: 14px 14px 6px; font-size: 12px; font-weight: 700; color: #64747b; } .metric { margin: 0 14px; font-size: 31px; font-weight: 760; } .trend { margin: 6px 14px; color: #299b77; font-size: 12px; } .chart { display: flex; align-items: end; gap: 9px; height: 170px; padding: 12px 16px 18px; background: repeating-linear-gradient(to bottom, transparent 0 33px, #e6ebec 34px); } .chart i { flex: 1; min-width: 10px; background: #38aa9a; } .chart i:nth-child(2n) { background: #4c97df; } .ring { display: grid; width: 126px; height: 126px; place-items: center; margin: 22px auto; border: 17px solid #d8e5e3; border-top-color: #2cc7ae; border-right-color: #2cc7ae; border-radius: 50%; font-size: 23px; font-weight: 750; } .event-list { grid-column: 1 / span 3; padding: 13px 15px; } .event { display: grid; grid-template-columns: 86px 1fr 74px; gap: 14px; padding: 8px 0; border-bottom: 1px solid #e5e9ea; font-size: 12px; } .event:last-child { border: 0; } .ok { color: #1f957e; } .alert { color: #c85d55; }
    .inspector { overflow: auto; border-left: 1px solid var(--line); background: var(--surface); } .inspect-title { padding: 17px 16px; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 750; } .inspect-tabs { display: flex; padding: 0 14px; border-bottom: 1px solid var(--line); } .inspect-tabs button { flex: 1; min-height: 40px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); } .inspect-tabs button.active { border-color: var(--accent); color: var(--text); } .section { padding: 14px 16px; border-bottom: 1px solid var(--line); } .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; color: #dce5e7; font-size: 12px; font-weight: 750; } .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .field label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 11px; } .field output { display: block; min-height: 34px; padding: 8px; border: 1px solid var(--line); border-radius: 3px; background: #1e2225; color: #edf1f2; font-size: 13px; } .tag { display: inline-flex; gap: 6px; align-items: center; padding: 6px 8px; border: 1px solid #3d7069; border-radius: 3px; color: #81ddce; font-size: 12px; }
    .status { display: flex; align-items: center; gap: 18px; padding: 0 16px; border-top: 1px solid var(--line); background: #202428; color: var(--muted); font-size: 12px; } .status strong { color: #d6dfe1; font-weight: 650; } .status .right { margin-left: auto; }
    @media (max-width: 1180px) { .workbench { grid-template-columns: 64px 230px minmax(0,1fr) 270px; } .page-name { min-width: auto; } .header-actions .button:not(.primary) { display: none; } .canvas-scroll { padding: 28px; } }
    @media (max-width: 900px) { .workbench { grid-template-columns: 64px minmax(0,1fr) 270px; } .library { display: none; } .crumb { display: none; } .header { gap: 9px; } .brand { padding-right: 0; border: 0; } }
    @media (max-width: 660px) { .app { min-height: 100vh; } .workbench { grid-template-columns: minmax(0,1fr); } .rail, .inspector, .save-state, .page-name { display: none; } .header { padding: 0 12px; } .header-actions { margin-left: auto; } .workspace { min-width: 0; } .canvas-scroll { padding: 16px; } .artboard { min-width: 500px; transform-origin: top left; } .status { gap: 10px; } .status span:not(.right) { display: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand"><span class="brand-mark">⊞</span><span>组态设计</span></div>
      <span class="crumb">项目 / 水处理厂</span><button class="button page-name" aria-label="切换当前页面">总览驾驶舱⌄</button><span class="spacer"></span>
      <span class="save-state"><b></b>已保存 · 刚刚</span><div class="header-actions"><button class="button" aria-label="预览当前页面">预览</button><button class="button" aria-label="打开更多页面操作">更多⌄</button><button class="button primary" aria-label="保存当前页面">保存</button></div>
    </header>
    <main class="workbench" aria-label="石墨工作台设计器">
      <nav class="rail" aria-label="主要功能"><button class="icon active" aria-label="素材库">▦</button><button class="icon" aria-label="页面">▤</button><button class="icon" aria-label="图层">≡</button><button class="icon" aria-label="数据源">⌁</button><button class="icon" aria-label="模板">◇</button><div class="bottom"><button class="icon" aria-label="设置">⚙</button></div></nav>
      <aside class="library" aria-label="素材库"><div class="panel-head"><span>素材库</span><button aria-label="收起素材库">‹</button></div><input class="search" aria-label="搜索素材" placeholder="搜索组件">
        <div class="tabs" role="tablist"><button class="active" role="tab" aria-selected="true">基础</button><button role="tab" aria-selected="false">图表</button><button role="tab" aria-selected="false">媒体</button></div>
        <div class="asset-grid"><button class="asset"><b class="asset-symbol">T</b><span>动态文本</span></button><button class="asset"><b class="asset-symbol">▣</b><span>数值卡片</span></button><button class="asset"><b class="asset-symbol">◔</b><span>仪表盘</span></button><button class="asset"><b class="asset-symbol">▥</b><span>柱状图</span></button><button class="asset"><b class="asset-symbol">⌁</b><span>折线图</span></button><button class="asset"><b class="asset-symbol">△</b><span>告警列表</span></button></div>
      </aside>
      <section class="workspace" aria-label="画布工作区"><div class="context"><span class="context-label">已选择 2 个元素</span><div class="context-actions"><button class="tool" aria-label="左对齐">⇤</button><button class="tool" aria-label="水平居中">↔</button><button class="tool" aria-label="右对齐">⇥</button><button class="tool active" aria-label="组合选中元素">⌘</button><button class="tool" aria-label="锁定选中元素">♙</button></div></div>
        <div class="canvas-scroll"><div class="artboard" aria-label="1920 乘 1080 画板"><div class="dashboard"><article class="widget"><h3>当前处理量</h3><p class="metric">2,486 <small>m³/h</small></p><p class="trend">↑ 4.2% 较昨日</p></article><article class="widget selected"><h3>近 24 小时进水流量</h3><div class="chart"><i style="height:44%"></i><i style="height:62%"></i><i style="height:48%"></i><i style="height:76%"></i><i style="height:67%"></i><i style="height:88%"></i><i style="height:72%"></i><i style="height:92%"></i></div></article><article class="widget"><h3>能耗效率</h3><div class="ring">86.4%</div></article><article class="widget event-list"><h3>实时事件</h3><div class="event"><span>10:42:18</span><span>沉淀池 02 阀门状态已同步</span><strong class="ok">正常</strong></div><div class="event"><span>10:40:03</span><span>泵房 B 压力接近预警阈值</span><strong class="alert">注意</strong></div><div class="event"><span>10:37:51</span><span>2 号加药设备进入自动运行</span><strong class="ok">正常</strong></div></article></div></div></div>
      </section>
      <aside class="inspector" aria-label="属性检查器"><div class="inspect-title">检查器</div><div class="inspect-tabs" role="tablist"><button class="active" role="tab" aria-selected="true">属性</button><button role="tab" aria-selected="false">图层</button><button role="tab" aria-selected="false">页面</button></div><section class="section"><div class="section-header"><span>布局</span><span>⌃</span></div><div class="field-grid"><div class="field"><label>X</label><output>612</output></div><div class="field"><label>Y</label><output>224</output></div><div class="field"><label>宽度</label><output>764</output></div><div class="field"><label>高度</label><output>372</output></div></div></section><section class="section"><div class="section-header"><span>数据绑定</span><span>⌃</span></div><span class="tag">● InflowRate · 已连接</span></section><section class="section"><div class="section-header"><span>外观</span><span>⌄</span></div></section><section class="section"><div class="section-header"><span>交互</span><span>⌄</span></div></section></aside>
    </main>
    <footer class="status"><span><strong>选择</strong> 2 个元素</span><span><strong>网格</strong> 20 px</span><span><strong>吸附</strong> 开启</span><span class="right"><strong>100%</strong>　−　＋</span></footer>
  </div>
</body>
</html>
